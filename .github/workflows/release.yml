name: Release artifact

# Consumers pin (engine semver, artifact descriptor). This workflow PROMOTES
# that pair: it verifies the draft release at the pushed tag carries the exact
# CI-built, attested bytes the committed descriptor was reviewed against, then
# publishes the npm package and flips the draft public.
#
# NOTHING IS REBUILT AT TAG TIME. SQLite builds do not byte-reproduce across
# environments — the defect class that produced v0.7.1 — so the canonical
# bytes are built once by mint-artifact.yml, attested, and parked on a draft
# release. This workflow's job is to prove those bytes match the reviewed
# descriptor and to ship them unchanged. A drifted asset cannot ship: the
# sha256, byte count, and attestation checks below fail the tag instead.
#
# ASSETS ARE FROZEN AT PUBLISH. With the repo's immutable-releases setting
# enabled (Jesse's toggle, plan RH-2/J51), a release's assets become
# read-only the moment --draft=false runs — a re-run of this workflow against
# a published tag is a verification pass, not a second promotion (the promote
# step below skips upload/edit when the release is already published).
# Releases published BEFORE the setting (v0.7.0, v0.7.1) remain mutable at
# rest — deliberately left untouched per the ship-forward decision (RH-1);
# the scheduled release-integrity sentinel (release-integrity.yml) watches
# their asset digests instead.
on:
  push:
    tags: ['v*']
  # Runnable on demand so the gates (stale descriptor, admission, pack) can be
  # exercised without minting a tag. A tagless run promotes and publishes
  # nothing.
  workflow_dispatch:

permissions:
  contents: write
  # Lets GitHub mint an OIDC token that npm verifies against the trusted
  # publisher configured for this package. This is what replaces a stored
  # secret: nothing to leak, nothing to rotate, and nothing that stops working
  # when npm removes publishing from bypass-2FA tokens in January 2027.
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          # Required for npm to authenticate on publish. Harmless when no
          # token is configured — it only writes a registry line to .npmrc.
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Install curation dev deps
        # curation/ is deliberately outside the npm workspaces (runtime
        # boundary), so root `npm ci` skips it — but `npm run verify` below
        # runs the root typecheck, which includes `tsc` over curation/.
        # --ignore-scripts: typecheck needs only the package files on disk.
        run: npm ci --prefix curation --ignore-scripts

      - name: Refuse to release against a stale descriptor
        # `stale.blocksRelease` in the reviewed descriptor is enforced here, or
        # it is decoration. A descriptor that no longer describes what this tree
        # builds must be re-minted before anything ships against it.
        run: |
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('artifacts/content-artifact.json','utf8')).stale?.blocksRelease ? 1 : 0)"; then
            echo "Descriptor is current."
          else
            echo "::error::artifacts/content-artifact.json is marked stale and blocks release."
            node -e "console.error(JSON.parse(require('fs').readFileSync('artifacts/content-artifact.json','utf8')).stale.reason)"
            exit 1
          fi

      # The gauntlet gates the CODE against the committed fixture. It runs here
      # too: a release cut from code that cannot pass admission is not a
      # release, it is an accident with a version number on it.
      - name: Admission gauntlet
        run: npm run verify -- --require-admit

      - name: Assert the descriptor names this tag
        if: startsWith(github.ref, 'refs/tags/v')
        # The committed descriptor is the release decision; the pushed tag
        # merely executes it. A tag the descriptor does not name would promote
        # bytes nobody reviewed under this identity.
        run: |
          node -e "
            const descriptor = JSON.parse(require('node:fs').readFileSync('artifacts/content-artifact.json', 'utf8'));
            const tag = process.env.GITHUB_REF_NAME;
            if (descriptor.release?.tag !== tag) {
              console.error(
                'The committed descriptor names release ' + JSON.stringify(descriptor.release?.tag) +
                ' but the pushed tag is ' + JSON.stringify(tag) + '.\n' +
                'Mint an artifact for this tag (mint-artifact.yml) and land its descriptor first.'
              );
              process.exit(1);
            }
            console.log('Descriptor names ' + tag + '.');
          "

      - name: Download the minted bytes from the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --pattern content.db --dir "$RUNNER_TEMP/asset"
          ls -l "$RUNNER_TEMP/asset/content.db"

      - name: Verify the minted bytes against the reviewed descriptor
        if: startsWith(github.ref, 'refs/tags/v')
        # The descriptor in this tree is the reviewed identity; the draft asset
        # must hash to it exactly or the release stops here.
        run: |
          node -e "
            const fs = require('node:fs'), crypto = require('node:crypto'), path = require('node:path');
            const descriptor = JSON.parse(fs.readFileSync('artifacts/content-artifact.json', 'utf8'));
            const bytes = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'asset', 'content.db'));
            const sha = crypto.createHash('sha256').update(bytes).digest('hex');
            console.log('reviewed sha256:', descriptor.databaseSha256);
            console.log('asset    sha256:', sha);
            console.log('reviewed bytes :', descriptor.databaseBytes);
            console.log('asset    bytes :', bytes.length);
            console.log('corpus  fingerprint:', descriptor.corpusFingerprint);
            console.log('layer   fingerprint:', descriptor.layerFingerprint);
            if (sha !== descriptor.databaseSha256 || bytes.length !== descriptor.databaseBytes) {
              console.error(
                '\nThe draft asset does not match the reviewed descriptor. The draft has ' +
                'drifted since the descriptor was reviewed — re-mint and re-review; never ' +
                'ship bytes whose reviewed identity is someone else\'s.'
              );
              process.exit(1);
            }
          "

      - name: Verify the minted bytes' build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        # Proves the bytes came out of THIS REPOSITORY'S MINT WORKFLOW — not a
        # laptop, not a hand-upload to the draft, and not any other workflow
        # in this repo. --signer-workflow closes the hole a bare --repo check
        # leaves open: any workflow run here with `attestations: write` —
        # including a modified workflow pushed to a non-default branch — could
        # attest arbitrary bytes that --repo alone would accept. Only
        # mint-artifact.yml is supposed to be able to mint bytes.
        #
        # How gh matches the pin (verified against cli/cli source,
        # pkg/cmd/attestation/verify/policy.go `validateSignerWorkflow`): the
        # value is NOT treated as a user-supplied regex. gh builds
        # `https://github.com/<value>`, regexp.QuoteMeta-escapes the whole
        # URL (dots become literal), and anchors it with `^` — a literal,
        # prefix-anchored SAN match, stricter than a raw regex. The missing
        # end anchor is deliberate slack: the SAN carries an `@<ref>` suffix
        # (…/mint-artifact.yml@refs/heads/main). Re-check this pin if the
        # workflow file is ever renamed. --repo is kept as belt-and-braces.
        #
        # Verification is ANY-MATCH over ALL attestations recorded for the
        # digest (up to --limit, default 30): gh succeeds when at least one
        # attestation satisfies the policy. So this step proves "a genuine
        # mint attestation exists for these bytes" — which is exactly the
        # property we want — and a later foreign attestation over the same
        # bytes cannot flip a passing verify to red.
        #
        # If the accept path ever fails against a real mint attestation
        # (rehearsal: docs/release-verification-rehearsal.md), the fallback
        # is `--cert-identity-regex` pinned to the path prefix
        # (^https://github\.com/OWNER/REPO/\.github/workflows/mint-artifact\.yml@)
        # — NOT exact `--cert-identity`, which would freeze the SAN's @<ref>
        # suffix and break the day a mint runs from a different ref.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "$RUNNER_TEMP/asset/content.db" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/mint-artifact.yml"

      # A tarball as well as a registry publish: this installs with
      # `npm i <url>` and needs no registry at all.
      - name: Pack the engine
        id: pack
        run: |
          npm pack --workspace engine --pack-destination .
          TARBALL=$(ls jestek-dev-scripture-engine-*.tgz)
          # Assert the package contains code. `files: ["dist"]` ships only the
          # build output, so a pack without a build produces a tarball holding
          # nothing but package.json — which installs cleanly and then fails at
          # the consumer's first import. v0.7.0 shipped exactly that.
          if ! tar tzf "$TARBALL" | grep -q 'package/dist/index.js'; then
            echo "::error::$TARBALL contains no dist/ — the engine was not built before packing"
            tar tzf "$TARBALL"
            exit 1
          fi
          echo "packed $TARBALL with $(tar tzf "$TARBALL" | wc -l) entries"
          # The tag is v0.9.0; the tarball npm produces is 0.9.0. Emitting the
          # real filename rather than reconstructing it keeps the install
          # command in the release notes from 404ing.
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      # Publishes via TRUSTED PUBLISHING (OIDC) — no token anywhere. npm
      # verifies the OIDC claim against a trusted publisher configured on the
      # package: this repository, this workflow filename. A workflow that is
      # not the configured one cannot publish, which is a stronger guarantee
      # than a secret provides, since a secret authorises whoever holds it.
      #
      # --access public is not a default. npm treats scoped packages as private
      # unless told otherwise, and a private publish on a free account fails
      # with a billing error that reads nothing like the actual problem.
      #
      # Skipped when the version is already on the registry, so re-running a
      # release does not fail on a duplicate publish.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./engine/package.json').version")
          if npm view "@jestek-dev/scripture-engine@$VERSION" version >/dev/null 2>&1; then
            echo "@jestek-dev/scripture-engine@$VERSION is already published — skipping"
            exit 0
          fi
          npm publish --workspace engine --access public

      - name: Promote the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        # The content.db already on the draft is the verified asset; only the
        # descriptor and tarball are added here. --draft=false is the moment
        # the release becomes visible to consumers.
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          # Idempotence guard, mirroring the npm-publish skip above: once the
          # release is published (and, with immutable releases enabled,
          # frozen), a re-run must not attempt upload/edit — `--clobber`
          # against an immutable release fails, turning a legitimate
          # verification re-run into a red herring. Skipping here keeps
          # "re-run release.yml on a published tag" a green no-op whose value
          # is the verification gates above, which all ran again.
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "Release $GITHUB_REF_NAME is already published — skipping asset upload and release edit."
            echo "(Published assets are never mutated; this re-run re-verified the gates and changed nothing.)"
            exit 0
          fi
          VERSION=$(node -p "require('./engine/package.json').version")
          gh release upload "$GITHUB_REF_NAME" artifacts/content-artifact.json "$TARBALL" --clobber
          # The CC BY attribution paragraph below must stay in step with the
          # consumer-contract commitment in docs/implementation-plan.md §5
          # (RH-8/P2.5; §5 cross-references back here). The RH-1 release
          # checklist carries "release notes and §5 attribution text agree" —
          # if you edit one, edit both.
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Deterministic Scripture artifact — CI-built, attested bytes; nothing rebuilt at tag time.

          Consumers pin **both** the engine semver and this descriptor.
          Verify \`content.db\` against \`databaseSha256\` in
          \`content-artifact.json\` before opening it — the engine's admission
          check expects a database whose identity you have confirmed.

          **Installing the engine:**

          \`\`\`bash
          npm i @jestek-dev/scripture-engine@$VERSION
          # or, with no npm registry:
          npm i https://github.com/jestek-dev/scripture-search-engine/releases/download/$GITHUB_REF_NAME/$TARBALL
          \`\`\`

          OpenBible.info data in this artifact is licensed CC BY 4.0 — the
          attribution obligation passes through to consumer apps.
          Sources and rights: see \`docs/ATTRIBUTIONS.md\`.
          EOF
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"

  smoke:
    # The consumer path, end to end, immediately after promotion:
    # unauthenticated download, checksum verification, a registry install, and
    # one real query. This is the check that would have caught v0.7.1 the day
    # it shipped.
    needs: promote
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # No npm ci: the smoke test must exercise what a consumer gets, not what
      # this repository's node_modules happens to contain.
      #
      # SMOKE_COMMITTED_DESCRIPTOR_PATH points the script at the descriptor in
      # THIS CHECKOUT — the identity a human reviewed in a PR. Without it the
      # smoke check is self-referential (release-served bytes vs release-served
      # descriptor) and a coordinated post-promotion swap of both assets would
      # pass. The script REQUIRES this in release mode, so the cross-check can
      # never be silently dropped.
      - name: Smoke-test the published release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SMOKE_COMMITTED_DESCRIPTOR_PATH: artifacts/content-artifact.json
        run: |
          VERSION=$(node -p "require('./engine/package.json').version")
          ENGINE_VERSION="$VERSION" node .github/scripts/release-smoke.mjs
