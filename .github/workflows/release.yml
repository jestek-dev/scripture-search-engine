name: Release artifact

# Consumers pin (engine semver, artifact descriptor). This is what produces the
# second half of that pair: a content.db anyone can download and a descriptor
# they can verify it against.
#
# The build runs from the MANIFESTS, not from anything cached on a maintainer's
# machine. That is the point — if this workflow can build the artifact, so can
# anyone else, and the reproducibility claim is a fact rather than a promise.

on:
  push:
    tags: ['v*']
  # Buildable on demand so the release path can be exercised without minting a
  # tag. A tagless run uploads nothing.
  workflow_dispatch:

permissions:
  contents: write
  # Lets GitHub mint an OIDC token that npm verifies against the trusted
  # publisher configured for this package. This is what replaces a stored
  # secret: nothing to leak, nothing to rotate, and nothing that stops working
  # when npm removes publishing from bypass-2FA tokens in January 2027.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          # Required for npm to authenticate on publish. Harmless when no
          # token is configured — it only writes a registry line to .npmrc.
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # The gauntlet gates the CODE against the committed fixture. It runs here
      # too: a release built from code that cannot pass admission is not a
      # release, it is an accident with a version number on it.
      - name: Admission gauntlet
        run: npm run verify

      - name: Fetch pinned sources
        run: npm run fetch:sources --workspace pipeline

      # The build below OVERWRITES artifacts/content-artifact.json with a
      # descriptor of whatever it just built. Capture the committed, reviewed
      # descriptor first — it is the yardstick, and comparing the build against
      # its own output would verify nothing.
      - name: Capture the committed descriptor
        run: cp artifacts/content-artifact.json "$RUNNER_TEMP/reviewed-content-artifact.json"

      # Rebuild AT THE REVIEWED BUILD TIME. built_at lands in the database's
      # meta table and therefore in its checksum, so without pinning it every
      # rebuild differs and the verification below could never mean anything.
      - name: Build artifact, reproducing the reviewed one
        run: |
          BUILT_AT=$(node -p "require('./artifacts/content-artifact.json').builtAt")
          echo "reproducing build stamped $BUILT_AT"
          npm run build:artifact --workspace pipeline -- --built-at "$BUILT_AT"

      # The descriptor is committed, so this catches a build that no longer
      # reproduces the reviewed artifact — a source drifting under us, or a
      # pipeline change nobody re-descriptored. Compare against the CAPTURED
      # committed descriptor, not the file the build just rewrote, then restore
      # the committed one so the release uploads what was reviewed.
      - name: Verify the built artifact matches the reviewed descriptor
        run: |
          node -e "
            const fs = require('node:fs'), crypto = require('node:crypto');
            const path = require('node:path');
            const d = JSON.parse(fs.readFileSync(
              path.join(process.env.RUNNER_TEMP, 'reviewed-content-artifact.json'), 'utf8'));
            const bytes = fs.readFileSync('pipeline/output/content.db');
            const sha = crypto.createHash('sha256').update(bytes).digest('hex');
            const ok = sha === d.databaseSha256;
            console.log('descriptor sha256:', d.databaseSha256);
            console.log('built      sha256:', sha);
            console.log('corpus  fingerprint:', d.corpusFingerprint);
            console.log('layer   fingerprint:', d.layerFingerprint);
            if (!ok) {
              console.error(
                '\nBuilt artifact does not match the reviewed descriptor. Either a source ' +
                'changed upstream or the pipeline changed without re-running the build; ' +
                'either way the descriptor must be re-reviewed, not overwritten here.'
              );
              process.exit(1);
            }
          "
          git checkout -- artifacts/content-artifact.json

      # A tarball, not a registry publish. An npm scope has to be a registered
      # npm account, which is separate from the GitHub owner and may not exist
      # — and consumers should not be blocked on that. This installs with
      # `npm i <url>` and needs no registry at all.
      - name: Pack the engine
        id: pack
        run: |
          npm pack --workspace engine --pack-destination .
          TARBALL=$(ls jestek-dev-scripture-engine-*.tgz)
          # Assert the package contains code. `files: ["dist"]` ships only the
          # build output, so a pack without a build produces a tarball holding
          # nothing but package.json — which installs cleanly and then fails at
          # the consumer's first import. v0.7.0 shipped exactly that.
          if ! tar tzf "$TARBALL" | grep -q 'package/dist/index.js'; then
            echo "::error::$TARBALL contains no dist/ — the engine was not built before packing"
            tar tzf "$TARBALL"
            exit 1
          fi
          echo "packed $TARBALL with $(tar tzf "$TARBALL" | wc -l) entries"
          # The tag is v0.7.0; the tarball npm produces is 0.7.0. Emitting the
          # real filename rather than reconstructing it keeps the install
          # command in the release notes from 404ing.
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      # Publishes via TRUSTED PUBLISHING (OIDC) — no token anywhere. npm
      # verifies the OIDC claim against a trusted publisher configured on the
      # package: this repository, this workflow filename. A workflow that is
      # not the configured one cannot publish, which is a stronger guarantee
      # than a secret provides, since a secret authorises whoever holds it.
      #
      # --access public is not a default. npm treats scoped packages as private
      # unless told otherwise, and a private publish on a free account fails
      # with a billing error that reads nothing like the actual problem.
      #
      # Skipped when the version is already on the registry, so re-running a
      # release does not fail on a duplicate publish.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./engine/package.json').version")
          if npm view "@jestek-dev/scripture-engine@$VERSION" version >/dev/null 2>&1; then
            echo "@jestek-dev/scripture-engine@$VERSION is already published — skipping"
            exit 0
          fi
          npm publish --workspace engine --access public

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pipeline/output/content.db
            artifacts/content-artifact.json
            jestek-dev-scripture-engine-*.tgz
          body: |
            Deterministic Scripture artifact.

            Consumers pin **both** the engine semver and this descriptor.
            Verify `content.db` against `databaseSha256` in
            `content-artifact.json` before opening it — the engine's admission
            check expects a database whose identity you have confirmed.

            **Installing the engine** — no npm registry required:

            ```bash
            npm i https://github.com/jestek-dev/scripture-search-engine/releases/download/${{ github.ref_name }}/${{ steps.pack.outputs.tarball }}
            ```

            Sources and rights: see `docs/ATTRIBUTIONS.md`.
