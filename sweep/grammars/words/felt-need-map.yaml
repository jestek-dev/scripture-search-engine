# felt-need-map.yaml — MS-3 (plan P8.3). PENDING JESSE'S SKIM (J65).
#
# Each frame maps a felt need, phrased as the first-person clause a church
# member actually types, to the concept(s) whose curated anchors should
# answer it. This file is pastoral judgment AS DATA: reviewable line by
# line, validated against live concept ids at compile time (fail-closed),
# and it NEVER ships — it only decides sweep test expectations. Jesse
# strikes or amends any row before the first certified run (J65); rows are
# a seed set and grow by reviewed PR.
#
# crisisAdjacent: true marks frames in the crisis register (self-harm,
# abuse, death, acute despair). These are deliberately INCLUDED — harmful
# #1s cost most exactly here — and the tag routes every such line to the
# tiered human-review policy (MS-9); committed digests show them as
# category + id, not verbatim text (J69).
frames:
  - topic: i am anxious all the time
    expectedConcepts: [remembered-anxious-for-nothing, peace-of-god]
  - topic: i cannot sleep because i am worried
    expectedConcepts: [remembered-anxious-for-nothing, rest-for-the-weary]
  - topic: i am worried about money
    expectedConcepts: [gods-provision, contentment]
  - topic: i just lost my job
