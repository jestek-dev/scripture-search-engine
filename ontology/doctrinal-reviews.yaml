  - source: openbible-topics
    reviewedAt: "2026-08-15"
    reviewer: "2026-08-15 doctrinal audit (see docs/DOCTRINAL-BASIS.md; ratified by PR merge)"
    verdict: admissible-with-bound
    criteria: ["DOCTRINAL-BASIS.md §3", "DOCTRINAL-BASIS.md §5"]
    bound: >-
      The one source whose pairings are crowd-authored, so §3 framings could
      genuinely enter through it. Admitted only inside three containments:
      (1) votes are a prior only — "never a correctness label, and never
      treated as one by the ranker" (manifest prose); (2) concept packs must
      OPT IN via openbibleTopics:, and every opt-in is a reviewed diff —
      opt-ins to money/blessing/favor-shaped topics are the residual risk this
      row exists to make checkable; (3) the prosperity-* golden fixture family
      polices output for the money-shaped queries.
    notes: >-
      OpenBible.info community topic votes, CC-BY. At review time five packs
      opt in, all on non-prosperity topics (faith and works, fear, grace,
      obedience, refuge).

