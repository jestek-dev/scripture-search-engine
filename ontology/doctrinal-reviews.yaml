# Per-source doctrinal review records — reviewed data, one row per source
# manifest in pipeline/manifests/.
#
# These rows are HUMAN review records, not machine judgments. Merging the PR
# that adds or edits a row is the review act (repo precedent: "Merging the PR
# is Jesse's review act"). The gauntlet presence-checks that a row EXISTS for
# every source manifest and that no row is orphaned — exactly as it
# presence-checks other human decisions. It never scores whether the theology
# is "correct": that would be the adjudication CLAUDE.md #6 forbids.
#
# Standard applied: docs/DOCTRINAL-BASIS.md — §2 shared core, §3
# prosperity/seed-faith exclusion (Akropong/TGC §6), §4 non-criteria.
# Source verdicts below transcribe the 2026-08-15 audit's Part 1 table
# (guardrail-audit-2026-08-15).
#
# verdict is a closed mechanical vocabulary — never a theology score:
#   compatible                        source framing is compatible with the basis
#   not-applicable-lineage-only       zero data rows; exists for lineage/budgeting (G7);
#                                     re-review required before any import
#   not-applicable-scripture-text     the Scripture text itself or its bare vocabulary;
#                                     the basis judges framings OF it, and it carries none
#   admissible-with-bound             admitted only inside the stated bound; the bound is
#                                     part of the verdict and reviewed with it

reviews:
  - source: barnes
    reviewedAt: "2026-08-15"
    reviewer: "2026-08-15 doctrinal audit (see docs/DOCTRINAL-BASIS.md; ratified by PR merge)"
    verdict: compatible
    criteria: ["DOCTRINAL-BASIS.md §2", "DOCTRINAL-BASIS.md §3"]
    notes: >-
      Albert Barnes, mainstream expository NT notes (1832-51); no prosperity
      vector. Manifest prose is licensing/coverage only.

  - source: clarke
    reviewedAt: "2026-08-15"
    reviewer: "2026-08-15 doctrinal audit (see docs/DOCTRINAL-BASIS.md; ratified by PR merge)"
    verdict: compatible
    criteria: ["DOCTRINAL-BASIS.md §2", "DOCTRINAL-BASIS.md §3", "DOCTRINAL-BASIS.md §4"]
    notes: >-
      Adam Clarke, Methodist (Arminian) — Arminianism is an explicit §4
      non-criterion. Honesty note carried from the audit: Clarke held an
      idiosyncratic view on the eternal Sonship of Christ while robustly
      affirming Christ's full deity; his passage-framing does not contradict
      core points 2-3.

  - source: editorial
    reviewedAt: "2026-08-15"
