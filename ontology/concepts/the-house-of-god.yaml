#
# God's house — the dwelling-of-God theme that runs tabernacle → temple
# → Haggai's latter-glory promise → the church as habitation.
# EXTENSION CHECK (the row's own flag, run before minting): worship's
# and presence-of-god's lexicons carry no house/temple/dwelling surface
