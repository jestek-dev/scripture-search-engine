# CORPUS-BLOCKED ROSTER build (post-#64 full-Bible corpus, 2026-08-27) —
# Theme M row 47 (4 requesting books: 2 Corinthians, Ezra,
# 2 Chronicles, Nehemiah). Deferred because 2 Cor 6:14-18 was absent
# (no ch. 6) plus all Ezra/Neh/2 Chr refs.
#
# EXTENSION ROUTES CHECKED before minting (the row's own flag):
# holiness and love-not-the-world carry neither the yoked nor the
# marrying-unbeliever vocabulary, and both are broader registers —
# MINTED narrow.
#
# REGISTER CAVEATS honored (both recorded):
# 1. Ezra 9 / Neh 13 are anchored as narrated covenant-national
#    background — "its remedy is narrated, not prescribed to later
#    readers; never a direct template for the modern
#    marrying-a-non-believer question" (the review's words, kept).
# 2. The 2 Chronicles POLITICAL-ALLIANCE refs (19:2; 18:1-3;
#    20:35-37; 25:7-10) are DECLINED entirely — the review says keep
#    the registers distinct, and an alliance anchor would blur the
#    partnership register this pack serves.
# 1 Cor 7:39 ("only in the Lord") claimed as the positive-form NT
# witness (verified free).
#
# Attribution: ALL anchors [editorial].
# DOCTRINAL SCAN: no watchlist anchor, no materialFrameKeyword. The
# pack reports the texts; it counsels no particular reader.
id: unequally-yoked
label: Unequally yoked
lexicon:
  - unequally yoked
  - yoked with unbelievers
  - marrying a non believer
  - dating a non believer
anchors:
  # "Don't be unequally yoked with unbelievers, for what fellowship do
  # righteousness and iniquity have?... What agreement does Christ
  # have with Belial? Or what portion does a believer have with an
  # unbeliever?" (WEB, in corpus). The passage itself — note it names
  # no marriage; the questions are its own frame.
  - ref: 2 Corinthians 6:14-15
    sources: [editorial]
    weight: 1.0
  # "'Come out from among them, and be separate,' says the Lord...
  # 'I will be to you a Father. You will be to me sons and
  # daughters'" (WEB, in corpus). The call's promise side.
  - ref: 2 Corinthians 6:17-18
    sources: [editorial]
    weight: 0.85
  # "she is free to be married to whomever she desires, only in the
  # Lord." (WEB, in corpus). The positive form — the one direct
  # marriage application in the NT's own words.
  - ref: 1 Corinthians 7:39
    sources: [editorial]
    weight: 0.8
  # "Didn't Solomon king of Israel sin by these things?... Nevertheless
  # foreign women caused even him to sin." (WEB, in corpus). Narrated
  # covenant-national background (see register caveat) — the argument
  # from Solomon, reported, not prescribed.
  - ref: Nehemiah 13:26-27
    sources: [editorial]
    weight: 0.65
  # "The people of Israel... have not separated themselves from the
  # peoples of the lands... the holy offspring have mixed themselves"
  # (WEB, in corpus). Same caveat: background narrative, not template.
  - ref: Ezra 9:1-2
    sources: [editorial]
    weight: 0.6
related:
  - godly-marriage
  - holiness
  - love-not-the-world
sources: [editorial]
