# answered ENTIRELY by gods-love's God-loves-you anchors (Rom 5:8, John
# 3:16 — the opposite direction; the row's exact diagnosis); "love the
# lord your god with all your heart" had Deut 6:5 and Matt 22:37 ranks
# 1-2 by exact phrase CHIPLESS, then the same gods-love flood; "the
# greatest commandment" had Matt 22:36 rank 1 CHIPLESS.
