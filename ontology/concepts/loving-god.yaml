# THREE-ID DESIGN DECIDED (carries batch 3's wholehearted-devotion
# deferral note — "one design across those three ids should be decided
# together"): the whole-heart devotion vocabulary lands on THIS row
# (Deut 6:5; Matt 22:37) and on seeking-god (Jer 29:13, same batch);
# wholehearted-devotion resolves at the re-pin as a lexicon extension
# of these two rather than a third id, when its own 1 Kgs/1 Chr texts
# (8:61; 11:4; 28:9...) become assertable. Reversible; recorded here,
# in seeking-god.yaml, and in the rollout ledger.
#
# BOUNDARIES: gods-love keeps bare "love" (Jesse's 2026-08-08 call) and
# God's-love-for-us; loving-others keeps Matt 22:39 and neighbor-love;
# no-other-god keeps Deut 6:4 (the Shema's opening — this pack takes
# 6:5, adjacent and disjoint); obedience-to-the-word keeps John 14:15
