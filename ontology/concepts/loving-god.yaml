# burnt offerings"), Luke 10:25-28, John 21:15-17 (the thrice-asked "do
# you love me?"), Ps 145:20.
#
# TOKENIZER NOTES (G-4): the natural entry "how to love god" normalizes
# to {love, god} — REJECTED: it would fire this pack on every
# "does god love me" / "gods love" query (the reverse of the inversion
# this pack exists to fix). STRUCTURAL LIMIT recorded: "how to love
# god" phrasings reach this pack only via its other entries' tokens;
# the fixture asserts on the commandment phrasings. "loving god"
# ({loving, god}) is safe — `loving` stems apart from `love` under the
# one tokenizer.
#
# Attribution: ALL anchors [editorial].
