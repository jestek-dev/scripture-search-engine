id: walking-in-the-light
label: Walking in the light
# Deliberately the ETHICAL sense: living and thinking the way the Word says —
# walking as Jesus walked. NOT the cosmological light/darkness of the John 1
# prologue, which is a different idea wearing the same vocabulary. Folding it
# in made this concept fire on creation and incarnation texts that say nothing
# about how a believer walks, so John 1:4-9 was removed.
#
# "light" on its own stays broad, because it legitimately spans both senses.
# It is the WALKING phrases that pin this concept to conduct.
lexicon:
  - walking in the light
  - walk as Jesus walked
  - walk in darkness
  - fellowship with one another
  - live according to the word
anchors:
  - ref: 1 John 1:5-7
    sources: [editorial]
    weight: 1.0
  - ref: 1 John 2:6
    sources: [editorial]
    weight: 0.95
  # Widened 5:8 -> 5:8-9, round-2 book admission 2026-08-18: v9 names the
  # fruit of walking as light. Torrey lists 5:9 under RIGHTEOUSNESS / TRUTH
  # ("fruit of the Spirit is in"). Sources/weight kept.
  - ref: Ephesians 5:8-9
    sources: [editorial]
    weight: 0.7
  # Torrey/Miller admission 2026-08-06 — supporting anchors from the verified
  # outline(s): CONDUCT, CHRISTIAN.
  - ref: Colossians 1:10
    sources: [torrey]
    weight: 0.65
  # Round-2 book admission 2026-08-18 — leads from the approved books,
  # verified in WEB context; the books are never engine sources.
  # "let your way of life be worthy of the Good News" — the
  # conduct-worthy register.
  - ref: Philippians 1:27
    sources: [editorial]
    weight: 0.7
related:
  - obedience-to-the-word
