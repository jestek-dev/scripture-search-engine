# DRAFT 2026-08-18 (Comfort & the Spirit cluster) — §7.7 PR-4's new-creation
# pack, extended with the fresh-start sense the 2026-08-13 audit found
# inverted ("new beginnings" → Ecclesiastes 1:9, "no new thing under the
# sun"). ONE concept, both senses: the candidate two-concept split shared
# the "new" token across both lexicons and split the anchors across two
# half-firing packs — exactly the near-duplicate failure G4 exists to catch.
#
# Bare-word decisions (for ontology/lexicon-inventory.yaml when §7.7 PR 2
# lands): "new" SKIPPED — catastrophic generic trigger, per §7.7. "born
# again" deliberately absent — salvation.yaml already owns that phrasing.
# Fresh-start phrasings corroborated by Growing by Heart's "Starting Over"
# week (see manifest.md); anchors are our own selection.
id: new-creation
label: A new creation
lexicon:
  - new creation
  - fresh start
  - new beginnings
  - starting over
  # CORPUS-BLOCKED ROSTER build (2026-08-27): the new-heart roster row
  # (Theme I, Ezekiel) lands as this EXTENSION, not a mint — the row's
  # own listed alternative, taken because this pack ALREADY anchors
  # Ezek 36:26 ("the promise behind Psalm 51's prayer") and Ps 51:10;
  # only the heart vocabulary was missing, so "new heart" / "heart of
  # stone to heart of flesh" / "god change my heart" could not reach
  # them. Decided together with circumcision-of-the-heart's narrow mint
  # (same PR — the read-together design both rows flag). BOUNDARIES
  # honored: Ezek 11:19 stays hardness-of-heart's anchor, Ezek 18:31
  # inside repentance's 18:30-32, Jer 31:33 covenant's — no anchor
  # added here. Fixture-backed (new-heart.json).
  # STRUCTURAL LIMIT (G-3 guard, recorded at authoring): "heart of
  # flesh" was REJECTED as an entry — {heart, flesh} is a subset of the
  # psalm-73-strength-guard query ("my flesh and my heart may fail...")
  # and firing there displaced Ps 73:26. "heart of stone" carries the
  # full stone-to-flesh query; the bare "heart of flesh" fragment
  # reaches Ezek 36:26 / 11:19 by exact-phrase retrieval.
  - a new heart
  - heart of stone
  - god change my heart
  - a clean heart
anchors:
  # "if anyone is in Christ, he is a new creation. The old things have
  # passed away. Behold, all things have become new." The defining text.
  - ref: 2 Corinthians 5:17
    sources: [editorial]
    weight: 1.0
  # "Create in me a clean heart, O God. Renew a right spirit within me."
  # David after Nathan — the fresh start asked for from inside the wreck.
  - ref: Psalms 51:10
    sources: [editorial]
    weight: 0.9
  # "neither is circumcision anything, nor uncircumcision, but a new
  # creation."
  - ref: Galatians 6:15
    sources: [editorial]
    weight: 0.8
  # "I will also give you a new heart, and I will put a new spirit within
  # you" — the promise behind Psalm 51's prayer.
  - ref: Ezekiel 36:26
    sources: [editorial]
    weight: 0.75
  # "Behold, I am making all things new." The sense the searcher wants,
  # spoken from the throne.
  - ref: Revelation 21:5
    sources: [editorial]
    weight: 0.75
  # "Repent therefore, and turn again... so that there may come times of
  # refreshing" — the fresh start's honest doorway is repentance; the
  # anchor keeps the concept from promising newness without turning.
  - ref: Acts 3:19
    sources: [editorial]
    weight: 0.7
openbibleTopics:
  - new creation
related:
  - repentance
  - salvation
  - forgiveness-of-sins
