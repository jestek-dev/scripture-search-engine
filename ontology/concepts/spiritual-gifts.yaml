anchors:
  # "We have many members in one body... having gifts differing according
  # to the grace that was given to us: prophecy... service... teaching...
  # giving... ruling... mercy" (WEB). One body, differing gifts — the
  # defining passage in the corpus today. Torrey lists 12:6 under GIFTS OF
  # GOD, THE ("dispensed according to his will"); editorial for the range.
  - ref: Romans 12:4-8
    sources: [editorial]
    weight: 1.0
  # "As each has received a gift, employ it in serving one another, as
  # good managers of the grace of God" (+ v11: speaking as oracles,
  # serving in God's strength) (WEB). Gifts as stewardship for one another
  # — the anti-status frame. Torrey lists 4:10 under GIFTS OF GOD, THE
  # ("Spiritual > To be used for mutual profit"); editorial for the range.
  - ref: 1 Peter 4:10-11
    sources: [editorial]
    weight: 0.9
  # apostles, prophets, evangelists, shepherds and teachers — given "for
  # the perfecting of the saints... to the building up of the body of
  # Christ" (WEB). Torrey lists 4:11 under EDIFICATION ("the object of the
  # ministerial office"); editorial for the range.
  - ref: Ephesians 4:11-12
    sources: [editorial]
    weight: 0.85
