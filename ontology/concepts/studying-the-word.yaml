  - ref: Hebrews 4:12
    sources: [torrey]
    weight: 0.95
  # "The LORD's law is perfect, restoring the soul... more to be desired
  # than gold" — SCRIPTURES, THE lists 19:7, 8, 10, 11 across its points.
  - ref: Psalms 19:7-11
    sources: [torrey]
    weight: 0.9
  # "Heaven and earth will pass away, but my words will not pass away."
  - ref: Matthew 24:35
    sources: [editorial]
    weight: 0.7
