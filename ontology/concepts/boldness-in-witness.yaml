id: boldness-in-witness
label: Boldness in witness
lexicon:
  - boldness
  - praying for boldness
  - boldness to share my faith
  - speak the word with boldness
  - overcoming fear of evangelism
anchors:
  # "Now, Lord, look at their threats, and grant to your servants to
  # speak your word with all boldness" (WEB, in corpus). The church's
  # own prayer under threat — the text "praying for boldness" is
  # looking for. (4:30 is signs-and-wonders'; 4:31 holy-spirit's.)
  - ref: Acts 4:29
    sources: [editorial]
    weight: 1.0
  # "when they saw the boldness of Peter and John, and had perceived
  # that they were unlearned and ignorant men, they marveled. They
  # recognized that they had been with Jesus." (WEB, in corpus).
  # Where the boldness comes from, by the council's own observation.
  - ref: Acts 4:13
    sources: [editorial]
    weight: 0.95
  # "Paul and Barnabas spoke out boldly" — boldness under rejection,
  # turning to a wider field. (WEB, in corpus; 13:47-48 not claimed,
  # see header.)
  - ref: Acts 13:46
    sources: [editorial]
    weight: 0.85
  # "Pray for me, that utterance may be given to me... to make known
  # with boldness the mystery of the Good News... that in it I may
  # speak boldly, as I ought to speak." (WEB, in corpus). Paul asks
  # for the same prayer — even an apostle requests boldness.
  # (6:10-18 stays the armor packs'.)
  - ref: Ephesians 6:19-20
    sources: [editorial]
    weight: 0.9
  # Barnabas tells how Saul "preached boldly in the name of Jesus" —
  # the pattern repeated. (Acts 9 NOT in web-subset; re-check at
  # re-pin.)
  - ref: Acts 9:27-29
    sources: [editorial]
    weight: 0.65
  # The book's last verse: "preaching God's Kingdom... with all
  # boldness, without hindrance." (Acts 28 NOT in web-subset;
  # re-check at re-pin.)
  - ref: Acts 28:31
    sources: [editorial]
    weight: 0.6
