# CORPUS-BLOCKED ROSTER build (post-#64 full-Bible corpus, 2026-08-27) —
# ADOPTED-TAG id (Theme E row, 2 requesting books: Esther, Nehemiah;
# roadmap appends Dan 3; 6). Adopted as display vocabulary by Jesse's
# 2026-08-25 ruling (CONVENTIONS §11); ENGINE admission only by his
# merge of this PR. Deferred through batches 1-6: the row's entire case
# was corpus-blocked, and the in-corpus courage texts were fear-not's
# divine-comfort register — which the row itself says is precisely NOT
# this gap.
#
# REGISTER: human courage to act rightly at personal risk where no
# divine word is recorded — Esther before the king, Nehemiah refusing
# the temple, the three refusing the image. fear-not keeps the
# comfort-COMMAND register ("do not be afraid", "take courage", Josh
# 1:9); Ps 27:14 stays trust-in-god's anchor. Zero shared phrases.
# Nehemiah's register caveat carried verbatim: this courage is
# prayer-entwined (Neh 6:9) — described, not disqualified.
#
# BOUNDARIES: Esth 4:14 ("for such a time as this") stays providence's
# anchor — this pack takes 4:16, the resolve itself. Dan 3:17-18
# anchored for the but-if-not confession (3:19-20, the furnace act,
# is persecuted-for-gods-word's — same PR, disjoint verses, recorded
# both files).
#
# TOKENIZER NOTE (G-4): no single-token entries; bare "courage"
# skipped with reason (fear-not's take-courage adjacency — inventory).
#
# Attribution: ALL anchors [editorial].
# DOCTRINAL SCAN: no watchlist anchor, no materialFrameKeyword.
