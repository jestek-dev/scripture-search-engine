# REMEMBERED-PHRASING PACK
#
# People search in the wording they memorised, which is usually NIV or ESV.
# The corpus is the WEB. Measured against the full artifact, this query does
# not reach its passage by any lexical rung: ranked 7th, behind Exodus narrative sharing the word "harden"/"tempt".
#
# A public-domain translation cannot close this — the remembered wordings are
# copyrighted, so the phrasing will never appear in the text we ship. Layer A
# is the mechanism that fits: the lexicon holds the remembered phrasing, the
# anchor names the verse it refers to, and the reason chip says LH editorial
# said so. The engine reports that a curated source names this passage; it
# does not claim the wording is the verse.
#
# ONE anchor per pack, deliberately. Every anchor of a matched concept fires,
# so a pack bundling ten phrasings against ten anchors would answer "plans to
# prosper you" with all ten passages. Narrow anchor, narrow claim.
id: remembered-a-way-of-escape
label: A way of escape under temptation
lexicon:
  - tempted beyond what you can bear
  - he will provide a way of escape
  - God is faithful and will not let you be tempted
  # Deliberate, commented exception to this pack's phrasing-only design
  # (2026-08-14 plan, lexicon-concepts PR 2 item 4, reproduced exactly): the
  # bare word cannot reach 1 Cor 10:13 today, and one narrow anchor is
  # exactly what the bare word wants. Precedent: "anxiety" in
  # remembered-anxious-for-nothing. Added 2026-08-18.
  - temptation
  - tempted
anchors:
  - ref: 1 Corinthians 10:13
    sources: [editorial]
    weight: 1.0
