# PASTORAL-CARE PACK — approved by Jesse 2026-07-31 after two external
# reviews (see NEEDS-JESSE §1.8 for what was adopted, demoted, and why).
#
# These anchors speak in LH's voice on the heaviest queries the engine
# receives. Every anchor was verified against the WEB text before admission,
# and the companion golden fixture asserts not only that the right passages
# surface but that the canon's dangerous near-misses (suicide narratives,
# "cut it off" sayings, submission passages) NEVER rank for these queries.
#
# Single-word lexicon entries below are DELIBERATE exceptions per
# NEEDS-JESSE §1.6d option 3: distinctive modern words absent from the WEB
# text ("suicide", "cancer"), where the word IS the concept. Generic-token
# entries remain forbidden.

# Distinct from prayer-for-healing on purpose: these passages do not
# force a serious illness into a healing narrative. They speak of
# presence in the valley, outward decay and inward renewal, and
# belonging to Christ in life and in death.
id: serious-illness-and-dying
label: God in the valley
lexicon:
  - cancer
  - terminal illness
  - terminal cancer
  - diagnosed with cancer
  - hospice
  - stage four
  - dying of cancer
  - facing death
  # Round-2 book admission 2026-08-18.
  # The death-of-a-believer register (phillips "Death" topic): this pack
  # already carries the dying-pastoral anchors, so the bare word lands here
  # (one-token discount applies).
  - death
  - to die is gain
  - what happens when we die
  # ("dies" and "die" tokenize differently, so the believer's-death felt
  # phrasing needs its own entry — measured: without it the query reached
  # no curated concept at all.)
  - when a believer dies
anchors:
  - ref: Psalms 23:4
    sources: [editorial]
    weight: 1
  - ref: 2 Corinthians 4:16-18
    sources: [editorial]
    weight: 0.9
  - ref: 2 Corinthians 12:9-10
    sources: [editorial]
    weight: 0.85
  - ref: John 14:1-3
    sources: [editorial]
    weight: 0.8
  - ref: Romans 8:18
    sources: [editorial]
    weight: 0.8
  - ref: Romans 8:26-27
    sources: [editorial]
    weight: 0.78
  - ref: Romans 14:8
    sources: [editorial]
    weight: 0.75
  - ref: Psalms 73:26
    sources: [editorial]
    weight: 0.75
  # Round-2 book admission 2026-08-18 — leads from the approved books,
  # verified in WEB context; the books are never engine sources.
  # "to die is gain... to depart and be with Christ, which is far better"
  # (book lead 1:21-22 widened by the contiguous v23 that completes the
  # sentence's thought).
  - ref: Philippians 1:21-23
    sources: [editorial]
    weight: 0.9
  # "absent from the body and at home with the Lord" (book lead 5:6-9
  # trimmed of v9's aim-to-please turn).
  - ref: 2 Corinthians 5:6-8
    sources: [editorial]
    weight: 0.9
  # the earthly tent and the building from God. Torrey: DEATH, NATURAL.
  - ref: 2 Corinthians 5:1
    sources: [torrey]
    weight: 0.85
  # "Precious in the LORD's sight is the death of his saints." Torrey:
  # DEATH OF SAINTS, THE.
  - ref: Psalms 116:15
    sources: [torrey]
    weight: 0.75
  # "whether we wake or sleep, we should live together with him."
  - ref: 1 Thessalonians 5:9-10
    sources: [editorial]
    weight: 0.7
related:
  - strength-in-weakness
  - prayer-for-healing
