# PASTORAL-CARE PACK — approved by Jesse 2026-07-31 after two external
# reviews (see NEEDS-JESSE §1.8 for what was adopted, demoted, and why).
#
# These anchors speak in LH's voice on the heaviest queries the engine
# receives. Every anchor was verified against the WEB text before admission,
# and the companion golden fixture asserts not only that the right passages
# surface but that the canon's dangerous near-misses (suicide narratives,
# "cut it off" sayings, submission passages) NEVER rank for these queries.
#
# Single-word lexicon entries below are DELIBERATE exceptions per
# NEEDS-JESSE §1.6d option 3: distinctive modern words absent from the WEB
# text ("suicide", "cancer"), where the word IS the concept. Generic-token
# entries remain forbidden.

# Distinct from prayer-for-healing on purpose: these passages do not
# force a serious illness into a healing narrative. They speak of
# presence in the valley, outward decay and inward renewal, and
# belonging to Christ in life and in death.
id: serious-illness-and-dying
label: God in the valley
lexicon:
  - cancer
  - terminal illness
  - terminal cancer
  - diagnosed with cancer
  - hospice
  - stage four
  - dying of cancer
  - facing death
anchors:
  - ref: Psalms 23:4
    sources: [editorial]
    weight: 1
  - ref: 2 Corinthians 4:16-18
    sources: [editorial]
    weight: 0.9
  - ref: 2 Corinthians 12:9-10
    sources: [editorial]
    weight: 0.85
  - ref: John 14:1-3
    sources: [editorial]
    weight: 0.8
  - ref: Romans 8:18
    sources: [editorial]
    weight: 0.8
  - ref: Romans 8:26-27
    sources: [editorial]
    weight: 0.78
  - ref: Romans 14:8
    sources: [editorial]
    weight: 0.75
  - ref: Psalms 73:26
    sources: [editorial]
    weight: 0.75
related:
  - strength-in-weakness
  - prayer-for-healing
