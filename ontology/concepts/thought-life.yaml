# Rom 12:2 stays remembered-transformed-not-conformed's — no renewing-
# of-your-mind phrasing here.
#
# CORPUS: all five anchors in corpus. Prov 4:23 (guard your heart) and
# Matt 15:19 (out of the heart come evil thoughts) are corpus-blocked
# riders.
#
# TOKENIZER NOTE (G-4): "what should i think about" was considered and
# DROPPED — it collapses to bare {think} (should/i/about are
# stopwords), the 2026-08-08 accident class. "think about these things"
# ({think, thing}) carries that query family at honest width. Every
# entry keeps >= 2 significant tokens.
#
# Attribution: ALL anchors [editorial].
# DOCTRINAL SCAN: no watchlist anchor, no materialFrameKeyword.
