#
# "What should I think about" / "guarding your thoughts" / "take every
# thought captive" — remembered-transformed-not-conformed is Romans-12
# verse-memory and self-control is behavior-shaped; nothing serves
# plain thought-life queries.
#
# DUAL ANCHORS, recorded in both files (mercy/Luke 18:13 sibling
# precedent):
#   - Phil 4:8 is a verse-scoped sibling claim inside peace-of-god's
#     Phil 4:8-9 span — that pack carries the whole passage for the
#     anxiety register ("think about such things" -> the God of peace);
#     this pack claims v8 for the what-to-think-about register the
#     verse itself commands.
#   - 2 Cor 10:3-5 overlaps giving-an-answer's 2 Cor 10:5 (the
#     apologetic demolish-arguments register); this pack's register is
