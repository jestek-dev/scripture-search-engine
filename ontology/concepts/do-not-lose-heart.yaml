# INNER-LIFE PACK (cluster B draft, 2026-08-18).
#
# DISCOURAGEMENT — the mild register, deliberately its own concept rather
# than aliases on `hope-in-despair`. That pack is the crisis register
# ("suicide", "no reason to live") with crisis-weighted anchors (2 Cor 1:8-10
# leads, Psalm 88 enters at 0.35); "I'm discouraged" is a different pastoral
# moment wanting Gal 6:9's keep-going word, which would be wrong served to a
# suicidal search and is not anchored there.
#
# LEXICON BOUNDARY, revised for Phase-4 P4.7 / fn12 (2026-08-22; original
# cluster-B design 2026-08-18 kept the two lexicons fully disjoint): the
# give-up phrasings ("tempted to give up", "want to give up", "ready to
# give up") are the fn12 audit register — an asker one step from quitting,
# whose needed perseverance texts never surfaced (bare "tempted" routes to
# remembered-a-way-of-escape by the deliberate bare-word routing; 1 Cor
# 10:13 stays an honest neighbour, not banned). Per the plan's fn12 item,
# those phrases now fire THIS pack too. "want to give up" is therefore
# DELIBERATELY SHARED with hope-in-despair — the one shared phrase between
# the two packs: the crisis pack keeps the phrase, its crisis anchors, and
# the pastoral-despair-give-up mustNotRank gate (measured intact at
# admission: 2 Cor 1:8-10 still leads the query on both beds, and every
# suicide-narrative ban still holds); this pack adds the keep-going
# register beside it, so a give-up search meets crisis comfort FIRST and
# perseverance right behind it. The rest of the crisis vocabulary
# ("feeling hopeless", "want to die", …) stays exclusively on
# hope-in-despair.
#
# Shared anchors (Ps 42:5 with hope-in-despair; Isa 41:10/Josh 1:9 with
# fear-not; 2 Cor 4:16-18 with serious-illness-and-dying) are deliberate:
# the same passage honestly serves adjacent registers, per the Ps 34:18
# precedent across the pastoral pack. No shared lexicon phrases (G4-checked).
id: do-not-lose-heart
label: Do not lose heart
lexicon:
  - discouraged
  - discouragement
  - do not lose heart
  - losing heart
  - weary in doing good
  # "don't give up" after apostrophe-stripping.
  - dont give up
  # Phase-4 P4.7 / fn12 admission (2026-08-22) — the give-up phrasings the
  # audit measured unreachable (see LEXICON BOUNDARY note). Widths under
  # the one tokenizer, verified pre-commit: {tempt, give} / {want, give} /
  # {ready, give} — two significant tokens each ("to"/"up" are stopwords),
  # no lexicon-inventory rows due. "want to give up" is the deliberately
  # shared crisis/perseverance phrase; the pastoral-despair-give-up
  # fixture's gate stays the authority on that query's crisis floor.
  - tempted to give up
  - want to give up
  - ready to give up
  # Round-2 book admission 2026-08-18.
  - pressed on every side
  - dont throw away your confidence
anchors:
  # "Let's not be weary in doing good, for we will reap in due season if we
  # don't give up" (WEB). The keep-going verse for the discouraged-but-
  # still-serving — named by the prayer books' Fatigue scripture list and by
  # Growing by Heart's perseverance week.
  - ref: Galatians 6:9
    sources: [editorial]
    weight: 1.0
  # "Why are you in despair, my soul?… Hope in God! For I shall still praise
  # him" (WEB). The psalmist talking his own soul out of discouragement.
  - ref: Psalms 42:5
    sources: [editorial]
    weight: 0.9
  # "Therefore we don't faint, but though our outward person is decaying, yet
  # our inward person is renewed day by day" (WEB). Paul's own do-not-lose-
  # heart passage — the phrase is the passage's refrain (4:1, 4:16).
  - ref: 2 Corinthians 4:16-18
    sources: [editorial]
    weight: 0.85
  # "Don't you be afraid… Don't be dismayed, for I am your God. I will
  # strengthen you" (WEB). "Dismayed" is the discouragement word; God's
  # strengthening promise to fearful Israel.
  - ref: Isaiah 41:10
    sources: [editorial]
    weight: 0.8
  # "Be strong and courageous. Don't be afraid. Don't be dismayed, for the
  # LORD your God is with you wherever you go" (WEB). To Joshua facing a task
  # too big for him — the commissioning word against losing heart.
  - ref: Joshua 1:9
    sources: [editorial]
    weight: 0.75
  # Round-2 book admission 2026-08-18 — leads from the approved books,
  # verified in WEB context; the books are never engine sources.
  # "pressed on every side, yet not crushed... struck down, yet not
  # destroyed" — leads into the existing 4:16-18 anchor. Torrey DESPAIR
  # lists 4:8; editorial for the range (round-1 gods-provision precedent).
  - ref: 2 Corinthians 4:8-10
    sources: [editorial]
    weight: 0.85
  # "don't throw away your boldness."
  - ref: Hebrews 10:35
    sources: [editorial]
    weight: 0.8
related:
  - hope-in-despair
  - strength-in-weakness
