# BOUNDARY NOTE (tag-gap batch 4, 2026-08-26): trusting-in-man is the
# failure-side register (Jer 17:5-6, Ps 146:3-4, Ps 33:16-17 — trust
# misplaced in man, princes, horses). This pack keeps bare "trust" /
# "confidence" and every positive anchor; Jer 17:7-8 (the blessed
# contrast) is left to this pack's territory at the re-pin. The related
# edge is deliberately ONE-DIRECTIONAL (trusting-in-man -> here):
# adding the reverse edge was TRIED AND REVERTED — measured on probe
# ot-wisdom-trust, it surfaced Jer 17:5 ("cursed is the man who trusts
# in man") into the top 10 for "trust in the LORD with all your heart",
# the exact inversion the two-register split exists to prevent.
