# CORPUS-BLOCKED ROSTER build (post-#64 full-Bible corpus, 2026-08-27) —
# Theme M row 48 (requesting book: Song of Solomon). Deferred because
# the Song's corpus presence was 2:1 ALONE.
#
# RIDER FOLDED: waiting-and-timing-in-love rides here as ONE pack per
# Jesse's adopted §11.1 fold — Song 2:7's thrice-repeated charge
# ("that you not stir up, nor awaken love, until it so desires") is
# anchored and its query family carried in this lexicon. No second id.
#
# NON-GRAPHIC CELEBRATION REGISTER (the row's own design note): the
