  # argument depends on the sufferer being righteous, dismantling the
  # friends' retribution theology. SPAN DESIGN (recorded): testing anchors
  # Job 1:8-12 [editorial] for the heavenly-court trial frame; this
  # single-verse row claims the certified-righteous-sufferer register —
  # deliberate overlap at v8, two honest registers.
  - ref: Job 1:8
    sources: [editorial]
    weight: 1.0
  # "Many are the afflictions of the righteous, but the LORD delivers him
  # out of them all." (WEB, in corpus). Both halves in one verse.
  # NO-EXEMPTION GUARD (map, named prosperity-framing exclusion):
  # 'delivers him out of them all' is testimony of God's faithfulness,
  # never a formula of exemption — the justification carries that edge.
  # DUAL NOTE: refuge-in-trouble anchors this verse [torrey] at 0.7 for
  # the deliverance register; this row claims the
  # affliction-is-not-anomalous register.
