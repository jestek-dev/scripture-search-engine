  # him, to ruin him without cause." (WEB wording — Job 2 NOT in
  # web-subset). God's own words: the ruin was 'without cause' — the text
  # itself denies the suffering was deserved.
  - ref: Job 2:3
    sources: [editorial]
    weight: 0.9
  # "Shall we receive good at the hand of God, and shall we not receive
  # evil?... Job didn't sin with his lips." (WEB wording — Job 2 NOT in
  # web-subset). Righteousness within suffering, not just before it.
  - ref: Job 2:10
    sources: [editorial]
    weight: 0.8
  # "Yes, for your sake we are killed all day long. We are regarded as
