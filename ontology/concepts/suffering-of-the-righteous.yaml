id: suffering-of-the-righteous
label: The righteous suffer
lexicon:
  # The claim as stated.
  - the righteous suffer
  # Ps 34:19's own words.
  - many are the afflictions of the righteous
  # The lay form.
  - why do good people suffer
  # The pastoral misreading this concept answers (descriptive, not
  # polemical — the anchors carry the texts that deny the calculus).
  - suffering is not punishment
anchors:
