# LEXICON ROUTING DECISIONS (recorded):
# - "when god is silent" belongs to wrestling-with-god (a pre-existing
#   lexicon fact, verified firing) and is NOT claimed here. The
#   Lamentations staging note's concern — that a when-god-is-silent id
#   would compete — is resolved by leaving that phrase where it lives.
# - The famine-of-hearing-gods-word boundary (Amos 8:11-12, word
