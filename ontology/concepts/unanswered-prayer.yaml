# turned-away-ear judgment register, cross-noted). Ps 88:1-2 stays
# hope-in-despair's; Ps 88:13-14 wrestling-with-god's.
#
# TOKENIZER NOTE (G-4): every entry keeps >= 2 significant tokens
# ("unanswered prayer" -> {unanswer, prayer}). No bare "prayer"
# (prayer's own bare word; inventory skip).
#
# Attribution: ALL anchors [editorial].
# DOCTRINAL SCAN: no watchlist anchor, no materialFrameKeyword.
id: unanswered-prayer
label: Unanswered prayer
lexicon:
  - unanswered prayer
  - why doesnt god answer my prayers
  - when god doesnt answer
  - god didnt answer my prayer
anchors:
  # "I begged the Lord three times that it might depart from me. He has
  # said to me, 'My grace is sufficient for you'" (WEB, in corpus) —
  # Scripture's paradigm text: asked three times, answered with grace
