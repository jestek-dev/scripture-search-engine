# SIBLING ANCHOR (recorded in all three files): 2 Cor 12:8-9 overlaps
# serious-illness-and-dying's and strength-in-weakness's 12:9-10 — the
# verse's own two movements: v8 the thrice-asked plea (this register),
# v9 the sufficient-grace answer (theirs). Batch precedent: Luke 18:13,
# Jer 31:34.
#
# GIST CARE (the row's own caveat, honored): the same poem that says
# "he shuts out my prayer" (Lam 3:8) later testifies "You heard my
# voice" (3:56). This concept routes to what Scripture says about
# seasons of unanswered prayer — including answers that are a No or a
# different provision — and must never teach that God does not hear.
#
# CORPUS: in-corpus witnesses 2 Cor 12:8-9, Lam 3:8, Lam 3:44.
# Corpus-blocked riders: Ps 80:4; Prov 21:13; 1:28 (personified
# Wisdom's refusal — the staging caveat rides with it); Prov 15:29 (the
