id: refuge-in-trouble
label: Refuge in trouble
lexicon:
  - refuge in trouble
  - shelter in the storm
  - god is our refuge
  - hiding place
  - stronghold in distress
  # Remembered phrasings for Psalm 91:1, added 2026-07-31. They belong HERE
  # rather than in a `remembered-*` pack of their own: this concept already
  # anchors Psalms 91:1-2, and minting a second concept over the same verse
  # is precisely the anchor dilution G4 exists to prevent. A remembered
  # phrasing needs its own pack only when no existing concept names the
  # passage. Measured before the change: the query ranked Psalm 91:1 eleventh.
  - dwells in the shelter of the most high
  - secret place of the most high
  # Bare words are how people commonly search. The one-token specificity
  # discount keeps this trigger weaker than a multi-word concept match.
  - refuge
  # "Be still and know" (Psalm 46:10), added 2026-08-18 (books-harvest
  # curation). Belongs HERE per the Psalm-91 precedent above: this concept
  # already owns Psalm 46 (46:1-3 at 1.0), and minting a rest/quiet concept
  # over 46:10 would decontextualize the verse — in the psalm it is God's
  # word amid the roaring nations, not a relaxation mantra. Bare "be still"
  # collapses to the single common token "still" and is deliberately NOT an
  # entry (see eval/golden/be-still-and-know.json).
  - be still and know
  - be still and know that i am god
