# TAG-GAP ROLLOUT batch 4 (Theme F, 2026-08-26) — ADOPTED-TAG id
# (Theme F row in tag-gaps-review.md, 11 requesting books — the
# theme's widest row). Adopted as display vocabulary by Jesse's
# 2026-08-25 ruling (CONVENTIONS §11); ENGINE admission happens only
# by his merge of this PR.
#
# "Why do we die" / "death in the Bible" / "life is short" — mortality
# itself is distinct from mourning a loss (pastoral-grief-and-loss
# serves the griever, not mortality).
#
# REGISTER BOUNDARIES, all recorded:
#   - serious-illness-and-dying absorbed the death-of-a-believer
#     register (its own 2026-08-18 round-2 admission) and owns bare
#     "death", "to die is gain", "what happens when we die", Phil
#     1:21-23, 2 Cor 5:1/5:6-8, Ps 116:15. This pack claims NO bare
#     death/die token and none of those anchors — doctrine question,
#     not dying-pastoral care.
#   - The row's one-or-two overlap with death-and-burial is DECIDED as
#     two registers; that row (burial practice) is corpus-blocked and
#     stays deferred.
#   - Sheol / the pit routes here and NOT to hell (the log's own
#     no-read-back note) — carried for the re-pin curator; the Ezekiel
#     pit oracles are all corpus-blocked.
#   - Isa 40:8 stays power-of-gods-word's (the anchor below stops at
#     40:7); Eccl 12:7 stays the-breath-of-life's; 1 Cor 15:54-57 stay
#     pastoral-grief-and-loss'; 1 Cor 15:20 stays the resurrection
#     packs'; Gen 5:1-3 stays image-of-god's.
#
# CORPUS: Gen 3:19, Ps 39:4-5, Ps 103:14-16, Eccl 3:19-21, Isa 40:6-7,
# 1 Cor 15:21-22, 1 Cor 15:26, Jas 4:13-14 in corpus. Ps 90:3-12,
# Heb 9:27, Eccl 12:1-7 and Ps 49:10-20 are corpus-blocked riders.
# Eccl 3:19's "all is vanity" clause is the vanity-of-life row's one
# in-corpus refrain instance — cross-noted there (that row stays
# deferred until Eccl 1-2/12 land).
#
# TOKENIZER NOTE (G-4): bare "mortality" is a deliberate single-word
# admission (the subject noun; no competing concept speaks the token).
# Bare "death"/"die"/"dying" are inventory SKIPS — serious-illness-
# and-dying owns bare "death" and the die-family spans its pastoral
# register.
#
# Attribution: ALL anchors [editorial].
# DOCTRINAL SCAN: no watchlist anchor, no materialFrameKeyword.
id: mortality
label: Mortality
lexicon:
  - mortality
  # "why do we die" was considered and DROPPED as a lexicon entry: it
  # normalizes to bare {die} (why/we are stopwords and "do" falls to
  # the 2-char floor) — a structural limit of the one tokenizer
  # (oaths-and-vows' "let your yes be yes" precedent). "why do people
  # die" carries the query family at honest width.
  - why do people die
  - mortality in the bible
  - death in the bible
  - life is short
  - our days are like grass
  - all flesh is grass
  # "dust to dust" was considered and DROPPED: it collapses to bare
  # {dust} ("to" is a stopword; the repeated token stores once) — the
  # 2026-08-08 accident class (shake-the-dust-off queries would fire
  # this pack; "you are dust" collapses identically). "return to dust"
  # carries the register at honest width ({return, dust}).
  - return to dust
  - number our days
anchors:
  # "By the sweat of your face... until you return to the ground...
  # For you are dust, and you shall return to dust" (WEB, in corpus).
  # Where the canon first answers "why do we die"; Gen 3:1-6 stays
  # temptation's — verse-disjoint claims on the shared chapter.
  - ref: Genesis 3:19
    sources: [editorial]
    weight: 1.0
  # "LORD, show me my end... Let me know how frail I am... Surely every
  # man stands as a breath" (WEB, in corpus). The prayed register;
  # Ps 39:12 is sojourners-and-strangers' (same batch) —
  # verse-disjoint.
  - ref: Psalms 39:4-5
    sources: [editorial]
    weight: 0.95
  # "He remembers that we are dust. As for man, his days are like
  # grass... the wind passes over it, and it is gone" (WEB, in corpus).
  # Ps 103:6 is justice-and-oppression's (same batch), 103:8
  # slow-to-anger's, 103:10-11 mercy's, 103:19 providence's, 103:20-21
  # angels' — verse-disjoint claims on the shared psalm.
  - ref: Psalms 103:14-16
    sources: [editorial]
    weight: 0.9
  # "For as in Adam all die, so also in Christ all will be made alive"
  # (WEB, in corpus). Mortality's NT frame — stated, not resolved here;
  # the resurrection hope belongs to the resurrection packs.
  - ref: 1 Corinthians 15:21-22
    sources: [editorial]
    weight: 0.9
  # "The last enemy that will be abolished is death" (WEB, in corpus).
  - ref: 1 Corinthians 15:26
    sources: [editorial]
    weight: 0.8
  # "All flesh is like grass... The grass withers, the flower fades"
  # (WEB, in corpus). Anchor deliberately stops at v7 — v8's "but the
  # word of our God stands forever" is power-of-gods-word's.
  - ref: Isaiah 40:6-7
    sources: [editorial]
    weight: 0.85
  # "that which happens to the sons of men happens to animals... All
  # are from the dust, and all turn to dust again" (WEB, in corpus).
  # Ecclesiastes' unflinching register; the verse's "all is vanity"
  # clause cross-noted to the deferred vanity-of-life row.
  - ref: Ecclesiastes 3:19-21
    sources: [editorial]
    weight: 0.8
  # "What is your life? For you are a vapor that appears for a little
  # time and then vanishes away" (WEB, in corpus). Jas 4:1-2 is
  # covetousness's (same batch), 4:7 resisting-the-devil's, 4:10
  # humble-exaltation's, 4:11-12 judging-others' — verse-disjoint.
  - ref: James 4:13-14
    sources: [editorial]
    weight: 0.85
  # "Teach us to number our days, that we may gain a heart of wisdom"
  # — the row's Psalter spine. (Psalm 90 NOT in web-subset; re-check at
  # re-pin. Ps 90:2 is creation's / gods-unchanging-nature's; the
  # mortality span 90:3-12 is disjoint.)
  - ref: Psalms 90:3-12
    sources: [editorial]
    weight: 0.9
  # "It is appointed for men to die once, and after this, judgment."
  # (Hebrews 9 NOT in web-subset; re-check at re-pin.)
  - ref: Hebrews 9:27
    sources: [editorial]
    weight: 0.85
related:
  - the-breath-of-life
  - resurrection-of-the-dead
  - grief-and-loss
  - seasons-of-life
