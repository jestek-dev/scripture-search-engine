# PASTORAL-CARE PACK — approved by Jesse 2026-07-31 after two external
# reviews (see NEEDS-JESSE §1.8 for what was adopted, demoted, and why).
#
# These anchors speak in LH's voice on the heaviest queries the engine
# receives. Every anchor was verified against the WEB text before admission,
# and the companion golden fixture asserts not only that the right passages
# surface but that the canon's dangerous near-misses (suicide narratives,
# "cut it off" sayings, submission passages) NEVER rank for these queries.
#
# Single-word lexicon entries below are DELIBERATE exceptions per
# NEEDS-JESSE §1.6d option 3: distinctive modern words absent from the WEB
# text ("suicide", "cancer"), where the word IS the concept. Generic-token
# entries remain forbidden.

# One concept, deliberately, where the reviews proposed three
# (suicidal-crisis / depression / despair): the answer set is the same
# passages whichever desperate phrasing was typed, and three concepts
# sharing 80% of their anchors is the dilution G4 exists to prevent.
# The lexicon carries all three registers instead.
# Psalm 88 enters at 0.35: the one psalm that ends in darkness. Its
# value is validation — this prayer is IN the Bible — and its weight
# keeps it from ever leading.
id: hope-in-despair
label: Hope in despair
lexicon:
  - want to give up
  - feeling hopeless
  - no reason to live
  - want to die
  - wish I were dead
  - better off dead
  - thinking about suicide
  - take my life
  - end of my rope
  - drowning in despair
  - everyone would be better off without me
  - cannot go on anymore
  - suicide
  - suicidal
  - depression
  - depressed
  - self harm
  - cutting myself
anchors:
  - ref: 2 Corinthians 1:8-10
    sources: [editorial]
    weight: 1
  - ref: 1 Kings 19:4-7
    sources: [editorial]
    weight: 0.95
  - ref: Matthew 11:28-29
    sources: [editorial]
    weight: 0.94
  - ref: Psalms 42:5
    sources: [editorial]
    weight: 0.93
  - ref: Lamentations 3:21-23
    sources: [editorial]
    weight: 0.85
  - ref: Psalms 40:1-3
    sources: [editorial]
    weight: 0.8
  - ref: Romans 8:38-39
    sources: [editorial]
    weight: 0.8
  - ref: Psalms 13:5-6
    sources: [editorial]
    weight: 0.7
  - ref: Psalms 139:13-14
    sources: [editorial]
    weight: 0.6
  - ref: Psalms 88:1-2
    sources: [editorial]
    weight: 0.35
related:
  - near-to-the-brokenhearted
