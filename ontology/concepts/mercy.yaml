# Mercy — the hesed compassion register the row says "falls between"
# gods-love (owns bare 'love') and forgiveness-of-sins (owns the
# guilt/pardon register). The row's check-first route (extension of
# either neighbour) was checked and DECLINED: routing "mercy" to John
# 3:16 or to pardon anchors would answer the query with the wrong
# register in the chip. The minting quotation "I desire mercy, not
# sacrifice" (Hos 6:6, quoted twice by Jesus) is corpus-blocked in all
