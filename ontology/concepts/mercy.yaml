# SPAN DISCIPLINE: Ps 103:8 is slow-to-anger's (same batch); this pack
# takes vv10-11. Micah 7:18 stays with forgiveness-of-sins (its own
# comment bars adjacent-verse re-anchoring). Lam 3:22-23 stays with
