id: election-and-predestination
label: Election and predestination
lexicon:
  - predestination
  - election
  - does god choose who is saved
  - chosen before the foundation of the world
anchors:
  # "he chose us in him before the foundation of the world... having
  # predestined us for adoption as children through Jesus Christ to
  # himself, according to the good pleasure of his desire" (WEB, in
  # corpus). The vocabulary's home verses. DUAL on 1:5 with
  # adoption-as-gods-children (recorded both files).
  - ref: Ephesians 1:4-5
    sources: [editorial]
    weight: 1.0
  # "For whom he foreknew, he also predestined... Whom he predestined,
  # those he also called. Whom he called, those he also justified.
  # Whom he justified, those he also glorified." (WEB, in corpus).
  # The golden chain, stated whole. SPAN SIBLING with image-of-god's
  # 8:29 (recorded both files).
  - ref: Romans 8:29-30
    sources: [editorial]
    weight: 0.95
  # "We were also assigned an inheritance in him, having been
  # foreordained according to the purpose of him who does all things
  # after the counsel of his will" (WEB, in corpus).
  - ref: Ephesians 1:11
    sources: [editorial]
    weight: 0.9
  # "election stated pastorally, as ground for thanks rather than
  # speculation" (the row) — "God chose you from the beginning for
  # salvation". (2 Thessalonians NOT in web-subset; re-check at
  # re-pin.)
  - ref: 2 Thessalonians 2:13-14
    sources: [editorial]
    weight: 0.7
  # "knowing, brothers loved by God, that you are chosen"
  # (1 Thessalonians 1 NOT in web-subset; re-check at re-pin.)
  - ref: 1 Thessalonians 1:4
    sources: [editorial]
    weight: 0.65
related:
  - providence
  - grace-not-earned
  - assurance-of-salvation
  - gods-plan-for-israel
