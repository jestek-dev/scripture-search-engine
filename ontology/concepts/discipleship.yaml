# widest row). Adopted as display vocabulary by Jesse's 2026-08-25
# ruling (CONVENTIONS §11); ENGINE admission happens only by his merge
# of this PR.
#
# MEASURED GAP (2026-08-26, fixture corpus): "cost of discipleship"
# returned FOUR results, all cost-token noise (Ezek 33:33 rank 1);
# "what does it mean to follow jesus" returned pure follow/jesus
# proximity scatter (John 1:37 narrative luck, chipless).
#
# TWO REGISTERS BY DESIGN (the row's own): the Gospels' call-and-cost
# texts AND the epistles' imitation/mentoring chain (2 Tim 2:2 — "the
# strongest anchor the row has"). One id, per the row's staging.
#
# BOUNDARY WITH surrender-to-god (decided, recorded): that pack owns
# "take up your cross" and "deny yourself" with Luke 9:23 and Matt
# 16:24 — all untouched. This pack anchors the ADJACENT verses (Luke
# 9:57-62; Matt 16:25-26) and the call/mentoring texts; zero shared
# phrases (governing-authorities precedent: design around the
# collision, don't dual-claim it).
#
# OTHER BOUNDARIES: John 13:34-35 stays loving-others' ("by this
# everyone will know that you are my disciples" — cross-noted); Matt
# 28:19-20 already carries four packs' anchors (baptism, trinity,
# nations-and-peoples, mormon-evangelism) and is NOT re-anchored — the
# "make disciples" lexicon entry reaches it lexically and the great
# commission stays where it lives; Luke 18:18-27 stays
# money-and-possessions' span (this pack takes 18:28-30, disjoint);
# John 8:36 stays freedom-from-bondage's (this pack takes 8:31-32).
# Titus 2:3-5 stays godly-marriage's (the older-training-younger
# register is carried by 2 Tim 2:2 instead).
#
# CORPUS: in-corpus witnesses Luke 9:57-62, Mark 1:16-18, Matt
# 16:25-26, Luke 18:28-30, John 8:31-32, John 1:43, 2 Tim 2:2, Phil
# 4:9. Corpus-blocked riders: Matt 4:18-22; 8:18-22; 10:37-39, Mark
# 8:34-38, Luke 14:25-33 (counting the cost — the row's densest cost
# text), John 21:19-22, 1 Thess 1:6, 2 Thess 3:7-9, 2 Tim 3:10, 14.
#
# TOKENIZER NOTES (G-4): bare `discipleship` admitted deliberately
# (the subject noun IS the concept). "follow jesus" ({follow, jesu})
# admitted as a two-token pair — queries carrying both are
# discipleship-intent. No bare "follow" (generic), no bare "disciple"
# ("the disciples" saturates Gospel narrative) — inventory skips.
#
# Attribution: ALL anchors [editorial].
# DOCTRINAL SCAN: no watchlist anchor, no materialFrameKeyword.
