# CORPUS: Exod 20:17, Rom 7:7-8, Col 3:5, Jas 4:1-2 in corpus. Luke
# 12:15 (beware of covetousness), 1 Kgs 21:1-16 (the minting
# narrative), Mic 2:1-2 and Deut 5:21 are corpus-blocked riders.
