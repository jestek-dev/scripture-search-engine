# TOKENIZER NOTE (G-4): "covetousness" and "coveting" both stem to the
# bare token `covet` — deliberate single-word admission (the subject
# noun people type; the WEB's own word; no competing concept speaks the
# stem). "you shall not covet" also collapses to {covet} (you/shall/
