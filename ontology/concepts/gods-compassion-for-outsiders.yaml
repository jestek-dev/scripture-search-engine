  # compassion extended to the enemy city.
  - ref: Jonah 4:2
    sources: [editorial]
    weight: 0.9
  # "Therefore they cried to the LORD... So they feared the LORD
  # exceedingly; and they offered a sacrifice to the LORD" (WEB, in
  # corpus). The pagan sailors spared and worshiping.
  - ref: Jonah 1:14-16
    sources: [editorial]
    weight: 0.7
