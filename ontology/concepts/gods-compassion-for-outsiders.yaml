  # are more than one hundred twenty thousand persons who can't
  # discern between their right hand and their left hand...?" (WEB, in
  # corpus). God's own closing argument — the keystone.
  - ref: Jonah 4:10-11
    sources: [editorial]
    weight: 1.0
  # "I knew that you are a gracious God and merciful, slow to anger,
  # and abundant in loving kindness, and you relent of doing harm."
