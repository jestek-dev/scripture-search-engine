# CORPUS-BLOCKED ROSTER build (post-#64 full-Bible corpus, 2026-08-27) —
# ADOPTED-TAG id (Theme E row, requesting book: Ecclesiastes). Adopted
# as display vocabulary by Jesse's 2026-08-25 ruling (CONVENTIONS
# §11); ENGINE admission only by his merge of this PR. Deferred
# through batches 1-6: the thesis texts were ALL absent (Ecclesiastes'
# corpus was ch. 3 only).
#
# GIST FLAG HONORED (the row's own wording rule): the WEB's "vanity"
# (hevel — vapor, fleeting) and the NIV-remembered "meaningless"
# phrasing are BOTH reachable in the lexicon; the pack routes to the
# book's own arc — the fear-of-the-lord related edge carries Eccl
# 12:13-14's conclusion (that pack's anchor, cross-noted, not claimed
# here) — without flattening the book's honesty (the anchors ARE the
# hard verses; no consolation is glued on).
#
# BOUNDARIES: Eccl 3:19 (the mortality-register refrain instance)
# stays mortality's anchor (the batch-4 cross-note). Eccl 3:1-8 stays
# seasons-of-life's, 3:12-13 enjoying-gods-gifts' — the ch. 3
# incumbents untouched. Eccl 12:13 stays fear-of-the-lord's.
#
# TOKENIZER NOTE (G-4): "vanity of vanities" collapses to the single
# stem `vanity` (both words share it; "of" is a stopword) — deliberate:
# the phrase IS the query people type, the stem reaches the thesis
# texts, and no other concept speaks it. Collapse row + inventory
# admission recorded (bare "vanity" reaching this pack is correct).
#
# Attribution: ALL anchors [editorial].
# DOCTRINAL SCAN: no watchlist anchor, no materialFrameKeyword. The
# pack reports the Preacher's own thesis; it does not resolve the
# book's tension for him.
id: vanity-of-life
label: Vanity of life
lexicon:
  - vanity of vanities
  - life feels meaningless
  - what is the point of life
  - life is meaningless
  - chasing after wind
anchors:
  # "'Vanity of vanities,' says the Preacher; 'Vanity of vanities, all
  # is vanity.' What does man gain from all his labor in which he
  # labors under the sun?" (WEB, in corpus). The thesis — the keystone.
  - ref: Ecclesiastes 1:2-3
    sources: [editorial]
    weight: 1.0
  # "Then I looked at all the works that my hands had worked... and
  # behold, all was vanity and a chasing after wind, and there was no
  # profit under the sun." (WEB, in corpus).
  - ref: Ecclesiastes 2:11
    sources: [editorial]
    weight: 0.9
  # "So I hated life, because the work that is worked under the sun
  # was grievous to me; for all is vanity and a chasing after wind."
  # (WEB, in corpus). The book at its most honest.
  - ref: Ecclesiastes 2:17
    sources: [editorial]
    weight: 0.85
  # "'Vanity of vanities,' says the Preacher. 'All is vanity!'" (WEB,
  # in corpus). The refrain closing the book — the arc's last word
  # before the conclusion (12:13-14 stays fear-of-the-lord's).
  - ref: Ecclesiastes 12:8
    sources: [editorial]
    weight: 0.85
  # "I have seen all the works that are done under the sun; and
  # behold, all is vanity and a chasing after wind." (WEB, in corpus).
  - ref: Ecclesiastes 1:14
    sources: [editorial]
    weight: 0.75
related:
  - fear-of-the-lord
  - mortality
  - enjoying-gods-gifts
  - seasons-of-life
sources: [editorial]
