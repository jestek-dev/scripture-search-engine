id: holiness
label: Called to be holy
# Torrey/Miller admission 2026-08-06. Torrey anchors drawn from the verified
# outline(s): HOLINESS; SANCTIFICATION. Lexicon is modern
# editorial phrasing; Torrey headings are provenance, not query language.
lexicon:
  - be holy
  - set apart
  - pursue holiness
  - sanctified
  - clean hands and a pure heart
  # Round-2 book admission 2026-08-18.
  # Bare word (one-token discount): sexual-purity keeps its multi-word
  # phrases — the bare token's honest home is the general call to holiness.
  - purity
  # Phase-4 P4.2 extension 2026-08-21 (audit sanct1/sanct2, [VER] §4):
  # 'sanctified' stems to the token `sanctifi`, but the pastor-register
  # nouns normalize to themselves ('sanctification' -> `sanctification`,
  # 'sanctify' -> `sanctify`) — distinct tokens under the one tokenizer, so
  # neither query could ever fire this concept. Explicitly rejected
  # alternative: extending the stemmer — the lexicon entry is the
  # deterministic, reviewable, zero-blast-radius fix. Bare `holiness`
  # stays OUT here: it belongs to the bare-word inventory item
  # (P4.11, BLOCKED-coordination with PR #33).
  - sanctification
  - sanctify
anchors:
  - ref: 1 Peter 1:15-16
    sources: [editorial]
    weight: 1.0
  - ref: Hebrews 12:14
    sources: [editorial]
    weight: 0.95
  - ref: Psalms 24:3-4
    sources: [editorial]
    weight: 0.9
