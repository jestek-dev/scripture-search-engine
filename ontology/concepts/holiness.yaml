  - ref: 1 Thessalonians 4:3
    sources: [torrey]
    weight: 0.9
  - ref: 2 Corinthians 7:1
    sources: [torrey]
    weight: 0.75
  - ref: 1 Thessalonians 4:7
    sources: [torrey]
    weight: 0.75
  - ref: 1 Thessalonians 5:23
    sources: [torrey]
    weight: 0.7
  # Round-2 book admission 2026-08-18 — leads from the approved books,
  # verified in WEB context; the books are never engine sources.
  # "everyone who has this hope set on him purifies himself, even as he is
  # pure."
  - ref: 1 John 3:3
    sources: [editorial]
    weight: 0.75
