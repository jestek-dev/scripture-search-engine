# TOKENIZER DISCIPLINE (G-4, verified): "priesthood" is the concept's
# own subject noun, a deliberate bare entry (inventory row admitted:
# [priesthood]). Other entries keep >= 2 significant tokens ({high,
# priest}, {priest, old, testament}, {royal, priesthood}, {great, high,
# priest}, {jesu, high, priest}). Worst neighbor overlaps: {great} with
# several packs, {jesu} with jesus-the-only-way — 1 incidental token
# each, zero shared phrases.
#
