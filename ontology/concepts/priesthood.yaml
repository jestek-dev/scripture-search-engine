# deliberately not built or absorbed (per the Exodus row: "decide the
# two together before minting" — decided: kept apart; mediator remains
# an open later-batch row). The intercession register ("Jesus prays for
# me", Heb 7:25) is corpus-blocked and rides the re-pin with the Heb 7
# anchor below.
#
# Attribution: ALL anchors [editorial].
