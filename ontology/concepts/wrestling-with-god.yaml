# GENESIS-PILOT PACK (14-concept round, drafted 2026-08-22) — struggling
# WITH God while refusing to let go of him: Jacob at the Jabbok, the lament
# psalms' "how long", Job demanding his hearing, Jeremiah's complaint,
# Habakkuk's protest. The register is engagement, not resignation — the
# person who argues with God is still talking to him.
#
# SENSE BOUNDARIES (verified against neighbors 2026-08-22):
# - NOT `doubt` (p6 stack: {doubt, help my unbelief}) — the doubter wavers
#   about believing; the wrestler believes and protests. Zero shared tokens;
#   add a `related: doubt` edge if/when the stacks co-land (cannot reference
#   a concept that does not exist on this branch).
# - NOT `surrender-to-god` — surrender is the laying down; wrestling is the
#   holding on. Related-edge, not lexicon overlap (shared tokens {god, lord}
#   only, ratio 0.20).
# - NOT `hope-in-despair` — that pack owns the crisis register (suicidal
#   ideation, depression) and the RESOLUTION verses of the very psalms this
#   pack anchors: it holds Ps 13:5-6 and Ps 88:1-2; this pack anchors the
#   COMPLAINT verses (13:1-2; 88:13-14) — disjoint ranges, deliberately.
# - Lamentations 3 is deliberately NOT anchored: three concepts already own
#   its slices (gods-faithfulness 3:22-23, hope-in-despair 3:21-23,
#   trust-in-god 3:25-26); see notes.md debatable list.
#
# LEXICON TRAP RECORDED (2026-08-22): the remembered phrasing "I will not
# let you go unless you bless me" (Gen 32:26) collapses to the single
# significant token {bless} under the tokenizer (will/not/let/you/unless/me
# are stopwords, "go" is under the 3-char floor) — a bare-`bless` entry
# would fire this concept on every blessing query AND on the ot-blessing
# noise probe ("the LORD bless you and keep you"), dumping eight lament
# anchors into its top-10 (G8 churn). The phrasing is therefore EXCLUDED;
# "jacob wrestling with the angel" carries that search intent instead.
# Record as a skipped-token row (bless) if the lexicon-inventory gate lands.
#
# DOCTRINAL SCAN: no materialFrameKeyword in id, label, or lexicon; no
# anchor on the flagged-pairings watchlist. Sense-inversion sweep: none of
# the anchors meets the wrestler with rebuke — Gen 32 ends in blessing,
# Job 42:7 vindicates Job's speech over his friends', Hab 2:1 is answered.
# Nothing to demote; "how long o lord" resolves to the complaint psalm
# itself, which is the honest answer.
id: wrestling-with-god
label: Wrestling with God
lexicon:
  - wrestling with god
  # Carries the Gen 32 search intent (see LEXICON TRAP note above).
  - jacob wrestling with the angel
  - struggling with god
  - arguing with god
  # The pastoral register: permission to bring anger INTO prayer, answered
  # by psalms that do exactly that. Flagged for Jesse in notes.md.
  - angry at god
  - when god is silent
  - how long o lord
anchors:
  # Torrey PRAYER, ANSWERS TO "Exemplified > Jacob :: Genesis 32:24-30" —
  # exact range (also BOLDNESS, HOLY and COMMUNION WITH GOD, both
  # 32:24-29; PRAYER "Should be offered up > With importunity" :: 32:26).
  # "I will not let you go unless you bless me… you have fought with God
  # and with men, and have prevailed" (WEB from knowledge — Genesis 32 NOT
  # in web-subset; see notes.md corpus request — this is the concept's
  # naming text and the one extension worth asking for).
  - ref: Genesis 32:24-30
    sources: [torrey]
    weight: 1.0
  # "How long, LORD? Will you forget me forever? How long will you hide
  # your face from me?" — the canonical complaint opener, IN the fixture
  # corpus; carries the G3 assertion. The psalm's resolution (13:5-6) is
  # hope-in-despair's anchor — this range stays on the complaint,
  # deliberately disjoint. Editorial: Torrey files 13:5-6 (AFFLICTED,
  # SAINTS "Should praise God") and 13:3, not the complaint verses.
  - ref: Psalms 13:1-2
    sources: [editorial]
    weight: 0.9
  # "When I tried to understand this, it was too painful for me — until I
  # entered God's sanctuary" — Asaph's wrestle with the prosperity of the
  # wicked, and where it turned. IN corpus. Editorial for the range: Torrey
  # corroborates each side under other identities (PROVIDENCE OF GOD
  # "Sometimes dark and mysterious" :: 73:16; HAPPINESS OF THE WICKED
  # "Sometimes a stumbling-block to saints" :: 73:3, 73:16, and "Saints
  # often permitted to see the end of" :: 73:17-20). The envy verse (73:3)
  # is left to the envy-and-jealousy draft.
  - ref: Psalms 73:16-17
    sources: [editorial]
    weight: 0.85
  # Hosea's inspired commentary on the Jabbok: "he had power with God…
  # he wept and made supplication" (WEB from knowledge — Hosea not in
  # web-subset). Editorial: Torrey files 12:3-5 under CHRIST IS GOD and
  # 12:4 under PRAYER "Accompanied with > Weeping" — corroborations under
  # other identities.
  - ref: Hosea 12:3-4
    sources: [editorial]
    weight: 0.8
  # "Oh that I knew where I might find him!… I would set my cause in order
  # before him, and fill my mouth with arguments" — Job asking for the
  # hearing; the arguing-with-God text par excellence. (WEB from knowledge
  # — Job 23 not in web-subset.) Editorial: Torrey's ch. 23 rows (GOD
  # "Invisible" :: 23:8-9; SAINTS COMPARED TO "Gold" :: 23:10) corroborate
  # the seeking-and-not-finding frame without attributing these verses.
  - ref: Job 23:3-4
    sources: [editorial]
    weight: 0.75
  # "LORD, you have persuaded me, and I was persuaded… If I say I will not
  # make mention of him… then there is in my heart as it were a burning
  # fire" — the prophet's complaint AGAINST God held together with the
  # inability to leave him: the concept in one passage. (WEB from knowledge
  # — Jeremiah 20 not in web-subset.) Editorial: Torrey lists 20:7-8
  # (SCORNING AND MOCKING, endured for faithfulness), 20:9 (HEART "God
  # influences"), and files 20:14-18 as MURMURING "Exemplified > Jeremiah"
  # — corroborations that the outline knows this chapter as complaint.
  - ref: Jeremiah 20:7-9
    sources: [editorial]
    weight: 0.75
  # "LORD, how long will I cry, and you will not hear?" — Habakkuk opens
  # with the protest and stations himself for the answer (2:1). (WEB from
  # knowledge — Habakkuk 1 not in web-subset; only ch. 3 is.) Editorial for
  # the range: Torrey lists 1:2 (PRAYER, PRIVATE "Exemplified > Habakkuk")
  # and 1:3-4 under STRIFE/INJUSTICE.
  - ref: Habakkuk 1:2-4
    sources: [editorial]
    weight: 0.7
  # "LORD, why do you reject my soul? Why do you hide your face from me?"
  # — the darkest psalm's direct challenge, still addressed to "LORD, the
  # God of my salvation" (88:1). IN corpus. Low weight on the
  # hope-in-despair precedent (it holds 88:1-2 at 0.35): validation, never
  # the lead. Disjoint range from its anchor.
  - ref: Psalms 88:13-14
    sources: [editorial]
    weight: 0.6
# BOUNDARY (tag-gap batch 5, 2026-08-26): lament minted beside this
# pack. This pack keeps the individual's protest-engagement register —
# "how long o lord", "when god is silent", "arguing with god", and the
# complaint verses Ps 13:1-2 / 88:13-14 — all untouched. lament carries
# the practice/form register ("how to lament", "psalms of lament",
# Lamentations, the composed and communal laments). Disjoint anchors,
# disjoint phrases; recorded in both files.
related:
  - prayer
  - hope-in-despair
  - surrender-to-god
  - lament
