# 1 Tim 2:5 were all absent.
#
# ONE-OR-TWO vs redeemer DECIDED at curation (both built this PR,
# reversible): two registers — this pack is the GO-BETWEEN longing
# ("no umpire between us") and its NT answer; redeemer is the ransom
# confession. Cross-related, zero shared phrases.
#
# The Hebrews decide-alongside-priesthood merge note HONORED: Heb 8:6 /
# 9:15 / 12:24 stay with their owners (priesthood's office register;
