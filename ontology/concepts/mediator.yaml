#
# TOKENIZER NOTE (G-4): two deliberate single-token collapses —
# "one mediator" -> `mediator` ("one" is a stopword) and "umpire
# between us" -> `umpire` ("between"/"us" are stopwords). Both stems
# are distinctive (no other concept speaks either); bare `mediator` is
# the subject noun people type, and bare `umpire` is the WEB's own
# word for Job 9:33 (KJV "daysman"). Collapse rows + inventory
# admissions recorded.
#
# Attribution: ALL anchors [editorial].
# DOCTRINAL SCAN: no watchlist anchor, no materialFrameKeyword. The
# pack reports Job's longing and Paul's sentence side by side; it
# does not adjudicate the typology between them.
