# TAG-GAP ROLLOUT batch 5 (Theme I, 2026-08-26) — ADOPTED-TAG id
# (Theme I row in tag-gaps-review.md, 5 requesting books). Adopted as
# display vocabulary by Jesse's 2026-08-25 ruling (CONVENTIONS §11);
# ENGINE admission happens only by his merge of this PR.
#
# MEASURED GAP (2026-08-26, fixture corpus): "backsliding" returned TWO
# results, both token noise; "falling away from the faith" was hijacked
# by Acts 13:8 (Elymas "seeking to turn the proconsul away from the
# faith" — exact-phrase luck, the wrong event entirely) over faith-pack
# flood; "drifting away from god" returned pure away/god proximity
# noise.
#
# EXTENSION ROUTE CHECKED AND DECLINED (the row's own flag): the
# check-first is relapse-and-restoration. Its register is the personal
# "failed again" sobriety/restoration crisis; this row is drift and
# apostasy from the faith — the 1 Timothy fold's own boundary
# restatement. Answering "my child left the faith" with relapse-crisis
# texts would be a register mismatch. Cross-related instead.
#
# GIST CARE (contested-doctrine guardrail): Hebrews' warning passages
# are Scripture's most contested texts on whether a believer can fall
# away. The gist DESCRIBES the warnings with the texts' own urgency and
# adjudicates neither the perseverance-of-the-saints question nor its
# denial — assurance-of-salvation carries the assurance side,
# cross-related, and the two packs together give both witnesses
# (hardness-of-heart / individual-responsibility precedent for
# both-statements-described).
#
# BOUNDARIES: 1 Tim 6:10 ("wandered from the faith") stays inside
# contentment's 1 Tim 6:6-10 span — cross-noted, not double-claimed.
# 2 Tim 2:19 stays assurance-of-salvation's (this pack takes 2:17-18,
# disjoint). Heb 10:24-25 stays gathering-together's (this pack takes
# 10:26-27, adjacent and disjoint). Jer 17:5-6 stays trusting-in-man's.
#
# CORPUS: in-corpus witnesses Heb 6:4-6, Heb 10:26-27, Heb 12:25, Heb
# 12:15, 2 Tim 2:17-18, Jer 31:22. Corpus-blocked riders: Heb 2:1
# ("lest we drift away" — the drift word itself), Heb 3:12-19, Judg
# 2:11-19 (the cycle stated) with 3:7-13:1's recurrences, 1 Tim
# 1:19-20; 4:1-3, 2 Tim 4:10 (Demas — the named-desertion register),
# Neh 9:26-28; 13:4-31, Prov 14:14, Jer 2:19; 3:6-14, Hos 14:4.
#
# TOKENIZER NOTES (G-4): bare `backslid` (backsliding) and bare
# `apostasy` admitted — both are the subject nouns, and `backslid`
# appears in the WEB corpus bytes (Jer 31:22). No bare "faith"
# (faith's), no bare "fall"/"away" (generic) — inventory skips.
#
# Attribution: ALL anchors [editorial].
# DOCTRINAL SCAN: Heb 6:4-6 described, not adjudicated (see GIST CARE);
# no materialFrameKeyword.
id: backsliding
label: Backsliding
lexicon:
  - backsliding
  - apostasy
  - falling away from the faith
  - drifting from god
  - left the faith
anchors:
  # "...and then fell away" — the warning at full strength (WEB, in
  # corpus). Described with the text's own urgency; the
  # perseverance question it raises is adjudicated by neither this pack
  # nor assurance-of-salvation (see header).
  - ref: Hebrews 6:4-6
    sources: [editorial]
    weight: 1.0
  # "For if we sin willfully after we have received the knowledge of
  # the truth..." (WEB, in corpus). (Heb 10:24-25 stays
  # gathering-together's — adjacent, disjoint.)
  - ref: Hebrews 10:26-27
    sources: [editorial]
    weight: 0.9
  # "See that you don't refuse him who speaks" (WEB, in corpus).
  - ref: Hebrews 12:25
    sources: [editorial]
    weight: 0.8
  # "...lest there be any man who falls short of the grace of God, lest
  # any root of bitterness springing up trouble you" (WEB, in corpus).
  - ref: Hebrews 12:15
    sources: [editorial]
    weight: 0.75
  # Hymenaeus and Philetus, "men who have erred concerning the truth...
  # overthrowing the faith of some" (WEB, in corpus) — the
  # named-desertion register. (2 Tim 2:19's firm-foundation answer
  # stays assurance-of-salvation's.)
  - ref: 2 Timothy 2:17-18
    sources: [editorial]
    weight: 0.7
  # "How long will you go here and there, you backsliding daughter?"
  # (WEB, in corpus) — the word itself in Israel's national register;
  # low weight, the token witness.
  - ref: Jeremiah 31:22
    sources: [editorial]
    weight: 0.5
  # "Therefore we ought to pay greater attention to the things that
  # were heard, lest perhaps we drift away." (Hebrews 2 NOT in
  # web-subset; re-check at re-pin — the drift text itself.)
  - ref: Hebrews 2:1
    sources: [editorial]
    weight: 0.9
  # The Judges cycle stated: "they turned away quickly out of the way"
  # — the corporate relapse cycle the row names. (Judges 2 NOT in
  # web-subset; re-check at re-pin.)
  - ref: Judges 2:11-19
    sources: [editorial]
    weight: 0.8
  # Demas: "having loved this present world" — the named desertion.
  # (2 Timothy 4 NOT in web-subset; re-check at re-pin.)
  - ref: 2 Timothy 4:10
    sources: [editorial]
    weight: 0.6
related:
