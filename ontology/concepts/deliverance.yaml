# CORPUS-BLOCKED ROSTER build (post-#64 full-Bible corpus, 2026-08-27) —
# Theme H row 32 (6 requesting books: 1-2 Samuel, Judges, 1 Kings,
# Ezra, Esther). Deferred because EVERY requested ref was absent.
#
# REGISTER (the row's own case): the plain rescue register — "God
# delivered me / will deliver you" — which had no home: salvation is
# gospel-keyed, gods-protection the shielding register,
# pastoral-freedom-from-bondage the crisis pack. None touched.
#
# BOUNDARIES: Judg 2:16, 18 stay inside backsliding's 2:11-19 anchor
# (this pack takes Judg 3:9 — the cycle's first named instance);
# Ezra 8:22 stays inside fasting's 8:21-23 (this pack takes 8:31, the
# deliverance reported); Esth 4:16 stays courage's (this pack takes
# 4:14 — the row's own phrase witness, adjacent and disjoint; the
# row's register caveat kept: Esther's deliverance arrives with no
# named deliverer, which is why the phrase is searched); 1 Sam 7:12
# (Ebenezer) goes to remembrance-and-memorials (same PR) — this pack
# takes the disjoint 7:10-11 rescue verses. Proverbs' recorded decline
# (11:8; 12:13 act-consequence generalizations) honored: not anchored.
# MEASURED MISROUTE FIXED: "god will deliver you" returned Deut 7:23
# rank 1 (destroy-the-nations register, wrong intent).
#
# Attribution: ALL anchors [editorial].
# DOCTRINAL SCAN: no watchlist anchor, no materialFrameKeyword. The
# pack reports the texts' own testimony of rescue; it promises no
# outcome.
id: deliverance
label: Deliverance
