# APOLOGETICS WAVE (batch 2, 2026-08-25) — PENDING-TAG-GAP id (Theme C row
# in tag-gaps-review.md; admission rides Jesse's merge of this draft PR,
# plan G-3). God is eternally and unchangeably God — from everlasting, not
# a man, without variation. Honest answer-ground for eternal-progression
# queries; the engine reports what the texts teach, never argues.
#
# Attribution: ALL anchors [editorial] (map corroborations:
# aomin-mormon-verses, scoping-brief — never engine sources).
#
# TOKENIZER DISCIPLINE (G-4, verified): "god does not change" normalizes to
# the identical token set as "does god change" ({do, god, change}) and is
# not duplicated; "from everlasting to everlasting" collapses to the single
# stem {everlast} and is declined; no phrase below collapses to one token.
# "the same yesterday today and forever" (Heb 13:8, in corpus) is left out
# per the map: Heb 13:8 is not a map anchor here, and an unanchored lexicon
