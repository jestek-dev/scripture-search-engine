id: gods-love
label: The love of God
# Torrey/Miller admission 2026-08-06. Torrey anchors drawn from the verified
# outline(s): LOVE OF CHRIST, THE; LOVE OF GOD, THE. Lexicon is modern
# editorial phrasing; Torrey headings are provenance, not query language.
lexicon:
  - god loves you
  - god so loved the world
  - unfailing love
  - steadfast love of the lord
  - nothing can separate us from the love of god
  # The bare word "love", Jesse's call 2026-08-08: it defaults HERE, and the
  # results still show both senses. `loving-others` is already listed under
  # related:, so a query for "love" surfaces God's love as the primary
  # theme and one-another love as a related theme, labelled as such.
  # Deliberately not added to `loving-others` as well: two concepts firing
  # equally on the commonest word in the product is how anchors dilute.
  - love
  # TAG-GAP ROLLOUT batch 2 (2026-08-26): the gods-delight-in-his-people
  # Theme C row (Zeph 3:14-17) resolved by its OWN check-first
  # alternative — a lexicon/anchor extension HERE, decided
  # extension-vs-mint per the leadership-row precedent the row cites.
  # "God delights in you" / "God rejoices over you" / "does God sing
  # over us" are heavily-searched comfort queries with no landing; their
  # landing verse (Zeph 3:17) is corpus-blocked (Zephaniah absent
  # entirely) and rides the re-pin below with the row's
  # remembered-phrasing note. In corpus the register is carried by Ps
  # 147:11 and Isa 43:4. Fixture: gods-delight-in-his-people.json.
  - god delights in you
  - god rejoices over you
  - god sings over you
anchors:
  - ref: John 3:16
    sources: [editorial]
    weight: 1.0
  - ref: Romans 8:38-39
    sources: [editorial]
    weight: 0.95
  - ref: Romans 5:8
    sources: [editorial]
    weight: 0.9
  - ref: 1 John 4:9-10
    sources: [torrey]
    weight: 0.8
  - ref: Jeremiah 31:3
    sources: [torrey]
    weight: 0.75
  - ref: 1 John 3:1
    sources: [torrey]
    weight: 0.75
  - ref: John 15:13
    sources: [torrey]
    weight: 0.7
  # Widened 3:19 -> 3:17-19, round-2 book admission 2026-08-18: vv17-18
  # are the same sentence — "rooted and grounded in love... to know
  # Christ's love"; three book chapters cite 3:17-18 and the clipped v19
  # anchor missed them. Sources/weight kept.
  - ref: Ephesians 3:17-19
    sources: [torrey]
    weight: 0.65
  # Round-2 book admission 2026-08-18 — leads from the approved books,
  # verified in WEB context; the books are never engine sources.
  # "If God is for us... He who didn't spare his own Son" — the love
  # proven by the giving of the Son. (Torrey files 8:32 under ATONEMENT /
  # GIFTS OF GOD; editorial for the range.)
  - ref: Romans 8:31-32
    sources: [editorial]
    weight: 0.85
  # "Who shall separate us from the love of Christ?" — adjacent to the
  # pack's existing 8:38-39, but the question verse people quote. Torrey:
  # LOVE OF CHRIST, THE ("To saints, is Indissoluble").
  - ref: Romans 8:35
    sources: [torrey]
    weight: 0.8
  # "for his great love with which he loved us... made us alive"; Torrey
  # lists 2:4 under LOVE OF GOD, THE ("Described as Great"); editorial for
  # the range.
  - ref: Ephesians 2:4-5
    sources: [editorial]
    weight: 0.8
  # "We know and have believed the love which God has for us." Torrey:
  # LOVE OF GOD, THE.
  - ref: 1 John 4:16
    sources: [torrey]
    weight: 0.8
  # "We love him, because he first loved us." Torrey: LOVE OF GOD, THE
  # ("The source of our love to him").
  - ref: 1 John 4:19
    sources: [torrey]
    weight: 0.75
  # "The LORD takes pleasure in those who fear him, in those who hope in
  # his loving kindness" (WEB, verified in web-subset). The delight
  # register's in-corpus witness — no lexical rung reaches it from
  # "delight" vocabulary, which was the measured gap. Added TAG-GAP
  # batch 2 (2026-08-26); Ps 147:1 stays praise's, 147:2
  # restoration-of-israel's, 147:3 near-to-the-brokenhearted's — no span
  # overlap.
  - ref: Psalms 147:11
    sources: [editorial]
    weight: 0.75
  # "Since you have been precious and honored in my sight, and I have
  # loved you" (WEB, verified in web-subset). Added TAG-GAP batch 2
  # (2026-08-26); Isa 43:1-3 stays fear-not's, 43:5-7
  # restoration-of-israel's — the v4 gap between them is exactly this
  # register.
  - ref: Isaiah 43:4
    sources: [editorial]
    weight: 0.7
  # "He will rejoice over you with joy. He will calm you in his love.
  # He will rejoice over you with singing" — the row's landing verse;
  # searchers quote NIV's "quiet you with his love" / "mighty to save",
  # which the lexicon entries carry. (Zephaniah NOT in web-subset;
  # re-check at re-pin.) Added TAG-GAP batch 2 (2026-08-26).
  - ref: Zephaniah 3:17
    sources: [editorial]
    weight: 0.8
related:
  - loving-others
  - the-cross
