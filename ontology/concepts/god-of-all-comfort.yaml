# DRAFT 2026-08-18 (Comfort & the Spirit cluster) — implements the comfort
# half of the §7.7 PR-3 "comfort pair". Anchor set and weights follow
# docs/plans/2026-08-14-implementation-plan.md §7.7 exactly; source labels
# were re-derived against the verified Torrey outline (see manifest.md —
# §7.7 said "editorial" for the whole pack, but five of the six anchors are
# verbatim in AFFLICTION, CONSOLATION UNDER, and fear-not.yaml's precedent
# is to say so). Jesse decides which labeling stands.
#
# Lexicon is token-disjoint from holy-spirit-the-comforter by design: the
# light stemmer (-ing/-ies/-ed/-es/-s only) never reduces "comforter" to
# "comfort", so the bare words route to different packs — the §7.7 design.
# "comforted"/"comforting" DO reduce to "comfort" and are covered free.
id: god-of-all-comfort
label: God of all comfort
lexicon:
  - comfort
  - god of all comfort
  - comfort in hard times
  - comfort in affliction
anchors:
  # "the Father of mercies and God of all comfort, who comforts us in all
  # our affliction, that we may be able to comfort those..." — the passage
  # that defines the topic, and names comfort as received-then-given.
  - ref: 2 Corinthians 1:3-4
    sources: [torrey]
    weight: 1.0
  # "Blessed are those who mourn, for they shall be comforted." NOT in the
  # Torrey outline — editorial, corroborated by Phillips's Comfort topic.
  - ref: Matthew 5:4
    sources: [editorial]
    weight: 0.95
  # Torrey/Miller admission (drafted 2026-08-18) — supporting anchors from
  # the verified outline: AFFLICTION, CONSOLATION UNDER.
  # "Comfort, comfort my people, says your God."
  - ref: Isaiah 40:1
    sources: [torrey]
    weight: 0.85
  # "your rod and your staff, they comfort me" — comfort inside the valley,
  # not after it.
  - ref: Psalms 23:4
    sources: [torrey]
    weight: 0.8
  # "who loved us and gave us eternal comfort and good hope through grace,
  # comfort your hearts and establish them"
  - ref: 2 Thessalonians 2:16-17
    sources: [torrey]
    weight: 0.75
  # "to comfort all who mourn" — Messiah's own commission (Luke 4 quotes it).
  - ref: Isaiah 61:1-2
    sources: [torrey]
    weight: 0.7
  # Round-2 book admission 2026-08-18 — leads from the approved books,
  # verified in WEB context; the books are never engine sources.
  # "through perseverance and through encouragement of the Scriptures we
  # might have hope." Torrey: AFFLICTION, CONSOLATION UNDER.
  - ref: Romans 15:4
    sources: [torrey]
    weight: 0.7
openbibleTopics:
  - comfort
related:
  - holy-spirit-the-comforter
  - near-to-the-brokenhearted
  - grief-and-loss
