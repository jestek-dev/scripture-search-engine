# permanently silent toward a seeker (Amos's famine is the prophets'
# own warning to a covenant people spurning the word they had).
id: famine-of-hearing-gods-word
label: Famine of hearing God's word
lexicon:
  - famine of the word
  - a famine of hearing the words of the lord
  - god withholding his word
  - no vision from the lord
anchors:
  # "Behold, the days come," says the Lord GOD, "that I will send a
  # famine in the land, not a famine of bread, nor a thirst for water,
  # but of hearing the LORD's words. They will wander from sea to
  # sea... to seek the LORD's word, and will not find it." (WEB, in
  # corpus). The passage that IS the row.
  - ref: Amos 8:11-12
    sources: [editorial]
    weight: 1.0
  # "The LORD's word was rare in those days. There were not many
  # visions, then." (WEB, in corpus). The register's narrative
  # statement at Shiloh.
  - ref: 1 Samuel 3:1
    sources: [editorial]
    weight: 0.8
  # "Her king and her princes are among the nations where the law is
  # not. Yes, her prophets find no vision from the LORD." (WEB, in
  # corpus). The exile's word-withheld verse. (Lam 3:8/3:44 stay
  # unanswered-prayer's — the settled routing.)
  - ref: Lamentations 2:9
    sources: [editorial]
    weight: 0.75
