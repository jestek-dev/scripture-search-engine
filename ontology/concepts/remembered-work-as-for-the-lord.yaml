# REMEMBERED-PHRASING PACK
#
# People search in the wording they memorised, which is usually NIV or ESV.
# The corpus is the WEB. Measured against the full artifact, this query does
# not reach its passage by any lexical rung: absent from results entirely (the WEB reads "work heartily, as for the Lord").
#
# A public-domain translation cannot close this — the remembered wordings are
# copyrighted, so the phrasing will never appear in the text we ship. Layer A
# is the mechanism that fits: the lexicon holds the remembered phrasing, the
# anchor names the verse it refers to, and the reason chip says LH editorial
# said so. The engine reports that a curated source names this passage; it
# does not claim the wording is the verse.
#
# ONE anchor per pack, deliberately. Every anchor of a matched concept fires,
# so a pack bundling ten phrasings against ten anchors would answer "plans to
# prosper you" with all ten passages. Narrow anchor, narrow claim.
id: remembered-work-as-for-the-lord
label: Working as for the Lord
lexicon:
  - work at it with all your heart
  - whatever you do work at it with all your heart
  - working for the Lord and not for men
  # Life-situation aliases, 2026-08-18 (books-harvest curation). The prayer
  # books' "New Job" / "Being a Godly Employee" topics and Phillips
  # "Occupation" confirm these as real search language; Col 3:23 is the
  # pack's answer to them. They widen this pack's remembered-phrasing
  # charter slightly while keeping its single anchor (two new queries, still
  # exactly one passage answered). Bare "work" is deliberately NOT an entry:
  # it normalizes to one generic token and would anchor this verse into
  # every query carrying it. A Prov 16:3 anchor was considered and deferred
  # (breaks the one-anchor design; unmeasurable until Proverbs 16 joins the
  # fixture corpus).
  - new job
  - my job
anchors:
  - ref: Colossians 3:23
    sources: [editorial]
    weight: 1.0
