id: watchman-and-warning
label: The watchman's charge
lexicon:
  - watchman
  - warn the wicked
  - responsibility to warn others
  - blood on your hands
anchors:
  # "So you, son of man, I have set you a watchman to the house of
  # Israel... if you warn the wicked of his way to turn from it... you
  # have delivered your soul" (WEB, in corpus) — the charge stated in
  # full: the whole watchman parable and its application. (Ezek 33:20
  # stays individual-responsibility's; 33:30-32 empty-worship's.)
  - ref: Ezekiel 33:1-9
    sources: [editorial]
    weight: 1.0
  # "I testify to you today that I am clean from the blood of all men,
  # for I didn't shrink from declaring to you the whole counsel of God"
  # (WEB, in corpus) — the row's own named NT echo of the charge.
  - ref: Acts 20:26-27
    sources: [editorial]
    weight: 0.9
  # The first statement of the charge: "I have made you a watchman to
  # the house of Israel: therefore hear the word from my mouth, and
  # give them warning from me." (Ezekiel 3 NOT in web-subset; re-check
  # at re-pin.)
  - ref: Ezekiel 3:16-21
    sources: [editorial]
    weight: 0.9
  # "I have set watchmen on your walls, Jerusalem. They will never be
  # silent day nor night." (Isaiah 62 NOT in web-subset; re-check at
  # re-pin.)
  - ref: Isaiah 62:6-7
    sources: [editorial]
    weight: 0.6
related:
  - sharing-your-faith
  - individual-responsibility
  - false-prophets
