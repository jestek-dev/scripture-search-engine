id: humble-exaltation
label: God exalts the humble
# Torrey/Miller supporting anchors (admission 2026-08-06) — from the
# verified outlines: HUMILITY; PROVIDENCE OF GOD, THE.
lexicon:
  - promotion
  - humility
  - humble yourselves
  - god exalts the humble
