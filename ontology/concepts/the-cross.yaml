id: the-cross
label: The cross and atonement
# Torrey/Miller admission 2026-08-06. Torrey anchors drawn from the verified
# outline(s): ATONEMENT, THE; REDEMPTION. Lexicon is modern
# editorial phrasing; Torrey headings are provenance, not query language.
lexicon:
  - jesus died for our sins
  - the blood of jesus
  - the lamb of god
  - by his wounds we are healed
  - christ died for us
  - atonement
  # Single-token entry, added 2026-08-08. Bare words are what people actually
  # type; the one-token specificity discount in conceptAnchorEvidence (0.55)
  # keeps the claim humble relative to a multi-word match.
  - the cross
  # Phase-4 P4.3 extension 2026-08-21 (audit th2, [VER] §4): the WEB never
  # contains "propitiation" (verified corpus-wide), so no lexical rung can
  # ever reach it — only a curated lexicon entry can. 'atoning sacrifice'
  # is the WEB's own wording at 1 John 2:2 / 4:10.
  - propitiation
  - atoning sacrifice
  # Alias-mining batch 1 extension (2026-08-26, coverage plan §2.3 item 2;
  # popular-verses Tier 1 seed, Isaiah 53:5 rank 20). ASV wording (1901,
  # public domain): "with his stripes we are healed" — the register
  # memorization programs and Handel's Messiah carry. 'stripes' stems to a
  # token the WEB text never contains ('by his wounds we are healed', the
  # entry above), so the query measured Isaiah 53:5 ABSENT from the top 10
  # (dead-ended in the bare 'healing' cue — see eval/golden/
  # stripes-healed.json for the fixture-first evidence). Extension here,
  # never a new concept: this pack already anchors Isaiah 53:5 at 1.0 and
  # already owns the WEB register of the same clause (the batch-5
  # gentle-and-humble-in-heart extension is the precedent).
  - with his stripes we are healed
anchors:
  - ref: Isaiah 53:5
    sources: [editorial]
    weight: 1.0
  - ref: 1 Peter 2:24
    sources: [editorial]
    weight: 0.95
  - ref: Romans 5:8
    sources: [editorial]
    weight: 0.9
  - ref: 1 Corinthians 15:3
    sources: [editorial]
    weight: 0.85
  - ref: John 1:29
    sources: [torrey]
    weight: 0.8
  # Phase-4 P4.3 re-weight 2026-08-21, 0.75 -> 0.85 (one rung, to 1 Cor
  # 15:3's level): once 'propitiation' fires this concept, the query is
  # anchor-dominated, and the ACTIVE propitiation-pmi-ordering.json pin
  # (P3.5's promoted tie resolution: 1 John 2:2 above John 1:29) can only
  # be honored by the weight order. Doctrinal basis: "he is the atoning
  # sacrifice for our sins, and not for ours only, but also for the whole
  # world" — the doctrine's summary sentence in the WEB's own words;
  # Torrey's ATONEMENT, THE outline lists 1 John 2:2 under "Explained".
  - ref: 1 John 2:2
    sources: [torrey]
    weight: 0.85
  # Phase-4 P4.3 extension 2026-08-21: "he loved us, and sent his Son as
  # the atoning sacrifice for our sins" — the doctrine in the WEB's own
  # words. Torrey's ATONEMENT, THE outline lists 1 John 4:10 ("Explained";
  # "Love of God.").
  - ref: 1 John 4:10
    sources: [torrey]
    weight: 0.75
  - ref: 2 Corinthians 5:21
    sources: [torrey]
    weight: 0.75
  - ref: Galatians 3:13
    sources: [torrey]
    weight: 0.7
  - ref: 1 Peter 1:18-19
    sources: [torrey]
    weight: 0.7
related:
  - salvation
  - resurrection
  - gods-love
