id: loving-others
label: Loving one another
# Torrey/Miller admission 2026-08-06. Torrey anchors drawn from the verified
# outline(s): LOVE TO MAN. Lexicon is modern
# editorial phrasing; Torrey headings are provenance, not query language.
lexicon:
  - love one another
  - love your neighbor
  - love is patient love is kind
  - greatest of these is love
  - love your enemies
  # Remembered-phrasing entries, 2026-08-08. The Golden Rule as people quote it
  # ("do to others as you would have them do to you") is ENTIRELY stopwords and
  # normalizes to nothing, so no lexicon entry can ever match that sentence —
  # a structural limit of token matching, recorded in the research note rather
  # than papered over. These are the matchable ways people name the same idea.
  - the golden rule
  - treat others the way you want to be treated
  # Round-2 book admission 2026-08-18: Matt 5:44's own second clause, as
  # searchers quote it. Measured: without this entry the bare-token
  # "pray" fired the prayer pack's anchors over the exact-phrase verse
  # itself, and Matt 5:44 appeared nowhere in the top 10.
  - pray for those who persecute you
  # (Round-2 note: a "walk in love" lexicon entry was drafted and DROPPED
  # by the integrator on G8 evidence — its two tokens sit inside the
  # ot-prophets-justly noise probe's query, so the entry flooded that
  # probe's top-10 with this pack's anchors (80% displaced, limit 40%).
  # The query needs no curation anyway: Ephesians 5:2 "walk in love" serves
  # it lexically.)
