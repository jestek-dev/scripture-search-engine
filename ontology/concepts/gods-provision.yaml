  # guarantee"; honest as God-supplies-needs). "My God will supply every
  # need of yours according to his riches in glory in Christ Jesus." — a
  # promise of needs met, written to a church that had just given
  # sacrificially to Paul's mission; NEEDS, not riches, and the riches are
  # God's in glory. sense-inversion-provision.json's own note asks for
  # exactly this anchor.
  - ref: Philippians 4:19
    sources: [editorial]
    weight: 0.95
  # "Give us today our daily bread." — provision asked of the Father, one
  # day at a time; the verse the pending fixture already prefers above
  # Romans 13:14.
  - ref: Matthew 6:11
    sources: [editorial]
    weight: 0.9
  # "The LORD is my shepherd; I shall lack nothing." — the shepherd's
