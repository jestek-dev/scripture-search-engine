# Romans 13:14 ("make no provision for the flesh" — the word in its
# opposite frame) and its note names Philippians 4:19 as "the natural
# expectedTop candidate when a provision concept pack lands; add it then,
# with its anchor reason."
#
# Idea source (PR description only): Phillips "Provision" (Matt 6:33,
