# Dan 3:17-18 (the confession) is fear-not/faith territory if anywhere;
# this pack anchors 3:19-20, the persecution act.
#
# TOKENIZER NOTE (G-4): no single-token entries and no stopword
# collapses; every entry keeps >= 2 significant tokens.
#
# Attribution: ALL anchors [editorial].
# DOCTRINAL SCAN: no watchlist anchor, no materialFrameKeyword. The
# gist describes the narratives; it promises no outcome and adjudicates
