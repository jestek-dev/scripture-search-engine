# no-weapon.json defers stays deferred), and every phrase here carries a
# token the short query 'no weapon formed against me' lacks, so the ACTIVE
# gods-protection.json's admitted ordering for that query cannot move.
#
# SOUNDNESS: the verse's own "heritage of the LORD's servants" clause keeps
# the promise covenantal, not incantational (gods-protection's header
# reasoning); the chip reports that LH editorial names this passage for
# this remembered phrasing — it adjudicates nothing.
