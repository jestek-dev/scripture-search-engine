# REMEMBERED-PHRASING PACK — alias-mining batch 1 (2026-08-26, whole-Bible
# coverage plan §2.3 item 2 / §4.3; battery re-grade seed row ph12).
#
# PD-ONLY WORDING (decision #4/#5 defaults): every phrase below is the
# verbatim wording of the American Standard Version (1901, public domain) —
# no ESV/NIV/NLT-derived wording anywhere in this pack.
#   - "no weapon that is formed against thee shall prosper" — ASV,
#     Isaiah 54:17a. The WEB reads "will prevail"; 'prosper' is the
#     register people remember and type (battery ph12).
#   - "every tongue that shall rise against thee in judgment" — ASV,
#     Isaiah 54:17b. Its query already led lexically (exact phrase); the
#     entry's value is the honest curated chip on the same verse and the
#     second clause of the same remembered promise — recorded so the
#     admission evidence is read correctly.
#
# ONE anchor per pack, deliberately (the remembered-* design): both clauses
# name exactly one verse. ADDITIVE on purpose: gods-protection keeps its
# reviewed anchors and weights untouched (Isaiah 54:17 at 0.85 under its
