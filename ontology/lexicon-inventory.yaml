# Lexicon inventory — reviewed acknowledgment record for single-token
# collapses (plan P3.2 data half; mechanism in
# eval/src/gates/collision.ts lexiconInventoryCheck, parser in
# pipeline/src/importers/lexiconInventory.ts).
#
# A lexicon phrase whose SIGNIFICANT-token width is one behaves as a
# bare-word trigger for its whole concept ("forgive others" stores as the
# single token `forgive`, so the bare query "forgive" fires
# forgiving-others). That is a legitimate thing to want and a terrible thing
# to have by accident, so every such collapse must be acknowledged here or
# gate G4 fails naming it; an entry that no longer matches the live lexicon
# (stale acknowledgment) fails too. The gate never scores theology — it
# enforces that a human DECIDED (CLAUDE.md covenant #6's exact shape).
#
# REVIEW STATUS: every row below is the implementation's PROPOSED triage of
# the 46 collapses live at the time this file was created — none is yet a
# Jesse ruling. `reviewedBy: pending-J12` marks that state honestly; his
# J12 review of this table (the approval artifact for the data PR) ratifies
# or redirects each row, flipping reviewedBy to his name and, where he
# directs a rephrase/remove instead, deleting the row in the same commit as
# the lexicon change. Rows whose note says "J12 flag" are the ones the
# measurement or the audit specifically routed to him:
#   - guidance "the will of the lord" -> lord is the MEASURED ph6-B cause
#     ("the Lord is my shepherd" #2 hijack; lord's IDF share 0.243 > 0.2, so
#     the engine's thin-cue gate does not demote it — only this table can).
#   - forgiving-others "forgive others" -> forgive is J1/Q10 territory
#     (does forgiveness-of-sins own bare "forgive"?); acknowledged to stand
#     as-is until that ruling.
#
# This file is shared with the planned per-concept bare-word inventory
# (one file, one gate, two consumers): future sections add their own
# top-level keys; `collapses` stays this list.
#
# Entry shape: { conceptId, phrase, token, intended: true, reviewedBy,
# date, note }. `phrase` is the lexicon phrase verbatim; `token` is the
# single significant token it collapses to under the shared tokenizer
# (stems, not words: "do not be anxious" -> anxiou).

