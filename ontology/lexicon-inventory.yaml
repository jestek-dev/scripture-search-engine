# Bare-word inventory — reviewed data, one row per compiled concept id.
#
# Every concept carries an explicit single-word decision: `admitted` bare
# words MUST fire the concept (a lexicon phrase normalizes to exactly that
# significant token), `skipped` bare words MUST NOT, and every skip records
# the reason a human gave. The gauntlet enforces both directions with the
# engine's own tokenizer (eval/src/gates/lexiconInventory.ts, merged into
# G4), so the 2026-08-08 accident class — bare-word behaviour nobody decided
# — cannot silently recur, and a future concept cannot ship without a row.
#
# Rows are keyed by compiled concept **id**, never by filename: the healing
# concept's id is `prayer-for-healing` though its file is
# `pastoral-prayer-for-healing.yaml`. Backfilled 2026-08-20 from:
#   - the 2026-08-08 single-token audit's decision table and its
#     post-adversarial-review correction table
#     (docs/research/2026-08-08-single-token-lexicon-audit.md §4);
#   - the in-file rulings those cite (gods-love.yaml 2026-08-08;
#     walking-in-the-light 2026-07-29);
#   - NEEDS-JESSE §1.6d option 3 for the pastoral packs' deliberate modern
#     single words;
#   - the 2026-08-18 books-harvest admissions (PR #31), whose in-file
#     comments are transcribed here as the provenance of each harvest-era
#     bare word;
#   - this PR's three measured gap closures (holiness, healing, assurance).
#
# KEPT-WITH-RESERVATION rows: a handful of admitted words are accidental
# stopword collapses of multi-word phrases (e.g. "the will of the lord" →
# bare `lord`) that shipped with the harvest. They are admitted here because
# they DO fire today — the inventory records behaviour, not intention — but
# each carries a comment naming the reservation, and the 2026-08-20 battery's
# proposed G4 deny-list is the follow-up that would retire the bad ones.
# Rephrasing or deleting a collapsing lexicon entry and its admitted token
# together is a one-commit, gauntlet-verified change.
#
# Merging the PR that adds or edits a row is the review act (repo
# precedent). An `admitted` word describes behaviour, not intention: the
# gate rejects an admitted word that does not fire. Adding a NEW bare word
# therefore stays fixture-first — golden fixture, failing run as gap
# evidence, lexicon entry, inventory row, all in one reviewed change.

concepts:
  - id: abiding-in-christ
    # 2026-08-08 correction table: collapses of "abide in me" / "remain in
    # me" — exactly the bare words someone would type; kept deliberately.
    admitted: [abide, remain]

  - id: asking-in-gods-will
    # 2026-08-23 stack merge (P4.11 completion): row authored for a
    # branch pack that postdates the 2026-08-20 backfill. Every phrase
    # is multi-word BY DESIGN per the pack's own comments — the pack
    # answers the movement slogan ("name it and claim it") with the
    # canon's teaching on asking (James 4:3 in both its WEB and KJV
    # registers), and its doctrine-negative sibling fixture depends on
    # proof-texts staying below the leading window. No width-1 phrase
    # exists, so no bare word fires today.
    skipped:
      - token: asking
        reason: >-
          Bare "ask"/"asking" is the canon's whole asking language
          (prayer, petition, narrative) and must never fire a pack built
          to answer one movement's slogan vocabulary; the slogan and the
          James 4:3 phrase forms carry the concept. (Note the pack's own
          width note: "asking" does not stem to "ask" under the one
          tokenizer, so the two registers are distinct tokens — both
          stay phrase-bound.)

  - id: assurance-of-salvation
    # 2026-08-20 (PR #33) admitted bare `assurance` here to close a measured
    # gap (the word fired no concept; this pack is its honest home per its
    # SENSE DISCIPLINE note — the Heb 11:1 pack stays phrasing-only, see
