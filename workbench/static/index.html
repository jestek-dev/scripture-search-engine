<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scripture workbench — viewer</title>
<style>
  :root {
    --ink: #1c1c1c;
    --muted: #6b6b6b;
    --line: #e0ddd6;
    --paper: #faf9f6;
    --card: #ffffff;
    --accent: #2f5d50;
    --badge: #a4491f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
  }
  main { max-width: 46rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
  h1 { font-size: 1.15rem; margin: 0 0 0.25rem; }
  #identities {
    font-family: ui-monospace, monospace;
    font-size: 0.7rem;
    color: var(--muted);
    word-break: break-all;
    margin-bottom: 1.5rem;
  }
  form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  input[type="search"] {
    flex: 1;
    font: inherit;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--card);
  }
  button {
    font: inherit;
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  #status { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
  .result {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin-bottom: 0.75rem;
  }
  .result-head { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
  .reference { font-weight: 600; }
  .score { font-family: ui-monospace, monospace; font-size: 0.75rem; color: var(--muted); }
  .cap-badge {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #fff;
    background: var(--badge);
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }
  .excerpt { margin: 0.35rem 0 0.5rem; font-size: 0.9rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .chip {
    font-family: ui-monospace, monospace;
    font-size: 0.7rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.1rem 0.55rem;
    background: var(--paper);
    white-space: nowrap;
  }
  .chip .family { color: var(--accent); font-weight: 600; }
  .chip .provenance { color: var(--muted); }
  .chip s { color: var(--badge); }
  .verse-number { color: var(--muted); font-size: 0.7rem; vertical-align: super; margin-right: 0.15rem; }
  .judge { margin-top: 0.6rem; border-top: 1px dashed var(--line); padding-top: 0.5rem; }
  .judge-verbs { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .judge button {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 0.2rem 0.6rem;
    font-size: 0.8rem;
  }
  .judge button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .judge-panel {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    margin-top: 0.5rem;
    font-size: 0.85rem;
  }
  .judge-panel label { display: flex; flex-direction: column; gap: 0.15rem; color: var(--muted); }
  .judge-panel select, .judge-panel input, .judge-panel textarea {
    font: inherit;
    color: var(--ink);
    padding: 0.3rem 0.5rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--card);
  }
  .judge-panel textarea { resize: vertical; min-height: 3rem; }
  .judge-message { font-size: 0.8rem; margin-top: 0.35rem; }
  .judge-message.error { color: var(--badge); }
  .judge-message.done { color: var(--accent); }
  #missing { display: none; margin-top: 1.5rem; }
  #missing fieldset {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    padding: 0.75rem 1rem 1rem;
  }
  #missing legend { font-size: 0.85rem; color: var(--muted); padding: 0 0.35rem; }
</style>
</head>
<body>
<main>
  <h1>Scripture workbench</h1>
  <div id="identities">loading identities&hellip;</div>
  <form id="search-form">
    <input id="q" type="search" placeholder="Search, e.g. walking in the light" autofocus>
    <button type="submit">Search</button>
  </form>
  <div id="status"></div>
  <div id="results"></div>
  <!-- The missing-passage form: a judgment about what did NOT surface. -->
  <form id="missing">
    <fieldset>
      <legend>Missing passage — should have surfaced but didn't</legend>
      <div class="judge-panel">
        <label>Reference (e.g. James 1:22-25)
          <input id="missing-reference" type="text" autocomplete="off">
        </label>
        <label>Why, from the text itself (required — no bare clicks)
          <textarea id="missing-note"></textarea>
        </label>
        <div><button type="submit" class="primary">Log missing passage</button></div>
      </div>
      <div id="missing-message" class="judge-message"></div>
    </fieldset>
  </form>
</main>
<script>
(() => {
  'use strict';

  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text; // textContent: everything interpolated is escaped
    return node;
  };

  const identities = document.getElementById('identities');
  const form = document.getElementById('search-form');
  const input = document.getElementById('q');
  const status = document.getElementById('status');
  const results = document.getElementById('results');
  const missingForm = document.getElementById('missing');
  const missingReference = document.getElementById('missing-reference');
  const missingNote = document.getElementById('missing-note');
  const missingMessage = document.getElementById('missing-message');

  // The query the visible results (and the missing form) belong to. Captured
  // at render time so typing a new search does not drift a judgment.
  let judgedQuery = null;

  const setMessage = (node, kind, text) => {
    node.className = 'judge-message ' + kind;
    node.textContent = text;
  };

  // POSTs a judgment; the server enforces the same rules and stamps
  // reviewer + the three identities. A 400 here means the client-side
  // checks missed something — surface the server's plain-English reason.
  const postJudgment = (payload, messageNode, onDone) => {
    setMessage(messageNode, '', 'Logging…');
    fetch('/api/judgment', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
    })
      .then((r) => r.json().then((body) => ({ ok: r.ok, body })))
      .then(({ ok, body }) => {
        if (!ok) {
          setMessage(messageNode, 'error', body.error || 'Rejected.');
          return;
        }
        onDone(body.record);
      })
      .catch((error) => { setMessage(messageNode, 'error', 'Request failed: ' + error); });
  };

  fetch('/api/meta')
    .then((r) => r.json())
    .then((meta) => {
      identities.textContent = '';
      const t = meta.translations.map((x) => x.code + ' (' + x.verseCount + ' verses)').join(', ');
      for (const line of [
        'engine ' + meta.engineVersion + ' · schema v' + meta.schemaVersion + ' · ' + t,
        'corpus ' + meta.corpusFingerprint,
        'layers ' + meta.layerFingerprint,
      ]) {
        identities.appendChild(el('div', null, line));
      }
    })
    .catch(() => { identities.textContent = 'failed to load /api/meta'; });

  const reasonChip = (reason) => {
    const chip = el('span', 'chip');
    chip.appendChild(el('span', 'family', reason.family));
    chip.appendChild(document.createTextNode(' '));
    if (reason.uncappedPoints !== undefined) {
      chip.appendChild(el('s', null, String(reason.uncappedPoints)));
      chip.appendChild(document.createTextNode(' '));
    }
    chip.appendChild(el('span', null, String(reason.points) + ' pts'));
    if (reason.provenance && reason.provenance.label) {
      chip.appendChild(document.createTextNode(' · '));
      chip.appendChild(el('span', 'provenance', reason.provenance.label));
    }
    chip.title = reason.label;
    return chip;
  };

  // The three judgment verbs (plan §4): plain ✓ (log-only agreement),
  // pinned ✓ (compiles into expectedTop), and ✗ with a cause. Client-side
  // enforcement mirrors the server: a ✗ requires a cause, and the
  // anchor-affecting causes (wrong-anchor, concept-misfire) require the
  // concept id and a defend-it-from-the-text note.
  const judgeBlock = (query, result) => {
    const block = el('div', 'judge');
    const verbs = el('div', 'judge-verbs');
    const panel = el('div', 'judge-panel');
    const message = el('div', 'judge-message');
    panel.style.display = 'none';

    const done = (record) => {
      block.textContent = '';
      const doneNote = el('div', 'judge-message done',
        'logged ' + record.verdict + (record.pin ? ' (pinned)' : '') +
        ' by ' + record.reviewer + ' at ' + record.at);
      block.appendChild(doneNote);
    };

    const openPanel = (build) => {
      panel.textContent = '';
      panel.style.display = '';
      build(panel);
    };

    const fitsButton = el('button', null, '✓ fits');
    fitsButton.type = 'button';
    fitsButton.addEventListener('click', () => {
      postJudgment({ query, verdict: 'fits', targetId: result.targetId }, message, done);
    });

    const pinButton = el('button', null, '✓ pin…');
    pinButton.type = 'button';
    pinButton.addEventListener('click', () => openPanel((panel) => {
      const families = [...new Set(result.reasons.map((reason) => reason.family))];
      const label = el('label', null, 'Verified reason family (compiles into the fixture)');
      const select = el('select');
      select.appendChild(new Option('(none — pin the position only)', ''));
      for (const family of families) select.appendChild(new Option(family, family));
      label.appendChild(select);
      panel.appendChild(label);
      const submit = el('button', 'primary', 'Pin ✓');
      submit.type = 'button';
      submit.addEventListener('click', () => {
        const payload = { query, verdict: 'fits', targetId: result.targetId, pin: true };
        if (select.value !== '') payload.reasonFamily = select.value;
        postJudgment(payload, message, done);
      });
      panel.appendChild(el('div')).appendChild(submit);
    }));

    const rejectButton = el('button', null, '✗ doesn’t fit…');
    rejectButton.type = 'button';
    rejectButton.addEventListener('click', () => openPanel((panel) => {
      const causeLabel = el('label', null, 'Cause (required)');
      const cause = el('select');
      cause.appendChild(new Option('choose…', ''));
      cause.appendChild(new Option('wrong-anchor', 'wrong-anchor'));
      cause.appendChild(new Option('concept-misfire', 'concept-misfire'));
      cause.appendChild(new Option('lexical-noise', 'lexical-noise'));
      causeLabel.appendChild(cause);

      const conceptLabel = el('label', null, 'Concept id that produced the bad evidence (required)');
      const concept = el('input');
      concept.type = 'text';
      conceptLabel.appendChild(concept);

      const noteLabel = el('label', null, 'Why, from the text itself (required — no bare clicks)');
      const note = el('textarea');
      noteLabel.appendChild(note);

      const anchorAffecting = () => cause.value === 'wrong-anchor' || cause.value === 'concept-misfire';
      const toggle = () => {
        const on = anchorAffecting();
        conceptLabel.style.display = on ? '' : 'none';
        noteLabel.firstChild.textContent = on
          ? 'Why, from the text itself (required — no bare clicks)'
          : 'Why, from the text itself (optional for lexical-noise)';
      };
      cause.addEventListener('change', toggle);
      toggle();

      const submit = el('button', 'primary', 'Log ✗');
      submit.type = 'button';
      submit.addEventListener('click', () => {
        if (cause.value === '') {
          setMessage(message, 'error', 'A ✗ needs a cause.');
          return;
        }
        if (anchorAffecting() && concept.value.trim() === '') {
          setMessage(message, 'error', 'A ' + cause.value + ' judgment must name the concept.');
          return;
        }
        if (anchorAffecting() && note.value.trim() === '') {
          setMessage(message, 'error', 'A ' + cause.value + ' judgment needs a note defending it from the text.');
          return;
        }
        const payload = { query, verdict: 'doesnt-fit', targetId: result.targetId, cause: cause.value };
        if (anchorAffecting()) payload.conceptId = concept.value.trim();
        if (note.value.trim() !== '') payload.note = note.value.trim();
        postJudgment(payload, message, done);
      });

      panel.appendChild(causeLabel);
      panel.appendChild(conceptLabel);
      panel.appendChild(noteLabel);
      panel.appendChild(el('div')).appendChild(submit);
    }));

    verbs.appendChild(fitsButton);
    verbs.appendChild(pinButton);
    verbs.appendChild(rejectButton);
    block.appendChild(verbs);
    block.appendChild(panel);
    block.appendChild(message);
    return block;
  };

  const renderDiscovery = (payload) => {
    judgedQuery = payload.query;
    missingForm.style.display = 'block';
    missingMessage.textContent = '';
    if (payload.results.length === 0) {
      status.textContent = 'No results for “' + payload.query + '”.';
      return;
    }
    status.textContent = payload.results.length + ' results for “' + payload.query + '”';
    for (const result of payload.results) {
      const card = el('article', 'result');
      const head = el('div', 'result-head');
      head.appendChild(el('span', 'reference', result.reference));
      head.appendChild(el('span', 'score', result.score.toFixed(2)));
      // The cap badge is derived client-side: uncappedPoints is present only
      // when a cap reduced the contribution. No `capped` field exists on the
      // public result type, and none may be added.
      if (result.reasons.some((reason) => reason.uncappedPoints !== undefined)) {
        head.appendChild(el('span', 'cap-badge', 'capped'));
      }
      card.appendChild(head);
      card.appendChild(el('p', 'excerpt', result.excerpt));
      const chips = el('div', 'chips');
      for (const reason of result.reasons) chips.appendChild(reasonChip(reason));
      card.appendChild(chips);
      card.appendChild(judgeBlock(payload.query, result));
      results.appendChild(card);
    }
  };

  const renderReference = (payload) => {
    status.textContent = 'Passage: ' + payload.passage.reference;
    const card = el('article', 'result');
    card.appendChild(el('div', 'reference', payload.passage.reference));
    const body = el('p', 'excerpt');
    for (const verse of payload.passage.verses) {
      body.appendChild(el('span', 'verse-number', String(verse.verse)));
      body.appendChild(document.createTextNode(verse.text + ' '));
    }
    card.appendChild(body);
    results.appendChild(card);
  };

  missingForm.addEventListener('submit', (event) => {
    event.preventDefault();
    if (judgedQuery === null) return;
    const reference = missingReference.value.trim();
    const note = missingNote.value.trim();
    if (reference === '') {
      setMessage(missingMessage, 'error', 'A missing judgment needs the reference that should have surfaced.');
      return;
    }
    if (note === '') {
      setMessage(missingMessage, 'error', 'A missing judgment needs a note defending it from the text.');
      return;
    }
    postJudgment({ query: judgedQuery, verdict: 'missing', reference, note }, missingMessage, (record) => {
      missingReference.value = '';
      missingNote.value = '';
      setMessage(missingMessage, 'done',
        'logged missing ' + record.reference + ' by ' + record.reviewer + ' at ' + record.at);
    });
  });

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const query = input.value.trim();
    if (query === '') return;
    status.textContent = 'Searching…';
    results.textContent = '';
    judgedQuery = null;
    missingForm.style.display = 'none';
    fetch('/api/search?q=' + encodeURIComponent(query))
      .then((r) => r.json())
      .then((payload) => {
        if (payload.kind === 'discovery') renderDiscovery(payload);
        else if (payload.kind === 'reference') renderReference(payload);
        else if (payload.kind === 'invalid-reference') {
          status.textContent = 'Invalid reference: “' + payload.query + '”';
        } else {
          status.textContent = payload.error || 'Unexpected response.';
        }
      })
      .catch((error) => { status.textContent = 'Request failed: ' + error; });
  });
})();
</script>
</body>
</html>
