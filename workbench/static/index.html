    renderAll({});
  }
  function renderInterview() {
    const interview = state.interview;
    if (interview === null) return;
    const dialog = openLayerDialog('Not relevant?', 'interview-title');
    dialog.id = 'interview-dialog';
    let firstFocus = null;

    const cancelButton = () => {
      const cancel = node('button', 'btn-quiet', 'Cancel');
      cancel.type = 'button';
      cancel.addEventListener('click', closeInterview);
      return cancel;
    };

    if (interview.mode === 'auto') {
      const prompt = node('p', 'layer-prompt', interview.matched !== null
        ? COPY.interviewAuto(interview.matched)
        : COPY.interviewAutoNoFragment);
      dialog.appendChild(prompt);
      const actions = node('div', 'layer-actions');
      const yes = node('button', 'btn-primary', COPY.interviewYes);
      yes.type = 'button';
      yes.id = 'interview-confirm';
      yes.addEventListener('click', () => { void commitInterview(); });
      actions.appendChild(yes);
      actions.appendChild(cancelButton());
      dialog.appendChild(actions);
      firstFocus = yes;
    } else if (interview.diagnosis !== null) {
      // Concept mode requires a why, before commit (§3.2).
      const label = node('label', 'layer-prompt', COPY.whyLabel);
      label.htmlFor = 'interview-why';
      dialog.appendChild(label);
      const why = node('textarea', 'note-input');
      why.id = 'interview-why';
      why.value = interview.note;
      why.addEventListener('input', () => {
        interview.note = why.value;
        const confirm = document.getElementById('interview-confirm');
        if (confirm !== null) confirm.disabled = interview.note.trim() === '';
      });
      dialog.appendChild(why);
      const actions = node('div', 'layer-actions');
      const confirm = node('button', 'btn-primary', COPY.confirmNotRelevant);
      confirm.type = 'button';
      confirm.id = 'interview-confirm';
      confirm.disabled = interview.note.trim() === '';
      confirm.addEventListener('click', () => { void commitInterview(); });
      actions.appendChild(confirm);
      actions.appendChild(cancelButton());
      dialog.appendChild(actions);
      firstFocus = why;
    } else if (interview.step === 1) {
      dialog.appendChild(node('p', 'layer-prompt', COPY.conceptStep1(interview.concept.label, interview.reference)));
      const actions = node('div', 'layer-actions');
      const yes = node('button', 'btn-quiet', COPY.conceptStep1Yes);
      yes.type = 'button';
      yes.addEventListener('click', () => { interview.step = 2; renderInterview(); });
      const no = node('button', 'btn-primary', COPY.conceptStep1No);
      no.type = 'button';
      no.addEventListener('click', () => { interview.diagnosis = 'wrong-anchor'; renderInterview(); });
      actions.appendChild(yes);
      actions.appendChild(no);
      const cancel = node('button', 'layer-cancel-link', 'Cancel (Esc)');
      cancel.type = 'button';
      cancel.addEventListener('click', closeInterview);
      actions.appendChild(cancel);
      dialog.appendChild(actions);
      firstFocus = yes;
    } else {
      dialog.appendChild(node('p', 'layer-prompt', COPY.conceptStep2(state.search.query)));
      const actions = node('div', 'layer-actions');
      const commit = node('button', 'btn-primary', COPY.conceptStep2Commit);
      commit.type = 'button';
      commit.addEventListener('click', () => { interview.diagnosis = 'concept-misfire'; renderInterview(); });
      const keep = node('button', 'btn-quiet', COPY.conceptStep2Keep);
      keep.type = 'button';
      keep.addEventListener('click', closeInterview);
      actions.appendChild(commit);
      actions.appendChild(keep);
      const cancel = node('button', 'layer-cancel-link', 'Cancel (Esc)');
      cancel.type = 'button';
      cancel.addEventListener('click', closeInterview);
      actions.appendChild(cancel);
      dialog.appendChild(actions);
      firstFocus = commit;
    }
    dialog.appendChild(node('p', 'layer-note', COPY.demotion));
    if (firstFocus !== null) firstFocus.focus();
  }
  async function commitInterview() {
    const interview = state.interview;
    if (interview === null) return;
    const result = state.search.results.find((entry) => entry.targetId === interview.targetId);
    if (result === undefined) { closeInterview(); return; }
    let fields;
    if (interview.mode === 'concept' && interview.diagnosis !== null) {
      const note = interview.note.trim();
      if (note === '') return;
      // Human-chosen diagnosis: no diagnosisInferred key at all (§4.4).
      fields = {
        action: 'irrelevant',
        targetId: interview.targetId,
        diagnosis: interview.diagnosis,
        conceptId: interview.concept.id,
        note,
      };
    } else {
      fields = {
        action: 'irrelevant',
        targetId: interview.targetId,
        diagnosis: 'lexical-noise',
        diagnosisInferred: true,
      };
      if (interview.unresolvedLabel !== null) {
        fields.note = 'concept label "' + interview.unresolvedLabel + '" (unresolved id)';
      }
    }
    state.interview = null;
    closeLayerDialog(interview.opener);
    await commitVerdict(result, fields);
  }

  // §rescue — the shared rescue/pick preview layer (§3.1; extended by the
  // missing form's pick mode). No rescue ever posts on the first keypress.
  function openRescuePreview(stopIndex) {
    if (degradedReadOnly()) { showToast(COPY.readOnlyToast); return; }
    const top = topCount();
    const tailIndex = stopIndex - top - 1;
    const result = state.search.results[TOP_WINDOW + tailIndex];
    if (result === undefined) return;
    state.rescue = {
      stopIndex,

    rescue.status = 'loading';
    renderRescue();
    apiPassage(rescue.rowReference).then((outcome) => {
      if (state.rescue !== rescue) return;
      if (outcome && outcome.kind === 'passage' && outcome.passage && Array.isArray(outcome.passage.verses) && outcome.passage.verses.length > 0) {

  async function confirmRescue() {

    const existing = state.missingByRef[reference];

    const rowReference = rescue.rowReference;
    const outcome = await postJudgmentBody(fields, {});
    if (state.rescue !== rescue) return;

    state.rescuedRows[caseId + '|' + rowReference] = reference;

  // §missing-form — the suggestion flow (§3.3).
  function missingGateActive() {

  }
  function openMissingForm(opener) {

    form.pickedRef = null;
    form.unresolvedShown = false;

    // Live preview: debounced 250ms GET /api/passage as you type.
    form.debounce = setTimeout(() => {
      form.debounce = null;

        if (state.missingForm !== form || seq !== form.seq) return;
        if (outcome && outcome.kind === 'passage' && outcome.passage && Array.isArray(outcome.passage.verses) && outcome.passage.verses.length > 0) {
          form.resolved = outcome.passage;
          form.resolvedFor = value;
          form.unresolvedShown = false;

  async function submitMissingForm() {

  // §already-displayed — reference comparison helpers (§3.3): a displayed
  // range card is compared by its member verses, resolved via GET
  // /api/passage (the focused-card resolution reused when already fetched).
  async function resolveRowPassage(reference) {
    const cached = state.passages[reference];
    if (cached !== undefined && cached.status === 'done') return cached.passage;
    try {
      const outcome = await apiPassage(reference);
      if (outcome && outcome.kind === 'passage' && outcome.passage && Array.isArray(outcome.passage.verses)) {
        state.passages[reference] = { status: 'done', passage: outcome.passage };
        return outcome.passage;
      }
    } catch (error) { /* fall through: no match provable */ }
    return null;
  }
  async function referenceMatchesRow(rowReference, canonicalRef) {
    if (rowReference === canonicalRef) return true;
    if (!isRangeReference(rowReference)) return false;
    const passage = await resolveRowPassage(rowReference);
    if (passage === null) return false;
    const range = parseReference(passage.reference);
    const single = parseReference(canonicalRef);
    if (range === null || single === null) return false;
    if (range.book !== single.book || range.chapter !== single.chapter) return false;
    return passage.verses.some((verse) => verse.verse === single.start);
  }
  async function findTopBlockIndexForReference(canonicalRef) {
    const top = state.search.results.slice(0, TOP_WINDOW);
    for (let index = 0; index < top.length; index += 1) {
      if (await referenceMatchesRow(top[index].reference, canonicalRef)) return index;
    }
    return -1;
  }
  async function findTailStopForReference(canonicalRef) {
    const results = state.search.results;
    const top = Math.min(results.length, TOP_WINDOW);
    for (let index = TOP_WINDOW; index < results.length; index += 1) {
      if (await referenceMatchesRow(results[index].reference, canonicalRef)) {
        return top + 1 + (index - TOP_WINDOW);
      }
    }
    return -1;
  }

  // §action-bar — verdict toolbar + bulk bar (§3.2). The toolbar is active

    // Per-button labels name the focused card's reference (D35): "Mark
    // {ref} essential" — the toolbar always acts on the focused card.
    const focusedRef = state.search.status === 'results' && state.search.results[state.expandedIndex] !== undefined
      ? state.search.results[state.expandedIndex].reference
      : null;
    const markLabel = (verb) => focusedRef !== null ? 'Mark ' + focusedRef + ' ' + verb : 'Mark the focused result ' + verb;
    const group = node('div', 'essential-group');
    const essential = node('button', 'verdict-btn essential');
    essential.type = 'button';
    essential.id = 'verdict-essential';
    essential.setAttribute('aria-label', markLabel('essential'));
    essential.appendChild(node('span', 'kbd', 'E'));
    essential.appendChild(node('span', '', 'Essential'));
    if (readOnly) essential.disabled = true;
    essential.addEventListener('click', () => { void verdictAction('essential'); });
    group.appendChild(essential);
    const picker = node('div', 'topn-picker');
    picker.id = 'topn-picker';
    picker.setAttribute('role', 'radiogroup');
    picker.setAttribute('aria-label', COPY.formTopLabel);
    picker.appendChild(node('span', 'topn-label', 'top'));
    for (const value of [1, 3, 5, 10]) {
      const seg = node('button', 'topn-seg', String(value));
      seg.type = 'button';
      seg.dataset.topn = String(value);
      seg.setAttribute('role', 'radio');
      seg.setAttribute('aria-checked', state.withinTop === value ? 'true' : 'false');
      seg.tabIndex = state.withinTop === value ? 0 : -1;
      seg.addEventListener('click', () => { setWithinTop(value); });
      picker.appendChild(seg);
    }
    picker.addEventListener('keydown', onPickerKey);
    group.appendChild(picker);
    bar.appendChild(group);
    const helpful = verdictButton('H', 'Helpful', 'verdict-helpful', readOnly, () => { void verdictAction('helpful'); });
    helpful.setAttribute('aria-label', markLabel('helpful'));
    bar.appendChild(helpful);
    const notrel = verdictButton('X', 'Not relevant', 'verdict-notrel', readOnly, () => { void verdictAction('irrelevant'); }, 'notrel');
    notrel.setAttribute('aria-label', markLabel('not relevant'));
    bar.appendChild(notrel);
    const missing = verdictButton('M', 'Missing passage', 'verdict-missing', readOnly, (event) => { handleMissingKey(event.currentTarget); });
    missing.setAttribute('aria-label', 'Add a passage that should be here');
    bar.appendChild(missing);
    slot.appendChild(bar);
  }

  // §screens — nav switching (P4). The review grid stays in the DOM; the
  // other screens render into their own containers.
  function setScreen(name) {
    if (state.screen === name) { renderAll({}); return; }
    state.screen = name;
    if (name === 'compare') void openCompare();
    if (name === 'history') openHistory();
    if (name === 'finish') void openFinishUp();
    if (name === 'updates') void openUpdates();
    renderAll({});
  }
  function renderScreenChrome() {
    document.getElementById('review-grid').hidden = state.screen !== 'review';
    document.getElementById('screen-compare').hidden = state.screen !== 'compare';
    document.getElementById('screen-history').hidden = state.screen !== 'history';
    document.getElementById('screen-finish').hidden = state.screen !== 'finish';
    document.getElementById('screen-updates').hidden = state.screen !== 'updates';
    document.getElementById('screen-advanced').hidden = state.screen !== 'advanced';
    const navName = state.screen;
    document.querySelectorAll('.nav-item, .advanced-link').forEach((item) => {
      if (item.dataset.nav === navName) item.setAttribute('aria-current', 'page');
      else item.removeAttribute('aria-current');
    });
    // The verdict toolbar and bulk bar belong to Review only.
    if (state.screen !== 'review') clear(document.getElementById('actionbar-slot'));
  }

  // §render — everything
  function renderAll(options) {
    renderScreenChrome();
    renderBanner();
    if (state.screen === 'compare') { renderCompare(); return; }
    if (state.screen === 'history') { renderHistory(); return; }
    if (state.screen === 'finish') { renderFinish(); return; }
    if (state.screen === 'updates') { renderUpdates(); return; }
    if (state.screen === 'advanced') { renderAdvanced(); return; }
    // Re-rendering replaces the results DOM: when the focused element lived
    // there (or focus already fell back to body after an earlier rebuild),
    // restore it, so an async re-render never strands keyboard focus.
    const active = document.activeElement;
    const focusWasInResults = active !== null && typeof active.closest === 'function'
      && active.closest('#center-body') !== null;
    // An id-bearing element (e.g. #missing-link, #empty-add-missing) is
    // re-found after the rebuild so the §3.12 layer focus contract holds:
    // closing a layer opened from such a control returns focus to it, not
    // to the roving card position.
    const activeId = focusWasInResults && typeof active.id === 'string' && active.id !== '' ? active.id : null;
    renderQueue();
    renderCenter();
    renderRail();
    renderActionBar();
    if (anyLayerOpen()) return;
    const explicit = options !== undefined && options.focus === true;
    if (state.search.status === 'results') {
      const focused = state.focus < topCount() ? state.search.results[state.focus] : null;
      if (focused) ensurePassage(focused.reference);
    }
    if (!explicit && activeId !== null) {
      const byId = document.getElementById(activeId);
      if (byId !== null && typeof byId.closest === 'function' && byId.closest('#center-body') !== null) {
        byId.focus();
        return;
      }
    }
    if (state.search.status === 'results' && (explicit || focusWasInResults)) focusCurrentStop();
  }

  // §compare — the blind Compare screen (§3.5/D27). Session and passage
  // field names are ported from the old console's compare code
  // (index.html:2779 area, loadComparisonReviews:3730): the start body is
  // {requestId}; a judgment posts {requestId, revision, stateDigest,
  // queryId, choice}; the passages GET carries exactly queryId + passageId.
  function compareReadOnly() {
    return degradedReadOnly() || state.compare.readOnly === true;
  }
  async function openCompare() {
    const compare = state.compare;
    if (compare.status === 'loading') return;
    compare.status = 'loading';
    renderCompare();
    try {
      const data = await apiCandidates();
      compare.reviews = data && Array.isArray(data.reviews) ? data.reviews : [];
      compare.readOnly = !!(data && data.readOnly === true);
      compare.status = 'ready';
    } catch (error) {
      compare.status = 'failed';
    }
    renderCompare();
  }
  // The per-review requestId persists in study.ui.v1 (§4.9) so a reload
  // resumes the same blind session instead of minting a duplicate.
  function blindRequestIdFor(reviewId) {
    const ui = readUiState();
    const map = typeof ui.blindRequestIds === 'object' && ui.blindRequestIds !== null ? ui.blindRequestIds : {};
    if (typeof map[reviewId] === 'string') return map[reviewId];
    const requestId = crypto.randomUUID();
    map[reviewId] = requestId;
    writeUiState({ blindRequestIds: map });
    return requestId;
  }
  async function startCompareSession(reviewId) {
    const compare = state.compare;
    if (compare.starting) return;
    compare.starting = true;
    renderCompare();
    try {
      const data = await apiBlindSessionStart(reviewId, blindRequestIdFor(reviewId));
      compare.reviewId = reviewId;
      acceptCompareSession(data.session);
    } catch (error) {
      compare.status = 'failed';
    }
    compare.starting = false;
    renderCompare();
  }
  function acceptCompareSession(session) {
    const compare = state.compare;
    compare.session = session;
    const queries = session && Array.isArray(session.queries) ? session.queries : [];
    if (!queries.some((query) => query.queryId === compare.queryId)) {
      const firstOpen = queries.find((query) => !query.judgment);
      compare.queryId = firstOpen !== undefined ? firstOpen.queryId
        : queries.length > 0 ? queries[0].queryId : null;
      compare.passageKey = null;
    }
  }
  function compareSelectedQuery() {
    const compare = state.compare;
    if (compare.session === null || compare.queryId === null) return null;
    const queries = Array.isArray(compare.session.queries) ? compare.session.queries : [];
    return queries.find((query) => query.queryId === compare.queryId) ?? null;
  }
  function selectComparePassage(passageId) {
    const compare = state.compare;
    const key = compare.queryId + '|' + passageId;
    compare.passageKey = key;
    if (compare.passages[key] === undefined) {
      compare.passages[key] = { status: 'loading', data: null };
      apiBlindPassage(compare.reviewId, compare.session.sessionId, compare.queryId, passageId).then((data) => {
        compare.passages[key] = { status: 'done', data };
        if (state.screen === 'compare') renderCompare();
      }).catch(() => {
        compare.passages[key] = { status: 'failed', data: null };
        if (state.screen === 'compare') renderCompare();
      });
    }
    renderCompare();
  }
  // §3.5 binding: A/B/T/W never commits directly — each opens the
  // one-confirm layer; only its Confirm posts.
  function openCompareConfirm(choice, opener) {
    if (compareReadOnly()) { showToast(COPY.readOnlyToast); return; }
    const query = compareSelectedQuery();
    if (query === null || query.judgment) return;
    state.compareConfirm = {
      choice,
      opener: opener !== null && opener !== undefined
        ? opener
        : document.getElementById('compare-' + KEY_BY_CHOICE[choice]),
    };
    renderCompareConfirm();
  }
  function closeCompareConfirm() {
    const confirm = state.compareConfirm;
    state.compareConfirm = null;
    closeLayerDialog(confirm !== null ? confirm.opener : null);
  }
  function renderCompareConfirm() {
    const confirm = state.compareConfirm;
    if (confirm === null) return;
    const label = CHOICE_LABELS[confirm.choice];
    const dialog = openLayerDialog(COPY.compareConfirmTitle(label), 'compare-confirm-title');
    dialog.id = 'compare-confirm-dialog';
    dialog.appendChild(node('p', 'layer-prompt', COPY.compareFinality));
    const actions = node('div', 'layer-actions');
    const commit = node('button', 'btn-primary', COPY.compareConfirmButton(label));
    commit.type = 'button';
    commit.id = 'compare-confirm-commit';
    if (compareReadOnly() || state.compare.posting) commit.disabled = true;
    commit.addEventListener('click', () => { void confirmCompareChoice(); });
    actions.appendChild(commit);
    const cancel = node('button', 'btn-quiet', 'Cancel');
    cancel.type = 'button';
    cancel.id = 'compare-confirm-cancel';
    cancel.addEventListener('click', closeCompareConfirm);
    actions.appendChild(cancel);
    dialog.appendChild(actions);
    // §3.12 exception class: initial focus is Cancel, never Confirm — a
    // reflexive A-then-Enter double-tap must not commit.
    cancel.focus();
  }
  async function confirmCompareChoice() {
    const confirm = state.compareConfirm;
    const compare = state.compare;
    if (confirm === null || compare.session === null || compare.posting) return;
    if (compareReadOnly()) { showToast(COPY.readOnlyToast); return; }
    compare.posting = true;
    const body = {
      requestId: crypto.randomUUID(),
      revision: compare.session.revision,
      stateDigest: compare.session.stateDigest,
      queryId: compare.queryId,
      choice: confirm.choice,
    };
    let data = null;
    try {
      data = await apiBlindJudgment(compare.reviewId, compare.session.sessionId, body);
    } catch (error) {
      compare.posting = false;
      refetchHealth();
      const code = error && typeof error.code === 'string' ? error.code : '';
      showToast(code === 'startup_degraded_read_only' || code === 'artifact_unavailable'
        ? COPY.readOnlyToast
        : COPY.postFailed);
      renderCompareConfirm();
      return;
    }
    compare.posting = false;
    state.compareConfirm = null;
    clear(document.getElementById('dialog-slot'));
    acceptCompareSession(data.session);
    // Keep the just-judged query selected so its reveal is what renders.
    compare.queryId = body.queryId;
    renderCompare();
  }
  function revealText(query) {
    const choice = query.judgment.choice;
    if (choice === 'tie') return COPY.revealTie;
    if (choice === 'both-wrong') return COPY.revealBothWrong;
    const reveal = query.reveal && typeof query.reveal === 'object' ? query.reveal : {};
    const side = choice === 'a-wins' ? 'A' : 'B';
    const sideName = choice === 'a-wins' ? reveal.sideA : reveal.sideB;
    return COPY.revealPreferred(side, sideName === 'Current' ? 'the current engine' : 'the candidate');
  }
  function compareResultRow(entry, index) {
    const compare = state.compare;
    const row = node('button', 'compare-row'
      + (compare.passageKey === compare.queryId + '|' + entry.passageId ? ' sel' : ''));
    row.type = 'button';
    row.dataset.passage = entry.passageId;
    row.appendChild(node('span', 'rank-badge', '#' + (index + 1)));
    row.appendChild(node('span', 'card-ref', entry.reference));
    row.addEventListener('click', () => { selectComparePassage(entry.passageId); });
    return row;
  }
  function renderCompare() {
    if (state.screen !== 'compare') return;
    const container = document.getElementById('screen-compare');
    clear(container);
    const inner = node('div', 'screen-inner');
    container.appendChild(inner);
    const compare = state.compare;
    if (compare.status === 'loading' || compare.starting) {
      for (let i = 0; i < 3; i += 1) inner.appendChild(node('div', 'skeleton-row'));
      return;
    }
    if (compare.status === 'failed') {
      inner.appendChild(node('p', 'screen-sub', COPY.bootFetchFailed));
      return;
    }
    if (compare.session === null) {
      inner.appendChild(node('h1', '', 'Compare'));
      if (compare.reviews.length === 0) {
        inner.appendChild(node('p', 'screen-sub', COPY.compareEmpty));
        return;
      }
      for (const review of compare.reviews) {
        const card = node('div', 'compare-card');
        const left = node('div', '');
        left.appendChild(node('div', '', typeof review.label === 'string' ? review.label : 'Comparison'));
        left.appendChild(node('div', 'screen-sub', review.reviewedCount + ' of ' + review.queryCount + ' searches called'));
        card.appendChild(left);
        const start = node('button', 'btn-primary', review.status === 'not-started' ? 'Start the blind review' : 'Resume the blind review');
        start.type = 'button';
        start.dataset.review = review.reviewId;
        start.addEventListener('click', () => { void startCompareSession(review.reviewId); });
        card.appendChild(start);
        inner.appendChild(card);
      }
      return;
    }
    const query = compareSelectedQuery();
    if (query === null) {
      inner.appendChild(node('p', 'screen-sub', COPY.compareEmpty));
      return;
    }
    const queries = Array.isArray(compare.session.queries) ? compare.session.queries : [];
    if (queries.length > 1) {
      const chips = node('div', 'query-chips');
      for (const entry of queries) {
        const chip = node('button', 'query-chip');
        chip.type = 'button';
        chip.setAttribute('aria-pressed', entry.queryId === compare.queryId ? 'true' : 'false');
        chip.appendChild(node('span', '', '“' + entry.query + '”'));
        if (entry.judgment) chip.appendChild(node('span', 'chip-done', ' ✓'));
        chip.addEventListener('click', () => {
          compare.queryId = entry.queryId;
          compare.passageKey = null;
          renderCompare();
        });
        chips.appendChild(chip);
      }
      inner.appendChild(chips);
    }
    const head = node('div', '');
    head.appendChild(node('h1', '', COPY.compareTitle(query.query)));
    head.appendChild(node('p', 'screen-sub', COPY.compareBlind));
    head.appendChild(node('p', 'screen-sub', COPY.compareHow));
    inner.appendChild(head);
    const lists = node('div', 'compare-lists');
    const sides = query.sides && typeof query.sides === 'object' ? query.sides : { a: [], b: [] };
    for (const side of ['a', 'b']) {
      const column = node('div', 'compare-col');
      column.appendChild(node('div', 'col-head', 'Set ' + side.toUpperCase()));
      (Array.isArray(sides[side]) ? sides[side] : []).forEach((entry, index) => {
        column.appendChild(compareResultRow(entry, index));
      });
      lists.appendChild(column);
    }
    inner.appendChild(lists);
    if (compare.passageKey !== null) {
      inner.appendChild(renderComparePanel(query, sides));
    }
    if (query.judgment) {
      const reveal = node('div', 'reveal-card');
      reveal.id = 'reveal-card';
      reveal.appendChild(node('div', 'reveal-tag', COPY.revealTag));
      reveal.appendChild(node('p', 'reveal-line', revealText(query)));
      reveal.appendChild(node('p', 'screen-sub', COPY.revealBody));
      const back = node('button', 'btn-quiet', COPY.backToReview);
      back.type = 'button';
      back.id = 'reveal-back';
      back.addEventListener('click', () => { setScreen('review'); });
      reveal.appendChild(back);
      inner.appendChild(reveal);
      return;
    }
    const toolbar = node('div', 'compare-toolbar');
    toolbar.setAttribute('role', 'toolbar');
    toolbar.setAttribute('aria-label', 'Comparison call');
    const disabled = compareReadOnly();
    const addButton = (keycap, choice, labelText) => {
      const button = node('button', 'verdict-btn');
      button.type = 'button';
      button.id = 'compare-' + keycap.toLowerCase();
      button.appendChild(node('span', 'kbd', keycap));
      button.appendChild(node('span', '', labelText));
      if (disabled) button.disabled = true;
      button.addEventListener('click', (event) => { openCompareConfirm(choice, event.currentTarget); });
      toolbar.appendChild(button);
    };
    addButton('A', 'a-wins', 'A wins');
    addButton('B', 'b-wins', 'B wins');
    addButton('T', 'tie', 'Tie');
    addButton('W', 'both-wrong', 'Both wrong');
    inner.appendChild(toolbar);
  }
  function renderComparePanel(query, sides) {
    const compare = state.compare;
    const panel = node('div', 'compare-panel');
    panel.id = 'compare-panel';
    const cached = compare.passages[compare.passageKey];
    const passageId = compare.passageKey.split('|')[1];
    if (cached === undefined || cached.status === 'loading') {
      panel.appendChild(node('p', 'screen-sub', COPY.loadingPassage));
      return panel;
    }
    if (cached.status === 'failed') {
      panel.appendChild(node('p', 'screen-sub', COPY.bootFetchFailed));
      return panel;
    }
    const data = cached.data;
    panel.appendChild(node('h2', '', typeof data.reference === 'string' ? data.reference : ''));
    const body = node('p', 'verse-body');
    for (const verse of Array.isArray(data.verses) ? data.verses : []) {
      body.appendChild(node('sup', '', String(verse.verse)));
      body.appendChild(document.createTextNode(verse.text + ' '));
    }
    panel.appendChild(body);
    const says = node('div', 'compare-says');
    for (const side of ['a', 'b']) {
      const cell = node('div', '');
      cell.appendChild(node('div', 'why-key', COPY.setSays(side.toUpperCase())));
      const entry = (Array.isArray(sides[side]) ? sides[side] : [])
        .find((candidate) => candidate.passageId === passageId);
      if (entry === undefined) {
        cell.appendChild(node('div', 'screen-sub', COPY.notInThisSet));
      } else {
        const labels = (Array.isArray(entry.reasons) ? entry.reasons : [])
          .map((reason) => reason && typeof reason.label === 'string' ? reason.label : null)
          .filter((label) => label !== null);
        cell.appendChild(node('div', 'why-val', labels.length > 0 ? labels.join(' · ') : '—'));
      }
      says.appendChild(cell);
    }
    panel.appendChild(says);
    return panel;
  }

  // §history — the humanized History screen (§3.6/D28). No raw IDs, digests,
  // or fingerprints anywhere on this screen.
  function historyCases() {
    return sortByTouchedDesc(state.cases.filter((record) => !!record));
  }
  function openHistory() {
    // Re-fetch lazily per visit so calls made this session appear.
    state.history.byCase = Object.create(null);
    ensureHistoryFetches();
  }
  function ensureHistoryFetches() {
    for (const record of historyCases().slice(0, state.history.expandedCount)) {
      if (state.history.byCase[record.caseId] !== undefined) continue;
      state.history.byCase[record.caseId] = { status: 'loading', records: [] };
      apiJudgments(record.caseId).then((data) => {
        state.history.byCase[record.caseId] = {
          status: 'done',
          records: data !== null && Array.isArray(data.judgments) ? data.judgments : [],
        };
        if (state.screen === 'history') renderHistory();
      }).catch(() => {
        state.history.byCase[record.caseId] = { status: 'failed', records: [] };
        if (state.screen === 'history') renderHistory();
      });
    }
  }
  function historyWhy(record) {
    const phrase = typeof record.diagnosis === 'string' ? COPY.plainWhy[record.diagnosis] : undefined;
    return phrase !== undefined ? phrase : COPY.plainWhy['lexical-noise'];
  }
  function historyRowText(record, query) {
    if (record.action === 'missing') {
      const ref = typeof record.reference === 'string' ? record.reference : '';
      const n = record.withinTop !== undefined ? record.withinTop : 10;
      // A missing judgment this session recorded as a tail rescue renders
      // the rescue phrasing; prior-session records render the generic
      // template — the distinction is session-local, never guessed.
      return state.sessionLog.rescues[normalizeQuery(query) + '|' + ref] === true
        ? COPY.historyRescued(ref, n, query)
        : COPY.historyMissing(ref, n, query);
    }
    if (record.action === 'prefer') {
      const above = referenceOfTargetId(record.preferredTargetId);
      const below = referenceOfTargetId(record.otherTargetId);
      return above !== null && below !== null ? COPY.historyPrefer(above, below, query) : null;
    }
    const ref = referenceOfTargetId(record.targetId);
    if (ref === null) return null; // never render a raw id in place of a reference
    if (record.action === 'essential') return COPY.historyEssential(ref, record.withinTop !== undefined ? record.withinTop : 10, query);
    if (record.action === 'helpful') return COPY.historyHelpful(ref, query);
    if (record.action === 'irrelevant') return COPY.historyIrrelevant(ref, historyWhy(record), query);
    return null;
  }
  function renderHistory() {
    if (state.screen !== 'history') return;
    const container = document.getElementById('screen-history');
    clear(container);
    const inner = node('div', 'screen-inner');
    container.appendChild(inner);
    const cases = historyCases();
    const visible = cases.slice(0, state.history.expandedCount);
    let total = 0;
    let anyLoading = false;
    const groups = [];
    for (const record of visible) {
      const entry = state.history.byCase[record.caseId];
      if (entry === undefined || entry.status === 'loading') { anyLoading = true; continue; }
      if (entry.status !== 'done' || entry.records.length === 0) continue;
      total += entry.records.length;
      groups.push({ record, records: entry.records });
    }
    const head = node('div', '');
    head.appendChild(node('h1', '', COPY.historyTitle));
    head.appendChild(node('p', 'screen-sub', COPY.historySub));
    inner.appendChild(head);
    if (cases.length === 0 || (!anyLoading && total === 0)) {
      inner.appendChild(node('p', 'screen-sub', COPY.historyEmpty));
      const go = node('button', 'btn-primary', COPY.goToReview);
      go.type = 'button';
      go.id = 'history-go-review';
      go.addEventListener('click', () => { setScreen('review'); });
      inner.appendChild(go);
      return;
    }
    inner.appendChild(node('p', 'screen-sub', COPY.historyCount(total)));
    for (const group of groups) {
      const card = node('div', 'history-group');
      const groupHead = node('div', 'group-head');
      groupHead.appendChild(node('h2', '', '“' + group.record.query + '”'));
      card.appendChild(groupHead);
      const superseded = Object.create(null);
      for (const record of group.records) {
        if (record && typeof record.supersedes === 'string') superseded[record.supersedes] = true;
      }
      const ordered = group.records.slice().sort((a, b) => {
        const left = typeof a.at === 'string' ? a.at : '';
        const right = typeof b.at === 'string' ? b.at : '';
        return right < left ? -1 : right > left ? 1 : 0;
      });
      for (const record of ordered) {
        if (!record || record.schemaVersion !== 2) continue;
        const text = historyRowText(record, group.record.query);
        if (text === null) continue;
        const struck = superseded[record.judgmentId] === true;
        const row = node('div', 'history-row' + (struck ? ' struck' : ''));
        const line = node('div', 'row-line');
        line.appendChild(node('span', 'when', relativeTime(record.at)));
        line.appendChild(node('span', 'what', text));
        row.appendChild(line);
        if (struck) row.appendChild(node('div', 'history-sub', COPY.replacedByNewer));
        card.appendChild(row);
      }
      inner.appendChild(card);
    }
    if (anyLoading) inner.appendChild(node('div', 'skeleton-row'));
    if (cases.length > state.history.expandedCount) {
      const more = node('button', 'btn-quiet', COPY.showMore);
      more.type = 'button';
      more.id = 'history-show-more';
      more.addEventListener('click', () => {
        state.history.expandedCount += 20;
        ensureHistoryFetches();
        renderHistory();
      });
      inner.appendChild(more);
    }
  }

  // §finish — the Finish-up screen (§3.7/D29): stat tiles, pending banner,
  // the honestly-derived changed set, and the typed-digest signing flow.

      const when = parkedStopDate(card);

      article.appendChild(node('p', 'updates-note', COPY.updatesNoneSaved));
    }

    if (!(card.state && typeof card.state.sealedInTrain === 'string')) {
      const links = node('div', 'updates-links');
      links.appendChild(updatesQuietLink(COPY.updatesChangeThis, () => { reopenCardButtons(card); }));

  }
  function buildUpdatesGroup(id, summaryText, cards, statusText, open) {

    details.id = id;
    if (open || cards.some((card) => state.updates.reopened[card.cardId] === true)) details.open = true;
    const summary = node('summary', '', summaryText);
    details.appendChild(summary);
    for (const card of cards) {
      details.appendChild(state.updates.reopened[card.cardId] === true
        ? buildUpdatesFullCard(card)
        : buildUpdatesCompactCard(card, statusText));
    }
    return details;
  }

  // §train — the update panel (votes-to-engine plan Phase 2, §4.5/§4.6).
  // A train's stored state is only open|sealed|stopped (the append-only
  // log); everything after `sealed` is OBSERVED from artifacts via
  // GET /api/v2/updates/train/:id, so the panel polls that endpoint while a
  // train is non-terminal. (The jobs/SSE wiring for train runs is Phase 3's
  // D12 — the Phase-2 server runs the checks inside the admit request and
  // mints no job, so there is no event stream to subscribe to yet.)
  function resetTrainPanel() {
    const train = state.updates.train;
    if (train.pollTimer !== null) clearTimeout(train.pollTimer);
    train.view = null;
    train.viewFailed = false;
    train.loading = false;
    train.sealing = false;
    train.approving = false;
    train.panelError = null;
    train.confirm = null;
    train.pollTimer = null;
    const ui = readUiState();
    train.dismissedLive = typeof ui.dismissedLiveTrain === 'string' ? ui.dismissedLiveTrain : null;

  function latestTrainSnapshot() {

    return trains.length > 0 ? trains[trains.length - 1] : null;
  }
  // Single-flight, as the panel sees it (V7): a stored-sealed train whose
  // observed state is not yet live/stopped is on its way. An unknown
  // observation counts as running — fail closed, never a second seal.
  function trainNonTerminal() {
    const snapshot = latestTrainSnapshot();
    if (snapshot === null || snapshot.state !== 'sealed') return false;
    const view = state.updates.train.view;
    return view === null || (view.state !== 'live' && view.state !== 'stopped');

  async function syncTrainView() {
    const updates = state.updates;
    const snapshot = latestTrainSnapshot();

    updates.train.loading = true;
    await refreshTrainView(snapshot.trainId, updates.seq);

  async function refreshTrainView(trainId, seq) {
    const updates = state.updates;
    const train = updates.train;
    let data = null;
    try { data = await apiTrain(trainId); } catch (error) { data = null; }
    if (seq !== updates.seq || state.screen !== 'updates') return;
    train.loading = false;
    if (data !== null && data.train && typeof data.train.state === 'string') {
      train.view = data.train;
      train.viewFailed = false;
    } else {
      train.viewFailed = true;
    }

    scheduleTrainPoll();
  }
  function scheduleTrainPoll() {
    const updates = state.updates;
    const train = updates.train;
    if (train.pollTimer !== null) { clearTimeout(train.pollTimer); train.pollTimer = null; }
    if (state.screen !== 'updates' || train.viewFailed) return;
    if (train.sealing || train.approving) return;
    const view = train.view;
    if (view === null) return;
    // `ready` waits on the human; live/stopped are terminal — no machine run
    // to watch. Everything else may move underneath us (the merge included).
    if (view.state === 'ready' || view.state === 'live' || view.state === 'stopped') return;
    const seq = updates.seq;
    train.pollTimer = setTimeout(() => {
      train.pollTimer = null;
      void refreshTrainView(view.trainId, seq);
    }, 4000);
  }
  // §4.5's summary inputs: the approved, un-routed cards not already frozen
  // by a live seal (a routed card stages nothing here — it went to the
  // curation queue; a sealed card is riding the current update, so it never
  // re-boards or re-counts — the fold clears the freeze if the train stops).
  function trainApprovableCards(groups) {
    return groups.approved.filter((card) => (card.routed === undefined || card.routed === null)
      && !(card.state && typeof card.state.sealedInTrain === 'string'));
  }
  function trainThemeChangeDetails(cards) {
    const details = [];
    for (const card of cards) {
      const derived = card.derived || {};
      if (card.question !== undefined && card.question !== null && card.state && card.state.answers) {
        const answer = card.state.answers[card.question.id];
        if (typeof answer === 'string' && answer !== '' && answer !== 'needs-new-theme') {
          const chip = (card.question.chips || []).find((candidate) => candidate.conceptId === answer);
          const label = chip !== undefined && typeof chip.label === 'string' ? chip.label : conceptLabelOf(answer);
          const ref = cardPrimaryRef(card);
          details.push('add ' + (ref !== null ? ref : 'the passage') + ' under “' + label + '”');
        }
      }
      if (derived.anchorRemove !== undefined) {
        const ref = cardPrimaryRef(card);
        details.push('remove ' + (ref !== null ? ref : 'the passage') + ' from “' + conceptLabelOf(derived.anchorRemove.conceptId) + '”');
      }
    }
    return details;
  }
  // The §4.5 "This update will contain" lines — counts of approved intents,
  // Jesse's own words played back; never a predicted reordering (r8 §4).
  // The flavor mirrors the server's derivation (guard = answer-sheet lines
  // only) so the machine-time sentence is lane-aware before anything runs.
  function trainSummary(cards) {
    let mustRank = 0;
    let mustNot = 0;
    let order = 0;
    const queries = Object.create(null);
    for (const card of cards) {
      const derived = card.derived || {};
      if (derived.guard !== undefined) mustNot += 1;
      else if (derived.expectation !== undefined) mustRank += 1;
      else if (derived.preferredOrder !== undefined) order += 1;
      else continue;
      queries[card.query] = true;
    }
    const lines = [];
    const total = mustRank + mustNot + order;
    if (total > 0) {
      const parts = [];
      if (mustRank > 0) parts.push(mustRank + ' must-rank');
      if (mustNot > 0) parts.push(mustNot + ' must-not-rank');
      if (order > 0) parts.push(order + ' preferred order');
      lines.push(COPY.trainLineSheet(total, Object.keys(queries).length, parts.join(', ')));
    }
    const themes = trainThemeChangeDetails(cards);
    if (themes.length > 0) lines.push(COPY.trainLineThemes(themes.length, themes.join('; ')));
    const corpus = cards.filter((card) => (card.derived || {}).chapterAdd !== undefined).length;
    if (corpus > 0) lines.push(COPY.trainLineCorpus(corpus));

  // The one-confirm layer (§4.5/§4.6): the Compare pattern reused — initial
  // focus on Cancel, Esc closes, and only the layer's own button commits.
  function openTrainConfirm(kind, opener) {
    if (updatesReadOnly()) { showToast(COPY.readOnlyToast); return; }
    state.updates.train.confirm = {
      kind,
      opener: opener !== undefined && opener !== null ? opener : document.activeElement,
    };
    renderTrainConfirm();
  }
  function closeTrainConfirm() {
    const confirm = state.updates.train.confirm;
    if (confirm === null) return;
    state.updates.train.confirm = null;
    closeLayerDialog(confirm.opener);
  }
  function renderTrainConfirm() {
    const confirm = state.updates.train.confirm;
    if (confirm === null) return;
    const seal = confirm.kind === 'seal';
    const dialog = openLayerDialog(seal ? COPY.trainConfirmTitle : COPY.trainApproveTitle, 'train-confirm-title');
    dialog.id = 'train-confirm-dialog';
    dialog.appendChild(node('p', 'layer-prompt', seal ? COPY.trainConfirmBody : COPY.trainApproveBody));
    const actions = node('div', 'layer-actions');
    const cancel = node('button', 'btn-quiet', 'Cancel');
    cancel.type = 'button';
    cancel.id = 'train-confirm-cancel';
    cancel.addEventListener('click', closeTrainConfirm);
    actions.appendChild(cancel);
    const commit = node('button', 'btn-primary', seal ? COPY.trainStart : COPY.trainApprove);
    commit.type = 'button';
    commit.id = 'train-confirm-commit';
    if (updatesReadOnly() || state.updates.train.sealing || state.updates.train.approving) commit.disabled = true;
    commit.addEventListener('click', () => {
      if (seal) void sealTrain();
      else void approveTrain();
    });
    actions.appendChild(commit);
    dialog.appendChild(actions);
    // Initial focus is Cancel, never the commit (§4.7, the Compare rule).
    cancel.focus();

  // The seal (§4.5): one POST carrying the derivation digest the panel
  // rendered from. The server re-derives and refuses rather than trusts —
  // every refusal renders in place, never a silent retry.
  async function sealTrain() {
    const updates = state.updates;
    const train = updates.train;
    if (updatesReadOnly()) { showToast(COPY.readOnlyToast); return; }
    if (train.sealing) return;
    const derivation = updates.derivation;
    train.sealing = true;
    train.panelError = null;
    renderTrainConfirm();
    let data = null;
    try {
      data = await apiTrainSeal({ derivationDigest: derivation !== null ? derivation.derivationDigest : null });
    } catch (error) {
      train.sealing = false;
      closeTrainConfirm();
      const code = error && typeof error.code === 'string' ? error.code : '';
      if (error && (error.status === 503 || code === 'startup_degraded_read_only' || code === 'artifact_unavailable')) {
        showToast(COPY.readOnlyToast);
        renderUpdates();
        return;
      }
      if (code === 'train_running') {
        // §4.5: a second start is refused — the one-at-a-time line stands.
        train.panelError = { id: 'updates-train-one-at-a-time', text: COPY.trainOneAtATime };
      } else if (code === 'stale_preview') {
        // §4.8's mid-seal row: the derivation moved under the summary — the
        // reload line renders and the fresh derivation re-renders the panel.
        train.panelError = { id: 'updates-train-error', text: COPY.staleLine };
      } else if (code === 'mutation_running') {
        train.panelError = { id: 'updates-train-error', text: COPY.busyLine };
      } else if (error && error.status === 409 && typeof error.message === 'string' && error.message !== '') {
        // The seal's own reviewed plain-language refusals (a data train
        // waiting for the full machinery, nothing to seal, an unmeasured
        // operation) render in the server's words — the single writer.
        train.panelError = { id: 'updates-train-error', text: error.message };
      } else {
        train.panelError = { id: 'updates-train-error', text: COPY.trainSealFailed };
      }
      void reloadUpdates();
      return;
    }
    train.sealing = false;
    closeTrainConfirm();
    if (data !== null && data.train && typeof data.train.state === 'string') {
      train.view = data.train;
      train.viewFailed = false;
    }
    // The sealed cards leave the approved group — re-derive the fresh fold.
    void reloadUpdates();
    scheduleTrainPoll();
  }
  // Phase 2's approve act (§4.6): one human confirm records the per-slot
  // review through the EXISTING admit surface, then opens the draft on
  // GitHub through the existing publish preparation — the draft PR is the
  // ceiling; nothing here merges or marks ready. Retires with D14's
  // typed-digest sign panel.
  async function approveTrain() {
    const updates = state.updates;
    const train = updates.train;
    if (updatesReadOnly()) { showToast(COPY.readOnlyToast); return; }
    const view = train.view;
    if (view === null || view.state !== 'ready' || train.approving) return;
    train.approving = true;
    train.panelError = null;
    closeTrainConfirm();
    renderUpdates();
    const seq = updates.seq;
    const failWith = (text) => {
      if (seq !== updates.seq || state.screen !== 'updates') return;
      train.approving = false;
      train.panelError = { id: 'updates-train-error', text };
      renderUpdates();
      // A terminal failure may have stopped the train — observe it.
      void refreshTrainView(view.trainId, seq);
    };
    let detail = null;
    try { detail = await apiAdmission(view.trainId); } catch (error) { failWith(COPY.trainDetailFailed); return; }
    const admissionView = detail !== null && typeof detail === 'object' ? detail.admission : null;
    const preview = admissionView && admissionView.preview ? admissionView.preview : null;
    if (preview === null || typeof preview.digest !== 'string' || !Array.isArray(preview.decisions)) {
      failWith(COPY.trainDetailFailed);
      return;
    }
    // The one confirm IS the recorded review of the listed lines (§4.6):
    // every decision slot carries the same reviewed rationale sentence.
    const decisions = preview.decisions.map((slot) => {
      const decision = { slotId: slot.slotId, rationale: COPY.trainDecisionRationale };
      if (slot.kind === 'probe-baseline') {
        decision.probeRationales = (slot.probes || []).map((probe) => ({ probeId: probe.probeId, rationale: COPY.trainDecisionRationale }));
      }
      return decision;
    });
    let admitted = null;
    try {
      admitted = await apiAdmissionAdmit(view.trainId, { previewDigest: preview.digest, decisions });
    } catch (error) {
      const code = error && typeof error.code === 'string' ? error.code : '';
      if (code === 'stale_preview') { failWith(COPY.staleLine); return; }
      if (code === 'mutation_running') { failWith(COPY.busyLine); return; }
      failWith(COPY.trainAdmitFailed);
      return;
    }
    const admittedView = admitted !== null && typeof admitted === 'object' ? admitted.admission : null;
    const admissionDigest = admittedView && admittedView.admission && typeof admittedView.admission.digest === 'string'
      ? admittedView.admission.digest
      : null;
    if (admissionDigest === null) { failWith(COPY.trainAdmitFailed); return; }
    if (seq === updates.seq && state.screen === 'updates') {
      // "Approved. Preparing the change for review on GitHub…" (§5.1) — the
      // draft opens next from this same single confirm.
      if (train.view !== null && train.view.state === 'ready') {
        train.view = Object.assign({}, train.view, { state: 'admitted' });
      }
      renderUpdates();
    }
    try {
      await apiPublishPrepare(view.trainId, { admissionDigest, push: true, openDraftPr: true });
    } catch (error) {
      failWith(COPY.trainPrepareFailed);
      return;
    }
    if (seq !== updates.seq || state.screen !== 'updates') return;
    train.approving = false;
    void refreshTrainView(view.trainId, seq);
  }
  // The progress strip: §05 §5.1's reviewer-visible labels only. A guard
  // train renders its three machine steps plus the two human-wait states —
  // never the trial-build or comparison waypoints (§4.6's fixture-lane rule).
  function trainStrip(stateKey) {
    const strip = node('div', 'train-strip');
    strip.setAttribute('aria-label', 'Update progress');
    if (stateKey === 'stopped') {
      strip.appendChild(node('span', 'train-step current', COPY.trainStepStopped));
      return strip;
    }
    const order = ['sealed', 'ready', 'admitted', 'pr-open', 'live'];
    const labels = {
      sealed: COPY.trainStepSealed,
      ready: COPY.trainStepReady,
      admitted: COPY.trainStepAdmitted,
      'pr-open': COPY.trainStepPrOpen,
      live: COPY.trainStepLive,
    };
    const current = order.indexOf(stateKey);
    order.forEach((key, index) => {
      strip.appendChild(node('span', 'train-step' + (index < current ? ' done' : index === current ? ' current' : ''), labels[key]));
    });
    return strip;
  }
  function trainStatusSentence(stateKey) {
    if (stateKey === 'ready') return COPY.trainReadyLine;
    if (stateKey === 'admitted') return COPY.trainAdmittedLine;
    if (stateKey === 'pr-open') return COPY.trainPrOpenLine;
    if (stateKey === 'live') return COPY.trainLiveLine;
    return COPY.trainSealedLine;
  }
  // The live receipt's query chips: the report's own lines name the updated
  // searches (the report is the reviewed record — no digest travels here).
  function trainReportQueries(view) {
    const queries = [];
    const lines = view.report && Array.isArray(view.report.lines) ? view.report.lines : [];
    for (const line of lines) {
      const match = /^For "([\s\S]+?)", /.exec(line);
      if (match !== null && queries.indexOf(match[1]) === -1) queries.push(match[1]);
    }
    return queries;
  }
  function dismissLiveReceipt(trainId) {

  }
  function renderTrainView(panel, view) {

    panel.appendChild(status);

    if (view.report !== null && view.report !== undefined && view.state !== 'sealed') {

      panel.appendChild(links);

  // The pruned/parked outcome's stop date (06 FM-5): the no-effect stop

  function parkedStopDate(card) {

    const trains = derivation !== null && Array.isArray(derivation.trains) ? derivation.trains : [];
    for (let index = trains.length - 1; index >= 0; index -= 1) {
      const train = trains[index];
      if (train.state !== 'stopped' || !train.stopped || train.stopped.reason !== 'no-measurable-effect') continue;
      if (train.sealed && Array.isArray(train.sealed.cardIds) && train.sealed.cardIds.indexOf(card.cardId) !== -1) {
        return typeof train.stopped.at === 'string' ? shortDate(train.stopped.at) : null;

        start.appendChild(list);
        start.appendChild(node('p', 'train-status', summary.flavor === 'guard' ? COPY.trainTimeGuard : COPY.trainTimeData));

    if (hasContent) inner.appendChild(panel);
  }
  function renderUpdates() {
    if (state.screen !== 'updates') return;
    const updates = state.updates;
    const container = document.getElementById('screen-updates');
    const activeBefore = document.activeElement;
    const hadFocusInside = activeBefore !== null && typeof activeBefore.closest === 'function'
      && activeBefore.closest('#screen-updates') !== null;
    clear(container);
    const inner = node('div', 'screen-inner');
    container.appendChild(inner);
    const head = node('div', '');
    head.appendChild(node('h1', '', 'Updates'));
    head.appendChild(node('p', 'screen-sub', COPY.updatesIntro));
    inner.appendChild(head);
    if (updates.status === 'loading' || updates.status === 'idle') {
      const loading = node('p', 'screen-sub', COPY.updatesLoading);
      loading.id = 'updates-loading';
      inner.appendChild(loading);
      for (let i = 0; i < 3; i += 1) inner.appendChild(node('div', 'skeleton-row'));
      return;
    }
    // Zone 1: the tally row (§4.2) — plain counts; re-confirmation, conflict
    // and needs-engineering cards never count (they stage no change).
    const derivation = updates.derivation;
    if (derivation !== null && derivation.tally) {
      const bits = [];
      if (derivation.tally.drafted > 0) bits.push(COPY.updatesStatWaiting(derivation.tally.drafted));
      if (derivation.tally.approved > 0) bits.push(COPY.updatesStatApproved(derivation.tally.approved));
      if (bits.length > 0) {
        const stats = node('p', 'screen-sub', bits.join(' · '));
        stats.id = 'updates-stats';
        inner.appendChild(stats);
      }
    }
    if (updates.reloading) {
      const line = node('p', 'updates-note', COPY.updatesStaleCard);
      line.id = 'updates-reloading';
      line.setAttribute('role', 'status');
      inner.appendChild(line);
    }
    // Zone 2: the card list — one column, most recent contributing vote
    // first, a labeled region with roving focus (§4.2/§4.7).
    const groups = updatesGroups();
    if (groups.main.length > 0) {
      const list = node('div', '');
      list.id = 'updates-cards';
      list.setAttribute('role', 'region');
      list.setAttribute('aria-label', 'Suggested changes');
      for (const card of groups.main) list.appendChild(buildUpdatesFullCard(card));
      inner.appendChild(list);
    }
    // Failure copy is scoped per data source (§4.9's parity rule: one
    // sentence per api function): the "Couldn't load your updates" sentence
    // belongs to GET /api/v2/updates alone and renders only when the cards
    // themselves failed to load — loaded cards never sit under it.
    if (updates.deriveFailed) {
      const failed = node('p', 'screen-sub', COPY.updatesFetchFailed);
      failed.id = 'updates-cards-failed';
      inner.appendChild(failed);
    }
    if (groups.approved.length > 0) {
      inner.appendChild(buildUpdatesGroup('updates-approved-group',
        COPY.updatesGroupApproved(groups.approved.length), groups.approved, COPY.updatesStatusApproved, true));
    }
    if (groups.sealed.length > 0) {
      // Sealed-aboard cards (§4.5): riding the CURRENT update, decisions
      // frozen by the seal until the train finishes or stops.
      inner.appendChild(buildUpdatesGroup('updates-sealed-group',
        COPY.updatesGroupSealed(groups.sealed.length), groups.sealed, COPY.updatesStatusSealed, false));
    }
    if (groups.engineering.length > 0) {
      inner.appendChild(buildUpdatesGroup('updates-engineering-group',
        COPY.updatesGroupEngineering(groups.engineering.length), groups.engineering, COPY.updatesStatusEngineering, false));
    }
    if (groups.parked.length > 0) {
      inner.appendChild(buildUpdatesGroup('updates-parked-group',
        COPY.updatesGroupParked(groups.parked.length), groups.parked, COPY.updatesStatusParked, false));
    }
    // §4.8 "Empty (all approved)": nothing waits for a call, but approved
    // changes are queued — point at the Start button below.
    const approvableNow = trainApprovableCards(groups);
    if (groups.main.length === 0 && approvableNow.length > 0 && !updates.deriveFailed) {
      const allApproved = node('p', 'screen-sub', COPY.updatesAllApproved(approvableNow.length));
      allApproved.id = 'updates-all-approved';
      inner.appendChild(allApproved);
    }
    // Zone 3 — the update panel (Phase 2's trains, §4.5/§4.6).
    renderTrainPanel(inner, groups);
    // The backlog: the compile checklist as read-only lines, headed by the
    // same-facts note when the legacy card stands above it (§4.2; the lines
    // retire with the checklist, Phase 4).
    const lines = updatesChecklist();
    const legacyRenders = groups.main.some((card) => isLegacyCard(card));
    if (lines.length > 0) {
      if (legacyRenders) {
        const note = node('p', 'updates-note', COPY.updatesSameFacts);
        note.id = 'updates-same-facts';
        inner.appendChild(note);
      }
      const list = node('div', 'write-group');
      list.id = 'updates-backlog';
      for (const line of lines) {
        list.appendChild(node('div', 'write-line', updatesLineText(parseChecklistLine(line))));
      }
      inner.appendChild(list);
    } else if (updates.planFailed) {
      // The backlog rides POST /api/v2/compile/preview, so its failure line
      // is that endpoint's own D39 sentence (the same one Finish up renders)
      // — never the §4.9 updates sentence, which would falsely claim the
      // cards above failed to load (e.g. when conflicting votes 422 the
      // compile while the derived cards render fine).
      const failed = node('p', 'screen-sub', COPY.bootFetchFailed);
      failed.id = 'updates-backlog-failed';
      inner.appendChild(failed);
    }
    // The steady empty state (§4.8 owns the string).
    const anyCard = groups.main.length > 0 || groups.approved.length > 0
      || groups.sealed.length > 0 || groups.engineering.length > 0 || groups.parked.length > 0;
    if (!anyCard && lines.length === 0 && !updates.deriveFailed && !updates.planFailed) {
      const empty = node('p', 'screen-sub', COPY.updatesEmpty);
      empty.id = 'updates-empty';
      inner.appendChild(empty);
      const go = node('button', 'btn-primary', COPY.goToReview);
      go.type = 'button';
      go.id = 'updates-go-review';
      go.addEventListener('click', () => { setScreen('review'); });
      inner.appendChild(go);
    }
    // Roving tabindex: exactly one card is the tab stop (§4.7).
    const els = updatesFocusables();
    if (els.length > 0) {
      let index = els.findIndex((el) => el.dataset.cardId === updates.focusCardId);
      if (index === -1) { index = 0; updates.focusCardId = els[0].dataset.cardId; }
      els.forEach((el, i) => { el.tabIndex = i === index ? 0 : -1; });
      // A just-opened decline input takes focus (§4.7); otherwise a rebuild
      // that destroyed the focused element restores the roving position.
      if (updates.focusDecline !== undefined && updates.focusDecline !== null) {
        const input = container.querySelector('.updates-card[data-card-id="' + updates.focusDecline + '"] .decline-input');
        updates.focusDecline = null;
        if (input !== null) input.focus();
      } else if (hadFocusInside && document.activeElement !== null
        && (document.activeElement === document.body || document.activeElement.closest('#screen-updates') === null)) {
        els[index].focus();
      }
    }
  }

  // §advanced — the Advanced door (§3.8/D30): the identity trio lives here,
  // in mono — nowhere else except the signing chip.
  function renderAdvanced() {
    if (state.screen !== 'advanced') return;
    const container = document.getElementById('screen-advanced');
