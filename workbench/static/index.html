  // §search
  function resetQueryState() {
    state.activeCase = null;
    state.judgedByTarget = Object.create(null);
    state.missingByRef = Object.create(null);
    state.reopened = Object.create(null);
    state.selected = Object.create(null);
    state.dataBanner = null;
    state.interview = null;
    state.missingForm = null;
    state.rescue = null;
    state.compareConfirm = null;
    // The onboarding tour, the `?` sheet, and the lookup live in the dialog
    // slot too and survive a search submit (e.g. the open-case boot search
    // under the first-run tour).
    if (state.lookup === null && state.onboarding === null && state.sheet === null) {
      clear(document.getElementById('dialog-slot'));
    }
  }
  async function submitSearch(rawQuery) {
    const query = rawQuery.trim();
    if (query === '') return; // A blank or whitespace-only submit is a client no-op.
    state.screen = 'review'; // a submitted search always lands on Review
    const seq = ++state.searchSeq;
    resetQueryState();
    state.search = { status: 'loading', query, kind: null, results: [], passage: null };
    renderAll({});
    let outcome;
    try {
      outcome = await apiSearch(query);
    } catch (error) {
      if (seq !== state.searchSeq) return; // stale
      state.search = { status: 'error', query, kind: null, results: [], passage: null };
      renderAll({});
      return;
    }
    if (seq !== state.searchSeq) return; // stale: only the latest search renders
    writeUiState({ lastQuery: query });
    if (outcome.kind === 'reference') {
      state.search = { status: 'reference', query, kind: 'reference', results: [], passage: outcome.passage };
      announce(COPY.referenceKind);
      renderAll({});
      return;
    }
    if (outcome.kind === 'invalid-reference') {
      state.search = { status: 'invalid', query, kind: 'invalid-reference', results: [], passage: null };
      announce(COPY.invalidReference(query));
      renderAll({});
      return;
    }
    let results = Array.isArray(outcome.results) ? outcome.results : [];
    if (results.length === 0) {
      state.search = { status: 'empty', query, kind: 'discovery', results: [], passage: null };
      announce(COPY.emptyTitle(query));
      renderAll({});
      return;
    }
    // Open existing case (§4.3): the live search supplies the tail; the
    // case's snapshot is the render source for the judged top block (§4.6),
    // with a reference-per-rank agreement check between the two.
    let firstUnjudged = 0;
    const openCase = caseForQuery(query);
    if (openCase !== null) {
      let caseData = null;
      let judgmentData = null;
      try {
        [caseData, judgmentData] = await Promise.all([apiCase(openCase.caseId), apiJudgments(openCase.caseId)]);
      } catch (error) {
        delete state.countsPending[openCase.caseId];
        showToast(COPY.bootFetchFailed);
      }
      if (seq !== state.searchSeq) return; // stale
      if (caseData !== null || judgmentData !== null) {
        // This pair IS the §4.3 counts row for the opened case — one fetch
        // pair per open case, never a duplicate.
        applyCaseCounts(openCase.caseId, judgmentData, caseData);
      }
      if (judgmentData !== null && Array.isArray(judgmentData.judgments)) {
        const resolved = resolveActiveJudgments(judgmentData.judgments);
        state.judgedByTarget = resolved.byTarget;
        state.missingByRef = resolved.byRef;
      }
      if (caseData !== null && caseData.review !== null && typeof caseData.review.token === 'string') {
        const review = caseData.review;
        const snapRefs = reviewTopRefs(review);
        const liveTopRefs = results.slice(0, TOP_WINDOW).map((result) => result.reference);
        adoptSnapshot(review, caseData.case);
        const snapResults = review.result && Array.isArray(review.result.results) ? review.result.results : [];
        results = snapResults.concat(results.slice(TOP_WINDOW));
        if (!sameOrder(snapRefs, liveTopRefs)) {
          // Agreement failure: the snapshot list wins for judging; the
          // banner's copy must say the list shown is the case-open one.
          state.dataBanner = 'snapshot-wins';
        }
      }
      const top = results.slice(0, TOP_WINDOW);
      const unjudgedIndex = top.findIndex((result) =>
        state.judgedByTarget[result.targetId] === undefined && state.reopened[result.targetId] !== true);
      firstUnjudged = unjudgedIndex === -1 ? 0 : unjudgedIndex;
    }
    state.search = { status: 'results', query, kind: 'discovery', results, passage: null };
    state.focus = firstUnjudged;
    state.expandedIndex = firstUnjudged;
    state.inTail = false;
    state.tailExpanded = false;
    state.railTab = 'why';
    announce(COPY.resultsAnnounce(results.length, query));
    // Post-search focus handoff: DOM focus moves from the search input to
    // result card #1 (the first unjudged card when the query has an open
    // case); the input keeps its value. The reference, invalid-reference,
    // and zero-result branches above leave focus in the input — the
    // reviewer's next act there is retyping.
    renderAll({ focus: true });
  }

  // §lookup (⌘K)
  let lookupDebounce = null;
  function openLookup(opener) {
    if (state.lookup !== null) { closeLookup(); return; }
    state.lookup = { q: '', kind: null, results: [], sel: 0, opener: opener || document.activeElement, seq: 0 };
    renderLookup();
    const input = document.getElementById('lookup-input');
    if (input !== null) input.focus();
  }
  function closeLookup() {
    const lookup = state.lookup;
    state.lookup = null;
    if (lookupDebounce !== null) { clearTimeout(lookupDebounce); lookupDebounce = null; }
    clear(document.getElementById('dialog-slot'));
    // The lookup shares the one dialog slot with the other layers (⌘K works
    // everywhere, so it can open over them): closing it re-renders whichever
    // layer is still open underneath, per the §3.12 Esc order.
    if (state.interview !== null) { renderInterview(); return; }
    if (state.rescue !== null) { renderRescue(); return; }
    if (state.missingForm !== null) { renderMissingForm(); return; }
    if (state.compareConfirm !== null) { renderCompareConfirm(); return; }
    if (state.sheet !== null) { renderSheet(); return; }
    if (lookup !== null && lookup.opener && typeof lookup.opener.focus === 'function') lookup.opener.focus();
  }
  function lookupType(value) {
    const lookup = state.lookup;
    if (lookup === null) return;
    lookup.q = value;
    if (lookupDebounce !== null) clearTimeout(lookupDebounce);
    if (value.trim().length < 3) {
      lookup.kind = null;
      lookup.results = [];
      lookup.sel = 0;
      renderLookupResults();
      return;
    }
    lookupDebounce = setTimeout(() => {
      lookupDebounce = null;
      const seq = ++lookup.seq;
      apiSearch(value.trim()).then((outcome) => {
        if (state.lookup !== lookup || seq !== lookup.seq) return;
        lookup.kind = outcome.kind;
        if (outcome.kind === 'discovery') lookup.results = Array.isArray(outcome.results) ? outcome.results : [];
        else if (outcome.kind === 'reference') lookup.results = [{ reference: outcome.passage.reference, excerpt: outcome.passage.verses.map((v) => v.text).join(' ') }];
        else lookup.results = [];
        lookup.sel = 0;
        renderLookupResults();
      }).catch(() => {
        if (state.lookup !== lookup || seq !== lookup.seq) return;
        lookup.kind = 'error';
        lookup.results = [];
        renderLookupResults();
      });
    }, 300);
  }
  function lookupSelect() {
    const lookup = state.lookup;
    if (lookup === null || lookup.results.length === 0) return;
    const query = lookup.q.trim();
    closeLookup();
    document.getElementById('search-input').value = query;
    void submitSearch(query);
  }
  function renderLookup() {
    const slot = document.getElementById('dialog-slot');
    clear(slot);
    const overlay = node('div', 'overlay');
    overlay.addEventListener('mousedown', (event) => { if (event.target === overlay) closeLookup(); });
    const dialog = node('div', 'lookup-dialog');
    dialog.setAttribute('role', 'dialog');
    dialog.setAttribute('aria-modal', 'true');
    dialog.setAttribute('aria-labelledby', 'lookup-title');
    const lookupTitle = node('h2', 'visually-hidden', 'Look something up');
    lookupTitle.id = 'lookup-title';
    dialog.appendChild(lookupTitle);
    const input = node('input', 'lookup-input');
    input.id = 'lookup-input';
    input.type = 'text';
    input.placeholder = COPY.lookupPlaceholder;
    input.setAttribute('aria-label', 'Quick lookup');
    input.addEventListener('input', () => { lookupType(input.value); });
    dialog.appendChild(input);
    const resultsEl = node('div', 'lookup-results');
    resultsEl.id = 'lookup-results';
    dialog.appendChild(resultsEl);
    const footer = node('div', 'lookup-footer');
    footer.appendChild(node('span', '', '↑↓ Navigate'));
    footer.appendChild(node('span', '', '↵ Select'));
    footer.appendChild(node('span', '', 'Esc Close'));
    footer.appendChild(node('span', 'spacer', ''));
    footer.appendChild(node('span', '', COPY.lookupNoCase));
    dialog.appendChild(footer);
    overlay.appendChild(dialog);
    slot.appendChild(overlay);
    renderLookupResults();
  }
  function renderLookupResults() {
    const lookup = state.lookup;
    if (lookup === null) return;
    const resultsEl = document.getElementById('lookup-results');
    if (resultsEl === null) return;
    clear(resultsEl);
    if (lookup.kind === 'invalid-reference') {
      resultsEl.appendChild(node('div', 'lookup-empty', COPY.invalidReference(lookup.q.trim())));
      return;
    }
    if (lookup.kind === 'error') {
      resultsEl.appendChild(node('div', 'lookup-empty', COPY.searchError));
      return;
    }
    if (lookup.kind !== null && lookup.results.length === 0) {
      resultsEl.appendChild(node('div', 'lookup-empty', COPY.lookupEmpty));
      return;
    }
    lookup.results.forEach((result, index) => {
      const row = node('button', 'lookup-row' + (index === lookup.sel ? ' sel' : ''));
      row.type = 'button';
      const head = node('div', 'row-head');
      head.appendChild(node('span', 'row-ref', result.reference));
      if (index === lookup.sel) head.appendChild(node('span', 'row-action', COPY.lookupAction));
      row.appendChild(head);
      row.appendChild(node('div', 'row-snippet', result.excerpt));
      row.addEventListener('click', () => { lookup.sel = index; lookupSelect(); });
      resultsEl.appendChild(row);
    });
  }

  // §onboarding — three keypress lessons on first visit (§3.9/D32). Each
  // card really requires its key (J → E → ?); the contract sentence rides
  // card 1 once; Skip works by mouse. A layer under the §3.12 focus contract.
  const ONBOARD_CARDS = [
    { key: 'j', keycap: 'J', title: () => COPY.onboardTitle1, body: () => COPY.onboardBody1 },
    { key: 'e', keycap: 'E', title: () => COPY.onboardTitle2, body: () => COPY.onboardBody2 + ' ' + COPY.onboardBody2Try },
    { key: '?', keycap: '?', title: () => COPY.onboardTitle3, body: () => COPY.onboardBody3 },
  ];
  function markOnboarded() {
    try { localStorage.setItem('study.onboarded', '1'); } catch (error) { /* storage unavailable */ }
  }
  function openOnboarding() {
    state.onboarding = { step: 1 };
    renderOnboarding();
  }
  function renderOnboarding() {
    const onboarding = state.onboarding;
    if (onboarding === null) return;
    const card = ONBOARD_CARDS[onboarding.step - 1];
    const dialog = openLayerDialog(card.title(), 'onboard-title');
    dialog.id = 'onboard-dialog';
    const step = node('div', 'onboard-step', 'Lesson ' + onboarding.step + ' of 3');
    dialog.insertBefore(step, dialog.firstChild);
    const keyRow = node('div', 'onboard-key');
    keyRow.appendChild(node('span', 'kbd', card.keycap));
    keyRow.appendChild(node('span', 'layer-prompt', card.body()));
    dialog.appendChild(keyRow);
    if (onboarding.step === 1) {
      // The effect-timing contract, once in the tour (§3.9).
      dialog.appendChild(node('p', 'layer-note', COPY.contract));
    }
    const foot = node('div', 'onboard-foot');
    foot.appendChild(node('span', '', COPY.onboardFoot));
    const skip = node('button', 'btn-quiet', COPY.onboardSkip);
    skip.type = 'button';
    skip.id = 'onboard-skip';
    skip.addEventListener('click', () => { finishOnboarding(); });
    foot.appendChild(skip);
    dialog.appendChild(foot);
    skip.focus();
  }
  function finishOnboarding() {
    markOnboarded();
    state.onboarding = null;
    clear(document.getElementById('dialog-slot'));
    const input = document.getElementById('search-input');
    if (state.search.status === 'results') focusCurrentStop();
    else if (input !== null) input.focus();
    renderAll({});
  }
  function onboardingKey(event) {
    const onboarding = state.onboarding;
    const card = ONBOARD_CARDS[onboarding.step - 1];
    if (event.key === 'Tab') { trapTab(event); return; }
    if (event.key.toLowerCase() === card.key || event.key === card.key) {
      event.preventDefault();
      if (onboarding.step === 3) { finishOnboarding(); return; }
      onboarding.step += 1;
      renderOnboarding();
      return;
    }
    // Any other single character is inert inside the tour — the lesson's
    // key is the only key that advances (E on card 1 must not).
    if (event.key.length === 1) event.preventDefault();
  }

  // §sheet — the `?` shortcut sheet (§3.12/D33): the four groups, "Esc to
  // close", and the persisted single-key shortcuts toggle (WCAG 2.1.4).
  const SHEET_GROUPS = [
    { title: 'Move', rows: [
      ['J / K', 'Move through the results'],
      ['↓ / ↑', 'Move through the results'],
      ['← / →', 'Change the Essential top-N'],
      ['Space', 'Select the focused row for bulk marking'],
    ] },
    { title: 'Judge', rows: [
      ['E', 'Essential at the current top-N'],
      ['H', 'Helpful'],
      ['X', 'Not relevant'],
      ['M', 'Missing passage'],
      ['U', 'Reopen a call — the earlier call stands until a new one'],
      ['E', 'On a lower result: “Should be near the top”'],
    ] },
    { title: 'Compare', rows: [
      ['A', 'A wins'],
      ['B', 'B wins'],
      ['T', 'Tie'],
      ['W', 'Both wrong'],
    ] },
    { title: 'Everywhere', rows: [
      ['⌘K', 'Look something up'],
      ['?', 'This sheet'],
      ['Enter', 'Submit / activate'],
      ['Esc', 'Close the open layer'],
    ] },
  ];
  function shortcutsPersist(on) {
    state.shortcutsOn = on;
    try { localStorage.setItem('study.shortcuts', on ? '1' : '0'); } catch (error) { /* storage unavailable */ }
  }
  function openSheet(opener) {
    if (state.sheet !== null) { closeSheet(); return; }
    state.sheet = { opener: opener || document.activeElement };
    renderAll({});
    renderSheet();
  }
  function closeSheet() {
    const sheet = state.sheet;
    state.sheet = null;
    closeLayerDialog(sheet !== null ? sheet.opener : null);
    renderAll({});
  }
  function renderSheet() {
    if (state.sheet === null) return;
    const dialog = openLayerDialog(COPY.sheetTitle, 'sheet-title-h');
    dialog.id = 'sheet-dialog';
    const groups = node('div', 'sheet-groups');
    for (const group of SHEET_GROUPS) {
      const box = node('div', 'sheet-group');
      box.appendChild(node('h3', '', group.title));
      for (const [keycap, text] of group.rows) {
        const row = node('div', 'sheet-row');
        row.appendChild(node('span', 'kbd', keycap));
        row.appendChild(node('span', '', text));
        box.appendChild(row);
      }
      groups.appendChild(box);
    }
    dialog.appendChild(groups);
    const toggleRow = node('div', 'sheet-toggle');
    const toggleLabel = node('span', '', COPY.sheetToggleLabel);
    toggleLabel.id = 'sheet-toggle-label';
    toggleRow.appendChild(toggleLabel);
    const toggle = node('button', 'btn-quiet', state.shortcutsOn ? 'On' : 'Off');
    toggle.type = 'button';
    toggle.id = 'shortcuts-toggle';
    toggle.setAttribute('role', 'switch');
    toggle.setAttribute('aria-checked', state.shortcutsOn ? 'true' : 'false');
    toggle.setAttribute('aria-labelledby', 'sheet-toggle-label');
    toggle.addEventListener('click', () => {
      shortcutsPersist(!state.shortcutsOn);
      toggle.textContent = state.shortcutsOn ? 'On' : 'Off';
      toggle.setAttribute('aria-checked', state.shortcutsOn ? 'true' : 'false');
    });
    toggleRow.appendChild(toggle);
    dialog.appendChild(toggleRow);
    dialog.appendChild(node('div', 'sheet-esc', COPY.sheetEsc));
    toggle.focus();
  }

  // §keys — one handler, layers first.
  function isTypingTarget(target) {
    if (!(target instanceof HTMLElement)) return false;
    const tag = target.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || target.isContentEditable;
  }
  document.addEventListener('keydown', (event) => {
    // The onboarding tour is fully modal: only the lesson's key advances,
    // Tab traps, Skip works by mouse (§3.9).
    if (state.onboarding !== null) { onboardingKey(event); return; }
    // ⌘K works everywhere, inputs included.
    if ((event.metaKey || event.ctrlKey) && (event.key === 'k' || event.key === 'K')) {
      event.preventDefault();
      openLookup(document.activeElement);
      return;
    }
    if (state.lookup !== null) {
      if (event.key === 'Escape') { event.preventDefault(); closeLookup(); return; }
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        const lookup = state.lookup;
        if (lookup.results.length > 0) {
          lookup.sel = Math.max(0, Math.min(lookup.results.length - 1, lookup.sel + (event.key === 'ArrowDown' ? 1 : -1)));
          renderLookupResults();
        }
        return;
      }
      if (event.key === 'Enter') { event.preventDefault(); lookupSelect(); return; }
      if (event.key === 'Tab') {
        // Focus trap: the input and the rows cycle within the dialog.
        const dialog = document.querySelector('.lookup-dialog');
        if (dialog !== null) {
          const focusables = dialog.querySelectorAll('input, button');
          if (focusables.length > 0) {
            const first = focusables[0];
            const last = focusables[focusables.length - 1];
            if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
            else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
          }
        }
      }
      return;
    }
    // Layered Esc order (§3.12): interview → missing form / rescue preview
    // (one shared slot) → lookup (handled above) → bulk selection.
    if (state.interview !== null) {
      // The interview is modal: Escape closes it without committing, from
      // any focus position; J/K/arrow navigation is inert (§3.13.1–2).
      if (event.key === 'Escape') { event.preventDefault(); closeInterview(); return; }
      if (event.key === 'Tab') { trapTab(event); }
      return;
    }
    if (state.rescue !== null) {
      if (event.key === 'Escape') { event.preventDefault(); closeRescue({}); return; }
      if (event.key === 'Tab') { trapTab(event); }
      return;
    }
    if (state.missingForm !== null) {
      if (event.key === 'Escape') { event.preventDefault(); closeMissingForm(); return; }
      if (event.key === 'Tab') { trapTab(event); return; }
      if (event.key === 'Enter' && event.target instanceof HTMLElement && event.target.id === 'missing-ref-input') {
        // Enter activates Submit only when Submit is enabled; while it is
        // disabled, Enter is a no-op — never a native form submit (§3.3).
        event.preventDefault();
        if (missingSubmitEnabled()) void submitMissingForm();
        return;
      }
      return;
    }
    // The Compare confirm rides the same §3.12 Esc slot as the rescue
    // preview and missing form (at most one of the three is ever open).
    if (state.compareConfirm !== null) {
      if (event.key === 'Escape') { event.preventDefault(); closeCompareConfirm(); return; }
      if (event.key === 'Tab') { trapTab(event); }
      return;
    }
    // The train's one-confirm layer (§4.5/§4.6) rides the same slot: Esc
    // closes without committing; the seal and approve acts are
    // mouse-or-focused-button only — no bare keystroke commits (§4.7).
    if (state.updates.train.confirm !== null) {
      if (event.key === 'Escape') { event.preventDefault(); closeTrainConfirm(); return; }
      if (event.key === 'Tab') { trapTab(event); }
      return;
    }
    // The `?` sheet rides the Esc slot after the lookup, before bulk (§3.12).
    if (state.sheet !== null) {
      if (event.key === 'Escape') { event.preventDefault(); closeSheet(); return; }
      if (event.key === 'Tab') { trapTab(event); }
      return;
    }
    if (event.key === 'Escape' && selectedCount() > 0) {
      event.preventDefault();
      state.selected = Object.create(null);
      renderAll({});
      return;
    }
    // Typing in an input suppresses single-letter shortcuts.
    if (isTypingTarget(event.target)) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    // The single-key toggle (§3.12, WCAG 2.1.4): Off disables every
    // single-letter shortcut (J/K/E/H/X/M/U/A/B/T/W/?); Esc, Enter, Tab,
    // arrows, and ⌘K remain, and every action keeps its visible button.
    const letters = state.shortcutsOn;
    if (letters && event.key === '?') {
      event.preventDefault();
      openSheet(null);
      return;
    }
    // A/B/T/W open the §3.5 one-confirm layer on Compare — the key alone
    // never commits; other single letters are inert off the Review screen.
    if (state.screen === 'compare') {
      if (!letters) return;
      const choice = CHOICE_BY_KEY[event.key.toLowerCase()];
      if (choice !== undefined) {
        event.preventDefault();
        openCompareConfirm(choice, null);
      }
      return;
    }
    // The Updates card list (§4.7): J/K and arrows rove; A/D/N decide the
    // focused card (reversible until seal, so bare keystrokes are legal); U
    // re-opens the last decided card's buttons. Typing targets returned
    // above, so the decline why-input keeps its letters.
    if (state.screen === 'updates') {
      if ((letters && (event.key === 'j' || event.key === 'J')) || event.key === 'ArrowDown') {
        event.preventDefault();
        moveUpdatesFocus(1);
        return;
      }
      if ((letters && (event.key === 'k' || event.key === 'K')) || event.key === 'ArrowUp') {
        event.preventDefault();
        moveUpdatesFocus(-1);
        return;
      }
      if (!letters) return;
      const updatesKey = event.key.toLowerCase();
      if (updatesKey === 'u') {
        event.preventDefault();
        reopenLastDecided();
        return;
      }
      if (updatesKey !== 'a' && updatesKey !== 'd' && updatesKey !== 'n') return;
      const focusedCard = focusedUpdatesCard();
      if (focusedCard === null) return;
      event.preventDefault();
      updatesKeyAction(focusedCard, updatesKey);
      return;
    }
    if (state.screen !== 'review') return;
    if ((letters && (event.key === 'j' || event.key === 'J')) || event.key === 'ArrowDown') {
      event.preventDefault();
      moveFocus(1);
      return;
    }
    if ((letters && (event.key === 'k' || event.key === 'K')) || event.key === 'ArrowUp') {
      event.preventDefault();
      moveFocus(-1);
      return;
    }
    const inResults = state.search.status === 'results';
    const onTailRow = inResults && state.focus > topCount();
    const onDivider = inResults && state.search.results.length > TOP_WINDOW && state.focus === topCount();
    if (event.key === 'Enter') {
      // Enter does nothing on a tail row (§3.12): the verse already reads in
      // the rail, and Enter must never double as an uncorrectable commit.
      if (document.activeElement !== null && document.activeElement.classList &&
        document.activeElement.classList.contains('tail-row')) {
        event.preventDefault();
      }
      return;
    }
    if (event.key === ' ') {
      const active = document.activeElement;
      if (active !== null && active.id === 'tail-divider') return; // native expand
      if (active !== null && active.classList && active.classList.contains('result-card')) {
        event.preventDefault();
        const index = Number(active.dataset.stop);
        const result = state.search.results[index];
        if (result !== undefined) toggleSelected(result.targetId);
        return;
      }
      if (active !== null && active.classList && active.classList.contains('tail-row')) {
        event.preventDefault();
      }
      return;
    }
    if (!letters) return;
    const key = event.key.toLowerCase();
    if (key === 'e') {
      event.preventDefault();
      if (onTailRow) { openRescuePreview(state.focus); return; }
      if (onDivider) return;
      if (inResults) void verdictAction('essential');
      return;
    }
    if (key === 'h' || key === 'x') {
      event.preventDefault();
      if (onTailRow) { showToast(COPY.tailHint); return; }
      if (onDivider) return;
      if (inResults) void verdictAction(key === 'h' ? 'helpful' : 'irrelevant');
      return;
    }
    if (key === 'm') {
      event.preventDefault();
      if (onTailRow) { showToast(COPY.tailHint); return; }
      if (onDivider) return;
      handleMissingKey(null);
      return;
    }
    if (key === 'u') {
      event.preventDefault();
      handleUndoKey();
      return;
    }
  });

  // §boot
  document.getElementById('theme-cycle').addEventListener('click', cycleTheme);
  document.getElementById('lookup-open').addEventListener('click', (event) => { openLookup(event.currentTarget); });
  document.querySelectorAll('[data-nav]').forEach((item) => {
    item.addEventListener('click', () => { setScreen(item.dataset.nav); });
  });
  document.getElementById('search-form').addEventListener('submit', (event) => {
    event.preventDefault();
    void submitSearch(document.getElementById('search-input').value);
  });

  try {
    const stored = localStorage.getItem('study.theme');
    if (stored === 'light' || stored === 'dark' || stored === 'auto') state.themeMode = stored;
  } catch (error) { /* storage unavailable */ }
  try {
    const storedTop = Number(localStorage.getItem('study.withinTop'));
    if (storedTop === 1 || storedTop === 3 || storedTop === 5 || storedTop === 10) state.withinTop = storedTop;
  } catch (error) { /* storage unavailable */ }
  try {
    // §3.12 single-key toggle, persisted; default On.
    if (localStorage.getItem('study.shortcuts') === '0') state.shortcutsOn = false;
  } catch (error) { /* storage unavailable */ }
  applyTheme();
  // Health refetches on window focus (§3.11) so read-only recovery re-enables.
  window.addEventListener('focus', () => { refetchHealth(); });
  try {
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if (state.themeMode === 'auto') applyTheme(); };
    if (typeof media.addEventListener === 'function') media.addEventListener('change', onChange);
    else if (typeof media.addListener === 'function') media.addListener(onChange);
  } catch (error) { /* matchMedia unavailable */ }

  // lastQuery pre-fills the search input's VALUE on the no-open-case boot;
  // it never auto-submits and never fetches.
  const uiState = readUiState();
  if (typeof uiState.lastQuery === 'string' && uiState.lastQuery !== '') {
    document.getElementById('search-input').value = uiState.lastQuery;
  }

  renderAll({});

  // §3.9 onboarding: three keypress lessons on first visit.
  let onboarded = true;
  try { onboarded = localStorage.getItem('study.onboarded') === '1'; } catch (error) { /* storage unavailable */ }
  if (!onboarded) openOnboarding();

  let bootToastShown = false;
  const bootFailed = () => {
    if (bootToastShown) return;
    bootToastShown = true;
    showToast(COPY.bootFetchFailed);
  };
  apiHealth().then((health) => { state.health = health; renderBanner(); }).catch(bootFailed);
  apiMeta().then((meta) => {
    state.meta = meta;
    // §2.3/D38 build-change notice: compare the identity trio to the stored
    // lastSeenMeta. The new trio is stored ONLY when the notice is dismissed
    // (storing on boot would silently eat it for a reload-without-dismiss);
    // a first-ever visit has nothing to compare and stores it directly.
    const trio = {
      engineVersion: meta.engineVersion,
      corpusFingerprint: meta.corpusFingerprint,
      layerFingerprint: meta.layerFingerprint,
    };
    const seen = readUiState().lastSeenMeta;
    if (typeof seen !== 'object' || seen === null) {
      writeUiState({ lastSeenMeta: trio });
    } else if (seen.engineVersion !== trio.engineVersion) {
      // The version-change branch — the only place a version string renders.
      state.updateNotice = { branch: 'version', from: seen.engineVersion, to: trio.engineVersion };
      renderCenter();
    } else if (seen.corpusFingerprint !== trio.corpusFingerprint
      || seen.layerFingerprint !== trio.layerFingerprint) {
      // The common case — a curation update: no codes ever render here.
      state.updateNotice = { branch: 'data' };
      renderCenter();
    }
  }).catch(bootFailed);
  apiConcepts().then((concepts) => { state.concepts = Array.isArray(concepts) ? concepts : []; }).catch(bootFailed);
  apiCases().then((data) => {
    state.cases = data && Array.isArray(data.cases) ? data.cases : [];
    renderQueue();
    // §3.1 open-case boot: the first open case (most recently touched — the
    // client sort, never the server's caseId order) loads exactly as if its
    // queue row were clicked; with none, no request until the first submit.
    const open = openCases();
    if (open.length > 0 && state.search.status === 'idle' && state.lookup === null) {
      // Reserve the boot case's §4.3 counts-row pair for the open-case flow
      // itself — one fetch pair per open case, never a duplicate.
      state.countsPending[open[0].caseId] = true;
      document.getElementById('search-input').value = open[0].query;
      void submitSearch(open[0].query);
    }
    ensureCaseCounts();
    // The D38 notice's re-search links come from this boot list.
    if (state.updateNotice !== null) renderCenter();
  }).catch(bootFailed);
  // "Worth a look next" (§3.4): inbox suggestions load once at boot; a
  // failure shows the §3.11 fallback sentence inline in that rail section.
  apiInbox().then((data) => {
    state.inbox = { status: 'done', items: data !== null && Array.isArray(data.items) ? data.items : [] };
    if (state.screen === 'review') renderQueue();
  }).catch(() => {
    state.inbox = { status: 'failed', items: [] };
    if (state.screen === 'review') renderQueue();
  });
})();
</script>
</body>
</html>
