<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="workbench-static-protocol" content="1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Workbench</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f1f4f3;
    --panel: #f8faf9;
    --card: #ffffff;
    --line: #d4dad7;
    --line-strong: #adb8b3;
    --text: #1b1d1f;
    --muted: #61686f;
    --accent: #285a55;
    --accent-soft: #dbe9e7;
    --warn: #8a5612;
    --warn-soft: #f7ecd9;
    --danger: #8a3030;
    --danger-soft: #f6e2e0;
    --ok: #1f5a3c;
    --ok-soft: #e2f0e8;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    --radius: 8px;
    --focus: 0 0 0 3px rgba(40, 90, 85, 0.22);
    --sidebar-width: 20rem;
  }

  * {
    box-sizing: border-box;
  }

  html {
    font-family: Inter, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    line-height: 1.45;
    background: var(--bg);
    color: var(--text);
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
    color: inherit;
  }

  button,
  input,
  select,
  textarea,
  summary {
    border-radius: 8px;
  }

  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  summary:focus-visible,
  [role="tab"]:focus-visible {
    outline: none;
    box-shadow: var(--focus);
  }

  a {
    color: inherit;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .app {
    width: min(100%, 88rem);
    margin: 0 auto;
    padding: 1rem;
  }

  .shell {
    display: grid;
    gap: 1rem;
    min-width: 0;
  }

  .topbar,
  .panel,
  .sidebar-card,
  .tab-strip {
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }

  .topbar {
    border-radius: 8px;
    padding: 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: space-between;
    align-items: start;
  }

  .eyebrow {
    margin: 0 0 0.2rem;
    color: var(--muted);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  h1 {
    margin: 0;
    font-size: 1.65rem;
    line-height: 1.15;
  }

  .subhead {
    margin: 0.4rem 0 0;
    color: var(--muted);
    max-width: 48rem;
  }

  .topbar-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: center;
    justify-content: flex-end;
  }

  .tab-strip {
    border-radius: 8px;
    padding: 0.5rem;
  }

  .tab-list {
    display: flex;
    gap: 0.45rem;
    flex-wrap: wrap;
  }

  .tab {
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    padding: 0.65rem 0.9rem;
    min-height: 2.6rem;
    cursor: pointer;
    text-align: left;
  }

  .tab[aria-selected="true"] {
    background: var(--card);
    border-color: var(--line);
    color: var(--text);
    box-shadow: var(--shadow);
  }

  .layout {
    display: grid;
    gap: 1rem;
    align-items: start;
    min-width: 0;
  }

  .sidebar {
    display: grid;
    gap: 1rem;
    min-width: 0;
  }

  .sidebar-card,
  .panel {
    border-radius: 8px;
  }

  .sidebar-card {
    padding: 1rem;
  }

  .panel {
    padding: 1rem;
    min-width: 0;
  }

  .section-head {
    display: flex;
    justify-content: space-between;
    gap: 0.75rem;
    align-items: start;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }

  .section-head h2,
  .sidebar-card h2,
  .sidebar-card h3,
  .panel h3 {
    margin: 0;
    font-size: 1rem;
    line-height: 1.25;
  }

  .muted {
    color: var(--muted);
  }

  .tiny {
    font-size: 0.82rem;
  }

  .stack {
    display: grid;
    gap: 0.75rem;
    min-width: 0;
  }

  #view-root,
  #view-root > *,
  .change-card > *,
  .operations-band > * {
    min-width: 0;
    max-width: 100%;
  }

  .row {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .field {
    display: grid;
    gap: 0.35rem;
    min-width: 0;
  }

  .field label,
  .field legend {
    font-size: 0.9rem;
    font-weight: 600;
  }

  fieldset.fieldset {
    border: 1px solid var(--line);
    padding: 0.75rem;
    margin: 0;
    min-width: 0;
    background: var(--card);
  }

  .field input,
  .field select,
  .field textarea,
  .search-input {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--card);
    padding: 0.7rem 0.8rem;
    min-height: 2.75rem;
    min-width: 0;
  }

  .field textarea {
    resize: vertical;
    min-height: 5rem;
  }

  .btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    padding: 0.65rem 0.85rem;
    min-height: 2.7rem;
    cursor: pointer;
    max-width: 100%;
    overflow-wrap: anywhere;
  }

  .btn:hover {
    border-color: var(--line-strong);
  }

  .btn:disabled {
    opacity: 0.55;
    cursor: default;
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }

  .btn-subtle {
    background: transparent;
  }

  .btn-danger {
    background: var(--danger-soft);
    border-color: #e5c0bb;
    color: var(--danger);
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.3rem 0.55rem;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    font-size: 0.8rem;
    max-width: 100%;
    word-break: break-word;
  }

  .pill-good {
    background: var(--ok-soft);
    border-color: #bcd7c6;
    color: var(--ok);
  }

  .pill-warn {
    background: var(--warn-soft);
    border-color: #ead7ba;
    color: var(--warn);
  }

  .pill-danger {
    background: var(--danger-soft);
    border-color: #e5c0bb;
    color: var(--danger);
  }

  .message {
    border-radius: var(--radius);
    border: 1px solid var(--line);
    padding: 0.75rem 0.85rem;
    background: var(--card);
    color: var(--muted);
    min-width: 0;
    overflow-wrap: anywhere;
  }

  .message.warn {
    background: var(--warn-soft);
    color: var(--warn);
    border-color: #ead7ba;
  }

  .message.error {
    background: var(--danger-soft);
    color: var(--danger);
    border-color: #e5c0bb;
  }

  .message.success {
    background: var(--ok-soft);
    color: var(--ok);
    border-color: #bcd7c6;
  }

  .metric-grid,
  .case-grid {
    display: grid;
    gap: 0.75rem;
  }

  .filter-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
    gap: 0.65rem;
    align-items: end;
  }

  .metric-card,
  .case-card,
  .result-card,
  .history-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.9rem;
    min-width: 0;
  }

  .metric-value {
    font-size: 1.45rem;
    font-weight: 700;
    line-height: 1.1;
    margin: 0.15rem 0 0;
  }

  .case-list {
    display: grid;
    gap: 0.65rem;
    max-height: 48rem;
    overflow: auto;
    padding-right: 0.1rem;
  }

  .case-button {
    width: 100%;
    text-align: left;
    border: 1px solid var(--line);
    background: var(--card);
    padding: 0.8rem;
    border-radius: 8px;
    cursor: pointer;
    display: grid;
    gap: 0.45rem;
  }

  .case-button.current {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }

  .case-button .case-query,
  .result-reference {
    font-weight: 600;
  }

  .case-meta,
  .result-meta,
  .history-meta,
  .mono-wrap {
    color: var(--muted);
    font-size: 0.85rem;
    word-break: break-word;
  }

  .mono-wrap {
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  }

  .signal-list,
  .history-list,
  .result-list {
    display: grid;
    gap: 0.75rem;
  }

  .signal-item {
    border-left: 4px solid var(--line);
    padding: 0.1rem 0 0.1rem 0.8rem;
  }

  .signal-item.warn {
    border-left-color: var(--warn);
  }

  .signal-item.error {
    border-left-color: var(--danger);
  }

  .review-header {
    display: grid;
    gap: 0.75rem;
  }

  .review-summary {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .action-row,
  .segment {
    display: flex;
    gap: 0.45rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .segment {
    padding: 0.25rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
  }

  .segment button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    min-width: 2.25rem;
    min-height: 2.25rem;
    padding: 0 0.7rem;
    cursor: pointer;
  }

  .segment button[aria-pressed="true"] {
    background: var(--card);
    color: var(--text);
    box-shadow: var(--shadow);
  }

  .result-card {
    display: grid;
    gap: 0.75rem;
  }

  .result-top {
    display: grid;
    gap: 0.4rem;
  }

  .result-title-row {
    display: flex;
    gap: 0.55rem;
    align-items: baseline;
    flex-wrap: wrap;
  }

  .rank {
    display: inline-flex;
    min-width: 2rem;
    justify-content: center;
    padding: 0.2rem 0.45rem;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 700;
  }

  .excerpt,
  .context-text {
    margin: 0;
    color: var(--text);
    overflow-wrap: anywhere;
  }

  .reason-list {
    display: flex;
    gap: 0.45rem;
    flex-wrap: wrap;
  }

  .reason-chip {
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 0.28rem 0.55rem;
    font-size: 0.78rem;
    max-width: 100%;
    word-break: break-word;
  }

  details.disclosure {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    padding: 0.15rem 0.7rem 0.7rem;
    min-width: 0;
    max-width: 100%;
    box-sizing: border-box;
  }

  details.disclosure > summary {
    cursor: pointer;
    padding: 0.6rem 0;
    font-weight: 600;
  }

  .disclosure-body {
    display: grid;
    gap: 0.75rem;
    min-width: 0;
    max-width: 100%;
  }

  .context-block {
    display: grid;
    gap: 0.45rem;
  }

  .verse-line {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.55rem;
    align-items: start;
    padding: 0.3rem 0;
    border-top: 1px solid rgba(0, 0, 0, 0.04);
  }

  .verse-line:first-child {
    border-top: none;
  }

  .verse-ref {
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 600;
  }

  .inline-status {
    font-size: 0.84rem;
    color: var(--muted);
  }

  .compare-bar {
    display: grid;
    gap: 0.75rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--accent-soft);
    padding: 0.9rem;
  }

  .split {
    display: grid;
    gap: 0.75rem;
  }

  .history-list {
    align-items: start;
  }

  .history-card.active {
    border-color: #bcd7c6;
    background: #fbfefc;
  }

  .history-card.superseded {
    opacity: 0.85;
  }

  .empty {
    padding: 1.1rem 0;
    color: var(--muted);
  }

  .change-list,
  .check-list,
  .checklist {
    display: grid;
    gap: 0.75rem;
    min-width: 0;
  }

  .change-card,
  .check-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.9rem;
    min-width: 0;
    display: grid;
    gap: 0.7rem;
  }

  .change-card h3,
  .check-card h3 {
    overflow-wrap: anywhere;
  }

  .change-summary {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }

  .file-preview {
    margin: 0;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    box-sizing: border-box;
    max-height: 22rem;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #f4f7f6;
    padding: 0.75rem;
    font: 0.8rem/1.45 ui-monospace, "SFMono-Regular", Consolas, monospace;
    white-space: pre;
  }

  .confirm-row {
    display: grid;
    gap: 0.65rem;
    align-items: end;
    min-width: 0;
  }

  .check-actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.55rem;
  }

  .check-actions .btn {
    width: 100%;
  }

  .job-output {
    margin: 0;
    min-height: 8rem;
    max-height: 28rem;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #1f2524;
    color: #edf4f1;
    padding: 0.75rem;
    font: 0.8rem/1.45 ui-monospace, "SFMono-Regular", Consolas, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .comparison-toolbar,
  .comparison-progress,
  .blind-actions,
  .gate-summary {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.55rem;
  }

  .comparison-picker { min-width: min(100%, 18rem); }

  .query-rail {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
    gap: 0.45rem;
  }

  .query-step {
    min-height: 3.25rem;
    text-align: left;
    border-left: 3px solid transparent;
  }

  .query-step[aria-current="step"] {
    border-left-color: var(--accent);
    background: var(--accent-soft);
  }

  .blind-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 0.8rem;
    align-items: start;
  }

  .blind-side {
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: var(--card);
  }

  .blind-side-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 0.85rem;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }

  .side-letter {
    display: grid;
    place-items: center;
    width: 2rem;
    height: 2rem;
    border-radius: 4px;
    color: #fff;
    background: var(--text);
    font-weight: 800;
  }

  .blind-results { display: grid; }

  .blind-result {
    width: 100%;
    min-height: 4.25rem;
    display: grid;
    grid-template-columns: 2rem minmax(0, 1fr) auto;
    gap: 0.65rem;
    align-items: center;
    padding: 0.7rem 0.8rem;
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    background: transparent;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }

  .blind-result:last-child { border-bottom: 0; }
  .blind-result:hover { background: var(--panel); }
  .blind-result[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); }
  .blind-result:focus-visible { position: relative; z-index: 1; }

  .rank-box,
  .score-box { font: 700 0.78rem/1 ui-monospace, "SFMono-Regular", Consolas, monospace; }
  .rank-box { color: var(--muted); }
  .result-reference { font-weight: 750; overflow-wrap: anywhere; }

  .passage-detail {
    min-height: 8rem;
    padding: 0.8rem;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }

  .reason-row { padding: 0.55rem 0; border-top: 1px solid var(--line); }
  .reason-row:first-of-type { border-top: 0; }

  .movement-grid,
  .gate-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.7rem;
  }

  .movement-cell,
  .gate-group {
    padding: 0.75rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--card);
  }

  .gate-group h4 { margin-bottom: 0.45rem; }
  .gate-list { display: grid; gap: 0.45rem; margin: 0; padding: 0; list-style: none; }
  .gate-finding { font-size: 0.84rem; line-height: 1.4; }

  .judgment-bar {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0.5rem;
  }

  .judgment-bar .btn { min-height: 2.75rem; }

  .reveal-panel {
    min-width: 0;
    max-width: 100%;
    padding: 0.9rem;
    border-left: 3px solid var(--ok);
    background: var(--ok-soft);
  }

  .reveal-panel details,
  .reveal-panel .file-preview {
    min-width: 0;
    max-width: 100%;
  }

  .reveal-panel details { overflow: hidden; }

  .missing-form {
    display: grid;
    grid-template-columns: minmax(10rem, 0.7fr) minmax(12rem, 1fr) auto;
    gap: 0.55rem;
    align-items: end;
  }

  .operations-toolbar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
    gap: 0.65rem;
    align-items: end;
  }

  .operations-band {
    display: grid;
    gap: 0.75rem;
    padding: 0.8rem 0;
    border-top: 1px solid var(--line);
  }

  .operations-band:first-of-type { border-top: 0; }

  .data-table-wrap {
    max-width: 100%;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--card);
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.84rem;
  }

  .data-table th,
  .data-table td {
    padding: 0.58rem 0.65rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
    min-width: 0;
    overflow-wrap: anywhere;
    overflow-wrap: anywhere;
  }

  .data-table th {
    color: var(--muted);
    background: var(--panel);
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .data-table tr:last-child td { border-bottom: 0; }
  .data-table .numeric { text-align: right; font-variant-numeric: tabular-nums; }

  .partition-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.9rem;
    align-items: start;
  }

  .partition-section { min-width: 0; }
  .partition-section > h3 { margin-bottom: 0.55rem; }

  .progress-track {
    width: 100%;
    height: 0.45rem;
    overflow: hidden;
    border-radius: 4px;
    background: var(--line);
  }

  .progress-fill { height: 100%; background: var(--accent); }

  .privacy-note {
    border-left: 3px solid var(--warn);
    padding: 0.7rem 0.8rem;
    background: var(--warn-soft);
  }

  .layout.operations-layout { grid-template-columns: minmax(0, 1fr); }
  .layout.operations-layout .sidebar { display: none; }

  @media (min-width: 760px) {
    .metric-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .case-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .split {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .confirm-row {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .check-actions {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
  }

  @media (min-width: 980px) {
    .layout {
      grid-template-columns: minmax(17rem, var(--sidebar-width)) minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 1rem;
    }
  }

  @media (max-width: 759px) {
    .app {
      padding: 0.75rem;
    }

    .topbar,
    .panel,
    .sidebar-card,
    .tab-strip {
      padding-left: 0.85rem;
      padding-right: 0.85rem;
    }

    .case-list {
      max-height: none;
    }

    .blind-grid,
    .movement-grid,
    .gate-grid,
    .judgment-bar,
    .missing-form,
    .partition-grid {
      grid-template-columns: minmax(0, 1fr);
    }

    .comparison-toolbar { align-items: stretch; }
    .comparison-toolbar > * { width: 100%; }

    .data-table thead { display: none; }
    .data-table,
    .data-table tbody,
    .data-table tr,
    .data-table td { display: block; width: 100%; }
    .data-table tr { padding: 0.35rem 0; border-bottom: 1px solid var(--line); }
    .data-table tr:last-child { border-bottom: 0; }
    .data-table td,
    .data-table td.numeric {
      display: grid;
      grid-template-columns: minmax(5.5rem, 0.42fr) minmax(0, 1fr);
      gap: 0.6rem;
      text-align: left;
      border: 0;
      padding: 0.35rem 0.65rem;
    }
    .data-table td::before {
      content: attr(data-label);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
  }
</style>
</head>
<body>
<div class="app">
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Scripture Search Engine</p>
        <h1>Workbench</h1>
        <p id="header-summary" class="subhead">Operational review for search quality, case flow, and release health.</p>
      </div>
      <div class="topbar-actions">
        <button id="refresh-all" class="btn" type="button">Refresh</button>
        <div id="global-status-pill" class="pill">Loading</div>
      </div>
    </header>

    <nav class="tab-strip" aria-label="Workbench views">
      <div id="tab-list" class="tab-list" role="tablist" aria-label="Workbench views"></div>
    </nav>

    <div class="layout">
      <aside class="sidebar">
        <section class="sidebar-card stack" aria-labelledby="create-case-heading">
          <div class="section-head">
            <div>
              <h2 id="create-case-heading">New review case</h2>
              <div class="tiny muted">Open a fresh search snapshot for human review.</div>
            </div>
          </div>
          <form id="create-case-form" class="stack">
            <div class="field">
              <label for="new-case-query">Query</label>
              <input id="new-case-query" name="query" type="text" autocomplete="off" placeholder="for example, faith and works">
            </div>
            <div class="field">
              <label for="new-case-source">Source</label>
              <select id="new-case-source" name="source"></select>
            </div>
            <div class="row">
              <button id="create-case-submit" class="btn btn-primary" type="submit">Create case</button>
            </div>
          </form>
          <div id="create-case-message" class="message" role="status" aria-live="polite">Ready.</div>
        </section>

        <section class="sidebar-card stack" aria-labelledby="cases-heading">
          <div class="section-head">
            <div>
              <h2 id="cases-heading">Cases</h2>
              <div id="case-count" class="tiny muted">Loading cases</div>
            </div>
            <button id="reload-cases" class="btn btn-subtle" type="button">Reload</button>
          </div>
          <div id="case-list" class="case-list" aria-live="polite"></div>
        </section>
      </aside>

      <main id="main-panel" class="panel" tabindex="-1">
        <div id="global-message" class="message" role="status" aria-live="polite">Loading workbench data.</div>
        <div id="view-root"></div>
      </main>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'workbench-ui-state-v3';
  // §routes — the single-inline snapshot contract (staticSnapshot.ts
  // REQUIRED_INLINE_ROUTES) requires these literals in every inline page.
  // This console reaches most of them through its own call sites; the
  // Study-only updates routes ride this mirror so the page keeps resolving.
  const REQUIRED_ROUTE_LITERALS = Object.freeze([
    '/api/v2/updates',
    '/api/v2/updates/cards/',
    '/decide',
    '/api/v2/updates/train',
  ]);
  void REQUIRED_ROUTE_LITERALS;
  const STUDIO_ROUTES = Object.freeze([
    '/api/v2/sessions',
    '/api/v2/quality',
    '/api/v2/audits/preview',
    '/api/v2/audits/apply',
    '/api/v2/audits/close',
    '/api/v2/admissions',
    '/api/v2/publish',
    '/complete-item',
    '/skip-item',
    '/complete-session',
  ]);
  const TABS = [
    { id: 'health', label: 'Health' },
    { id: 'inbox', label: 'Inbox' },
    { id: 'review', label: 'Review' },
    { id: 'history', label: 'History' },
    { id: 'compare', label: 'Candidate' },
    { id: 'admission', label: 'Admission' },
    { id: 'changes', label: 'Changes' },
    { id: 'publish', label: 'Publish' },
    { id: 'sessions', label: 'Sessions' },
    { id: 'quality', label: 'Quality' },
    { id: 'audits', label: 'Audits' },
  ];
  const CASE_SOURCES = [
    'manual',
    'gauntlet',
    'coverage',
    'stale-judgment',
    'telemetry',
    'calibration',
    'regression',
  ];
  const STATE_ORDER = {
    reviewing: 0,
    new: 1,
    judged: 2,
    proposed: 3,
    'candidate-ready': 4,
    admitted: 5,
    'pr-prepared': 6,
    merged: 7,
    monitored: 8,
    rejected: 9,
    'needs-engineering': 10,
  };
  const WINDOW_VALUES = [1, 3, 5, 10];
  const ACTION_LABELS = {
    essential: 'Essential',
    helpful: 'Helpful',
    irrelevant: 'Not relevant',
    missing: 'Missing passage',
    prefer: 'Prefer A',
  };
  const DIAGNOSIS_LABELS = {
    'lexical-noise': 'Matched words, not meaning',
    'wrong-anchor': 'Theme anchor is attached to the wrong passage',
    'concept-misfire': 'Theme trigger is too broad for this query',
  };

  const state = {
    view: 'review',
    readOnly: false,
    readOnlyReason: '',
    selectedCaseId: null,
    health: null,
    cases: [],
    inbox: {
      items: [],
      fallback: false,
      unavailable: false,
      reason: '',
      filters: { source: 'all', state: 'all', sensitivity: 'all', reviewer: 'all', identity: 'all', age: 'all' },
    },
    caseDetail: null,
    judgments: [],
    loading: {
      health: false,
      cases: false,
      inbox: false,
      review: false,
      history: false,
    },
    requests: {
      caseSerial: 0,
    },
    drafts: {
      results: Object.create(null),
      missing: { reference: '', withinTop: 10, note: '' },
      pairNote: '',
      preferredTargetId: null,
      context: Object.create(null),
    },
    changes: {
      compilePlan: null,
      compileConfirmation: '',
      promotionPlans: Object.create(null),
      selectedPromotionId: null,
      promotionConfirmation: '',
      job: null,
      loadingPreview: false,
      applying: false,
      loadingPromotionId: null,
      applyingPromotionId: null,
      polling: false,
    },
    comparison: {
      reviews: [],
      selectedReviewId: null,
      session: null,
      selectedQueryId: null,
      selectedPassageId: null,
      passageContexts: Object.create(null),
      loading: false,
      submitting: false,
      missingOpen: false,
      missingReference: '',
      missingNote: '',
    },
    sessions: {
      items: [], selected: null, loading: false, submitting: false,
      form: { kind: 'weekly-triage', reviewedSize: 20, seed: 'weekly-review', reviewer: 'jesse', qualifiedReviewer: false, authorizedHoldoutReview: false },
    },
    quality: { report: null, loading: false, unavailable: '' },
    audits: { preview: null, files: [], loading: false, submitting: false, recoveryDigest: null },
    admission: { items: [], selectedReviewId: null, detail: null, loading: false, submitting: false, decisions: Object.create(null) },
    publish: { items: [], selectedReviewId: null, detail: null, loading: false, submitting: false, push: false, openDraftPr: false, result: null },
  };

  function mutationReadOnly(localValue) { return state.readOnly || localValue === true; }

  function readOnlyNotice() {
    const notice = node('div', 'message warn');
    notice.setAttribute('role', 'status');
    notice.textContent = state.readOnlyReason || 'Read-only mode: repository mutations are disabled. Resolve the startup health issues and restart Workbench to resume changes.';
    return notice;
  }

  const tabList = document.getElementById('tab-list');
  const viewRoot = document.getElementById('view-root');
  const mainPanel = document.getElementById('main-panel');
  const layout = document.querySelector('.layout');
  const caseList = document.getElementById('case-list');
  const caseCount = document.getElementById('case-count');
  const globalMessage = document.getElementById('global-message');
  const globalStatusPill = document.getElementById('global-status-pill');
  const headerSummary = document.getElementById('header-summary');
  const refreshAllButton = document.getElementById('refresh-all');
  const reloadCasesButton = document.getElementById('reload-cases');
  const createCaseForm = document.getElementById('create-case-form');
  const createCaseMessage = document.getElementById('create-case-message');
  const newCaseQuery = document.getElementById('new-case-query');
  const newCaseSource = document.getElementById('new-case-source');
  const createCaseSubmit = document.getElementById('create-case-submit');

  function node(tag, className, text) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (text !== undefined) element.textContent = text;
    return element;
  }

  function clear(element) {
    while (element.firstChild) element.removeChild(element.firstChild);
  }

  function isPlainObject(value) {
    return typeof value === 'object' && value !== null && !Array.isArray(value);
  }

  function safeArray(value) {
    return Array.isArray(value) ? value : [];
  }

  function formatDate(value) {
    if (typeof value !== 'string' || value.trim() === '') return 'Unknown time';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return value;
    return new Intl.DateTimeFormat(undefined, {
      dateStyle: 'medium',
      timeStyle: 'short',
    }).format(date);
  }

  function escapeCaseSourceLabel(value) {
    return value.replace(/-/g, ' ');
  }

  function statusTone(value) {
    if (value === 'healthy' || value === 'aligned' || value === 'main') return 'pill-good';
    if (value === 'rejected' || value === 'unavailable' || value === 'mismatch' || value === 'detached') return 'pill-danger';
    if (value === 'running') return 'pill';
    return 'pill-warn';
  }

  function currentCase() {
    return state.cases.find((entry) => entry.caseId === state.selectedCaseId) || null;
  }

  function selectedReview() {
    return state.caseDetail && state.caseDetail.review ? state.caseDetail.review : null;
  }

  function latestEventTime(entry) {
    const events = entry && Array.isArray(entry.events) ? entry.events : [];
    const last = events.length > 0 ? events[events.length - 1] : null;
    return last && typeof last.at === 'string' ? last.at : '';
  }

  function sortCases(entries) {
    return [...entries].sort((left, right) => {
      const stateDiff = (STATE_ORDER[left.state] ?? 99) - (STATE_ORDER[right.state] ?? 99);
      if (stateDiff !== 0) return stateDiff;
      return latestEventTime(right).localeCompare(latestEventTime(left));
    });
  }

  function queryStateFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const view = params.get('view');
    const caseId = params.get('case');
    return {
      view: TABS.some((tab) => tab.id === view) ? view : null,
      caseId: typeof caseId === 'string' && caseId.trim() !== '' ? caseId : null,
    };
  }

  function persistRouteState() {
    const params = new URLSearchParams();
    params.set('view', state.view);
    if (state.selectedCaseId) params.set('case', state.selectedCaseId);
    const nextUrl = `${window.location.pathname}?${params.toString()}`;
    window.history.replaceState(null, '', nextUrl);
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
      view: state.view,
      selectedCaseId: state.selectedCaseId,
      inboxFilters: state.inbox.filters,
      changes: {
        selectedPromotionId: state.changes.selectedPromotionId,
        jobRunId: state.changes.job && typeof state.changes.job.runId === 'string' ? state.changes.job.runId : null,
      },
      comparisonReviewId: state.comparison.selectedReviewId,
      auditRecoveryDigest: state.audits.preview && typeof state.audits.preview.auditDigest === 'string' ? state.audits.preview.auditDigest : null,
    }));
  }

  function loadStoredRouteState() {
    const fromUrl = queryStateFromUrl();
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        if (saved && TABS.some((tab) => tab.id === saved.view)) state.view = saved.view;
        if (saved && typeof saved.selectedCaseId === 'string' && saved.selectedCaseId.trim() !== '') {
          state.selectedCaseId = saved.selectedCaseId;
        }
        if (saved && isPlainObject(saved.inboxFilters)) {
          for (const key of Object.keys(state.inbox.filters)) {
            if (typeof saved.inboxFilters[key] === 'string') state.inbox.filters[key] = saved.inboxFilters[key];
          }
        }
        if (saved && isPlainObject(saved.changes)) {
          if (typeof saved.changes.selectedPromotionId === 'string') {
            state.changes.selectedPromotionId = saved.changes.selectedPromotionId;
          }
          if (typeof saved.changes.jobRunId === 'string' && saved.changes.jobRunId.trim() !== '') {
            state.changes.job = { runId: saved.changes.jobRunId, state: 'queued', jobId: 'check' };
          }
        }
        if (saved && typeof saved.comparisonReviewId === 'string' && saved.comparisonReviewId.trim() !== '') {
          state.comparison.selectedReviewId = saved.comparisonReviewId;
        }
        if (saved && typeof saved.auditRecoveryDigest === 'string' && /^[0-9a-f]{64}$/.test(saved.auditRecoveryDigest)) {
          state.audits.recoveryDigest = saved.auditRecoveryDigest;
        }
      }
    } catch {
      // Ignore storage corruption and continue with defaults.
    }
    if (fromUrl.view) state.view = fromUrl.view;
    if (fromUrl.caseId) state.selectedCaseId = fromUrl.caseId;
  }

  function nearestWindow(rank) {
    if (rank <= 1) return 1;
    if (rank <= 3) return 3;
    if (rank <= 5) return 5;
    return 10;
  }

  function ensureResultDraft(targetId, rank) {
    if (!state.drafts.results[targetId]) {
      state.drafts.results[targetId] = {
        withinTop: nearestWindow(rank || 10),
        interview: null,
        note: '',
      };
    }
    return state.drafts.results[targetId];
  }

  function judgmentKey(record) {
    if (!record || record.schemaVersion !== 2 || typeof record.action !== 'string') return null;
    if (record.action === 'missing') return `missing:${String(record.reference || '')}`;
    if (record.action === 'prefer') {
      const pair = [String(record.preferredTargetId || ''), String(record.otherTargetId || '')].sort();
      return `prefer:${pair[0]}|${pair[1]}`;
    }
    return `target:${String(record.targetId || '')}`;
  }

  function supersededIds(records) {
    const ids = new Set();
    for (const record of records) {
      if (record && record.schemaVersion === 2 && typeof record.supersedes === 'string') ids.add(record.supersedes);
    }
    return ids;
  }

  function activeJudgmentsByKey(records) {
    const superseded = supersededIds(records);
    const map = new Map();
    for (const record of records) {
      const key = judgmentKey(record);
      if (!key) continue;
      if (typeof record.judgmentId !== 'string' || superseded.has(record.judgmentId)) continue;
      const existing = map.get(key);
      if (!existing || String(existing.at || '').localeCompare(String(record.at || '')) <= 0) {
        map.set(key, record);
      }
    }
    return map;
  }

  function currentJudgmentForTarget(targetId) {
    return activeJudgmentsByKey(state.judgments).get(`target:${targetId}`) || null;
  }

  function currentMissingJudgment(reference) {
    return activeJudgmentsByKey(state.judgments).get(`missing:${reference}`) || null;
  }

  function currentPairJudgment(targetA, targetB) {
    const pair = [targetA, targetB].sort();
    return activeJudgmentsByKey(state.judgments).get(`prefer:${pair[0]}|${pair[1]}`) || null;
  }

  function technicalDetailsId(targetId, suffix) {
    return `result-${targetId.replace(/[^a-zA-Z0-9_-]/g, '-')}-${suffix}`;
  }

  async function requestJson(url, options) {
    let response;
    try {
      response = await fetch(url, options);
    } catch (error) {
      const message = error instanceof Error ? error.message : 'Network request failed.';
      throw { status: 0, code: 'network_error', message };
    }
    let body = null;
    try {
      body = await response.json();
    } catch {
      body = null;
    }
    if (!response.ok) {
      const message = body && isPlainObject(body) && isPlainObject(body.error) && typeof body.error.message === 'string'
        ? body.error.message
        : body && isPlainObject(body) && typeof body.error === 'string'
          ? body.error
          : `${response.status} ${response.statusText}`;
      const code = body && isPlainObject(body) && isPlainObject(body.error) && typeof body.error.code === 'string'
        ? body.error.code
        : 'request_failed';
      throw { status: response.status, code, message, body };
    }
    if (body && isPlainObject(body) && body.ok === true && 'data' in body) return body.data;
    return body;
  }

  function setGlobalMessage(kind, text) {
    globalMessage.className = `message${kind ? ` ${kind}` : ''}`;
    globalMessage.textContent = text;
  }

  function setInlineMessage(element, kind, text) {
    element.className = `message${kind ? ` ${kind}` : ''}`;
    element.textContent = text;
  }

  function updateHeader() {
    const count = state.cases.length;
    const caseText = count === 1 ? '1 case' : `${count} cases`;
    headerSummary.textContent = state.selectedCaseId
      ? `Operational review for search quality, case flow, and release health. ${caseText} loaded.`
      : `Operational review for search quality, case flow, and release health. ${caseText} loaded.`;
    globalStatusPill.className = `pill ${state.health ? statusTone(state.health.status) : ''}`.trim();
    globalStatusPill.textContent = state.health ? `Status: ${state.health.status}` : 'Status: loading';
  }

  function renderTabs() {
    clear(tabList);
    TABS.forEach((tab, index) => {
      const button = node('button', 'tab', tab.label);
      button.type = 'button';
      button.id = `tab-${tab.id}`;
      button.role = 'tab';
      button.setAttribute('aria-selected', state.view === tab.id ? 'true' : 'false');
      button.setAttribute('aria-controls', `panel-${tab.id}`);
      button.tabIndex = state.view === tab.id ? 0 : -1;
      button.dataset.view = tab.id;
      button.addEventListener('click', () => {
        state.view = tab.id;
        persistRouteState();
        render();
        if (tab.id === 'sessions') void loadSessions();
        else if (tab.id === 'quality') void loadQuality();
        else if (tab.id === 'audits') void recoverAuditPreview().then(render);
        else if (tab.id === 'admission') void loadAdmissions();
        else if (tab.id === 'publish') void loadPublish();
      });
      button.addEventListener('keydown', (event) => {
        if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft' && event.key !== 'Home' && event.key !== 'End') return;
        event.preventDefault();
        let nextIndex = index;
        if (event.key === 'ArrowRight') nextIndex = (index + 1) % TABS.length;
        else if (event.key === 'ArrowLeft') nextIndex = (index - 1 + TABS.length) % TABS.length;
        else if (event.key === 'Home') nextIndex = 0;
        else if (event.key === 'End') nextIndex = TABS.length - 1;
        const next = tabList.querySelector(`[data-view="${TABS[nextIndex].id}"]`);
        if (next) next.focus();
      });
      tabList.appendChild(button);
    });
  }

  function renderSidebar() {
    caseCount.textContent = state.loading.cases ? 'Loading cases' : `${state.cases.length} loaded`;
    clear(caseList);
    if (state.loading.cases && state.cases.length === 0) {
      caseList.appendChild(node('div', 'empty', 'Loading cases.'));
      return;
    }
    if (state.cases.length === 0) {
      caseList.appendChild(node('div', 'empty', 'No cases yet.'));
      return;
    }
    sortCases(state.cases).forEach((entry) => {
      const button = node('button', `case-button${state.selectedCaseId === entry.caseId ? ' current' : ''}`);
      button.type = 'button';
      button.addEventListener('click', () => {
        selectCase(entry.caseId, state.view === 'health' ? 'review' : state.view);
      });

      const title = node('div', 'case-query', entry.query);
      title.className = 'case-query';
      button.appendChild(title);

      const meta = node('div', 'case-meta');
      meta.textContent = `${escapeCaseSourceLabel(entry.source)} | ${entry.state} | ${formatDate(latestEventTime(entry))}`;
      button.appendChild(meta);

      const chips = node('div', 'row');
      chips.appendChild(statusBadge(entry.state));
      if (entry.caseId === state.selectedCaseId) chips.appendChild(node('span', 'pill pill-good', 'Selected'));
      button.appendChild(chips);
      caseList.appendChild(button);
    });
  }

  function statusBadge(value) {
    const badge = node('span', `pill ${statusTone(value)}`.trim(), value);
    return badge;
  }

  function metricCard(label, value, tone, detail) {
    const card = node('section', 'metric-card');
    const top = node('div', 'tiny muted', label);
    const main = node('div', 'metric-value', String(value));
    card.appendChild(top);
    card.appendChild(main);
    if (detail) card.appendChild(node('div', `pill ${tone}`.trim(), detail));
    return card;
  }

  function twoColumnDefinitionList(entries) {
    const wrapper = node('div', 'case-grid');
    entries.forEach(([label, value]) => {
      const card = node('div', 'history-card');
      card.appendChild(node('div', 'tiny muted', label));
      card.appendChild(node('div', value.className || '', value.text));
      wrapper.appendChild(card);
    });
    return wrapper;
  }

  function renderHealthView() {
    const panel = node('section', 'stack');
    panel.id = 'panel-health';
    panel.role = 'tabpanel';
    panel.setAttribute('aria-labelledby', 'tab-health');

    const head = node('div', 'section-head');
    const text = node('div');
    text.appendChild(node('h2', '', 'Health'));
    text.appendChild(node('div', 'tiny muted', 'Descriptor, artifact, fixture, gauntlet, judgment, and git status.'));
    head.appendChild(text);
    panel.appendChild(head);

    if (state.loading.health && !state.health) {
      panel.appendChild(node('div', 'message', 'Loading health.'));
      return panel;
    }
    if (!state.health) {
      panel.appendChild(node('div', 'message warn', 'Health is unavailable.'));
      return panel;
    }

    const health = state.health;
    const metrics = node('div', 'metric-grid');
    metrics.appendChild(metricCard('Overall', health.status, statusTone(health.status), health.descriptor.alignment));
    metrics.appendChild(metricCard('Golden fixtures', `${health.golden.active}/${health.golden.total}`, 'pill', `${health.golden.pending} pending`));
    metrics.appendChild(metricCard('Coverage', `${health.coverage.active}/${health.coverage.total}`, 'pill', `${health.coverage.uncovered} uncovered`));
    metrics.appendChild(metricCard('Judgments', `${health.judgments.effective}/${health.judgments.total}`, 'pill', `${health.judgments.stale} stale`));
    panel.appendChild(metrics);

    const gauntletCard = node('section', 'history-card stack');
    gauntletCard.appendChild(node('h3', '', 'Release gate'));
    const gauntletRow = node('div', 'row');
    gauntletRow.appendChild(statusBadge(health.gauntlet.status));
    gauntletRow.appendChild(statusBadge(health.git.state));
    if (health.gauntlet.verdict) gauntletRow.appendChild(node('span', 'pill', `Verdict: ${health.gauntlet.verdict}`));
    gauntletCard.appendChild(gauntletRow);
    if (health.gauntlet.summary) gauntletCard.appendChild(node('p', 'excerpt', health.gauntlet.summary));
    if (health.gauntlet.reason) gauntletCard.appendChild(node('div', 'message warn', health.gauntlet.reason));
    if (health.gauntlet.reportPath) gauntletCard.appendChild(node('div', 'mono-wrap tiny', health.gauntlet.reportPath));
    panel.appendChild(gauntletCard);

    const signals = node('section', 'stack');
    signals.appendChild(node('h3', '', 'Signals'));
    if (!Array.isArray(health.signals) || health.signals.length === 0) {
      signals.appendChild(node('div', 'message success', 'No warnings or errors reported.'));
    } else {
      const list = node('div', 'signal-list');
      health.signals.forEach((signal) => {
        const item = node('div', `signal-item ${signal.severity}`);
        item.appendChild(node('div', 'tiny muted', `${signal.area} | ${signal.severity}`));
        item.appendChild(node('div', '', signal.message));
        if (Array.isArray(signal.subjects) && signal.subjects.length > 0) {
          item.appendChild(node('div', 'mono-wrap tiny', signal.subjects.join(', ')));
        }
        list.appendChild(item);
      });
      signals.appendChild(list);
    }
    panel.appendChild(signals);

    const details = node('div', 'split');
    const descriptor = node('section', 'history-card stack');
    descriptor.appendChild(node('h3', '', 'Descriptor and artifact'));
    descriptor.appendChild(twoColumnDefinitionList([
      ['Alignment', { text: health.descriptor.alignment, className: 'mono-wrap' }],
      ['Engine version', { text: health.descriptor.identity ? health.descriptor.identity.engineVersion : 'Unavailable', className: 'mono-wrap' }],
      ['Corpus fingerprint', { text: health.descriptor.identity ? health.descriptor.identity.corpusFingerprint : 'Unavailable', className: 'mono-wrap' }],
      ['Layer fingerprint', { text: health.descriptor.identity ? health.descriptor.identity.layerFingerprint : 'Unavailable', className: 'mono-wrap' }],
    ]));
    if (health.descriptor.stale && health.descriptor.stale.reason) {
      descriptor.appendChild(node('div', 'message warn', health.descriptor.stale.reason));
    }
    details.appendChild(descriptor);

    const startup = node('section', 'history-card stack');
    startup.appendChild(node('h3', '', 'Startup and git'));
    const legacyLog = isPlainObject(health.legacyLog) ? health.legacyLog : null;
    startup.appendChild(twoColumnDefinitionList([
      ['Branch', { text: health.git.branch || 'Unavailable', className: 'mono-wrap' }],
      ['Ahead / behind', { text: `${health.git.aheadBy} / ${health.git.behindBy}`, className: '' }],
      ['Dirty tree', { text: health.git.dirty ? 'Yes' : 'No', className: '' }],
      ['Degraded startup', { text: health.startup.degraded ? 'Yes' : 'No', className: '' }],
      ['Legacy judgment log', {
        text: legacyLog && legacyLog.status === 'closed-canonical'
          ? 'Closed and canonical'
          : legacyLog ? legacyLog.status : 'Not checked',
        className: '',
      }],
    ]));
    if (legacyLog && legacyLog.status !== 'closed-canonical' && legacyLog.status !== 'absent' && legacyLog.message) {
      startup.appendChild(node('div', 'message warn', legacyLog.message));
    }
    if (Array.isArray(health.startup.diagnostics) && health.startup.diagnostics.length > 0) {
      const list = node('div', 'stack');
      health.startup.diagnostics.forEach((item) => list.appendChild(node('div', 'message error', item)));
      startup.appendChild(list);
    }
    details.appendChild(startup);
    panel.appendChild(details);

    return panel;
  }

  function normalizeInboxItem(item) {
    if (!item) return null;
    if (isPlainObject(item) && isPlainObject(item.case)) {
      return {
        case: item.case,
        suggestion: null,
        note: typeof item.reason === 'string' ? item.reason : typeof item.note === 'string' ? item.note : '',
        freshness: typeof item.freshness === 'string' ? item.freshness : '',
        judgmentCount: typeof item.judgmentCount === 'number' ? item.judgmentCount : null,
        resultCount: typeof item.resultCount === 'number' ? item.resultCount : null,
        meta: isPlainObject(item.meta) ? item.meta : {},
      };
    }
    if (isPlainObject(item) && isPlainObject(item.suggestion) &&
      typeof item.suggestion.query === 'string' && typeof item.suggestion.source === 'string') {
      return {
        case: null,
        suggestion: item.suggestion,
        note: typeof item.reason === 'string' ? item.reason : '',
        freshness: '',
        judgmentCount: null,
        resultCount: typeof item.resultCount === 'number' ? item.resultCount : null,
        meta: isPlainObject(item.meta) ? item.meta : {},
      };
    }
    if (isPlainObject(item) && typeof item.caseId === 'string' && typeof item.query === 'string') {
      return { case: item, suggestion: null, note: '', freshness: '', judgmentCount: null, resultCount: null, meta: {} };
    }
    return null;
  }

  function renderInboxView() {
    const panel = node('section', 'stack');
    panel.id = 'panel-inbox';
    panel.role = 'tabpanel';
    panel.setAttribute('aria-labelledby', 'tab-inbox');

    const head = node('div', 'section-head');
    const text = node('div');
    text.appendChild(node('h2', '', 'Inbox'));
    text.appendChild(node('div', 'tiny muted', 'Cases that need human attention right now.'));
    head.appendChild(text);
    const reload = node('button', 'btn btn-subtle', 'Reload inbox');
    reload.type = 'button';
    reload.addEventListener('click', () => {
      void loadInbox(true);
    });
    head.appendChild(reload);
    panel.appendChild(head);

    if (state.loading.inbox && state.inbox.items.length === 0) {
      panel.appendChild(node('div', 'message', 'Loading inbox.'));
      return panel;
    }

    if (state.inbox.unavailable) {
      panel.appendChild(node('div', 'message warn', state.inbox.reason || 'Inbox endpoint unavailable. Showing local fallback queue.'));
    } else if (state.inbox.fallback) {
      panel.appendChild(node('div', 'message', state.inbox.reason || 'Showing fallback queue from cases.'));
    }

    const allItems = state.inbox.items.map(normalizeInboxItem).filter(Boolean);
    if (allItems.length === 0) {
      panel.appendChild(node('div', 'empty', 'Nothing is waiting in the inbox.'));
      return panel;
    }

    const filterBar = node('div', 'filter-bar');
    const filterDefinitions = [
      ['source', 'Source', ['all', ...new Set(allItems.map((item) => item.meta.source || (item.case || item.suggestion).source))]],
      ['state', 'State', ['all', ...new Set(allItems.map((item) => item.meta.state || item.case?.state || 'new'))]],
      ['sensitivity', 'Sensitivity', ['all', 'standard', 'sensitive']],
      ['reviewer', 'Reviewer', ['all', ...new Set(allItems.map((item) => item.meta.reviewer || 'unassigned'))]],
      ['identity', 'Artifact', ['all', 'current', 'other']],
      ['age', 'Age', ['all', '7', '30', 'older']],
    ];
    filterDefinitions.forEach(([key, label, values]) => {
      const field = node('div', 'field');
      const fieldLabel = node('label', '', label);
      const select = document.createElement('select');
      const selectId = `inbox-filter-${key}`;
      select.id = selectId;
      fieldLabel.htmlFor = selectId;
      values.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value === 'all' ? `All ${label.toLowerCase()}`
          : key === 'age' ? (value === '7' ? 'Last 7 days' : value === '30' ? 'Last 30 days' : 'Older than 30 days')
            : value.replaceAll('-', ' ');
        option.selected = state.inbox.filters[key] === value;
        select.appendChild(option);
      });
      select.addEventListener('change', () => {
        state.inbox.filters[key] = select.value;
        persistRouteState();
        render();
      });
      field.appendChild(fieldLabel);
      field.appendChild(select);
      filterBar.appendChild(field);
    });
    panel.appendChild(filterBar);

    const currentIdentity = state.health && state.health.artifact ? state.health.artifact.identity : null;
    const items = allItems.filter((item) => {
      const subject = item.case || item.suggestion;
      const meta = item.meta;
      const reviewer = meta.reviewer || 'unassigned';
      const artifact = meta.artifact || item.case?.artifact || null;
      const isCurrent = currentIdentity && artifact &&
        artifact.engineVersion === currentIdentity.engineVersion &&
        artifact.corpusFingerprint === currentIdentity.corpusFingerprint &&
        artifact.layerFingerprint === currentIdentity.layerFingerprint;
      const ageDays = typeof meta.ageDays === 'number' ? meta.ageDays : 0;
      const filters = state.inbox.filters;
      return (filters.source === 'all' || filters.source === (meta.source || subject.source)) &&
        (filters.state === 'all' || filters.state === (meta.state || item.case?.state || 'new')) &&
        (filters.sensitivity === 'all' || filters.sensitivity === (meta.sensitivity || 'standard')) &&
        (filters.reviewer === 'all' || filters.reviewer === reviewer) &&
        (filters.identity === 'all' || (filters.identity === 'current' ? isCurrent : !isCurrent)) &&
        (filters.age === 'all' || (filters.age === '7' ? ageDays <= 7 : filters.age === '30' ? ageDays <= 30 : ageDays > 30));
    });
    if (items.length === 0) {
      panel.appendChild(node('div', 'empty', 'No inbox cases match these filters.'));
      return panel;
    }

    const list = node('div', 'case-grid');
    items.forEach((item) => {
      const subject = item.case || item.suggestion;
      const card = node('article', 'case-card stack');
      card.appendChild(node('div', 'case-query', subject.query));
      const metaText = item.case
        ? `${escapeCaseSourceLabel(item.case.source)} | ${item.case.state} | ${formatDate(latestEventTime(item.case))}`
        : `${escapeCaseSourceLabel(item.suggestion.source)} | suggested review`;
      const meta = node('div', 'case-meta', metaText);
      card.appendChild(meta);
      const row = node('div', 'row');
      row.appendChild(item.case ? statusBadge(item.case.state) : node('span', 'pill pill-warn', 'Suggested'));
      if (item.freshness) row.appendChild(node('span', 'pill', `Snapshot: ${item.freshness}`));
      if (typeof item.judgmentCount === 'number') row.appendChild(node('span', 'pill', `${item.judgmentCount} judgments`));
      if (typeof item.resultCount === 'number') row.appendChild(node('span', 'pill', `${item.resultCount} results`));
      card.appendChild(row);
      if (item.note) card.appendChild(node('p', 'excerpt', item.note));
      const actions = node('div', 'row');
      if (item.case) {
        const review = node('button', 'btn btn-primary', 'Open review');
        review.type = 'button';
        review.addEventListener('click', () => {
          selectCase(item.case.caseId, 'review');
        });
        actions.appendChild(review);
        const history = node('button', 'btn', 'Open history');
        history.type = 'button';
        history.addEventListener('click', () => {
          selectCase(item.case.caseId, 'history');
        });
        actions.appendChild(history);
      } else {
        const create = node('button', 'btn btn-primary', 'Create review case');
        create.type = 'button';
        create.addEventListener('click', () => {
          void createCase(item.suggestion.query, item.suggestion.source);
        });
        actions.appendChild(create);
      }
      card.appendChild(actions);
      list.appendChild(card);
    });
    panel.appendChild(list);
    return panel;
  }

  function resultCurrentActionText(record) {
    if (!record || record.schemaVersion !== 2) return 'No review yet';
    const label = ACTION_LABELS[record.action] || record.action;
    if (record.action === 'essential' && typeof record.withinTop === 'number') {
      return `${label} within top ${record.withinTop}`;
    }
    if (record.action === 'irrelevant' && record.diagnosis) {
      return `${label} | ${DIAGNOSIS_LABELS[record.diagnosis] || record.diagnosis}`;
    }
    return label;
  }

  // Concept label -> id from the artifact's own concept table, fetched once.
  // This is what lets "Not relevant" name the concept from the result's
  // evidence instead of asking the reviewer to know internal ids. A failed
  // fetch degrades to the hand-typed fallback inside the note step — never a
  // blocked judgment and never a guessed id.
  const conceptIdsByLabel = new Map();

  async function loadConceptLabels() {
    try {
      const list = await requestJson('/api/concepts');
      safeArray(list).forEach((concept) => {
        if (isPlainObject(concept) && typeof concept.id === 'string' && typeof concept.label === 'string') {
          conceptIdsByLabel.set(concept.label, concept.id);
        }
      });
    } catch {
      // Degraded mode: conceptEvidence returns null ids and the note step
      // asks for the concept id by hand.
    }
  }

  // The distinct concepts a result's evidence actually names: one entry per
  // concept behind a concept_anchor or concept_lexicon reason. All three
  // current label prefixes ('Theme: ', 'Theme cue: ', 'Related theme: ') are
  // stripped; a future prefix this misses leaves the label unmatched, which
  // degrades to the hand-typed fallback rather than wiring a wrong id.
  function conceptEvidence(result) {
    const seen = new Set();
    const concepts = [];
    safeArray(result.reasons).forEach((reason) => {
      if (!isPlainObject(reason) || typeof reason.label !== 'string') return;
      if (reason.family !== 'concept_anchor' && reason.family !== 'concept_lexicon') return;
      const label = reason.label
        .replace(/^Theme cue: /, '')
        .replace(/^Related theme: /, '')
        .replace(/^Theme: /, '');
      if (seen.has(label)) return;
      seen.add(label);
      concepts.push({ label, id: conceptIdsByLabel.has(label) ? conceptIdsByLabel.get(label) : null });
    });
    return concepts;
  }

  // Honest-demotion copy: what an irrelevant judgment actually compiles to.
  const DEMOTION_EXPLANATION = 'It is demoted out of the top results for this query only — the verse stays in the corpus and every other search.';

  function renderMachineReasons(result) {
    const reasons = node('div', 'reason-list');
    safeArray(result.reasons).forEach((reason) => {
      const family = typeof reason.family === 'string' ? reason.family : 'reason';
      const points = typeof reason.points === 'number' ? `${reason.points.toFixed(2)} pts` : '';
      const label = typeof reason.label === 'string' ? reason.label : '';
      const chip = node('div', 'reason-chip', `${family}${points ? ` | ${points}` : ''}${label ? ` | ${label}` : ''}`);
      reasons.appendChild(chip);
    });
    return reasons;
  }

  function renderPassageContextDisclosure(result) {
    const ref = typeof result.reference === 'string' ? result.reference : '';
    const cache = state.drafts.context[ref] || { status: 'idle', data: null, error: '' };
    state.drafts.context[ref] = cache;

    const details = node('details', 'disclosure');
    const summary = node('summary', '', 'Passage context');
    details.appendChild(summary);
    const body = node('div', 'disclosure-body');
    const meta = node('div', 'tiny muted', `Review target stays ${result.targetId}. Context is loaded around ${ref}.`);
    body.appendChild(meta);

    const content = node('div', 'context-block');
    body.appendChild(content);
    details.appendChild(body);

    function paintContext() {
      clear(content);
      if (cache.status === 'loading') {
        content.appendChild(node('div', 'message', 'Loading surrounding verses.'));
        return;
      }
      if (cache.status === 'error') {
        content.appendChild(node('div', 'message warn', cache.error || 'Context is unavailable.'));
        return;
      }
      if (!cache.data) {
        content.appendChild(node('div', 'message', 'Open this section to load surrounding verses on demand.'));
        return;
      }
      content.appendChild(node('div', 'tiny muted', `Requested reference: ${cache.data.requestedReference || ref}`));
      const context = cache.data.context;
      const passage = isPlainObject(context) && context.kind === 'passage' && isPlainObject(context.passage)
        ? context.passage
        : context;
      if (isPlainObject(passage) && typeof passage.reference === 'string') {
        content.appendChild(node('div', 'pill', passage.reference));
      }
      const verses = isPlainObject(passage) && Array.isArray(passage.verses) ? passage.verses : [];
      if (verses.length === 0) {
        content.appendChild(node('div', 'message', 'No expanded passage came back for this result.'));
        return;
      }
      const verseList = node('div', 'stack');
      verses.forEach((verse) => {
        const line = node('div', 'verse-line');
        const verseNumber = node('div', 'verse-ref', typeof verse.verse === 'number' ? String(verse.verse) : typeof verse.verse === 'string' ? verse.verse : '');
        const verseText = node('p', 'context-text', typeof verse.text === 'string' ? verse.text : '');
        line.appendChild(verseNumber);
        line.appendChild(verseText);
        verseList.appendChild(line);
      });
      content.appendChild(verseList);
    }

    details.addEventListener('toggle', () => {
      if (!details.open || cache.status === 'loading' || cache.data || !ref) return;
      cache.status = 'loading';
      paintContext();
      void requestJson(`/api/v2/context?ref=${encodeURIComponent(ref)}`)
        .then((data) => {
          cache.status = 'ready';
          cache.data = data;
          paintContext();
        })
        .catch((error) => {
          cache.status = 'error';
          cache.error = error && typeof error.message === 'string' ? error.message : 'Context could not be loaded.';
          paintContext();
        });
    });

    paintContext();
    return details;
  }

  // Plain yes/no questions built from the result's own concept evidence
  // decide between wrong-anchor and concept-misfire — the diagnosis is never
  // picked from a jargon list, and the concept id is wired from the evidence
  // rather than asked for. A hand-written sentence stays required only here,
  // because these two causes queue changes to reviewed theme files.
  function renderNotRelevantInterview(result, review, record, draft) {
    const interview = draft.interview;
    const concept = interview.concepts[interview.index];
    const reference = result.reference || result.targetId;
    const panel = node('div', 'stack');

    const cancelButton = () => {
      const cancel = node('button', 'btn btn-subtle', 'Never mind');
      cancel.type = 'button';
      cancel.addEventListener('click', () => {
        draft.interview = null;
        render();
      });
      return cancel;
    };

    // The interview draft (including the required hand-typed note) must
    // survive a rejected submit — stale snapshot token, CSRF, network — so
    // the reviewer can retry without retyping. submitJudgment clears it in
    // its success branch, alongside the missing/prefer draft clears.
    const submitIrrelevant = (details, successMessage) => {
      void submitJudgment(Object.assign({
        caseId: review.caseId,
        snapshotToken: review.token,
        action: 'irrelevant',
        targetId: result.targetId,
        supersedes: record && record.judgmentId ? record.judgmentId : undefined,
      }, details), successMessage);
    };

    // Every named theme checked out on both counts: the pull was word
    // overlap after all, recorded with the diagnosisInferred marker.
    const logNoise = () => submitIrrelevant(
      { diagnosis: 'lexical-noise', diagnosisInferred: true, note: draft.note.trim() || undefined },
      `Marked ${reference} not relevant — matched words, not meaning. ${DEMOTION_EXPLANATION}`,
    );

    const question = (text, onYes, onNo) => {
      panel.appendChild(node('div', '', text));
      const row = node('div', 'action-row');
      [['Yes', onYes], ['No', onNo]].forEach(([label, handler]) => {
        const button = node('button', 'btn', label);
        button.type = 'button';
        button.addEventListener('click', handler);
        row.appendChild(button);
      });
      row.appendChild(cancelButton());
      panel.appendChild(row);
    };

    if (interview.step === 'fit') {
      question(
        `Does “${concept.label}” fit this verse?`,
        () => {
          interview.step = 'trigger';
          render();
        },
        () => {
          interview.step = 'note';
          interview.cause = 'wrong-anchor';
          render();
        },
      );
      return panel;
    }

    if (interview.step === 'trigger') {
      question(
        `Should “${review.query}” have brought up “${concept.label}” at all?`,
        () => {
          if (interview.index + 1 < interview.concepts.length) {
            interview.index += 1;
            interview.step = 'fit';
            render();
          } else {
            logNoise();
          }
        },
        () => {
          interview.step = 'note';
          interview.cause = 'concept-misfire';
          render();
        },
      );
      return panel;
    }

    const explanation = interview.cause === 'wrong-anchor'
      ? `“${concept.label}” doesn’t belong on this verse — that anchor will be queued for review in the theme files.`
      : `“${review.query}” shouldn’t pull in “${concept.label}” — that trigger will be queued for review in the theme files.`;
    panel.appendChild(node('div', '', explanation));

    let conceptInput = null;
    if (concept.id === null) {
      const conceptField = node('div', 'field');
      const conceptLabel = node('label', '', `Concept id (the workbench could not match “${concept.label}” to an id)`);
      conceptLabel.htmlFor = technicalDetailsId(result.targetId, 'interview-concept');
      conceptInput = document.createElement('input');
      conceptInput.type = 'text';
      conceptInput.id = technicalDetailsId(result.targetId, 'interview-concept');
      conceptInput.value = interview.conceptId;
      conceptInput.placeholder = 'for example, obedience';
      conceptInput.addEventListener('input', () => {
        interview.conceptId = conceptInput.value;
      });
      conceptField.appendChild(conceptLabel);
      conceptField.appendChild(conceptInput);
      panel.appendChild(conceptField);
    }

    const noteField = node('div', 'field');
    const noteLabel = node('label', '', 'Why, from the verse itself (required — this queues a change to reviewed theme files)');
    noteLabel.htmlFor = technicalDetailsId(result.targetId, 'interview-note');
    const noteInput = document.createElement('textarea');
    noteInput.id = technicalDetailsId(result.targetId, 'interview-note');
    noteInput.value = interview.note;
    noteInput.placeholder = 'What you saw in the passage.';
    noteInput.addEventListener('input', () => {
      interview.note = noteInput.value;
    });
    noteField.appendChild(noteLabel);
    noteField.appendChild(noteInput);
    panel.appendChild(noteField);

    const submitRow = node('div', 'action-row');
    const submit = node('button', 'btn btn-danger', 'Log not relevant');
    submit.type = 'button';
    submit.addEventListener('click', () => {
      const conceptId = concept.id !== null ? concept.id : interview.conceptId.trim();
      if (!conceptId) {
        setGlobalMessage('warn', 'This judgment must name the concept.');
        return;
      }
      if (!interview.note.trim()) {
        setGlobalMessage('warn', 'This judgment queues a change to reviewed theme files — say why, from the verse itself.');
        return;
      }
      submitIrrelevant(
        { diagnosis: interview.cause, conceptId, note: interview.note.trim() },
        `Marked ${reference} not relevant — “${concept.label}” is queued for review in the theme files. ${DEMOTION_EXPLANATION}`,
      );
    });
    submitRow.appendChild(submit);
    submitRow.appendChild(cancelButton());
    panel.appendChild(submitRow);
    return panel;
  }

  function renderResultCard(result, review, activeByKey) {
    const record = currentJudgmentForTarget(result.targetId);
    const draft = ensureResultDraft(result.targetId, result.rank || 10);
    const card = node('article', 'result-card');

    const top = node('div', 'result-top');
    const titleRow = node('div', 'result-title-row');
    titleRow.appendChild(node('span', 'rank', `#${result.rank}`));
    titleRow.appendChild(node('div', 'result-reference', result.reference || result.targetId));
    if (typeof result.score === 'number') titleRow.appendChild(node('span', 'pill', `Score ${result.score.toFixed(2)}`));
    top.appendChild(titleRow);
    top.appendChild(node('div', 'result-meta', `Target ${result.targetId}`));
    if (result.excerpt) top.appendChild(node('p', 'excerpt', result.excerpt));
    card.appendChild(top);

    const currentRow = node('div', 'row');
    currentRow.appendChild(node('span', 'pill', `Current call: ${resultCurrentActionText(record)}`));
    if (record && record.judgmentId) currentRow.appendChild(node('span', 'pill', `Judgment ${record.judgmentId.slice(0, 8)}`));
    card.appendChild(currentRow);

    const actions = node('div', 'stack');
    const essentialGroup = node('div', 'row');
    essentialGroup.appendChild(node('span', 'tiny muted', 'Place within'));
    const segment = node('div', 'segment');
    WINDOW_VALUES.forEach((windowValue) => {
      const option = node('button', '', String(windowValue));
      option.type = 'button';
      option.setAttribute('aria-pressed', draft.withinTop === windowValue ? 'true' : 'false');
      option.addEventListener('click', () => {
        draft.withinTop = windowValue;
        render();
      });
      segment.appendChild(option);
    });
    essentialGroup.appendChild(segment);
    actions.appendChild(essentialGroup);

    const buttonRow = node('div', 'action-row');
    const essentialButton = node('button', 'btn btn-primary', 'Essential');
    essentialButton.type = 'button';
    essentialButton.addEventListener('click', () => {
      void submitJudgment({
        caseId: review.caseId,
        snapshotToken: review.token,
        action: 'essential',
        targetId: result.targetId,
        withinTop: draft.withinTop,
        note: draft.note.trim() || undefined,
        supersedes: record && record.judgmentId ? record.judgmentId : undefined,
      }, `Marked ${result.reference || result.targetId} essential.`);
    });
    buttonRow.appendChild(essentialButton);

    const helpfulButton = node('button', 'btn', 'Helpful');
    helpfulButton.type = 'button';
    helpfulButton.addEventListener('click', () => {
      void submitJudgment({
        caseId: review.caseId,
        snapshotToken: review.token,
        action: 'helpful',
        targetId: result.targetId,
        note: draft.note.trim() || undefined,
        supersedes: record && record.judgmentId ? record.judgmentId : undefined,
      }, `Marked ${result.reference || result.targetId} helpful.`);
    });
    buttonRow.appendChild(helpfulButton);

    const irrelevantButton = node('button', 'btn btn-danger', 'Not relevant');
    irrelevantButton.type = 'button';
    irrelevantButton.addEventListener('click', () => {
      const concepts = conceptEvidence(result);
      if (concepts.length === 0) {
        // No theme evidence on this result: word overlap is the only thing
        // that put it up here, so one click is the whole judgment and the
        // record carries diagnosisInferred to mark the auto-classification.
        void submitJudgment({
          caseId: review.caseId,
          snapshotToken: review.token,
          action: 'irrelevant',
          targetId: result.targetId,
          diagnosis: 'lexical-noise',
          diagnosisInferred: true,
          note: draft.note.trim() || undefined,
          supersedes: record && record.judgmentId ? record.judgmentId : undefined,
        }, `Marked ${result.reference || result.targetId} not relevant — matched words, not meaning. ${DEMOTION_EXPLANATION}`);
        return;
      }
      draft.interview = { concepts, index: 0, step: 'fit', cause: '', conceptId: '', note: '' };
      render();
    });
    buttonRow.appendChild(irrelevantButton);

    const preferredTargetId = state.drafts.preferredTargetId;
    if (preferredTargetId === result.targetId) {
      const clearA = node('button', 'btn', 'Clear A');
      clearA.type = 'button';
      clearA.addEventListener('click', () => {
        state.drafts.preferredTargetId = null;
        state.drafts.pairNote = '';
        render();
      });
      buttonRow.appendChild(clearA);
    } else if (!preferredTargetId) {
      const chooseA = node('button', 'btn', 'Choose as A');
      chooseA.type = 'button';
      chooseA.addEventListener('click', () => {
        state.drafts.preferredTargetId = result.targetId;
        render();
      });
      buttonRow.appendChild(chooseA);
    } else {
      const preferA = node('button', 'btn', 'Prefer A');
      preferA.type = 'button';
      preferA.addEventListener('click', () => {
        const prior = currentPairJudgment(preferredTargetId, result.targetId);
        void submitJudgment({
          caseId: review.caseId,
          snapshotToken: review.token,
          action: 'prefer',
          preferredTargetId,
          otherTargetId: result.targetId,
          note: state.drafts.pairNote.trim() || undefined,
          supersedes: prior && prior.judgmentId ? prior.judgmentId : undefined,
        }, 'Recorded pair preference.');
      });
      buttonRow.appendChild(preferA);
    }
    actions.appendChild(buttonRow);
    card.appendChild(actions);

    if (draft.interview) card.appendChild(renderNotRelevantInterview(result, review, record, draft));

    card.appendChild(renderPassageContextDisclosure(result));

    const technical = node('details', 'disclosure');
    const summary = node('summary', '', 'Why this result misses or notes');
    technical.appendChild(summary);
    const body = node('div', 'disclosure-body');
    body.appendChild(node('div', 'tiny muted', 'Machine evidence and notes are optional. Not relevant asks its own plain questions when a theme is on the result.'));
    body.appendChild(renderMachineReasons(result));

    const noteField = node('div', 'field');
    const noteLabel = node('label', '', 'Optional note');
    noteLabel.htmlFor = technicalDetailsId(result.targetId, 'note');
    const noteInput = document.createElement('textarea');
    noteInput.id = technicalDetailsId(result.targetId, 'note');
    noteInput.value = draft.note;
    noteInput.placeholder = 'What you saw in the passage.';
    noteInput.addEventListener('input', () => {
      draft.note = noteInput.value;
    });
    noteField.appendChild(noteLabel);
    noteField.appendChild(noteInput);
    body.appendChild(noteField);
    technical.appendChild(body);
    card.appendChild(technical);

    return card;
  }

  function renderReviewView() {
    const panel = node('section', 'stack');
    panel.id = 'panel-review';
    panel.role = 'tabpanel';
    panel.setAttribute('aria-labelledby', 'tab-review');

    const head = node('div', 'section-head');
    const text = node('div');
    text.appendChild(node('h2', '', 'Review'));
    text.appendChild(node('div', 'tiny muted', 'Review one case at a time against the current snapshot.'));
    head.appendChild(text);
    const refresh = node('button', 'btn btn-subtle', 'Refresh case');
    refresh.type = 'button';
    refresh.disabled = !state.selectedCaseId;
    refresh.addEventListener('click', () => {
      if (state.selectedCaseId) void loadSelectedCaseData(true);
    });
    head.appendChild(refresh);
    panel.appendChild(head);

    if (!state.selectedCaseId) {
      panel.appendChild(node('div', 'message', 'Select a case from the sidebar or create a new one.'));
      return panel;
    }
    if (state.loading.review && !state.caseDetail) {
      panel.appendChild(node('div', 'message', 'Loading case review.'));
      return panel;
    }
    if (!state.caseDetail || !state.caseDetail.case) {
      panel.appendChild(node('div', 'message warn', 'The selected case could not be loaded.'));
      return panel;
    }

    const detail = state.caseDetail;
    const caseEntry = detail.case;
    const review = detail.review;
    const reviewHeader = node('section', 'review-header history-card');
    reviewHeader.appendChild(node('h3', '', caseEntry.query));
    const summary = node('div', 'review-summary');
    summary.appendChild(statusBadge(caseEntry.state));
    summary.appendChild(node('span', 'pill', escapeCaseSourceLabel(caseEntry.source)));
    summary.appendChild(node('span', 'pill', `Updated ${formatDate(latestEventTime(caseEntry))}`));
    if (review && review.freshness) summary.appendChild(node('span', 'pill', `Snapshot ${review.freshness}`));
    reviewHeader.appendChild(summary);
    reviewHeader.appendChild(node('div', 'result-meta', `Case ${caseEntry.caseId}`));

    const stateActions = node('div', 'row');
    if (caseEntry.state === 'new') {
      const startReview = node('button', 'btn', 'Start review');
      startReview.type = 'button';
      startReview.addEventListener('click', () => {
        void transitionCase(caseEntry.caseId, 'reviewing', 'Case moved to reviewing.');
      });
      stateActions.appendChild(startReview);
    }
    if (caseEntry.state === 'reviewing') {
      const markJudged = node('button', 'btn', 'Mark judged');
      markJudged.type = 'button';
      markJudged.addEventListener('click', () => {
        void transitionCase(caseEntry.caseId, 'judged', 'Case moved to judged.');
      });
      stateActions.appendChild(markJudged);
    }
    reviewHeader.appendChild(stateActions);
    panel.appendChild(reviewHeader);

    if (!review) {
      panel.appendChild(node('div', 'message warn', 'No live review snapshot is available for this case.'));
      return panel;
    }

    const resultSet = review.result && review.result.kind === 'discovery' && Array.isArray(review.result.results)
      ? review.result.results.map((item, index) => ({ ...item, rank: index + 1 }))
      : [];

    if (state.drafts.preferredTargetId) {
      const preferred = resultSet.find((item) => item.targetId === state.drafts.preferredTargetId);
      const compareBar = node('section', 'compare-bar');
      compareBar.appendChild(node('h3', '', 'Prefer A'));
      compareBar.appendChild(node('div', '', preferred
        ? `A is ${preferred.reference || preferred.targetId}. Choose "Prefer A" on another result to record the pairwise call.`
        : 'A is selected. Choose "Prefer A" on another result to record the pairwise call.'));
      const noteField = node('div', 'field');
      const noteLabel = node('label', '', 'Optional pair note');
      noteLabel.htmlFor = 'pair-note';
      const noteInput = document.createElement('textarea');
      noteInput.id = 'pair-note';
      noteInput.placeholder = 'Why passage A should rank above the other passage.';
      noteInput.value = state.drafts.pairNote;
      noteInput.addEventListener('input', () => {
        state.drafts.pairNote = noteInput.value;
      });
      noteField.appendChild(noteLabel);
      noteField.appendChild(noteInput);
      compareBar.appendChild(noteField);
      const row = node('div', 'row');
      const clearA = node('button', 'btn', 'Clear A');
      clearA.type = 'button';
      clearA.addEventListener('click', () => {
        state.drafts.preferredTargetId = null;
        state.drafts.pairNote = '';
        render();
      });
      row.appendChild(clearA);
      compareBar.appendChild(row);
      panel.appendChild(compareBar);
    }

    if (resultSet.length === 0) {
      panel.appendChild(node('div', 'message warn', 'This review snapshot has no ranked discovery results to judge.'));
    } else {
      const list = node('div', 'result-list');
      const activeByKey = activeJudgmentsByKey(state.judgments);
      resultSet.forEach((result) => list.appendChild(renderResultCard(result, review, activeByKey)));
      panel.appendChild(list);
    }

    const missingSection = node('section', 'history-card stack');
    missingSection.appendChild(node('h3', '', 'Missing passage'));
    missingSection.appendChild(node('div', 'tiny muted', 'Use this when a passage should have surfaced in the reviewed window but did not.'));

    const missingForm = document.createElement('form');
    missingForm.className = 'stack';
