    missingForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const reference = state.drafts.missing.reference.trim();
      if (!reference) {
        setGlobalMessage('warn', 'Missing passage needs a reference.');
        return;
      }
      const prior = currentMissingJudgment(reference);
      void submitJudgment({
        caseId: review.caseId,
        snapshotToken: review.token,
        action: 'missing',
        reference,
        withinTop: state.drafts.missing.withinTop,
        note: state.drafts.missing.note.trim() || undefined,
        supersedes: prior && prior.judgmentId ? prior.judgmentId : undefined,
      }, `Logged missing passage ${reference}.`);
    });

    const missingSplit = node('div', 'split');
    const left = node('div', 'stack');
    const refField = node('div', 'field');
    const refLabel = node('label', '', 'Reference');
    refLabel.htmlFor = 'missing-reference';
    const refInput = document.createElement('input');
    refInput.id = 'missing-reference';
    refInput.type = 'text';
    refInput.value = state.drafts.missing.reference;
    refInput.placeholder = 'for example, James 2:14';
    refInput.addEventListener('input', () => {
      state.drafts.missing.reference = refInput.value;
    });
    refField.appendChild(refLabel);
    refField.appendChild(refInput);
    left.appendChild(refField);

    const withinField = node('div', 'stack');
    withinField.appendChild(node('div', 'tiny muted', 'Should appear within'));
    const segment = node('div', 'segment');
    WINDOW_VALUES.forEach((windowValue) => {
      const option = node('button', '', String(windowValue));
      option.type = 'button';
      option.setAttribute('aria-pressed', state.drafts.missing.withinTop === windowValue ? 'true' : 'false');
      option.addEventListener('click', () => {
        state.drafts.missing.withinTop = windowValue;
        render();
      });
      segment.appendChild(option);
    });
    withinField.appendChild(segment);
    left.appendChild(withinField);
    missingSplit.appendChild(left);

    const right = node('div', 'field');
    const noteLabel = node('label', '', 'Optional note');
    noteLabel.htmlFor = 'missing-note';
    const noteInput = document.createElement('textarea');
    noteInput.id = 'missing-note';
    noteInput.value = state.drafts.missing.note;
    noteInput.placeholder = 'Why this passage belongs here.';
    noteInput.addEventListener('input', () => {
      state.drafts.missing.note = noteInput.value;
    });
    right.appendChild(noteLabel);
    right.appendChild(noteInput);
    missingSplit.appendChild(right);
    missingForm.appendChild(missingSplit);

    const submitRow = node('div', 'row');
    const submit = node('button', 'btn btn-primary', 'Missing passage');
    submit.type = 'submit';
    submitRow.appendChild(submit);
    missingForm.appendChild(submitRow);
    missingSection.appendChild(missingForm);
    panel.appendChild(missingSection);

    return panel;
  }

  function renderCaseTimeline(caseEntry) {
    const list = node('div', 'history-list');
    safeArray(caseEntry.events).slice().reverse().forEach((event) => {
      const card = node('article', 'history-card stack');
      card.appendChild(node('div', 'history-meta', `${formatDate(event.at)} | ${event.kind}`));
      if (event.kind === 'case-state-changed' && event.state) {
        card.appendChild(node('div', '', `State changed to ${event.state}.`));
      } else if (event.kind === 'case-created') {
        card.appendChild(node('div', '', `Case created for "${caseEntry.query}".`));
      } else {
        card.appendChild(node('div', '', event.kind));
      }
      if (event.eventId) card.appendChild(node('div', 'mono-wrap tiny', event.eventId));
      list.appendChild(card);
    });
    return list;
  }

  function renderJudgmentTimeline() {
    const list = node('div', 'history-list');
    const superseded = supersededIds(state.judgments);
    if (state.judgments.length === 0) {
      list.appendChild(node('div', 'empty', 'No judgments have been recorded for this case yet.'));
      return list;
    }
    [...state.judgments].sort((left, right) => String(right.at || '').localeCompare(String(left.at || ''))).forEach((record) => {
      const key = judgmentKey(record);
      const active = record && record.schemaVersion === 2 && typeof record.judgmentId === 'string' && !superseded.has(record.judgmentId);
      const card = node('article', `history-card stack${active ? ' active' : ' superseded'}`);
      card.appendChild(node('div', 'history-meta', `${formatDate(record.at)} | ${ACTION_LABELS[record.action] || record.action}`));
      const target = record.action === 'missing'
        ? record.reference
        : record.action === 'prefer'
          ? `${record.preferredTargetId} over ${record.otherTargetId}`
          : record.targetId;
      card.appendChild(node('div', '', target || 'Unknown target'));
      const chips = node('div', 'row');
      chips.appendChild(node('span', `pill ${active ? 'pill-good' : 'pill-warn'}`.trim(), active ? 'Active' : 'Superseded'));
      if (record.withinTop) chips.appendChild(node('span', 'pill', `Top ${record.withinTop}`));
      if (record.diagnosis) chips.appendChild(node('span', 'pill', DIAGNOSIS_LABELS[record.diagnosis] || record.diagnosis));
      if (record.supersedes) chips.appendChild(node('span', 'pill', `Supersedes ${record.supersedes.slice(0, 8)}`));
      card.appendChild(chips);
      if (record.note) card.appendChild(node('p', 'excerpt', record.note));
      if (record.excerpt) card.appendChild(node('p', 'excerpt', record.excerpt));
      if (record.judgmentId) card.appendChild(node('div', 'mono-wrap tiny', record.judgmentId));
      if (key) card.appendChild(node('div', 'tiny muted', key));
      list.appendChild(card);
    });
    return list;
  }

  function renderHistoryView() {
    const panel = node('section', 'stack');
    panel.id = 'panel-history';
    panel.role = 'tabpanel';
    panel.setAttribute('aria-labelledby', 'tab-history');

    const head = node('div', 'section-head');
    const text = node('div');
    text.appendChild(node('h2', '', 'History'));
    text.appendChild(node('div', 'tiny muted', 'Case events and judgments, including corrections through supersedes.'));
    head.appendChild(text);
    panel.appendChild(head);

    if (!state.selectedCaseId) {
      if (state.cases.length === 0) {
        panel.appendChild(node('div', 'message', 'Create or select a case to see its history.'));
        return panel;
      }
      const list = node('div', 'case-grid');
      sortCases(state.cases).forEach((entry) => {
        const card = node('article', 'case-card stack');
        card.appendChild(node('div', 'case-query', entry.query));
        card.appendChild(node('div', 'case-meta', `${escapeCaseSourceLabel(entry.source)} | ${entry.state} | ${formatDate(latestEventTime(entry))}`));
        const button = node('button', 'btn', 'Open history');
        button.type = 'button';
        button.addEventListener('click', () => {
          selectCase(entry.caseId, 'history');
        });
        card.appendChild(button);
        list.appendChild(card);
      });
      panel.appendChild(list);
      return panel;
    }
    if (!state.caseDetail || !state.caseDetail.case) {
      panel.appendChild(node('div', 'message warn', 'Select a valid case to inspect its history.'));
      return panel;
    }

    const caseEntry = state.caseDetail.case;
    const summary = node('section', 'history-card stack');
    summary.appendChild(node('h3', '', caseEntry.query));
    const row = node('div', 'row');
    row.appendChild(statusBadge(caseEntry.state));
    row.appendChild(node('span', 'pill', escapeCaseSourceLabel(caseEntry.source)));
    row.appendChild(node('span', 'pill', `${state.judgments.length} judgment${state.judgments.length === 1 ? '' : 's'}`));
    summary.appendChild(row);
    summary.appendChild(node('div', 'mono-wrap tiny', caseEntry.caseId));
    panel.appendChild(summary);

    const split = node('div', 'split');
    const events = node('section', 'stack');
    events.appendChild(node('h3', '', 'Case events'));
    events.appendChild(renderCaseTimeline(caseEntry));
    split.appendChild(events);

    const judgments = node('section', 'stack');
    judgments.appendChild(node('h3', '', 'Judgments'));
    judgments.appendChild(renderJudgmentTimeline());
    split.appendChild(judgments);
    panel.appendChild(split);
    return panel;
  }

  function textPre(text, className) {
    const pre = node('pre', className || 'file-preview');
    pre.textContent = typeof text === 'string' && text !== '' ? text : '(empty)';
    return pre;
  }

  function planOperationCard(operation) {
    const card = node('article', 'change-card');
    const title = node('h3', '', operation.path || 'Unknown file');
    card.appendChild(title);
    const summary = node('div', 'change-summary');
    const kind = operation.afterText === null ? 'Remove'
      : operation.beforeSha256 === null ? 'Create' : 'Update';
    summary.appendChild(node('span', `pill ${kind === 'Remove' ? 'pill-danger' : 'pill-warn'}`, kind));
    if (operation.beforeSha256) summary.appendChild(node('span', 'pill mono-wrap', `Before ${operation.beforeSha256.slice(0, 12)}`));
    card.appendChild(summary);

    const details = document.createElement('details');
    details.className = 'disclosure';
    const disclosure = node('summary', '', 'Exact file preview');
    details.appendChild(disclosure);
    const body = node('div', 'disclosure-body');
    body.appendChild(node('div', 'tiny muted', 'Before'));
    body.appendChild(textPre(operation.beforeText || operation.before ||
      (operation.beforeSha256 ? 'Prior bytes are represented by this preview\'s observed SHA-256.' : '(file absent)')));
    body.appendChild(node('div', 'tiny muted', 'After'));
    body.appendChild(textPre(operation.afterText === null ? '(file removed)' : (operation.afterText || operation.after || '')));
    details.appendChild(body);
    card.appendChild(details);
    return card;
  }

  function messageList(title, entries, kind) {
    const section = node('section', 'stack');
    section.appendChild(node('h3', '', title));
    const values = safeArray(entries).filter((entry) => typeof entry === 'string' && entry.trim() !== '');
    if (values.length === 0) {
      section.appendChild(node('div', 'message success', title === 'Warnings' ? 'No warnings in this preview.' : 'No checklist items in this preview.'));
      return section;
    }
    const list = node('div', 'checklist');
    values.forEach((entry) => list.appendChild(node('div', `message ${kind}`, entry)));
    section.appendChild(list);
    return section;
  }

  function pendingFixtures(plan) {
    return safeArray(plan && plan.fixturesWritten)
      .filter((entry) => entry && entry.fixture && entry.fixture.status === 'pending')
      .sort((left, right) => String(left.fixture.id).localeCompare(String(right.fixture.id)));
  }

  function jobIsFinished(job) {
    return job && ['passed', 'failed', 'timed-out', 'cancelled'].includes(job.state);
  }

  function renderJobCard() {
    const card = node('section', 'check-card');
    card.appendChild(node('h3', '', 'Latest check'));
    const job = state.changes.job;
    if (!job) {
      card.appendChild(node('div', 'empty', 'No check has been started in this browser session.'));
      return card;
    }
    const row = node('div', 'row');
    row.appendChild(statusBadge(job.state || 'queued'));
    row.appendChild(node('span', 'pill', job.jobId || 'check'));
    if (job.runId) row.appendChild(node('span', 'pill mono-wrap', job.runId));
    card.appendChild(row);
    const timing = [
      job.startedAt ? `Started ${formatDate(job.startedAt)}` : `Queued ${formatDate(job.queuedAt)}`,
      job.finishedAt ? `Finished ${formatDate(job.finishedAt)}` : '',
      typeof job.exitCode === 'number' ? `Exit ${job.exitCode}` : '',
    ].filter(Boolean).join(' | ');
    if (timing) card.appendChild(node('div', 'tiny muted', timing));
    if (job.failureReason) card.appendChild(node('div', 'message error', job.failureReason));
    if (!jobIsFinished(job)) {
      const cancel = node('button', 'btn btn-danger', 'Cancel check');
      cancel.type = 'button';
      cancel.addEventListener('click', () => { void cancelCheck(job.runId); });
      card.appendChild(cancel);
    }
    const output = job.output || {};
    const outputText = [
      output.stdout ? `stdout\n${output.stdout}` : '',
      output.stderr ? `stderr\n${output.stderr}` : '',
      output.stdoutTruncated || output.stderrTruncated ? '\nOutput was truncated by the server.' : '',
    ].filter(Boolean).join('\n\n');
    card.appendChild(textPre(outputText || 'Waiting for check output.', 'job-output'));
    return card;
  }

  function renderChangesView() {
    const panel = node('section', 'stack');
    panel.id = 'panel-changes';
    panel.role = 'tabpanel';
    panel.setAttribute('aria-labelledby', 'tab-changes');

    const head = node('div', 'section-head');
    const heading = node('div');
    heading.appendChild(node('h2', '', 'Changes'));
    heading.appendChild(node('div', 'tiny muted', 'Preview fixture changes, promote pending fixtures, and run fixed repository checks.'));
    head.appendChild(heading);
    const preview = node('button', 'btn btn-primary', state.changes.loadingPreview ? 'Creating preview...' : 'Preview fixture changes');
    preview.type = 'button';
    preview.disabled = state.changes.loadingPreview || state.changes.applying;
    preview.addEventListener('click', () => { void loadCompilePreview(); });
    head.appendChild(preview);
    panel.appendChild(head);

    const plan = state.changes.compilePlan;
    if (!plan) {
      panel.appendChild(node('div', 'message', 'Create a preview to inspect exactly what fixture and corpus-subset files would change.'));
    } else {
      const summary = node('section', 'change-card');
      summary.appendChild(node('h3', '', 'Fixture compilation preview'));
      const chips = node('div', 'row');
      chips.appendChild(node('span', 'pill', `${safeArray(plan.operations).length} file operation${safeArray(plan.operations).length === 1 ? '' : 's'}`));
      chips.appendChild(node('span', 'pill', `${pendingFixtures(plan).length} pending fixture${pendingFixtures(plan).length === 1 ? '' : 's'}`));
      summary.appendChild(chips);
      summary.appendChild(node('div', 'mono-wrap tiny', `Digest ${plan.digest}`));
      panel.appendChild(summary);

      const operations = node('section', 'stack');
      operations.appendChild(node('h3', '', 'Exact changes'));
      const operationList = node('div', 'change-list');
      if (safeArray(plan.operations).length === 0) operationList.appendChild(node('div', 'empty', 'This preview would not write any files.'));
      safeArray(plan.operations).forEach((operation) => operationList.appendChild(planOperationCard(operation)));
      operations.appendChild(operationList);
      panel.appendChild(operations);

      if (safeArray(plan.proposedSelections).length > 0) {
        const selections = node('section', 'stack');
        selections.appendChild(node('h3', '', 'Fixture-corpus additions'));
        const list = node('div', 'checklist');
        safeArray(plan.proposedSelections).forEach((entry) => {
          list.appendChild(node('div', 'message warn', `${entry.book} ${safeArray(entry.chapters).join(', ')}: ${entry.why}`));
        });
        selections.appendChild(list);
        panel.appendChild(selections);
      }

      panel.appendChild(messageList('Warnings', plan.warnings, 'warn'));
      panel.appendChild(messageList('Reviewer checklist', plan.checklist, ''));

      const apply = node('section', 'change-card');
      apply.appendChild(node('h3', '', 'Apply this preview'));
      apply.appendChild(node('div', 'tiny muted', 'Type the full preview digest to confirm this exact write. A repository change requires a fresh preview.'));
      const confirmRow = node('div', 'confirm-row');
      const field = node('div', 'field');
      const label = node('label', '', 'Preview digest');
      label.htmlFor = 'compile-digest-confirmation';
      const input = document.createElement('input');
      input.id = 'compile-digest-confirmation';
      input.type = 'text';
      input.autocomplete = 'off';
      input.spellcheck = false;
      input.value = state.changes.compileConfirmation;
      input.addEventListener('input', () => {
        state.changes.compileConfirmation = input.value;
        persistRouteState();
        render();
      });
      field.appendChild(label);
      field.appendChild(input);
      confirmRow.appendChild(field);
      const applyButton = node('button', 'btn btn-primary', state.changes.applying ? 'Applying...' : 'Apply fixture changes');
      applyButton.type = 'button';
      applyButton.disabled = state.changes.applying || input.value !== plan.digest;
      applyButton.addEventListener('click', () => { void applyCompilePreview(); });
      confirmRow.appendChild(applyButton);
      apply.appendChild(confirmRow);
      panel.appendChild(apply);
    }

    const promotion = node('section', 'stack');
    promotion.appendChild(node('h3', '', 'Pending fixture promotion'));
    const pending = pendingFixtures(plan);
    if (pending.length === 0) {
      promotion.appendChild(node('div', 'message', plan ? 'This preview has no pending workbench fixtures to promote.' : 'A compilation preview identifies promotable pending fixtures.'));
    } else {
      const list = node('div', 'change-list');
      pending.forEach((entry) => {
        const fixture = entry.fixture;
        const card = node('article', 'change-card');
        card.appendChild(node('h3', '', fixture.id));
        card.appendChild(node('div', 'tiny muted', fixture.query || entry.path));
        const previewButton = node('button', 'btn', state.changes.loadingPromotionId === fixture.id ? 'Loading promotion preview...' : 'Preview promotion');
        previewButton.type = 'button';
        previewButton.disabled = state.changes.loadingPromotionId === fixture.id || state.changes.applyingPromotionId === fixture.id;
        previewButton.addEventListener('click', () => { void loadPromotionPreview(fixture.id); });
        card.appendChild(previewButton);
        const promotionPlan = state.changes.promotionPlans[fixture.id];
        if (promotionPlan) {
          card.appendChild(node('div', 'mono-wrap tiny', `Digest ${promotionPlan.digest}`));
          const details = document.createElement('details');
          details.className = 'disclosure';
          details.appendChild(node('summary', '', `Exact status change in ${promotionPlan.fixturePath}`));
          const body = node('div', 'disclosure-body');
          body.appendChild(node('div', 'tiny muted', 'Before'));
          body.appendChild(textPre(promotionPlan.before && promotionPlan.before.text));
          body.appendChild(node('div', 'tiny muted', 'After'));
          body.appendChild(textPre(promotionPlan.after && promotionPlan.after.text));
          details.appendChild(body);
          card.appendChild(details);
          const promotionConfirm = node('div', 'confirm-row');
          const field = node('div', 'field');
          const label = node('label', '', 'Promotion digest');
          const inputId = `promotion-digest-${fixture.id}`;
          label.htmlFor = inputId;
          const input = document.createElement('input');
          input.id = inputId;
          input.type = 'text';
          input.autocomplete = 'off';
          input.spellcheck = false;
          input.value = state.changes.selectedPromotionId === fixture.id ? state.changes.promotionConfirmation : '';
          input.addEventListener('input', () => {
            state.changes.selectedPromotionId = fixture.id;
            state.changes.promotionConfirmation = input.value;
            persistRouteState();
            render();
          });
          field.appendChild(label);
          field.appendChild(input);
          promotionConfirm.appendChild(field);
          const promote = node('button', 'btn btn-primary', state.changes.applyingPromotionId === fixture.id ? 'Promoting...' : 'Promote fixture');
          promote.type = 'button';
          promote.disabled = state.changes.applyingPromotionId === fixture.id || input.value !== promotionPlan.digest;
          promote.addEventListener('click', () => { void applyPromotion(fixture.id); });
          promotionConfirm.appendChild(promote);
          card.appendChild(promotionConfirm);
        }
        list.appendChild(card);
      });
      promotion.appendChild(list);
    }
    panel.appendChild(promotion);

    const checks = node('section', 'stack');
    checks.appendChild(node('h3', '', 'Repository checks'));
    checks.appendChild(node('div', 'tiny muted', 'These fixed checks never update a baseline. Only one can run at a time.'));
    const actions = node('div', 'check-actions');
    const running = state.changes.job && !jobIsFinished(state.changes.job);
    [
      ['typecheck', 'Typecheck'],
      ['test', 'Unit tests'],
      ['gauntlet', 'Gauntlet'],
      ['verify', 'Full verify'],
    ].forEach(([jobId, label]) => {
      const button = node('button', 'btn', label);
      button.type = 'button';
      button.disabled = Boolean(running);
      button.addEventListener('click', () => { void startCheck(jobId); });
      actions.appendChild(button);
    });
    checks.appendChild(actions);
    checks.appendChild(renderJobCard());
    panel.appendChild(checks);
    return panel;
  }

  function comparisonRequestId(prefix) {
    const suffix = typeof crypto.randomUUID === 'function'
      ? crypto.randomUUID()
      : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    return `${prefix}-${suffix}`;
  }

  function selectedComparisonQuery() {
    const session = state.comparison.session;
    if (!session || !Array.isArray(session.queries)) return null;
    return session.queries.find((entry) => entry.queryId === state.comparison.selectedQueryId) || session.queries[0] || null;
  }

  function movementCount(query, key) {
    return query && query.movement && Array.isArray(query.movement[key]) ? query.movement[key].length : 0;
  }

  function renderBlindSide(letter, results, selectedPassageId) {
    const side = node('section', 'blind-side');
    side.setAttribute('aria-labelledby', `side-${letter.toLowerCase()}-heading`);
    const head = node('div', 'blind-side-head');
    const sideLabel = node('div', 'side-letter', letter);
    sideLabel.id = `side-${letter.toLowerCase()}-heading`;
    head.appendChild(sideLabel);
    head.appendChild(node('span', 'tiny muted', `${safeArray(results).length} ranked passages`));
    side.appendChild(head);

    const list = node('div', 'blind-results');
    safeArray(results).forEach((result) => {
      const button = node('button', 'blind-result');
      button.type = 'button';
      button.dataset.passageId = result.passageId;
      button.setAttribute('aria-label', `Select ${result.reference} in side ${letter}`);
      button.setAttribute('aria-pressed', String(state.comparison.selectedPassageId === result.passageId));
      button.appendChild(node('span', 'rank-box', `#${result.rank}`));
      button.appendChild(node('span', 'result-reference', result.reference));
      button.appendChild(node('span', 'score-box', Number(result.score).toFixed(2)));
      button.addEventListener('click', () => {
        state.comparison.selectedPassageId = result.passageId;
        render();
        void loadBlindPassageContext(result.passageId);
      });
      list.appendChild(button);
    });
    if (safeArray(results).length === 0) list.appendChild(node('div', 'message', 'No passage ranked on this side.'));
    side.appendChild(list);

    const selected = safeArray(results).find((result) => result.passageId === selectedPassageId) || null;
    const detail = node('div', 'passage-detail stack');
    if (selected === null) {
      detail.appendChild(node('div', 'tiny muted', selectedPassageId ? 'This passage is absent from this side.' : 'Select a passage to inspect its scoring evidence.'));
    } else {
      detail.appendChild(node('h4', '', `${selected.reference} | rank ${selected.rank}`));
      const passageContext = state.comparison.passageContexts[selected.passageId];
      if (passageContext && passageContext.loading) {
        detail.appendChild(node('div', 'tiny muted', 'Loading synchronized passage context.'));
      } else if (passageContext && passageContext.data) {
        detail.appendChild(node('div', 'tiny muted', passageContext.data.contextReference));
        safeArray(passageContext.data.verses).forEach((verse) => {
          const verseLine = node('div', 'reason-row');
          verseLine.appendChild(node('strong', '', `${verse.bookName} ${verse.chapter}:${verse.verse} `));
          verseLine.appendChild(document.createTextNode(verse.text));
          detail.appendChild(verseLine);
        });
      } else if (passageContext && passageContext.error) {
        detail.appendChild(node('div', 'tiny muted', passageContext.error));
      }
      safeArray(selected.reasons).forEach((reason) => {
        const row = node('div', 'reason-row');
        const cap = reason.capped ? `, capped from ${reason.uncappedPoints}` : ', uncapped';
        row.appendChild(node('div', '', `${reason.label} | ${reason.points} points${cap}`));
        row.appendChild(node('div', 'tiny muted', `Family: ${reason.family}`));
        if (reason.provenance) {
          const location = reason.provenance.locator ? ` | ${reason.provenance.locator}` : '';
          const weight = reason.provenance.weight === null ? '' : ` | weight ${reason.provenance.weight}`;
          row.appendChild(node('div', 'tiny muted', `Provenance: ${reason.provenance.label} (${reason.provenance.sourceId})${location}${weight}`));
        } else {
          row.appendChild(node('div', 'tiny muted', 'Provenance: none'));
        }
        detail.appendChild(row);
      });
    }
    side.appendChild(detail);
    return side;
  }

  function renderMovement(query) {
    const section = node('section', 'stack');
    section.appendChild(node('h3', '', 'Exact movement'));
    const grid = node('div', 'movement-grid');
    [
      ['Only in A', movementCount(query, 'onlyA')],
      ['Only in B', movementCount(query, 'onlyB')],
      ['Rank changed', movementCount(query, 'rankMoved')],
      ['Reason changed', movementCount(query, 'reasonChanged')],
      ['Provenance changed', movementCount(query, 'provenanceChanged')],
      ['Score changed', movementCount(query, 'scoreChanged')],
      ['Cap changed', movementCount(query, 'capChanged')],
    ].forEach(([label, count]) => {
      const cell = node('div', 'movement-cell');
      cell.appendChild(node('div', 'metric-value', String(count)));
      cell.appendChild(node('div', 'tiny muted', label));
      grid.appendChild(cell);
    });
    section.appendChild(grid);
    const rankMoves = safeArray(query.movement && query.movement.rankMoved);
    if (rankMoves.length > 0) {
      section.appendChild(node('div', 'tiny muted', rankMoves.map((entry) => `${entry.passageId}: A #${entry.aRank}, B #${entry.bRank}`).join(' | ')));
    }
    return section;
  }

  function renderGateGroups(groups) {
    const section = node('section', 'stack');
    section.appendChild(node('h3', '', 'Gate findings'));
    const grid = node('div', 'gate-grid');
    [
      ['blocking', 'Blocking'],
      ['review-required', 'Review required'],
      ['passing', 'Passing'],
      ['not-applicable', 'Not applicable'],
    ].forEach(([key, label]) => {
      const findings = safeArray(groups && groups[key]);
      const group = node('section', 'gate-group');
      group.appendChild(node('h4', '', `${label} (${findings.length})`));
      const list = node('ul', 'gate-list');
      if (findings.length === 0) list.appendChild(node('li', 'gate-finding muted', 'None'));
      findings.forEach((finding) => list.appendChild(node('li', 'gate-finding', finding.message)));
      group.appendChild(list);
      grid.appendChild(group);
    });
    section.appendChild(grid);
    return section;
  }

  function renderComparisonView() {
    const panel = node('section', 'stack');
    panel.id = 'panel-compare';
    panel.setAttribute('role', 'tabpanel');
    panel.setAttribute('aria-labelledby', 'tab-compare');

    const heading = node('div', 'section-head');
    const title = node('div');
    title.appendChild(node('h2', '', 'Candidate'));
    title.appendChild(node('div', 'tiny muted', 'Blind, query-by-query comparison review.'));
    heading.appendChild(title);
    panel.appendChild(heading);

    if (state.comparison.loading && state.comparison.reviews.length === 0) {
      panel.appendChild(node('div', 'message', 'Loading comparisons.'));
      return panel;
    }
    if (state.comparison.reviews.length === 0) {
      panel.appendChild(node('div', 'message', 'No verified comparison publication is ready for review.'));
      return panel;
    }

    const toolbar = node('div', 'comparison-toolbar');
    const pickerField = node('div', 'field comparison-picker');
    const pickerLabel = node('label', '', 'Comparison');
    pickerLabel.htmlFor = 'comparison-picker';
    const picker = document.createElement('select');
    picker.id = 'comparison-picker';
    state.comparison.reviews.forEach((review) => {
      const option = document.createElement('option');
      option.value = review.reviewId;
      option.textContent = `${review.label} | ${review.reviewedCount}/${review.queryCount} reviewed`;
      option.selected = review.reviewId === state.comparison.selectedReviewId;
      picker.appendChild(option);
    });
    picker.addEventListener('change', () => {
      state.comparison.selectedReviewId = picker.value;
      state.comparison.session = null;
      state.comparison.selectedQueryId = null;
      state.comparison.selectedPassageId = null;
      persistRouteState();
      render();
    });
    pickerField.appendChild(pickerLabel);
    pickerField.appendChild(picker);
    toolbar.appendChild(pickerField);
    const start = node('button', 'btn btn-primary', state.comparison.session ? 'Resume blind review' : 'Start blind review');
    start.type = 'button';
    start.disabled = state.comparison.loading || state.comparison.submitting || !state.comparison.selectedReviewId;
    start.addEventListener('click', () => { void startBlindReview(); });
    toolbar.appendChild(start);
    panel.appendChild(toolbar);

    const session = state.comparison.session;
    if (!session) {
      const selected = state.comparison.reviews.find((entry) => entry.reviewId === state.comparison.selectedReviewId);
      if (selected) {
        panel.appendChild(node('div', 'message', `${selected.queryCount} required queries | ${selected.gateCounts.blocking} blocking findings | ${selected.gateCounts.reviewRequired} need review.`));
      }
      return panel;
    }

    const progress = node('div', 'comparison-progress');
    progress.appendChild(node('span', session.progress.complete ? 'pill pill-good' : 'pill pill-warn', `${session.progress.reviewed} of ${session.progress.total} reviewed`));
    progress.appendChild(node('span', 'pill', session.phase === 'revealed' ? 'Review complete' : 'Blind review'));
    panel.appendChild(progress);

    const rail = node('div', 'query-rail');
    safeArray(session.queries).forEach((query, index) => {
      const button = node('button', 'btn query-step', `${index + 1}. ${query.query}`);
      button.type = 'button';
      if (query.queryId === state.comparison.selectedQueryId) button.setAttribute('aria-current', 'step');
      if (query.judgment) button.appendChild(node('span', 'tiny', ' | reviewed'));
      button.addEventListener('click', () => {
        state.comparison.selectedQueryId = query.queryId;
        state.comparison.selectedPassageId = null;
        state.comparison.passageContexts = Object.create(null);
        state.comparison.missingOpen = false;
        render();
      });
      rail.appendChild(button);
    });
    panel.appendChild(rail);

    const query = selectedComparisonQuery();
    if (!query) return panel;
    const queryHeader = node('section', 'history-card stack');
    queryHeader.id = `blind-query-${query.queryId}`;
    queryHeader.tabIndex = -1;
    const queryTitle = node('div', 'section-head');
    queryTitle.appendChild(node('h3', '', query.query));
    queryTitle.appendChild(node('span', query.verdict === 'regressed' ? 'pill pill-danger' : query.changed ? 'pill pill-warn' : 'pill pill-good', query.verdict.replaceAll('-', ' ')));
    queryHeader.appendChild(queryTitle);
    queryHeader.appendChild(node('div', 'blind-grid'));
    const grid = queryHeader.lastElementChild;
    grid.appendChild(renderBlindSide('A', query.sides.a, state.comparison.selectedPassageId));
    grid.appendChild(renderBlindSide('B', query.sides.b, state.comparison.selectedPassageId));
    panel.appendChild(queryHeader);
    panel.appendChild(renderMovement(query));

    const decision = node('section', 'stack');
    decision.appendChild(node('h3', '', 'Blind judgment'));
    if (query.judgment) {
      decision.appendChild(node('div', 'message success', `Saved: ${query.judgment.choice.replaceAll('-', ' ')}. This judgment is immutable.`));
    } else {
      const choices = node('div', 'judgment-bar');
      [['a-wins', 'A wins'], ['b-wins', 'B wins'], ['tie', 'Tie'], ['both-wrong', 'Both wrong']].forEach(([choice, label]) => {
        const button = node('button', choice === 'both-wrong' ? 'btn btn-danger' : 'btn', label);
        button.type = 'button';
        button.disabled = state.comparison.submitting;
        button.addEventListener('click', () => { void submitBlindChoice(query.queryId, choice); });
        choices.appendChild(button);
      });
      decision.appendChild(choices);
    }
    const missingToggle = node('button', 'btn btn-subtle', state.comparison.missingOpen ? 'Close missing passage' : 'Record missing passage');
    missingToggle.type = 'button';
    missingToggle.setAttribute('aria-expanded', String(state.comparison.missingOpen));
    missingToggle.addEventListener('click', () => { state.comparison.missingOpen = !state.comparison.missingOpen; render(); });
    decision.appendChild(missingToggle);
    if (state.comparison.missingOpen) {
      const form = node('form', 'missing-form');
      const referenceField = node('div', 'field');
      const referenceLabel = node('label', '', 'Missing passage reference');
      referenceLabel.htmlFor = 'comparison-missing-reference';
      const reference = document.createElement('input');
      reference.id = 'comparison-missing-reference';
      reference.type = 'text';
      reference.autocomplete = 'off';
      reference.value = state.comparison.missingReference;
      reference.addEventListener('input', () => { state.comparison.missingReference = reference.value; });
      referenceField.appendChild(referenceLabel);
      referenceField.appendChild(reference);
      const noteField = node('div', 'field');
      const noteLabel = node('label', '', 'Note');
      noteLabel.htmlFor = 'comparison-missing-note';
      const note = document.createElement('input');
      note.id = 'comparison-missing-note';
      note.type = 'text';
      note.value = state.comparison.missingNote;
      note.addEventListener('input', () => { state.comparison.missingNote = note.value; });
      noteField.appendChild(noteLabel);
      noteField.appendChild(note);
      const save = node('button', 'btn', 'Save missing passage');
      save.type = 'submit';
      save.disabled = state.comparison.submitting;
      form.appendChild(referenceField);
      form.appendChild(noteField);
      form.appendChild(save);
      form.addEventListener('submit', (event) => { event.preventDefault(); void submitComparisonMissing(query.queryId); });
      decision.appendChild(form);
    }
    safeArray(query.missingPassages).forEach((entry) => decision.appendChild(node('div', 'message warn', `Missing: ${entry.reference}${entry.note ? ` | ${entry.note}` : ''}`)));
    panel.appendChild(decision);

    if (query.reveal) {
      const reveal = node('section', 'reveal-panel stack');
      reveal.appendChild(node('h3', '', 'Identity reveal'));
      reveal.appendChild(node('div', '', `A was ${query.reveal.sideA}. B was ${query.reveal.sideB}.`));
      reveal.appendChild(node('div', 'pill pill-good', `Recorded preference: ${query.reveal.preference.replaceAll('-', ' ')}`));
      const details = document.createElement('details');
      const summary = document.createElement('summary');
      summary.textContent = 'Technical details';
      details.appendChild(summary);
      details.appendChild(node('pre', 'file-preview', JSON.stringify({ identities: query.reveal.identities, exact: query.reveal.exact }, null, 2)));
      reveal.appendChild(details);
      const followUp = node('button', 'btn', 'Create follow-up case');
      followUp.type = 'button';
      followUp.addEventListener('click', () => { void createCase(query.query, 'regression'); });
      reveal.appendChild(followUp);
      reveal.appendChild(node('div', 'tiny muted', 'A follow-up case is separate from this blind preference. No fixture is changed automatically.'));
      panel.appendChild(reveal);
    }

    panel.appendChild(renderGateGroups(session.gateGroups));
    const admission = node('section', 'history-card stack');
    admission.appendChild(node('h3', '', 'Admission control'));
    safeArray(session.admission.blockers).forEach((blocker) => admission.appendChild(node('div', 'message error', blocker)));
    const admit = node('button', 'btn btn-primary', session.admission.enabled ? 'Open admission review' : 'Admission blocked');
    admit.type = 'button';
    admit.disabled = !session.admission.enabled;
    admit.addEventListener('click', () => {
      state.view = 'admission';
      persistRouteState();
      render();
      void loadAdmissions();
    });
    admission.appendChild(admit);
    panel.appendChild(admission);
    return panel;
  }

  function renderDataTable(headers, rows, label) {
    const wrap = node('div', 'data-table-wrap');
    const table = node('table', 'data-table');
    if (label) table.setAttribute('aria-label', label);
    const head = document.createElement('thead');
    const headRow = document.createElement('tr');
    headers.forEach((header) => headRow.appendChild(node('th', header.numeric ? 'numeric' : '', header.label)));
    head.appendChild(headRow);
    table.appendChild(head);
    const body = document.createElement('tbody');
    rows.forEach((cells) => {
      const row = document.createElement('tr');
      cells.forEach((cell, index) => {
        const td = node('td', headers[index] && headers[index].numeric ? 'numeric' : '');
        td.dataset.label = headers[index] ? headers[index].label : '';
        if (cell instanceof Node) td.appendChild(cell);
        else td.textContent = String(cell == null ? '' : cell);
        row.appendChild(td);
      });
      body.appendChild(row);
    });
    table.appendChild(body);
    wrap.appendChild(table);
    return wrap;
  }

  function metricValue(metric) {
    if (metric && typeof metric.count === 'number') return String(metric.count);
    if (!metric || metric.rate === null || typeof metric.rate !== 'number') return 'Unavailable';
    return `${(metric.rate * 100).toFixed(1)}%`;
  }

  function renderMetricTable(metrics, label) {
    const rows = safeArray(metrics).map((metric) => [
      String(metric.metricKey || 'metric'),
      metricValue(metric),
      typeof metric.denominator === 'number' ? `${metric.numerator}/${metric.denominator}` : `${metric.sampleSize || 0} sample`,
      metric.sparse ? 'Sparse' : 'Comparable',
      String(metric.context || ''),
    ]);
    if (rows.length === 0) return node('div', 'empty', 'No metrics are available.');
    return renderDataTable([
      { label: 'Metric' }, { label: 'Value', numeric: true }, { label: 'Evidence', numeric: true }, { label: 'Precision' }, { label: 'Context' },
    ], rows, label);
  }

  function renderSessionsView() {
    const panel = node('section', 'stack');
    panel.id = 'panel-sessions';
    panel.setAttribute('role', 'tabpanel');
    panel.setAttribute('aria-labelledby', 'tab-sessions');
    const head = node('div', 'section-head');
    const title = node('div');
    title.appendChild(node('h2', '', 'Review sessions'));
    title.appendChild(node('div', 'tiny muted', 'Build a source-balanced queue, preserve its order, and resume exactly where review stopped.'));
    head.appendChild(title);
    const reload = node('button', 'btn btn-subtle', 'Reload');
    reload.type = 'button';
    reload.addEventListener('click', () => { void loadSessions(); });
    head.appendChild(reload);
    panel.appendChild(head);
    if (state.readOnly) panel.appendChild(readOnlyNotice());

    const controls = node('form', 'operations-toolbar');
    const definitions = [
      ['Kind', 'select', 'kind'], ['Reviewed size', 'number', 'reviewedSize'], ['Seed', 'text', 'seed'], ['Reviewer', 'text', 'reviewer'],
    ];
    definitions.forEach(([label, kind, key]) => {
      const field = node('div', 'field');
      const id = `session-${key}`;
      const caption = document.createElement('label'); caption.htmlFor = id; caption.textContent = label;
      let control;
      if (kind === 'select') {
        control = document.createElement('select');
        ['weekly-triage', 'stale-reconfirmation', 'candidate-regression', 'calibration', 'holdout'].forEach((value) => {
          const option = document.createElement('option'); option.value = value; option.textContent = value.replace(/-/g, ' '); control.appendChild(option);
        });
      } else {
        control = document.createElement('input'); control.type = kind; if (kind === 'number') { control.min = '1'; control.max = '200'; }
      }
      control.id = id;
      control.disabled = state.readOnly;
      control.value = String(state.sessions.form[key]);
      control.addEventListener('input', () => { state.sessions.form[key] = kind === 'number' ? Number(control.value) : control.value; });
      field.appendChild(caption); field.appendChild(control); controls.appendChild(field);
    });
    [['qualifiedReviewer', 'Pastoral review qualified'], ['authorizedHoldoutReview', 'Authorized holdout review']].forEach(([key, label]) => {
      const field = node('label', 'row tiny');
      const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = state.sessions.form[key];
      checkbox.disabled = state.readOnly;
      checkbox.addEventListener('change', () => { state.sessions.form[key] = checkbox.checked; });
      field.appendChild(checkbox); field.appendChild(document.createTextNode(label)); controls.appendChild(field);
    });
    const start = node('button', 'btn btn-primary', state.sessions.submitting ? 'Starting' : 'Start session');
    start.type = 'submit'; start.disabled = state.readOnly || state.sessions.submitting || state.sessions.loading;
    controls.appendChild(start);
    controls.addEventListener('submit', (event) => { event.preventDefault(); void startStudioSession(); });
    panel.appendChild(controls);

    const formula = node('div', 'privacy-note tiny');
    formula.textContent = 'Priority = outcome severity + converted-rank evidence + recurrence + age + source factor + blocker status. Device count is a bounded recurrence signal; popularity is excluded. A small seeded exploration sample protects quiet failures.';
    panel.appendChild(formula);

    if (state.sessions.loading && state.sessions.items.length === 0) panel.appendChild(node('div', 'empty', 'Loading sessions.'));
    else if (state.sessions.items.length === 0) panel.appendChild(node('div', 'empty', 'No review sessions yet.'));
    else {
      const picker = document.createElement('select'); picker.className = 'comparison-picker'; picker.setAttribute('aria-label', 'Review session');
      state.sessions.items.forEach((entry, index) => {
        const option = document.createElement('option');
        option.value = entry.sessionId || `opaque-${index}`;
        option.textContent = entry.opaqueMembership ? `Holdout | ${entry.status} | membership protected` : `${entry.kind} | ${entry.status} | ${entry.progress.handled}/${entry.progress.total}`;
        if (state.sessions.selected && entry.sessionId === state.sessions.selected.sessionId) option.selected = true;
        picker.appendChild(option);
      });
      picker.addEventListener('change', () => {
        const chosen = state.sessions.items.find((entry) => entry.sessionId === picker.value);
        if (chosen) { state.sessions.selected = chosen; render(); }
      });
      panel.appendChild(picker);
    }

    const session = state.sessions.selected;
    if (session && !session.opaqueMembership) {
      const progress = session.progress || { handled: 0, total: 0, remaining: 0 };
      const summary = node('section', 'operations-band');
      const summaryHead = node('div', 'row');
      summaryHead.appendChild(node('span', 'pill', `${progress.handled}/${progress.total} handled`));
      summaryHead.appendChild(node('span', 'pill', `${progress.remaining} remaining`));
      summaryHead.appendChild(statusBadge(session.status));

  function operationRequestId(prefix) {
    const uuid = typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;

  }

    try {
      const payload = {
        requestId: operationRequestId(action), expectedRevision: session.revision, expectedDigest: session.digest,
        ...(itemId ? { itemId } : {}), ...(reason ? { reason } : {}), ...(requeue ? { requeue } : {}),
      };
      const scope = session.kind === 'holdout' ? '?scope=authorized-review' : '';
      const data = await requestJson(`/api/v2/sessions/${encodeURIComponent(session.sessionId)}/${action}${scope}`, {

      });
      state.sessions.selected = data.session;
      const index = state.sessions.items.findIndex((entry) => entry.sessionId === data.session.sessionId);
      if (index >= 0) state.sessions.items[index] = data.session;
      setGlobalMessage('success', action === 'complete-session' ? 'Session completed.' : action === 'skip-item' ? 'Item skipped with an explicit requeue outcome.' : 'Item completed.');

  async function fileBase64(file) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    let binary = '';
    for (let offset = 0; offset < bytes.length; offset += 32768) binary += String.fromCharCode(...bytes.subarray(offset, Math.min(bytes.length, offset + 32768)));
    return btoa(binary);
  }

  async function previewAuditFiles() {
    if (state.audits.loading || state.audits.files.length === 0) return;
    state.audits.loading = true; render();
    try {
      const files = [];
      for (const file of state.audits.files) {
        if (file.size < 1 || file.size > 1048576) throw new Error('Each distillate must be between 1 byte and 1 MiB.');
        files.push({ filename: file.name, size: file.size, contentBase64: await fileBase64(file) });
      }
      const data = await requestJson('/api/v2/audits/preview', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ files }),
      });
      state.audits.preview = data.audit; state.audits.recoveryDigest = data.audit.auditDigest; persistRouteState();
      setGlobalMessage('success', 'Audit preview complete. Suppressed evidence remains hidden.');
    } catch (error) { setGlobalMessage('error', error && error.message ? error.message : 'Audit preview failed.'); }
    finally { state.audits.loading = false; render(); }
  }

  async function loadSelectedCaseData(renderNow) {
    if (!state.selectedCaseId) {
      state.caseDetail = null;
      state.judgments = [];
      render();
      return;
    }
    const caseId = state.selectedCaseId;
    const serial = ++state.requests.caseSerial;
    state.loading.review = true;
    state.loading.history = true;
    if (renderNow !== false) render();
    try {
      const [detail, history] = await Promise.all([
        requestJson(`/api/v2/cases/${encodeURIComponent(caseId)}`),
        requestJson(`/api/v2/judgments?caseId=${encodeURIComponent(caseId)}`),
      ]);
      if (serial !== state.requests.caseSerial || state.selectedCaseId !== caseId) return;
      state.caseDetail = detail;
      state.judgments = history && Array.isArray(history.judgments) ? history.judgments : [];
      if (detail && detail.case && !state.cases.some((entry) => entry.caseId === detail.case.caseId)) {
        state.cases = sortCases([...state.cases, detail.case]);
      }
    } catch (error) {
      if (serial !== state.requests.caseSerial || state.selectedCaseId !== caseId) return;
      state.caseDetail = null;
      state.judgments = [];
      setGlobalMessage('warn', error && typeof error.message === 'string' ? error.message : 'Case review could not be loaded.');
    } finally {
      if (serial !== state.requests.caseSerial || state.selectedCaseId !== caseId) return;
      state.loading.review = false;
      state.loading.history = false;
      render();
    }
  }

  let jobEventSource = null;
  let jobPollTimer = null;

  function stopJobWatch() {
    if (jobEventSource) {
      jobEventSource.close();
      jobEventSource = null;
    }
    if (jobPollTimer !== null) {
      window.clearInterval(jobPollTimer);
      jobPollTimer = null;
    }
    state.changes.polling = false;
  }

  function updateJob(job) {
    if (!job || typeof job.runId !== 'string') return;
    state.changes.job = job;
    persistRouteState();
    if (jobIsFinished(job)) stopJobWatch();
    render();
  }

  async function pollJob(runId) {
    try {
      const data = await requestJson(`/api/v2/jobs/${encodeURIComponent(runId)}`);
      if (data && data.job) updateJob(data.job);
    } catch (error) {
      if (error && error.status === 404 && state.changes.job && state.changes.job.runId === runId) {
        state.changes.job = null;
        persistRouteState();
        stopJobWatch();
        render();
      }
    }
  }

  function watchJob(runId) {
    stopJobWatch();
    state.changes.polling = true;
    void pollJob(runId);
    if (typeof window.EventSource === 'function') {
      jobEventSource = new EventSource(`/api/v2/jobs/${encodeURIComponent(runId)}/events`);
      jobEventSource.addEventListener('status', (event) => {
        try {
          updateJob(JSON.parse(event.data));
        } catch {
          // Polling remains the recovery path for malformed event data.
        }
      });
      jobEventSource.onerror = () => {
        if (jobEventSource) {
          jobEventSource.close();
          jobEventSource = null;
        }
      };
    }
    jobPollTimer = window.setInterval(() => { void pollJob(runId); }, 1000);
  }

      await loadHealth();
    } catch (error) {
      setGlobalMessage('error', error && typeof error.message === 'string' ? error.message : 'Fixture changes could not be applied.');
    } finally {
      state.changes.applying = false;
      persistRouteState();
      render();
    }
  }

  async function loadPromotionPreview(fixtureId) {
    state.changes.loadingPromotionId = fixtureId;
    state.changes.selectedPromotionId = fixtureId;
    state.changes.promotionConfirmation = '';
    render();
    try {
      const data = await requestJson(`/api/v2/fixtures/${encodeURIComponent(fixtureId)}/promotion/preview`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: '{}',
      });
      state.changes.promotionPlans[fixtureId] = data && data.plan ? data.plan : null;
      setGlobalMessage('success', `Promotion preview for ${fixtureId} is ready for review.`);
    } catch (error) {
      setGlobalMessage('error', error && typeof error.message === 'string' ? error.message : 'Promotion preview could not be created.');
    } finally {
      state.changes.loadingPromotionId = null;
      persistRouteState();
      render();
    }
  }

  async function applyPromotion(fixtureId) {
    const plan = state.changes.promotionPlans[fixtureId];
    if (!plan || state.changes.selectedPromotionId !== fixtureId || state.changes.promotionConfirmation !== plan.digest) return;
    state.changes.applyingPromotionId = fixtureId;
    render();
    try {
      await requestJson(`/api/v2/fixtures/${encodeURIComponent(fixtureId)}/promotion/apply`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ digest: plan.digest }),
      });
      state.changes.compilePlan = null;
      state.changes.promotionPlans = Object.create(null);
      state.changes.selectedPromotionId = null;
      state.changes.promotionConfirmation = '';
      setGlobalMessage('success', `${fixtureId} is active. Create a fresh fixture preview for the current state.`);
      await loadHealth();
    } catch (error) {
      setGlobalMessage('error', error && typeof error.message === 'string' ? error.message : 'Fixture promotion could not be applied.');
    } finally {
      state.changes.applyingPromotionId = null;
      persistRouteState();
      render();
    }
  }

  async function startCheck(jobId) {
    if (state.changes.job && !jobIsFinished(state.changes.job)) return;
    try {
      const data = await requestJson('/api/v2/checks', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ jobId }),
      });
      if (!data || !data.job) throw new Error('The check did not return a job record.');
      updateJob(data.job);
      watchJob(data.job.runId);
      setGlobalMessage('', `${jobId} check started.`);
    } catch (error) {
      setGlobalMessage('error', error && typeof error.message === 'string' ? error.message : 'Check could not be started.');
      render();
    }
  }

  async function cancelCheck(runId) {
    try {
      const data = await requestJson(`/api/v2/jobs/${encodeURIComponent(runId)}/cancel`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: '{}',
      });
      if (data && data.job) updateJob(data.job);
      setGlobalMessage('warn', 'Check cancellation was requested.');
    } catch (error) {
      setGlobalMessage('error', error && typeof error.message === 'string' ? error.message : 'Check could not be cancelled.');
      render();
    }
  }

  async function restoreSavedJob() {
    const job = state.changes.job;
    if (!job || typeof job.runId !== 'string') return;
    await pollJob(job.runId);
    if (state.changes.job && !jobIsFinished(state.changes.job)) watchJob(job.runId);
  }

  async function submitJudgment(payload, successMessage) {
    try {
      const clean = {};
      Object.keys(payload).forEach((key) => {
        if (payload[key] !== undefined && payload[key] !== '') clean[key] = payload[key];
      });
      await requestJson('/api/v2/judgments', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(clean),
      });
      setGlobalMessage('success', successMessage);
      if (clean.action === 'missing') {
        state.drafts.missing.reference = '';
        state.drafts.missing.note = '';
      }
      if (clean.action === 'prefer') {
        state.drafts.preferredTargetId = null;
        state.drafts.pairNote = '';
      }
      if (clean.action === 'irrelevant' && typeof clean.targetId === 'string') {
        const resultDraft = state.drafts.results[clean.targetId];
        if (resultDraft) resultDraft.interview = null;
      }
      await Promise.all([loadCases(false), loadSelectedCaseData(false)]);
    } catch (error) {
      setGlobalMessage('error', error && typeof error.message === 'string' ? error.message : 'Judgment could not be saved.');
      render();
    }
  }

  async function transitionCase(caseId, nextState, successMessage) {
    try {
      await requestJson(`/api/v2/cases/${encodeURIComponent(caseId)}/state`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ state: nextState }),
      });
      setGlobalMessage('success', successMessage);
      await Promise.all([loadCases(false), loadSelectedCaseData(false), loadInbox(false)]);
    } catch (error) {
      setGlobalMessage('error', error && typeof error.message === 'string' ? error.message : 'Case state could not be updated.');
      render();
    }
  }

  async function createCase(query, source) {
    createCaseSubmit.disabled = true;
    setInlineMessage(createCaseMessage, '', 'Creating case.');
    try {
      const data = await requestJson('/api/v2/cases', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ query, source }),
      });
      setInlineMessage(createCaseMessage, 'success', 'Case created.');
      newCaseQuery.value = '';
      state.drafts.preferredTargetId = null;
      state.caseDetail = null;
      state.judgments = [];
      state.selectedCaseId = data.case.caseId;
      state.view = 'review';
      persistRouteState();
      await Promise.all([loadCases(false), loadInbox(false), loadSelectedCaseData(false)]);
      render();
      mainPanel.focus();
    } catch (error) {
      setInlineMessage(createCaseMessage, 'error', error && typeof error.message === 'string' ? error.message : 'Case could not be created.');
    } finally {
      createCaseSubmit.disabled = false;
    }
  }

  function selectCase(caseId, nextView) {
    state.selectedCaseId = caseId;
    state.view = nextView || state.view;
    state.caseDetail = null;
    state.judgments = [];
    state.drafts.preferredTargetId = null;
    state.drafts.pairNote = '';
    persistRouteState();
    void loadSelectedCaseData();
    render();
  }

  function wireStaticControls() {
    clear(newCaseSource);
    CASE_SOURCES.forEach((source) => {
      const option = document.createElement('option');
      option.value = source;
      option.textContent = escapeCaseSourceLabel(source);
      if (source === 'manual') option.selected = true;
      newCaseSource.appendChild(option);
    });

    refreshAllButton.addEventListener('click', () => {
      void refreshAll();
    });
    reloadCasesButton.addEventListener('click', () => {
      void loadCases();
    });
    createCaseForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const query = newCaseQuery.value.trim();
      const source = newCaseSource.value;
      if (!query) {
        setInlineMessage(createCaseMessage, 'warn', 'Query is required.');
        return;
      }
      void createCase(query, source);
    });
  }

  async function boot() {
    loadStoredRouteState();
    if (state.view === 'sessions') state.sessions.loading = true;
    if (state.view === 'quality') state.quality.loading = true;
    if (state.view === 'admission') state.admission.loading = true;
    if (state.view === 'publish') state.publish.loading = true;
    wireStaticControls();
    render();
    await loadCases(false);
    if (!state.selectedCaseId && state.cases[0]) state.selectedCaseId = state.cases[0].caseId;
    persistRouteState();
    await Promise.all([
      loadHealth(),
      loadInbox(false),
      loadComparisonReviews(false),
      loadSelectedCaseData(false),
      loadConceptLabels(),
    ]);
    if (state.view === 'sessions') await loadSessions(false);
    else if (state.view === 'quality') await loadQuality(false);
    else if (state.view === 'audits') await recoverAuditPreview();
    else if (state.view === 'admission') await loadAdmissions(false);
    else if (state.view === 'publish') await loadPublish(false);
    setGlobalMessage('success', 'Workbench ready.');
    render();
  }

  void boot();
})();
</script>
</body>
</html>
