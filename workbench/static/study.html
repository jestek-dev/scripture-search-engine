    const index = top.findIndex((result) => result.targetId === targetId);
    if (index !== -1) { state.focus = index; state.expandedIndex = index; state.inTail = false; }
    renderAll({ focus: true });
  }
  function handleUndoKey() {
    const last = state.lastCommit;
    if (last === null) return;
    if (last.kind === 'verdict') { reopenCall(last.targetId); return; }
    if (last.kind === 'bulk') { showToast(COPY.bulkUndoHint); return; }
    // Suggestions and rescues have no reopen path (§4.5); state permanence.
    showToast(COPY.permanence);
  }

  // §bulk — serial batch; stops at the first failure (§3.2 partial receipt).
  function toggleSelected(targetId) {
    if (state.judgedByTarget[targetId] !== undefined) return;
    if (state.selected[targetId] === true) delete state.selected[targetId];
    else state.selected[targetId] = true;
    renderAll({});
  }
  async function runBulk() {
    if (degradedReadOnly()) { showToast(COPY.readOnlyToast); return; }
    const top = state.search.results.slice(0, TOP_WINDOW);
    const chosen = top.filter((result) => state.selected[result.targetId] === true);
    const total = chosen.length;
    if (total === 0) return;
    let committed = 0;
    for (const result of chosen) {
      const outcome = await postJudgmentBody({ action: 'helpful', targetId: result.targetId }, { silentFailure: true });
      if (!outcome.ok) break;
      committed += 1;
      delete state.selected[result.targetId];
    }
    state.lastCommit = { kind: 'bulk' };
    if (committed === total) {
      state.selected = Object.create(null);
      showToast(COPY.bulkDone(total));
    } else {
      showToast(COPY.bulkPartial(committed, total));
    }
    renderAll({});
  }

  // §health — refetches on window focus and after any failed POST (§3.11).
  let healthRefetchInFlight = false;
  function refetchHealth() {
    if (healthRefetchInFlight) return;
    healthRefetchInFlight = true;
    apiHealth().then((health) => { state.health = health; }).catch(() => { /* keep the last known health */ }).then(() => {
      healthRefetchInFlight = false;
      renderAll({});
      if (state.rescue !== null) renderRescue();
      if (state.missingForm !== null) renderMissingForm();
    });
  }

  async function addToQueue() {
    if (degradedReadOnly()) { showToast(COPY.readOnlyToast); return; }
    const query = state.search.query;
    if (caseForQuery(query) !== null || state.activeCase !== null) return;
    try {
      const data = await apiCaseCreate(query);
      state.cases = state.cases.concat([data.case]);
      if (data.review !== null && typeof data.review.token === 'string') adoptSnapshot(data.review, data.case);
      renderAll({});
    } catch (error) {
      refetchHealth();
      showToast(COPY.postFailed);
    }
  }

  // §focus — roving tabindex over cards, divider, expanded tail rows.
  function stopCount() {
    const search = state.search;
    if (search.status !== 'results') return 0;
    const top = Math.min(search.results.length, TOP_WINDOW);
    const tail = search.results.length - top;
    if (tail <= 0) return top;
    return state.tailExpanded ? top + 1 + tail : top + 1;
  }
  function topCount() {
    return Math.min(state.search.results.length, TOP_WINDOW);
  }
  function onCardFocused(index) {
    state.focus = index;
    state.inTail = false;
    if (state.expandedIndex !== index) {
      state.expandedIndex = index;
      renderAll({ focus: true });
      return;
    }
    renderQueue();
    renderRail();
  }
  function onTailRowFocused(stopIndex) {
    state.focus = stopIndex;
    // When focus first enters the tail, the rail fronts the Context tab;
    // J/K within the tail keeps whichever tab the reviewer chose.
    if (!state.inTail) state.railTab = 'context';
    state.inTail = true;
    const result = focusedResult();
    if (result !== null) ensureContext(result.reference);
    renderTailFocusClasses();
    renderRail();
  }
  function renderTailFocusClasses() {
    const rows = document.querySelectorAll('.tail-row');
    rows.forEach((row) => {
      row.classList.toggle('focused', row.dataset.stop === String(state.focus));
      row.tabIndex = row.dataset.stop === String(state.focus) ? 0 : -1;
    });
  }
  function focusStop(index) {
    state.focus = index;
    if (index < topCount()) {
      if (state.expandedIndex !== index) state.expandedIndex = index;
      renderAll({ focus: true });
      return;
    }
    renderAll({ focus: true });
  }
  function focusCurrentStop() {
    const list = document.getElementById('results-list');
    if (list === null) return;
    const target = state.focus < topCount()
      ? list.querySelector('[data-stop="' + state.focus + '"]')
      : state.focus === topCount()
        ? document.getElementById('tail-divider')
        : list.querySelector('.tail-row[data-stop="' + state.focus + '"]');
    if (target !== null) target.focus();
  }
  function moveFocus(delta) {
    const total = stopCount();
    if (total === 0) return;
    const next = state.focus + delta;
    // Plain J/K navigation never wraps.
    if (next < 0 || next >= total) return;
    focusStop(next);
  }

  // §layers — shared focus-contract plumbing (§3.12): every layer is a
  // focus trap; on close, focus returns to the element that opened it.
  function trapTab(event) {
    const dialog = document.querySelector('#dialog-slot .layer-dialog');
    if (dialog === null) return;
    const candidates = dialog.querySelectorAll('input, textarea, button, [tabindex]');
    const focusables = [];
    for (const el of candidates) {
      if (!el.disabled && el.tabIndex !== -1) focusables.push(el);
    }
    if (focusables.length === 0) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }
  function openLayerDialog(titleText, titleId) {
    const slot = document.getElementById('dialog-slot');
    clear(slot);
    const overlay = node('div', 'overlay');
    const dialog = node('div', 'layer-dialog');
    dialog.setAttribute('role', 'dialog');
    dialog.setAttribute('aria-modal', 'true');
    dialog.setAttribute('aria-labelledby', titleId);
    const title = node('h2', 'layer-title', titleText);
    title.id = titleId;
    dialog.appendChild(title);
    overlay.appendChild(dialog);
    slot.appendChild(overlay);
    return dialog;
  }
  function closeLayerDialog(opener) {
    clear(document.getElementById('dialog-slot'));
    // Focus returns to the element that opened the layer (§3.12). Re-renders
    // replace DOM nodes, so a stale opener is re-found by id or by the
    // roving-focus position (the focused card / tail row).
    if (opener && typeof opener.focus === 'function' && document.contains(opener)) { opener.focus(); return; }
    if (opener && typeof opener.id === 'string' && opener.id !== '') {
      const byId = document.getElementById(opener.id);
      if (byId !== null) { byId.focus(); return; }
    }
    if (state.search.status === 'results') focusCurrentStop();
  }

  // §interview — the not-relevant interview (§3.2, fixes §3.13.1–2).
  function openInterview(result) {
    if (degradedReadOnly()) { showToast(COPY.readOnlyToast); return; }
    const concepts = conceptEvidence(result);
    const fragments = lexicalFragments(result, state.search.query);
    const resolved = concepts.find((concept) => concept.id !== null);
    state.interview = {
      targetId: result.targetId,
      reference: result.reference,
      // The server requires conceptId for the concept-mode diagnoses; with
      // no resolvable id the interview falls back to auto mode (§4.4) and
      // the unresolved label rides the note into curation review.
      mode: resolved !== undefined ? 'concept' : 'auto',
      concept: resolved !== undefined ? resolved : null,
      unresolvedLabel: resolved === undefined && concepts.length > 0 ? concepts[0].label : null,
      matched: fragments.length > 0 ? fragments[0] : null,
      step: 1,
      diagnosis: null,
      note: '',
      opener: document.activeElement,
    };
    renderAll({});
    renderInterview();
  }
  function closeInterview() {
    const interview = state.interview;
    state.interview = null;
    closeLayerDialog(interview !== null ? interview.opener : null);
    renderAll({});
  }
  function renderInterview() {
    const interview = state.interview;
    if (interview === null) return;
    const dialog = openLayerDialog('Not relevant?', 'interview-title');
    dialog.id = 'interview-dialog';
    let firstFocus = null;

    const cancelButton = () => {
      const cancel = node('button', 'btn-quiet', 'Cancel');
      cancel.type = 'button';
      cancel.addEventListener('click', closeInterview);
      return cancel;
    };

    if (interview.mode === 'auto') {
      const prompt = node('p', 'layer-prompt', interview.matched !== null
        ? COPY.interviewAuto(interview.matched)
        : COPY.interviewAutoNoFragment);
      dialog.appendChild(prompt);
      const actions = node('div', 'layer-actions');
      const yes = node('button', 'btn-primary', COPY.interviewYes);
      yes.type = 'button';
      yes.id = 'interview-confirm';
      yes.addEventListener('click', () => { void commitInterview(); });
      actions.appendChild(yes);
      actions.appendChild(cancelButton());
      dialog.appendChild(actions);
      firstFocus = yes;
    } else if (interview.diagnosis !== null) {
      // Concept mode requires a why, before commit (§3.2).
      const label = node('label', 'layer-prompt', COPY.whyLabel);
      label.htmlFor = 'interview-why';
      dialog.appendChild(label);
      const why = node('textarea', 'note-input');
      why.id = 'interview-why';
      why.value = interview.note;
      why.addEventListener('input', () => {
        interview.note = why.value;
        const confirm = document.getElementById('interview-confirm');
        if (confirm !== null) confirm.disabled = interview.note.trim() === '';
      });
      dialog.appendChild(why);
      const actions = node('div', 'layer-actions');
      const confirm = node('button', 'btn-primary', COPY.confirmNotRelevant);
      confirm.type = 'button';
      confirm.id = 'interview-confirm';
      confirm.disabled = interview.note.trim() === '';
      confirm.addEventListener('click', () => { void commitInterview(); });
      actions.appendChild(confirm);
      actions.appendChild(cancelButton());
      dialog.appendChild(actions);
      firstFocus = why;
    } else if (interview.step === 1) {
      dialog.appendChild(node('p', 'layer-prompt', COPY.conceptStep1(interview.concept.label, interview.reference)));
      const actions = node('div', 'layer-actions');
      const yes = node('button', 'btn-quiet', COPY.conceptStep1Yes);
      yes.type = 'button';
      yes.addEventListener('click', () => { interview.step = 2; renderInterview(); });
      const no = node('button', 'btn-primary', COPY.conceptStep1No);
      no.type = 'button';
      no.addEventListener('click', () => { interview.diagnosis = 'wrong-anchor'; renderInterview(); });
      actions.appendChild(yes);
      actions.appendChild(no);
      const cancel = node('button', 'layer-cancel-link', 'Cancel (Esc)');
      cancel.type = 'button';
      cancel.addEventListener('click', closeInterview);
      actions.appendChild(cancel);
      dialog.appendChild(actions);
      firstFocus = yes;
    } else {
      dialog.appendChild(node('p', 'layer-prompt', COPY.conceptStep2(state.search.query)));
      const actions = node('div', 'layer-actions');
      const commit = node('button', 'btn-primary', COPY.conceptStep2Commit);
      commit.type = 'button';
      commit.addEventListener('click', () => { interview.diagnosis = 'concept-misfire'; renderInterview(); });
      const keep = node('button', 'btn-quiet', COPY.conceptStep2Keep);
      keep.type = 'button';
      keep.addEventListener('click', closeInterview);
      actions.appendChild(commit);
      actions.appendChild(keep);
      const cancel = node('button', 'layer-cancel-link', 'Cancel (Esc)');
      cancel.type = 'button';
      cancel.addEventListener('click', closeInterview);
      actions.appendChild(cancel);
      dialog.appendChild(actions);
      firstFocus = commit;
    }
    dialog.appendChild(node('p', 'layer-note', COPY.demotion));
    if (firstFocus !== null) firstFocus.focus();
  }
  async function commitInterview() {
    const interview = state.interview;
    if (interview === null) return;
    const result = state.search.results.find((entry) => entry.targetId === interview.targetId);
    if (result === undefined) { closeInterview(); return; }
    let fields;
    if (interview.mode === 'concept' && interview.diagnosis !== null) {
      const note = interview.note.trim();
      if (note === '') return;
      // Human-chosen diagnosis: no diagnosisInferred key at all (§4.4).
      fields = {
        action: 'irrelevant',
        targetId: interview.targetId,
        diagnosis: interview.diagnosis,
        conceptId: interview.concept.id,
        note,
      };
    } else {
      fields = {
        action: 'irrelevant',
        targetId: interview.targetId,
        diagnosis: 'lexical-noise',
        diagnosisInferred: true,
      };
      if (interview.unresolvedLabel !== null) {
        fields.note = 'concept label "' + interview.unresolvedLabel + '" (unresolved id)';
      }
    }
    state.interview = null;
    closeLayerDialog(interview.opener);
    await commitVerdict(result, fields);
  }

  // §rescue — the shared rescue/pick preview layer (§3.1; extended by the
  // missing form's pick mode). No rescue ever posts on the first keypress.
  function openRescuePreview(stopIndex) {
    if (degradedReadOnly()) { showToast(COPY.readOnlyToast); return; }
    const top = topCount();
    const tailIndex = stopIndex - top - 1;
    const result = state.search.results[TOP_WINDOW + tailIndex];
    if (result === undefined) return;
    state.rescue = {
      stopIndex,
      rowReference: result.reference,
      rowTargetId: result.targetId,
      status: 'loading',
      passage: null,
      mode: null,
      picked: null,
      pickedRef: null,
      pickedPending: false,
      posting: false,
      opener: document.activeElement,
    };
    renderAll({});
    renderRescue();
    startRescueResolution();
  }
  // Resolution timing (§3.1 binding): pressing E fires the resolution if not
  // already held (the focused-card resolution is reused when present) and the
  // preview opens immediately.
  function startRescueResolution() {
    const rescue = state.rescue;
    if (rescue === null) return;
    const cached = state.passages[rescue.rowReference];
    if (cached !== undefined && cached.status === 'done') { rescueResolved(cached.passage); return; }
    rescue.status = 'loading';
    renderRescue();
    apiPassage(rescue.rowReference).then((outcome) => {
      if (state.rescue !== rescue) return;
      if (outcome && outcome.kind === 'passage' && outcome.passage && Array.isArray(outcome.passage.verses) && outcome.passage.verses.length > 0) {
        state.passages[rescue.rowReference] = { status: 'done', passage: outcome.passage };
        rescueResolved(outcome.passage);
      } else {
        rescue.status = 'failed';
        renderRescue();
      }
    }).catch(() => {
      if (state.rescue !== rescue) return;
      rescue.status = 'failed';
      renderRescue();
    });
  }
  function rescueResolved(passage) {
    const rescue = state.rescue;
    if (rescue === null) return;
    rescue.passage = passage;
    rescue.status = 'ready';
    if (passage.verses.length === 1) {
      rescue.mode = 'single';
      rescue.pickedRef = passage.reference;
      renderRescue();
      return;
    }
    // A collapsed anchor run: pick-chip mode with the verse the row's
    // targetId addresses pre-selected (§3.1) — the merged row keeps its
    // best-ranked member's targetId (BBCCCVVV-decodable, so the verse number
    // is its last three digits); when that verse is not in the resolved
    // passage, fall back to the range's first verse.
    rescue.mode = 'pick';
    const decoded = /^[A-Z][A-Z0-9]*:(\d{7,8})$/.exec(rescue.rowTargetId ?? '');
    const targetVerse = decoded !== null ? Number(decoded[1]) % 1000 : null;
    const parsed = parseReference(passage.reference);
    const preferred = targetVerse !== null && passage.verses.some((verse) => verse.verse === targetVerse)
      ? targetVerse
      : parsed !== null ? parsed.start : passage.verses[0].verse;
    void resolveRescuePick(preferred);
  }
  // Picking re-resolves that verse alone so the submitted reference is a
  // canonical single-verse label (§3.3 canonical-reference rule).
  async function resolveRescuePick(verseNumber) {
    const rescue = state.rescue;
    if (rescue === null) return;
    rescue.picked = verseNumber;
    rescue.pickedRef = null;
    rescue.pickedPending = true;
    renderRescue();
    const parsed = parseReference(rescue.passage.reference);
    const singleRef = parsed !== null ? parsed.book + ' ' + parsed.chapter + ':' + verseNumber : rescue.rowReference;
    try {
      const outcome = await apiPassage(singleRef);
      if (state.rescue !== rescue || rescue.picked !== verseNumber) return;
      if (outcome && outcome.kind === 'passage' && outcome.passage && Array.isArray(outcome.passage.verses) && outcome.passage.verses.length === 1) {
        rescue.pickedRef = outcome.passage.reference;
      }
    } catch (error) { /* pickedRef stays null; Confirm stays disabled */ }
    if (state.rescue !== rescue || rescue.picked !== verseNumber) return;
    rescue.pickedPending = false;
    renderRescue();
  }
  function closeRescue(options) {

    } else {

    renderAll({});
  }
  function rescueConfirmEnabled() {
    const rescue = state.rescue;

      !rescue.pickedPending && !rescue.posting && !degradedReadOnly();
  }
  function renderRescue() {
    const rescue = state.rescue;
    if (rescue === null) return;
    const dialog = openLayerDialog(COPY.rescueButton, 'rescue-title');
    dialog.id = 'rescue-dialog';
    dialog.appendChild(node('p', 'layer-prompt', rescue.rowReference));
    let initialFocus = null;

    if (rescue.status === 'loading') {

    } else if (rescue.status === 'failed') {

      // with a Retry; a rescue never posts an unresolved reference.
      dialog.appendChild(node('p', 'layer-prompt', COPY.searchError));

    // modes, where the reviewer's eyes are at commit time.
    dialog.appendChild(node('p', 'layer-note', COPY.permanence));
    const actions = node('div', 'layer-actions');
    const confirm = node('button', 'btn-primary', COPY.rescueConfirm);
    confirm.type = 'button';
    confirm.id = 'rescue-confirm';

    actions.appendChild(confirm);

    cancel.type = 'button';

    dialog.appendChild(actions);
    // §3.12 focus-contract exception: initial focus is Cancel (single-verse

  }
  async function confirmRescue() {
    const rescue = state.rescue;

    rescue.posting = true;
    renderRescue();
    const reference = rescue.pickedRef;
    const fields = { action: 'missing', reference, withinTop: 10 };
    const existing = state.missingByRef[reference];
    if (existing !== undefined) fields.supersedes = existing.judgmentId;
    const rowReference = rescue.rowReference;
    const outcome = await postJudgmentBody(fields, {});
    if (state.rescue !== rescue) return;
    rescue.posting = false;
    if (!outcome.ok) {
      if (outcome.code === 'already_displayed') {
        // §3.1 mismatch branch: close the preview layer, then run the §3.3
        // already-displayed recovery (focus the matching card + its toast).
        closeRescue({ skipFocusReturn: true });
        const index = await findTopBlockIndexForReference(reference);
        if (index !== -1) focusStop(index);
        showToast(COPY.alreadyDisplayed);
        return;
      }
      renderRescue();
      return;
    }
    const caseId = state.activeCase !== null ? state.activeCase.caseId : '';
    state.sessionRescues[caseId + '|' + reference] = true;
    state.rescuedRows[caseId + '|' + rowReference] = reference;
    state.lastCommit = { kind: 'rescue' };
    closeRescue({});
    showToast(COPY.rescueToast(reference, state.search.query));
    renderAll({ focus: true });
  }

  // §missing-form — the suggestion flow (§3.3).
  function missingGateActive() {
    return state.search.status === 'results' || state.search.status === 'empty';
  }
  function handleMissingKey(opener) {
    if (!missingGateActive()) { showToast(COPY.mGateHint); return; }
    openMissingForm(opener);
  }
  function openMissingForm(opener) {
    if (!missingGateActive()) { showToast(COPY.mGateHint); return; }
    state.missingForm = {
      input: '',
      resolved: null,       // the resolved ScripturePassage (any verse count)
      resolvedFor: '',      // the input text the resolution answered
      unresolvedShown: false,
      picked: null,
      pickedRef: null,
      pickedPending: false,
      withinTop: 3,
      note: '',
      seq: 0,
      debounce: null,
      settle: null,
      posting: false,
      opener: opener || document.activeElement,
    };

    renderMissingForm();

    if (input !== null) input.focus();
  }
  function closeMissingForm() {
    const form = state.missingForm;

      if (form.settle !== null) clearTimeout(form.settle);
    }
    state.missingForm = null;
    closeLayerDialog(form !== null ? form.opener : null);
    renderAll({});
  }
  function missingSubmitEnabled() {
    const form = state.missingForm;
    if (form === null || form.posting || degradedReadOnly()) return false;
    if (form.resolved === null) return false;
    if (form.resolved.verses.length === 1) return true;
    return form.picked !== null && form.pickedRef !== null && !form.pickedPending;
  }
  function missingFormType(value) {
    const form = state.missingForm;
    if (form === null) return;
    form.input = value;
    form.resolved = null;
    form.resolvedFor = '';
    form.picked = null;
    form.pickedRef = null;
    form.unresolvedShown = false;
    if (form.debounce !== null) clearTimeout(form.debounce);
    if (form.settle !== null) clearTimeout(form.settle);
    renderMissingFormPreview();
    if (value.trim() === '') return;
    const seq = ++form.seq;
    // Live preview: debounced 250ms GET /api/passage as you type.
    form.debounce = setTimeout(() => {
      form.debounce = null;
      apiPassage(value.trim()).then((outcome) => {
        if (state.missingForm !== form || seq !== form.seq) return;
        if (outcome && outcome.kind === 'passage' && outcome.passage && Array.isArray(outcome.passage.verses) && outcome.passage.verses.length > 0) {
          form.resolved = outcome.passage;
          form.resolvedFor = value;
          form.unresolvedShown = false;
          if (form.settle !== null) { clearTimeout(form.settle); form.settle = null; }
          renderMissingFormPreview();
        }
      }).catch(() => { /* the settle timer owns the failed-resolution copy */ });
    }, 250);
    // Failed resolution is never silent: after 1.5s without a successful
    // resolution, recovery copy replaces the waiting line (§3.3).
    form.settle = setTimeout(() => {
      form.settle = null;
      if (state.missingForm !== form || form.resolved !== null || form.input.trim() === '') return;
      form.unresolvedShown = true;
      renderMissingFormPreview();
    }, 1500);
  }
  async function resolveMissingPick(verseNumber) {
    const form = state.missingForm;
    if (form === null || form.resolved === null) return;
    form.picked = verseNumber;
    form.pickedRef = null;
    form.pickedPending = true;
    renderMissingFormPreview();
    const parsed = parseReference(form.resolved.reference);
    if (parsed === null) { form.pickedPending = false; renderMissingFormPreview(); return; }
    try {
      const outcome = await apiPassage(parsed.book + ' ' + parsed.chapter + ':' + verseNumber);
      if (state.missingForm !== form || form.picked !== verseNumber) return;
      if (outcome && outcome.kind === 'passage' && outcome.passage && outcome.passage.verses.length === 1) {
        form.pickedRef = outcome.passage.reference;
      }
    } catch (error) { /* Submit stays disabled */ }
    if (state.missingForm !== form || form.picked !== verseNumber) return;
    form.pickedPending = false;
    renderMissingFormPreview();
  }
  function renderMissingForm() {
    const form = state.missingForm;

    dialog.id = 'missing-form-dialog';
    dialog.appendChild(node('p', 'layer-prompt', COPY.formPrompt(state.search.query)));
    const input = node('input', 'ref-input');

    input.placeholder = COPY.formPlaceholder;

    preview.id = 'missing-preview';
    dialog.appendChild(preview);

    const segRow = node('div', 'seg-row');
    segRow.appendChild(node('span', 'seg-label', COPY.formTopLabel));
    const picker = node('div', 'topn-picker');
    picker.id = 'missing-topn';

    dialog.appendChild(note);

    const actions = node('div', 'layer-actions');
    const submit = node('button', 'btn-primary', COPY.formSubmit);

    submit.id = 'missing-submit';
    submit.disabled = !missingSubmitEnabled();
    submit.addEventListener('click', () => { void submitMissingForm(); });
    actions.appendChild(submit);
    const cancel = node('button', 'btn-quiet', 'Cancel');
    cancel.type = 'button';
    cancel.id = 'missing-cancel';

    actions.appendChild(cancel);

  }
  function renderMissingFormPreview() {
    const form = state.missingForm;

      body.appendChild(document.createTextNode(verse.text));

  async function submitMissingForm() {

    // Client pre-check against the displayed top-10 (ranges by member
    // verses) and the fetched tail (§3.3) — no POST on either match.

    if (topIndex !== -1) {
      closeMissingForm();
      focusStop(topIndex);
      showToast(COPY.alreadyDisplayed);
      return;
    }
    const tailStop = await findTailStopForReference(reference);
    if (tailStop !== -1) {
      closeMissingForm();
      state.tailExpanded = true;
      focusStop(tailStop);
      showToast(COPY.alreadyInTail);
      return;
    }
    form.posting = true;
    renderMissingFormPreview();
    const fields = { action: 'missing', reference, withinTop: form.withinTop };
    const noteText = form.note.trim();
    if (noteText !== '') fields.note = noteText;
    const existing = state.missingByRef[reference];
    if (existing !== undefined) fields.supersedes = existing.judgmentId;
    const outcome = await postJudgmentBody(fields, {});
    if (state.missingForm !== form) return;
    form.posting = false;
    if (!outcome.ok) {
      if (outcome.code === 'already_displayed') {

        const index = await findTopBlockIndexForReference(reference);
        if (index !== -1) focusStop(index);

        return;
      }

  // §already-displayed — reference comparison helpers (§3.3): a displayed
  // range card is compared by its member verses, resolved via GET
  // /api/passage (the focused-card resolution reused when already fetched).
  async function resolveRowPassage(reference) {
    const cached = state.passages[reference];
    if (cached !== undefined && cached.status === 'done') return cached.passage;
    try {
      const outcome = await apiPassage(reference);
      if (outcome && outcome.kind === 'passage' && outcome.passage && Array.isArray(outcome.passage.verses)) {
        state.passages[reference] = { status: 'done', passage: outcome.passage };
        return outcome.passage;
      }
    } catch (error) { /* fall through: no match provable */ }
    return null;
  }
  async function referenceMatchesRow(rowReference, canonicalRef) {
    if (rowReference === canonicalRef) return true;
    if (!isRangeReference(rowReference)) return false;
    const passage = await resolveRowPassage(rowReference);
    if (passage === null) return false;
    const range = parseReference(passage.reference);
    const single = parseReference(canonicalRef);
    if (range === null || single === null) return false;
    if (range.book !== single.book || range.chapter !== single.chapter) return false;
    return passage.verses.some((verse) => verse.verse === single.start);
  }
  async function findTopBlockIndexForReference(canonicalRef) {
    const top = state.search.results.slice(0, TOP_WINDOW);
    for (let index = 0; index < top.length; index += 1) {
      if (await referenceMatchesRow(top[index].reference, canonicalRef)) return index;
    }
    return -1;
  }
  async function findTailStopForReference(canonicalRef) {
    const results = state.search.results;
    const top = Math.min(results.length, TOP_WINDOW);
    for (let index = TOP_WINDOW; index < results.length; index += 1) {
      if (await referenceMatchesRow(results[index].reference, canonicalRef)) {
        return top + 1 + (index - TOP_WINDOW);
      }
    }
    return -1;
  }

  // §action-bar — verdict toolbar + bulk bar (§3.2). The toolbar is active

  function verdictButton(keycap, labelText, id, disabled, onClick, extraClass) {
    const button = node('button', 'verdict-btn' + (extraClass !== undefined ? ' ' + extraClass : ''));
    button.type = 'button';
    button.id = id;

      // the arrow alone changes the value the next E commits.
      const next = event.key === 'ArrowRight' ? Math.min(values.length - 1, index + 1) : Math.max(0, index - 1);

    group.appendChild(essential);
    const picker = node('div', 'topn-picker');

    for (const value of [1, 3, 5, 10]) {

  // §render — everything
  function renderAll(options) {
    // Re-rendering replaces the results DOM: when the focused element lived
    // there (or focus already fell back to body after an earlier rebuild),
    // restore it, so an async re-render never strands keyboard focus.
    const active = document.activeElement;
    const focusWasInResults = active !== null && typeof active.closest === 'function'
      && active.closest('#center-body') !== null;
    renderBanner();
    renderQueue();
    renderCenter();
    renderRail();
    renderActionBar();
    if (state.search.status === 'results' && !anyLayerOpen()) {
      const focused = state.focus < topCount() ? state.search.results[state.focus] : null;
      if (focused) ensurePassage(focused.reference);
      if ((options && options.focus) || focusWasInResults) focusCurrentStop();
    }
  }

  // §search
  function resetQueryState() {
    state.activeCase = null;
    state.judgedByTarget = Object.create(null);
    state.missingByRef = Object.create(null);
    state.reopened = Object.create(null);
    state.selected = Object.create(null);
    state.dataBanner = null;
    state.interview = null;
    state.missingForm = null;
    state.rescue = null;
    if (state.lookup === null) clear(document.getElementById('dialog-slot'));
  }
  async function submitSearch(rawQuery) {
    const query = rawQuery.trim();
    if (query === '') return; // A blank or whitespace-only submit is a client no-op.
    const seq = ++state.searchSeq;
    resetQueryState();
    state.search = { status: 'loading', query, kind: null, results: [], passage: null };
    renderAll({});
    let outcome;
    try {
      outcome = await apiSearch(query);
    } catch (error) {
      if (seq !== state.searchSeq) return; // stale
      state.search = { status: 'error', query, kind: null, results: [], passage: null };
      renderAll({});
      return;
    }
    if (seq !== state.searchSeq) return; // stale: only the latest search renders
    writeUiState({ lastQuery: query });
    if (outcome.kind === 'reference') {
      state.search = { status: 'reference', query, kind: 'reference', results: [], passage: outcome.passage };
      announce(COPY.referenceKind);
      renderAll({});
      return;
    }
    if (outcome.kind === 'invalid-reference') {
      state.search = { status: 'invalid', query, kind: 'invalid-reference', results: [], passage: null };
      announce(COPY.invalidReference(query));
      renderAll({});
      return;
    }
    let results = Array.isArray(outcome.results) ? outcome.results : [];
    if (results.length === 0) {
      state.search = { status: 'empty', query, kind: 'discovery', results: [], passage: null };
      announce(COPY.emptyTitle(query));
      renderAll({});
      return;
    }
    // Open existing case (§4.3): the live search supplies the tail; the
    // case's snapshot is the render source for the judged top block (§4.6),
    // with a reference-per-rank agreement check between the two.
    let firstUnjudged = 0;
    const openCase = caseForQuery(query);
    if (openCase !== null) {
      let caseData = null;
      let judgmentData = null;
      try {
        [caseData, judgmentData] = await Promise.all([apiCase(openCase.caseId), apiJudgments(openCase.caseId)]);
      } catch (error) {
        showToast(COPY.bootFetchFailed);
      }
      if (seq !== state.searchSeq) return; // stale
      if (judgmentData !== null && Array.isArray(judgmentData.judgments)) {
        const resolved = resolveActiveJudgments(judgmentData.judgments);
        state.judgedByTarget = resolved.byTarget;
        state.missingByRef = resolved.byRef;
      }
      if (caseData !== null && caseData.review !== null && typeof caseData.review.token === 'string') {
        const review = caseData.review;
        const snapRefs = reviewTopRefs(review);
        const liveTopRefs = results.slice(0, TOP_WINDOW).map((result) => result.reference);
        adoptSnapshot(review, caseData.case);
        const snapResults = review.result && Array.isArray(review.result.results) ? review.result.results : [];
        results = snapResults.concat(results.slice(TOP_WINDOW));
        if (!sameOrder(snapRefs, liveTopRefs)) {
          // Agreement failure: the snapshot list wins for judging; the
          // banner's copy must say the list shown is the case-open one.
          state.dataBanner = 'snapshot-wins';
        }
      }
      const top = results.slice(0, TOP_WINDOW);
      const unjudgedIndex = top.findIndex((result) =>
        state.judgedByTarget[result.targetId] === undefined && state.reopened[result.targetId] !== true);
      firstUnjudged = unjudgedIndex === -1 ? 0 : unjudgedIndex;
    }
    state.search = { status: 'results', query, kind: 'discovery', results, passage: null };
    state.focus = firstUnjudged;
    state.expandedIndex = firstUnjudged;
    state.inTail = false;
    state.tailExpanded = false;
    state.railTab = 'why';
    announce(COPY.resultsAnnounce(results.length, query));
    // Post-search focus handoff: DOM focus moves from the search input to
    // result card #1 (the first unjudged card when the query has an open
    // case); the input keeps its value. The reference, invalid-reference,
    // and zero-result branches above leave focus in the input — the
    // reviewer's next act there is retyping.
    renderAll({ focus: true });
  }

  // §lookup (⌘K)
  let lookupDebounce = null;
  function openLookup(opener) {
    if (state.lookup !== null) { closeLookup(); return; }
    state.lookup = { q: '', kind: null, results: [], sel: 0, opener: opener || document.activeElement, seq: 0 };
    renderLookup();
    const input = document.getElementById('lookup-input');
    if (input !== null) input.focus();
  }
  function closeLookup() {
    const lookup = state.lookup;
    state.lookup = null;
    if (lookupDebounce !== null) { clearTimeout(lookupDebounce); lookupDebounce = null; }
    clear(document.getElementById('dialog-slot'));
    if (lookup !== null && lookup.opener && typeof lookup.opener.focus === 'function') lookup.opener.focus();
  }
  function lookupType(value) {
    const lookup = state.lookup;
    if (lookup === null) return;
    lookup.q = value;
    if (lookupDebounce !== null) clearTimeout(lookupDebounce);
    if (value.trim().length < 3) {
      lookup.kind = null;
      lookup.results = [];
      lookup.sel = 0;
      renderLookupResults();
      return;
    }
    lookupDebounce = setTimeout(() => {
      lookupDebounce = null;
      const seq = ++lookup.seq;
      apiSearch(value.trim()).then((outcome) => {
        if (state.lookup !== lookup || seq !== lookup.seq) return;
        lookup.kind = outcome.kind;
        if (outcome.kind === 'discovery') lookup.results = Array.isArray(outcome.results) ? outcome.results : [];
        else if (outcome.kind === 'reference') lookup.results = [{ reference: outcome.passage.reference, excerpt: outcome.passage.verses.map((v) => v.text).join(' ') }];
        else lookup.results = [];
        lookup.sel = 0;
        renderLookupResults();
      }).catch(() => {
        if (state.lookup !== lookup || seq !== lookup.seq) return;
        lookup.kind = 'error';
        lookup.results = [];
        renderLookupResults();
      });
    }, 300);
  }
  function lookupSelect() {
    const lookup = state.lookup;
    if (lookup === null || lookup.results.length === 0) return;
    const query = lookup.q.trim();
    closeLookup();
    document.getElementById('search-input').value = query;
    void submitSearch(query);
  }
  function renderLookup() {
    const slot = document.getElementById('dialog-slot');
    clear(slot);
    const overlay = node('div', 'overlay');
    overlay.addEventListener('mousedown', (event) => { if (event.target === overlay) closeLookup(); });
    const dialog = node('div', 'lookup-dialog');
    dialog.setAttribute('role', 'dialog');
    dialog.setAttribute('aria-modal', 'true');
    dialog.setAttribute('aria-label', 'Quick lookup');
    const input = node('input', 'lookup-input');
    input.id = 'lookup-input';
    input.type = 'text';
    input.placeholder = COPY.lookupPlaceholder;
    input.setAttribute('aria-label', 'Quick lookup');
    input.addEventListener('input', () => { lookupType(input.value); });
    dialog.appendChild(input);
    const resultsEl = node('div', 'lookup-results');
    resultsEl.id = 'lookup-results';
    dialog.appendChild(resultsEl);
    const footer = node('div', 'lookup-footer');
    footer.appendChild(node('span', '', '↑↓ Navigate'));
    footer.appendChild(node('span', '', '↵ Select'));
    footer.appendChild(node('span', '', 'Esc Close'));
    footer.appendChild(node('span', 'spacer', ''));
    footer.appendChild(node('span', '', COPY.lookupNoCase));
    dialog.appendChild(footer);
    overlay.appendChild(dialog);
    slot.appendChild(overlay);
    renderLookupResults();
  }
  function renderLookupResults() {
    const lookup = state.lookup;
    if (lookup === null) return;
    const resultsEl = document.getElementById('lookup-results');
    if (resultsEl === null) return;
    clear(resultsEl);
    if (lookup.kind === 'invalid-reference') {
      resultsEl.appendChild(node('div', 'lookup-empty', COPY.invalidReference(lookup.q.trim())));
      return;
    }
    if (lookup.kind === 'error') {
      resultsEl.appendChild(node('div', 'lookup-empty', COPY.searchError));
      return;
    }
    if (lookup.kind !== null && lookup.results.length === 0) {
      resultsEl.appendChild(node('div', 'lookup-empty', COPY.lookupEmpty));
      return;
    }
    lookup.results.forEach((result, index) => {
      const row = node('button', 'lookup-row' + (index === lookup.sel ? ' sel' : ''));
      row.type = 'button';
      const head = node('div', 'row-head');
      head.appendChild(node('span', 'row-ref', result.reference));
      if (index === lookup.sel) head.appendChild(node('span', 'row-action', COPY.lookupAction));
      row.appendChild(head);
      row.appendChild(node('div', 'row-snippet', result.excerpt));
      row.addEventListener('click', () => { lookup.sel = index; lookupSelect(); });
      resultsEl.appendChild(row);
    });
  }

  // §keys — one handler, layers first.
  function isTypingTarget(target) {
    if (!(target instanceof HTMLElement)) return false;
    const tag = target.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || target.isContentEditable;
  }
  document.addEventListener('keydown', (event) => {
    // ⌘K works everywhere, inputs included.
    if ((event.metaKey || event.ctrlKey) && (event.key === 'k' || event.key === 'K')) {
      event.preventDefault();
      openLookup(document.activeElement);
      return;
    }
    if (state.lookup !== null) {
      if (event.key === 'Escape') { event.preventDefault(); closeLookup(); return; }
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        const lookup = state.lookup;
        if (lookup.results.length > 0) {
          lookup.sel = Math.max(0, Math.min(lookup.results.length - 1, lookup.sel + (event.key === 'ArrowDown' ? 1 : -1)));
          renderLookupResults();
        }
        return;
      }
      if (event.key === 'Enter') { event.preventDefault(); lookupSelect(); return; }
      if (event.key === 'Tab') {
        // Focus trap: the input and the rows cycle within the dialog.
        const dialog = document.querySelector('.lookup-dialog');
        if (dialog !== null) {
          const focusables = dialog.querySelectorAll('input, button');
          if (focusables.length > 0) {
            const first = focusables[0];
            const last = focusables[focusables.length - 1];
            if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
            else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
          }
        }
      }
      return;
    }
    // Layered Esc order (§3.12): interview → missing form / rescue preview
    // (one shared slot) → lookup (handled above) → bulk selection.
    if (state.interview !== null) {
      // The interview is modal: Escape closes it without committing, from
      // any focus position; J/K/arrow navigation is inert (§3.13.1–2).
      if (event.key === 'Escape') { event.preventDefault(); closeInterview(); return; }
      if (event.key === 'Tab') { trapTab(event); }
      return;
    }
    if (state.rescue !== null) {
      if (event.key === 'Escape') { event.preventDefault(); closeRescue({}); return; }
      if (event.key === 'Tab') { trapTab(event); }
      return;
    }
    if (state.missingForm !== null) {
      if (event.key === 'Escape') { event.preventDefault(); closeMissingForm(); return; }
      if (event.key === 'Tab') { trapTab(event); return; }
      if (event.key === 'Enter' && event.target instanceof HTMLElement && event.target.id === 'missing-ref-input') {
        // Enter activates Submit only when Submit is enabled; while it is
        // disabled, Enter is a no-op — never a native form submit (§3.3).
        event.preventDefault();
        if (missingSubmitEnabled()) void submitMissingForm();
        return;
      }
      return;
    }
    if (event.key === 'Escape' && selectedCount() > 0) {
      event.preventDefault();
      state.selected = Object.create(null);
      renderAll({});
      return;
    }
    // Typing in an input suppresses single-letter shortcuts.
    if (isTypingTarget(event.target)) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.key === 'j' || event.key === 'J' || event.key === 'ArrowDown') {
      event.preventDefault();
      moveFocus(1);
      return;
    }
    if (event.key === 'k' || event.key === 'K' || event.key === 'ArrowUp') {
      event.preventDefault();
      moveFocus(-1);
      return;
    }
    const inResults = state.search.status === 'results';
    const onTailRow = inResults && state.focus > topCount();
    const onDivider = inResults && state.search.results.length > TOP_WINDOW && state.focus === topCount();
    if (event.key === 'Enter') {
      // Enter does nothing on a tail row (§3.12): the verse already reads in
      // the rail, and Enter must never double as an uncorrectable commit.
      if (document.activeElement !== null && document.activeElement.classList &&
        document.activeElement.classList.contains('tail-row')) {
        event.preventDefault();
      }
      return;
    }
    if (event.key === ' ') {
      const active = document.activeElement;
      if (active !== null && active.id === 'tail-divider') return; // native expand
      if (active !== null && active.classList && active.classList.contains('result-card')) {
        event.preventDefault();
        const index = Number(active.dataset.stop);
        const result = state.search.results[index];
        if (result !== undefined) toggleSelected(result.targetId);
        return;
      }
      if (active !== null && active.classList && active.classList.contains('tail-row')) {
        event.preventDefault();
      }
      return;
    }
    const key = event.key.toLowerCase();
    if (key === 'e') {
      event.preventDefault();
      if (onTailRow) { openRescuePreview(state.focus); return; }
      if (onDivider) return;
      if (inResults) void verdictAction('essential');
      return;
    }
    if (key === 'h' || key === 'x') {
      event.preventDefault();
      if (onTailRow) { showToast(COPY.tailHint); return; }
      if (onDivider) return;
      if (inResults) void verdictAction(key === 'h' ? 'helpful' : 'irrelevant');
      return;
    }
    if (key === 'm') {
      event.preventDefault();
      if (onTailRow) { showToast(COPY.tailHint); return; }
      if (onDivider) return;
      handleMissingKey(null);
      return;
    }
    if (key === 'u') {
      event.preventDefault();
      handleUndoKey();
      return;
    }
  });

  // §boot
  document.getElementById('theme-cycle').addEventListener('click', cycleTheme);
  document.getElementById('lookup-open').addEventListener('click', (event) => { openLookup(event.currentTarget); });
  document.getElementById('search-form').addEventListener('submit', (event) => {
    event.preventDefault();
    void submitSearch(document.getElementById('search-input').value);
  });

  try {
    const stored = localStorage.getItem('study.theme');
    if (stored === 'light' || stored === 'dark' || stored === 'auto') state.themeMode = stored;
  } catch (error) { /* storage unavailable */ }
  try {
    const storedTop = Number(localStorage.getItem('study.withinTop'));
    if (storedTop === 1 || storedTop === 3 || storedTop === 5 || storedTop === 10) state.withinTop = storedTop;
  } catch (error) { /* storage unavailable */ }
  applyTheme();
  // Health refetches on window focus (§3.11) so read-only recovery re-enables.
  window.addEventListener('focus', () => { refetchHealth(); });
  try {
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if (state.themeMode === 'auto') applyTheme(); };
    if (typeof media.addEventListener === 'function') media.addEventListener('change', onChange);
    else if (typeof media.addListener === 'function') media.addListener(onChange);
  } catch (error) { /* matchMedia unavailable */ }

  // lastQuery pre-fills the search input's VALUE on the no-open-case boot;
  // it never auto-submits and never fetches.
  const uiState = readUiState();
  if (typeof uiState.lastQuery === 'string' && uiState.lastQuery !== '') {
    document.getElementById('search-input').value = uiState.lastQuery;
  }

  renderAll({});

  let bootToastShown = false;
  const bootFailed = () => {
    if (bootToastShown) return;
    bootToastShown = true;
    showToast(COPY.bootFetchFailed);
  };
  apiHealth().then((health) => { state.health = health; renderBanner(); }).catch(bootFailed);
  apiMeta().then((meta) => {
    state.meta = meta;
    writeUiState({ lastSeenMeta: { engineVersion: meta.engineVersion, corpusFingerprint: meta.corpusFingerprint, layerFingerprint: meta.layerFingerprint } });
  }).catch(bootFailed);
  apiConcepts().then((concepts) => { state.concepts = Array.isArray(concepts) ? concepts : []; }).catch(bootFailed);
  apiCases().then((data) => {
    state.cases = data && Array.isArray(data.cases) ? data.cases : [];
    renderQueue();
    // §3.1 open-case boot: the first open case (most recently touched — the
    // client sort, never the server's caseId order) loads exactly as if its
    // queue row were clicked; with none, no request until the first submit.
    const open = openCases();
    if (open.length > 0 && state.search.status === 'idle' && state.lookup === null) {
      document.getElementById('search-input').value = open[0].query;
      void submitSearch(open[0].query);
    }
  }).catch(bootFailed);
})();
</script>
</body>
</html>
