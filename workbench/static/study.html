<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="workbench-static-protocol" content="1">
<title>The Study</title>
<!-- §theme-stamp: first paint is theme-correct (no FOUC). This tiny IIFE runs
     before the stylesheet below; the main IIFE takes over theming from here. -->
<script>
(function () {
  'use strict';
  var mode = 'auto';
  try {
    var stored = localStorage.getItem('study.theme');
    if (stored === 'light' || stored === 'dark' || stored === 'auto') mode = stored;
  } catch (error) { /* storage unavailable: stay on auto */ }
  var dark = mode === 'dark';
  if (mode === 'auto') {
    try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (error) { dark = false; }
  }
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>
<!-- §style -->
<style>
/* §tokens — reviewed values in workbench/DESIGN.md; guarded by
   workbench/test/contrast.audit.test.ts. */
:root{
  --ground:#F6F4EF; --surface:#FCFBF8; --panel:#FFFDF7;
  --hairline:#E5E1D8; --hairline-strong:#D6D1C6;
  --ink:#1D1C18; --text-2:#57534A; --text-3:#6E695E; --text-faint:#A9A398;
  --accent:#0D5C58; --accent-hover:#094744; --on-accent:#F1FAF9; --accent-wash:rgba(13,92,88,.08);
  --v-affirm:#2C734D; --v-notrel:#A6493D; --v-missing:#80621B;
  --v-affirm-wash:rgba(44,115,77,.10); --v-notrel-wash:rgba(166,73,61,.09); --v-missing-wash:rgba(128,98,27,.10);
  --highlight:rgba(228,176,58,.30);
  --kbd-bg:#EFECE4; --kbd-border:#D8D3C8;
  --sel-bg:rgba(13,92,88,.16); --caret:#0D5C58;
  --shadow:0 1px 2px rgba(29,28,24,.06),0 6px 20px rgba(29,28,24,.07);
  --r-ctl:6px; --r-panel:10px;
  --control-border:#8F897C;
  color-scheme: light;
}
[data-theme="dark"]{
  --ground:#131311; --surface:#1A1A17; --panel:#211E18;
  --hairline:#2E2B25; --hairline-strong:#3B372F;
  --ink:#EBE7DE; --text-2:#B4AEA1; --text-3:#948E81; --text-faint:#67635A;
  --accent:#43A8A0; --accent-hover:#5CBEB5; --on-accent:#0A2422; --accent-wash:rgba(67,168,160,.12);
  --v-affirm:#6FBE8C; --v-notrel:#DE8B7C; --v-missing:#D2A94F;
  --v-affirm-wash:rgba(111,190,140,.12); --v-notrel-wash:rgba(222,139,124,.10); --v-missing-wash:rgba(210,169,79,.12);
  --highlight:rgba(212,163,62,.20);
  --kbd-bg:#24231F; --kbd-border:#3B372F;
  --sel-bg:rgba(67,168,160,.28); --caret:#43A8A0;
  --shadow:none;
  --control-border:#6B6558;
  color-scheme: dark;
}

/* §fonts — self-hosted, unmodified upstream variable woff2 (see
   static/fonts/README.md); the named fallbacks carry the page if /fonts 404s. */
@font-face{font-family:'Literata';font-style:normal;font-weight:200 900;font-display:swap;src:url('/fonts/literata/Literata-Variable.woff2') format('woff2');}
@font-face{font-family:'Literata';font-style:italic;font-weight:200 900;font-display:swap;src:url('/fonts/literata/Literata-Italic-Variable.woff2') format('woff2');}
@font-face{font-family:'Source Sans 3';font-style:normal;font-weight:200 900;font-display:swap;src:url('/fonts/source-sans-3/SourceSans3VF-Upright.ttf.woff2') format('woff2');}
@font-face{font-family:'Source Sans 3';font-style:italic;font-weight:200 900;font-display:swap;src:url('/fonts/source-sans-3/SourceSans3VF-Italic.ttf.woff2') format('woff2');}

/* §base — dark painted at document level, never an inner div. */
html,body{margin:0;padding:0;background:var(--ground);}
body{color:var(--ink);font-family:'Source Sans 3',-apple-system,'Segoe UI',sans-serif;font-size:13px;line-height:1.45;}
a{color:var(--accent);} a:hover{color:var(--accent-hover);}
::selection{background:var(--sel-bg);}
input,textarea{caret-color:var(--caret);}
*{scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent;box-sizing:border-box;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px;}
button{font:inherit;}
.serif{font-family:'Literata',Georgia,serif;}
.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
@keyframes toastUp{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}

/* §header */
.app-header{height:48px;display:flex;align-items:center;gap:24px;padding:0 16px;border-bottom:1px solid var(--hairline);background:var(--surface);position:sticky;top:0;z-index:30;}
.wordmark{font-family:'Literata',Georgia,serif;font-size:15px;letter-spacing:0.01em;}
.app-nav{display:flex;gap:4px;height:100%;}
.nav-item{border:0;background:none;cursor:pointer;padding:0 10px;height:100%;display:flex;align-items:center;position:relative;color:var(--text-3);font-size:13px;}
.nav-item[aria-current="page"]{color:var(--ink);font-weight:600;}
.nav-item[aria-current="page"]::after{content:'';position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px 2px 0 0;}
.nav-item[aria-disabled="true"]{cursor:default;}
.header-spacer{flex:1;}
.header-btn{display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--hairline-strong);border-radius:var(--r-ctl);background:var(--surface);color:var(--text-2);cursor:pointer;}
.header-btn:hover{border-color:var(--text-3);}
.advanced-link{padding:5px 10px;border:0;background:none;color:var(--text-3);font-size:12px;text-decoration:none;}
.advanced-link:hover{color:var(--text-2);}
.kbd{display:inline-block;min-width:14px;padding:1px 5px;border:1px solid var(--kbd-border);border-bottom-width:2px;border-radius:4px;background:var(--kbd-bg);font-size:11px;color:var(--text-2);text-align:center;}

/* §banner */
.banner{padding:9px 16px;border-bottom:1px solid var(--hairline);background:var(--v-missing-wash);color:var(--text-2);}
.banner strong{color:var(--ink);}

/* §review layout */
.review-grid{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;height:calc(100vh - 48px);}
.review-grid.with-banner{height:calc(100vh - 48px - 37px);}
.queue-rail{border-right:1px solid var(--hairline);background:var(--surface);overflow-y:auto;display:flex;flex-direction:column;}
.queue-body{flex:1;}
.rail-label{padding:14px 16px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.rail-label .label-text{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rail-label .label-count{color:var(--text-3);white-space:nowrap;}
.queue-row{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 16px 0 12px;cursor:pointer;background:none;border:0;border-left:2px solid transparent;width:100%;text-align:left;color:var(--text-2);}
.queue-row:hover{background:var(--accent-wash);}
.queue-row.current{background:var(--accent-wash);border-left-color:var(--accent);color:var(--ink);font-weight:600;}
.queue-row .row-ref{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.queue-dot{width:7px;height:7px;border-radius:50%;flex:none;background:none;border:1.5px solid var(--hairline-strong);}
.queue-section-title{padding:18px 16px 4px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);border-top:1px solid var(--hairline);margin-top:12px;}
.waiting-row{display:flex;width:100%;align-items:baseline;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;padding:8px 16px;cursor:pointer;font:inherit;color:var(--text-2);}
.waiting-row:hover{background:var(--accent-wash);}
.waiting-row .q{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rail-empty{padding:8px 16px;color:var(--text-3);}
.rail-footer{padding:14px 16px;color:var(--text-3);font-size:12px;border-top:1px solid var(--hairline);margin-top:10px;}

/* §center */
.center-pane{overflow-y:auto;padding:28px 32px 60px;display:flex;flex-direction:column;align-items:center;}
.search-form{width:100%;max-width:680px;margin-bottom:28px;}
.search-box{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--control-border);border-radius:var(--r-panel);box-shadow:var(--shadow);padding:6px 6px 6px 18px;}
.search-box svg{flex:none;color:var(--text-faint);}
.search-input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:17px;color:var(--ink);padding:8px 0;}
.btn-primary{padding:8px 18px;border:1px solid var(--accent);border-radius:var(--r-ctl);background:var(--accent);color:var(--on-accent);cursor:pointer;font-weight:600;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-quiet{padding:7px 14px;border:1px solid var(--hairline-strong);border-radius:var(--r-ctl);background:var(--surface);color:var(--ink);cursor:pointer;}
.btn-quiet:hover{border-color:var(--text-3);}
.contract-line{color:var(--text-3);max-width:52ch;text-align:center;margin-top:6px;}
.center-message{width:100%;max-width:680px;color:var(--text-2);}
.center-message .headline{font-family:'Literata',Georgia,serif;font-size:20px;color:var(--ink);margin:0 0 8px;}
.results-list{width:100%;max-width:680px;display:flex;flex-direction:column;}
.result-card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-panel);padding:10px 16px;margin-bottom:8px;cursor:pointer;}
.result-card.after-three{margin-bottom:6px;}
.result-card .card-line{display:flex;align-items:baseline;gap:10px;min-height:20px;}
.rank-badge{flex:none;font-size:11px;color:var(--text-3);border:1px solid var(--hairline-strong);border-radius:4px;padding:1px 5px;min-width:24px;text-align:center;}
.rank-badge.top{font-size:12px;font-weight:700;color:var(--ink);border-color:var(--text-3);}
.card-ref{flex:none;font-size:13px;font-weight:600;color:var(--ink);}
.card-excerpt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2);}
.result-card.expanded{background:var(--panel);border-color:var(--hairline);box-shadow:var(--shadow);padding:34px 44px 30px;cursor:default;}
.verse-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px;}
.verse-ref{font-family:'Literata',Georgia,serif;font-size:20px;font-weight:600;margin:0;}
.verse-pos{color:var(--text-3);font-size:12px;white-space:nowrap;}
.verse-body{font-family:'Literata',Georgia,serif;font-size:17.5px;line-height:1.65;max-width:68ch;margin:14px 0 0;text-wrap:pretty;}
.verse-body sup{font-family:'Source Sans 3',-apple-system,'Segoe UI',sans-serif;font-size:0.6em;color:var(--text-3);margin:0 3px 0 1px;letter-spacing:0.02em;}
.verse-body mark{background:var(--highlight);color:inherit;border-radius:2px;padding:0 2px;box-decoration-break:clone;}
.attribution{margin-top:14px;color:var(--text-3);font-size:12px;}
.reason-pill{display:inline-block;margin-top:12px;padding:3px 10px;border:1px solid var(--hairline-strong);border-radius:99px;color:var(--text-2);font-size:12px;}
.tail-divider{width:100%;max-width:680px;margin:12px 0 8px;text-align:left;border:1px dashed var(--hairline-strong);border-radius:var(--r-ctl);background:none;color:var(--text-3);padding:8px 12px;cursor:pointer;}
.tail-divider:hover{color:var(--text-2);border-color:var(--text-3);}
.tail-list{width:100%;max-width:680px;}
.tail-row{display:flex;align-items:baseline;gap:10px;padding:7px 12px;border-bottom:1px solid var(--hairline);cursor:pointer;background:none;border-left:2px solid transparent;}
.tail-row.focused{background:var(--accent-wash);border-left-color:var(--accent);}
.tail-row .rank-badge{border:0;padding-left:0;}
.tail-row .card-excerpt{color:var(--text-3);}
.skeleton-row{height:40px;border:1px solid var(--hairline);border-radius:var(--r-panel);background:var(--surface);margin-bottom:8px;}
.error-box{width:100%;max-width:680px;border:1px solid var(--hairline-strong);border-radius:var(--r-panel);background:var(--surface);padding:16px 18px;color:var(--text-2);display:flex;align-items:center;gap:14px;justify-content:space-between;}

/* §why-rail */
.why-rail{border-left:1px solid var(--hairline);background:var(--surface);overflow-y:auto;padding:0 0 24px;}
.rail-tabs{display:flex;gap:2px;padding:10px 16px 0;border-bottom:1px solid var(--hairline);}
.rail-tab{border:0;background:none;cursor:pointer;padding:6px 8px 10px;color:var(--text-3);position:relative;}
.rail-tab[aria-selected="true"]{color:var(--ink);font-weight:600;}
.rail-tab[aria-selected="true"]::after{content:'';position:absolute;left:6px;right:6px;bottom:-1px;height:2px;background:var(--accent);}
.why-row{padding:10px 0;border-bottom:1px solid var(--hairline);}
.why-key{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:3px;}
.why-val{color:var(--ink);overflow-wrap:anywhere;}
.rail-pad{padding:16px;}
.rail-note{margin-top:16px;color:var(--text-3);font-size:12px;max-width:36ch;}
.context-verse{font-family:'Literata',Georgia,serif;font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--text-2);}
.context-verse.focus{color:var(--ink);background:var(--highlight);border-radius:2px;padding:0 2px;}
.context-verse sup{font-family:'Source Sans 3',-apple-system,'Segoe UI',sans-serif;font-size:0.6em;color:var(--text-3);margin:0 3px 0 1px;}

/* §toast */
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:40;display:flex;gap:12px;align-items:center;padding:9px 16px;border:1px solid var(--hairline-strong);border-radius:99px;background:var(--surface);box-shadow:var(--shadow);animation:toastUp 0.2s cubic-bezier(0.16,1,0.3,1);}

/* §lookup */
.overlay{position:fixed;inset:0;background:rgba(20,19,16,.35);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;}
.lookup-dialog{width:600px;max-width:92vw;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:var(--r-panel);box-shadow:var(--shadow);overflow:hidden;}
.lookup-input{width:100%;padding:14px 18px;border:0;border-bottom:1px solid var(--hairline);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;outline:none;}
.lookup-results{max-height:46vh;overflow-y:auto;}
.lookup-row{display:block;width:100%;text-align:left;padding:10px 18px;border:0;border-bottom:1px solid var(--hairline);background:none;cursor:pointer;color:var(--ink);}
.lookup-row.sel{background:var(--accent-wash);}
.lookup-row .row-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.lookup-row .row-ref{font-weight:600;}
.lookup-row .row-action{color:var(--accent);font-size:12px;white-space:nowrap;}
.lookup-row .row-snippet{font-family:'Literata',Georgia,serif;font-size:14.5px;color:var(--text-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lookup-empty{padding:16px 18px;color:var(--text-3);}
.lookup-footer{display:flex;gap:14px;padding:8px 18px;border-top:1px solid var(--hairline);color:var(--text-3);font-size:11px;}
.lookup-footer .spacer{flex:1;}

/* §verdict-bar */
.verdict-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:35;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--hairline-strong);border-radius:99px;background:var(--surface);box-shadow:var(--shadow);}
.verdict-btn{display:flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--hairline-strong);border-radius:99px;background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;}
.verdict-btn:hover{border-color:var(--text-3);}
.verdict-btn[disabled]{opacity:0.45;cursor:default;}
.verdict-btn.essential{background:var(--accent);border-color:var(--accent);color:var(--on-accent);border-radius:99px 0 0 99px;font-weight:600;}
.verdict-btn.essential:hover{background:var(--accent-hover);}
.verdict-btn.essential .kbd{background:rgba(255,255,255,.16);border-color:transparent;color:var(--on-accent);}
.verdict-btn.notrel:hover{border-color:var(--v-notrel);color:var(--v-notrel);}
.essential-group{display:flex;align-items:stretch;}
.topn-picker{display:flex;align-items:center;gap:2px;border:1px solid var(--control-border);border-left:0;border-radius:0 99px 99px 0;background:var(--surface);padding:0 8px 0 6px;}
.topn-label{font-size:11px;color:var(--text-3);padding-right:2px;white-space:nowrap;}
.topn-seg{border:1px solid transparent;background:none;border-radius:99px;padding:3px 7px;color:var(--text-2);cursor:pointer;font-size:12px;min-width:26px;}
.topn-seg[aria-checked="true"]{border-color:var(--control-border);background:var(--accent-wash);color:var(--ink);font-weight:600;}

/* §judged chips */
.judged-chip{display:inline-flex;align-items:baseline;gap:8px;margin-top:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;}
.judged-chip .chip-undo{border:0;background:none;padding:0;cursor:pointer;font:inherit;font-weight:400;text-decoration:underline;color:inherit;}
.judged-chip.affirm{color:var(--v-affirm);background:var(--v-affirm-wash);}
.judged-chip.notrel{color:var(--v-notrel);background:var(--v-notrel-wash);}
.judged-chip.missing{color:var(--v-missing);background:var(--v-missing-wash);}
.judged-chip.reopened{color:var(--text-2);background:none;border:1px dashed var(--hairline-strong);font-weight:400;}
.queue-dot.affirm{background:var(--v-affirm);border-color:var(--v-affirm);}
.queue-dot.notrel{background:var(--v-notrel);border-color:var(--v-notrel);}
.queue-dot.reopened{background:none;border-style:dashed;border-color:var(--text-3);}
.queue-check{flex:none;accent-color:var(--accent);margin:0;}
.rail-hint{padding:10px 16px;color:var(--text-3);display:flex;flex-direction:column;gap:8px;align-items:flex-start;}

/* §bulk bar */
.bulk-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:35;display:flex;align-items:center;gap:12px;padding:8px 14px;border:1px solid var(--hairline-strong);border-radius:99px;background:var(--surface);box-shadow:var(--shadow);}
.bulk-bar .count{font-weight:600;}

/* §tail rescue */
.tail-header{width:100%;max-width:680px;color:var(--text-3);font-size:12px;padding:4px 12px 8px;}
.tail-action{margin-left:auto;flex:none;border:1px solid var(--hairline-strong);border-radius:99px;background:var(--surface);color:var(--text-2);padding:2px 10px;cursor:pointer;font-size:12px;white-space:nowrap;}
.tail-action:hover{border-color:var(--accent);color:var(--accent);}
.tail-action[disabled]{opacity:0.45;cursor:default;}
.receipt-chip{display:block;margin:2px 12px 8px;padding:6px 10px;border-left:2px solid var(--v-missing);color:var(--text-3);font-size:12px;max-width:60ch;}

/* §layers (interview, missing form, rescue preview) */
.layer-dialog{width:560px;max-width:92vw;background:var(--panel);border:1px solid var(--hairline-strong);border-radius:var(--r-panel);box-shadow:var(--shadow);padding:22px 26px;max-height:78vh;overflow-y:auto;}
.layer-title{font-family:'Literata',Georgia,serif;font-size:20px;margin:0 0 10px;}
.layer-prompt{margin:0 0 12px;color:var(--ink);}
.layer-note{color:var(--text-3);font-size:12px;margin-top:12px;max-width:60ch;}
.layer-actions{display:flex;gap:10px;margin-top:16px;align-items:center;}
.layer-cancel-link{border:0;background:none;color:var(--text-3);cursor:pointer;text-decoration:underline;padding:0;font:inherit;}
.layer-verse{font-family:'Literata',Georgia,serif;font-size:16px;line-height:1.65;margin:12px 0 0;}
.layer-verse sup{font-family:'Source Sans 3',-apple-system,'Segoe UI',sans-serif;font-size:0.6em;color:var(--text-3);margin:0 3px 0 1px;}
.ref-input{width:100%;padding:9px 12px;border:1px solid var(--control-border);border-radius:var(--r-ctl);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;outline:none;margin-bottom:6px;}
.note-input{width:100%;padding:9px 12px;border:1px solid var(--control-border);border-radius:var(--r-ctl);background:var(--surface);color:var(--ink);font:inherit;outline:none;min-height:52px;resize:vertical;}
.btn-primary[disabled]{opacity:0.45;cursor:default;}
.pick-verse{display:flex;align-items:baseline;gap:10px;margin-top:10px;}
.pick-verse .layer-verse{margin:0;flex:1;}
.pick-chip{flex:none;border:1px solid var(--hairline-strong);border-radius:99px;background:var(--surface);color:var(--text-2);padding:2px 10px;cursor:pointer;font-size:12px;white-space:nowrap;}
.pick-chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash);color:var(--accent);font-weight:600;}
.seg-row{display:flex;align-items:center;gap:2px;margin-top:14px;}
.seg-label{font-size:12px;color:var(--text-2);margin-right:8px;}

/* §receipt card */
.receipt-card{background:var(--surface);border:1px dashed var(--hairline-strong);border-radius:var(--r-panel);padding:12px 16px;margin-bottom:8px;}
.receipt-card .receipt-tag{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--v-missing);margin-bottom:4px;}
.receipt-card .card-ref{display:block;margin-bottom:2px;}
.receipt-card .receipt-lines{color:var(--text-3);font-size:12px;margin-top:6px;max-width:60ch;}
.missing-link{width:100%;max-width:680px;text-align:left;border:0;background:none;color:var(--text-3);padding:4px 0 10px;cursor:pointer;font-size:12px;text-decoration:underline;}
.missing-link:hover{color:var(--text-2);}
.data-banner{padding:9px 16px;border-bottom:1px solid var(--hairline);background:var(--accent-wash);color:var(--text-2);}
</style>
</head>
<body>
<!-- §skeleton -->
<header class="app-header">
  <div class="wordmark">The Study</div>
  <nav class="app-nav" aria-label="Workbench views">
    <button type="button" class="nav-item" data-nav="review" aria-current="page">Review</button>
    <button type="button" class="nav-item" data-nav="compare" aria-disabled="true" title="Coming in a later phase">Compare</button>
    <button type="button" class="nav-item" data-nav="history" aria-disabled="true" title="Coming in a later phase">History</button>
    <button type="button" class="nav-item" data-nav="finish" aria-disabled="true" title="Coming in a later phase">Finish up</button>
  </nav>
  <div class="header-spacer"></div>
  <button type="button" class="header-btn" id="lookup-open" aria-label="Quick lookup">
    <span>Look something up</span><span class="kbd">⌘K</span>
  </button>
  <button type="button" class="header-btn" id="theme-cycle" aria-label="Theme"></button>
  <a class="advanced-link" href="/">Advanced</a>
</header>
<div id="banner-slot"></div>
<main class="review-grid" id="review-grid">
  <aside class="queue-rail" aria-label="Queue">
    <div class="queue-body" id="queue-body"></div>
    <div class="rail-footer" id="rail-footer" hidden></div>
  </aside>
  <section class="center-pane" aria-label="Passage">
    <form class="search-form" id="search-form" role="search">
      <div class="search-box">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"></circle><line x1="13.5" y1="13.5" x2="18" y2="18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line></svg>
        <input type="search" class="search-input" id="search-input" aria-label="Search the scriptures" placeholder="Search the scriptures…" autocomplete="off">
        <button type="submit" class="btn-primary">Search</button>
      </div>
    </form>
    <div id="results-status" class="visually-hidden" role="status" aria-live="polite"></div>
    <div id="center-body" style="width:100%;display:flex;flex-direction:column;align-items:center;"></div>
  </section>
  <aside class="why-rail" aria-label="Why this ranked" id="why-rail"></aside>
</main>
<div id="actionbar-slot"></div>
<div id="toast-slot"></div>
<div id="dialog-slot"></div>
<script>
(function () {
  'use strict';

  // §routes — copied verbatim from workbench/src/staticSnapshot.ts
  // REQUIRED_INLINE_ROUTES (the single-inline snapshot contract requires
  // every one of these literals present in the inline JS).
  const ROUTES = [
    '/api/v2/health',
    '/api/v2/cases',
    '/api/v2/inbox',
    '/api/v2/judgments',
    '/api/v2/compile/preview',
    '/api/v2/compile/apply',
    '/api/v2/checks',
    '/api/v2/context',
    '/api/v2/jobs/',
    '/api/v2/candidates',
    '/api/v2/sessions',
    '/api/v2/quality',
    '/api/v2/audits/preview',
    '/api/v2/audits/apply',
    '/api/v2/audits/close',
    '/complete-item',
    '/skip-item',
    '/complete-session',
    '/blind-sessions',
    '/missing-passages',
    '/passages',
    '/promotion/preview',
    '/promotion/apply',
    '/cancel',
  ];
  void ROUTES;

  // §copy
  const COPY = {
    contract: 'Your calls are saved the moment you make them. They change search results only in the next reviewed update — never while you work.',
    referenceKind: 'That’s a direct passage lookup — nothing to judge here. Search words or phrases to judge results.',
    invalidReference: (q) => '“' + q + '” looks like a verse reference, but no passage matches it — check the book name, chapter, and verse (e.g. “Psalm 46:1”).',
    emptyTitle: (q) => 'No results for “' + q + '”.',
    emptyInvite: 'Know a passage that should answer this? Add it.',
    emptyButton: 'Add the missing passage',
    searchError: 'The engine did not answer. It may be restarting — try again in a moment.',
    bootFetchFailed: 'That part of the workbench did not load. Reload the page to try again.',
    tailDivider: (n) => 'Lower results (' + n + ') — most people never scroll this far. Skim them only to rescue anything that deserves the top.',
    readOnlyStrong: 'Read-only right now.',
    readOnlyRest: ' The engine is rebuilding its data. You can read everything, but calls will not save. This usually clears in a minute — then reload the page.',
    attribution: 'King James Version',
    namedByNone: 'No theme names this verse — it matched on wording alone',
    whyFooter: 'This explains the engine’s reasoning. Your call decides whether it was right.',
    queueEmpty: 'Nothing waiting — search for something you would actually type.',
    lookupPlaceholder: 'Type words or a reference — “mercy”, “Psalm 46”…',
    lookupEmpty: 'Nothing yet — try a word from the verse, or a reference like “Psalm 46:1”.',
    lookupAction: 'Review results for this search ↵',
    lookupNoCase: 'Looking something up never creates a case by itself.',
    resultsAnnounce: (n, q) => n + ' results for “' + q + '”',
    // §copy — P2 (voting)
    markedEssential: (ref, n) => 'Marked ' + ref + ' Essential (top ' + n + ')',
    marked: (ref, label) => 'Marked ' + ref + ' ' + label,
    replaced: (ref, label) => 'Replaced your earlier call — ' + ref + ' is now ' + label + '.',
    undoRest: '— your call stands until you choose a new one',
    chipUndoTitle: 'Undo — nothing is erased: your call stands until you make a new one.',
    reopenedChip: 'Reopened — your earlier call stands until you make a new one.',
    reopenedDot: 'Reopened — your earlier call stands',
    yourCall: (label) => 'Your call: ' + label,
    priorCall: (when, label) => 'Your call from ' + when + ': ' + label,
    addedMissingChip: (n) => 'Added as missing (top ' + n + ')',
    newSearchHint: 'New search — your first call starts its case.',
    addQueue: 'Add to my queue',
    readOnlyToast: 'Read-only right now — this call was not saved.',
    postFailed: 'That call did not save — the engine did not answer. Try it again in a moment.',
    rejectedToast: 'Something about this call was rejected — nothing was saved.',
    refreshedToast: 'The results just refreshed — check your call still applies.',
    banner409: 'The engine’s data changed since this case was opened. The results below are the current ones — earlier calls stay on record.',
    bannerSnapshotWins: 'The engine’s data changed since this case was opened. The results below are the ones this case was opened on — earlier calls stay on record.',
    interviewAuto: (matched) => 'This looks like a word match without the meaning — “' + matched + '” appears, but the verse is about something else. Mark it not relevant?',
    interviewAutoNoFragment: 'This looks like a word match without the meaning — the verse is about something else. Mark it not relevant?',
    interviewYes: 'Yes — not relevant',
    conceptStep1: (namedBy, ref) => 'This verse ranked because it is listed under the theme “' + namedBy + '.” Does ' + ref + ' really speak about that?',
    conceptStep1Yes: 'Yes, it does',
    conceptStep1No: 'No, it doesn’t',
    conceptStep2: (q) => 'Then is it just not a good answer for “' + q + '”?',
    conceptStep2Commit: 'Right — not a fit here',
    conceptStep2Keep: 'Actually, keep it',
    whyLabel: 'Say why, from the text — this goes to the theme files for review.',
    confirmNotRelevant: 'Mark not relevant',
    demotion: 'It is demoted out of the top results for this query only — the verse stays in the corpus and every other search.',
    bulkDone: (n) => 'Marked ' + n + ' passages Helpful.',
    bulkPartial: (k, n) => 'Marked ' + k + ' of ' + n + ' — the rest did not save. Try them on their cards.',
    bulkUndoHint: 'Change a bulk call on its card.',
    alreadyJudgedCheckbox: 'Already judged — change it on its card',
    markAllHelpful: 'Mark all helpful',
    selectedCount: (n) => n + ' selected',
    tailHeader: 'A rescue is recorded like a suggestion — it can’t be taken back here.',
    tailHint: 'Lower results take one action — “Should be near the top”.',
    rescueButton: 'Should be near the top',
    rescueConfirm: 'Confirm — should be near the top',
    rescueToast: (ref, q) => 'Noted — ' + ref + ' should rank near the top for “' + q + '”. Saved to your calls for the next reviewed update.',
    loadingPassage: 'Loading the passage…',
    permanence: 'A suggestion can’t be taken back here — you’ll see it again in Finish up before anything is written, and a human reviews every change before it ships.',
    mGateHint: 'Search words or phrases first — a suggestion attaches to the search that misses it.',
    alreadyDisplayed: 'That passage is already in the results — judge it there instead.',
    alreadyInTail: 'That passage is already in the lower results — rescue it there instead.',
    formTitle: 'Add a passage that should be here',
    formPrompt: (q) => 'Which passage is missing for “' + q + '”?',
    formPlaceholder: 'e.g. Lamentations 3:22',
    formWaiting: 'The passage appears here as you type, so you can check it is the right one.',
    formUnresolved: (input) => '“' + input + '” doesn’t match a passage yet — check the book name, chapter, and verse (e.g. “Psalm 46:1”). Abbreviations like “Ps 46:1” work too.',
    formPickCopy: 'Pick the one verse that should rank — suggestions are recorded one verse at a time.',
    formPickChip: 'Add this verse',
    formSubmit: 'Add this passage to the answers',
    formNotePlaceholder: 'Optional — e.g. other phrases people might type to find this.',
    formNoteLabel: 'Optional note',
    formTopLabel: 'Should show in top',
    suggestionToast: (ref, n) => 'Added ' + ref + ' as missing (top ' + n + '). Saved to your calls for the next reviewed update.',
    receiptTitle: 'Your suggestion',
    receiptSaved: 'Saved to your calls. It goes in for review with the next reviewed update.',
    missingLink: 'Missing a passage?',
    doneCount: 'done',
    toGo: (n) => n + ' to go',
    toGoReopened: (n, r) => n + ' to go · ' + r + ' reopened',
  };
  const VERDICT_LABELS = { essential: 'Essential', helpful: 'Helpful', irrelevant: 'Not relevant' };
  const PILL_BY_FAMILY = {
    concept_anchor: 'Matched the meaning',
    exact_phrase: 'Shares key words',
    token_overlap: 'Shares key words',
    proximity: 'Shares key words',
    concept_lexicon: 'Close in meaning',
    translation_variant: 'Close in meaning',
    passage_terms: 'Close in meaning',
    cross_reference: 'Close in meaning',
    co_citation: 'Close in meaning',
  };
  const SOURCE_LABELS = {
    manual: 'You looked this up',
    gauntlet: 'From a routine check',
    coverage: 'New topic to cover',
    'stale-judgment': 'Needs a fresh look',
    telemetry: 'From real searches',
    calibration: 'Spot check',
    regression: 'Used to rank differently',
  };
  const TOP_WINDOW = 10;

  // §state
  const state = {
    themeMode: 'auto',
    health: null,
    meta: null,
    concepts: [],
    cases: [],
    search: { status: 'idle', query: '', kind: null, results: [], passage: null },
    searchSeq: 0,
    focus: 0,            // index into the roving stops (cards, divider, tail rows)
    expandedIndex: 0,    // which top-block card renders expanded
    inTail: false,       // whether focus currently sits on a tail row
    tailExpanded: false,
    railTab: 'why',
    passages: Object.create(null),  // ref -> {status:'loading'|'done'|'failed', passage}
    contexts: Object.create(null),  // ref -> {status, data}
    passageSeq: 0,
    lookup: null,        // {q, kind, results, sel, opener, seq}
    toastTimer: null,
    // §state — P2 (voting)
    withinTop: 3,        // persisted study.withinTop; the value the next E commits
    activeCase: null,    // {caseId, query, source, state, token, snapshotResults} — the open case behind the current query
    judgedByTarget: Object.create(null),   // targetId -> active v2 record (supersede-resolved)
    missingByRef: Object.create(null),     // reference -> active v2 missing record
    reopened: Object.create(null),         // targetId -> true (local third display state)
    sessionJudgmentIds: Object.create(null), // judgmentId -> true (made this session)
    sessionRescues: Object.create(null),   // `${caseId}|${reference}` -> true (missing recorded as a tail rescue)
    rescuedRows: Object.create(null),      // `${caseId}|${rowReference}` -> confirmed canonical reference
    selected: Object.create(null),         // targetId -> true (bulk selection)
    interview: null,     // {targetId, reference, mode, step, concept, matched, note, diagnosis, opener}
    missingForm: null,   // §3.3 form state
    rescue: null,        // §3.1 rescue preview state
    dataBanner: null,    // null | 'refreshed' | 'snapshot-wins'
    lastCommit: null,    // {kind:'verdict'|'rescue'|'suggestion'|'bulk', targetId?} — the U target
    caseSeq: 0,          // drops stale case-open fetches
  };

  function readUiState() {
    try {
      const raw = localStorage.getItem('study.ui.v1');
      if (raw === null) return {};
      const parsed = JSON.parse(raw);
      return typeof parsed === 'object' && parsed !== null ? parsed : {};
    } catch (error) { return {}; }
  }
  function writeUiState(patch) {
    try {
      localStorage.setItem('study.ui.v1', JSON.stringify(Object.assign(readUiState(), patch)));
    } catch (error) { /* storage unavailable */ }
  }

  // §request
  async function requestJson(url, options) {
    let response;
    try {
      response = await fetch(url, options);
    } catch (error) {
      const message = error instanceof Error ? error.message : 'Network request failed.';
      throw { status: 0, code: 'network_error', message };
    }
    let body = null;
    try { body = await response.json(); } catch (error) { body = null; }
    if (!response.ok) {
      const isRecord = (v) => typeof v === 'object' && v !== null && !Array.isArray(v);
      const message = body && isRecord(body) && isRecord(body.error) && typeof body.error.message === 'string'
        ? body.error.message
        : body && isRecord(body) && typeof body.error === 'string'
          ? body.error
          : response.status + ' ' + response.statusText;
      const code = body && isRecord(body) && isRecord(body.error) && typeof body.error.code === 'string'
        ? body.error.code
        : 'request_failed';
      throw { status: response.status, code, message, body };
    }
    if (body && typeof body === 'object' && body.ok === true && 'data' in body) return body.data;
    return body;
  }

  // §api — one named function per endpoint.
  function apiMeta() { return requestJson('/api/meta'); }
  function apiConcepts() { return requestJson('/api/concepts'); }
  function apiHealth() { return requestJson('/api/v2/health'); }
  function apiCases() { return requestJson('/api/v2/cases'); }
  function apiSearch(query) { return requestJson('/api/search?q=' + encodeURIComponent(query)); }
  function apiPassage(reference) { return requestJson('/api/passage?ref=' + encodeURIComponent(reference)); }
  function apiContext(reference) { return requestJson('/api/v2/context?ref=' + encodeURIComponent(reference)); }
  function postJson(url, body) {
    return requestJson(url, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
  }
  function apiCaseCreate(query) { return postJson('/api/v2/cases', { query, source: 'manual' }); }
  function apiCase(caseId) { return requestJson('/api/v2/cases/' + encodeURIComponent(caseId)); }
  function apiCaseState(caseId, caseState) { return postJson('/api/v2/cases/' + encodeURIComponent(caseId) + '/state', { state: caseState }); }
  function apiJudgments(caseId) { return requestJson('/api/v2/judgments?caseId=' + encodeURIComponent(caseId)); }
  function apiJudgmentSubmit(body) { return postJson('/api/v2/judgments', body); }

  // §stores
  function openCases() {
    const open = state.cases.filter((c) => c && (c.state === 'new' || c.state === 'reviewing' || c.state === 'judged'));
    // The raw response arrives in caseId order; the queue is most recently
    // touched first (latest events[].at descending).
    const touched = (c) => {
      let latest = '';
      for (const event of Array.isArray(c.events) ? c.events : []) {
        if (event && typeof event.at === 'string' && event.at > latest) latest = event.at;
      }
      return latest;
    };
    return open.slice().sort((a, b) => touched(b) < touched(a) ? -1 : touched(b) > touched(a) ? 1 : 0);
  }
  function degradedReadOnly() {
    const h = state.health;
    return !!(h && h.startup && h.startup.degraded === true);
  }
  function caseForQuery(query) {
    const wanted = normalizeQuery(query);
    return openCases().find((c) => normalizeQuery(c.query) === wanted) ?? null;
  }
  // Supersede-chain resolution: a record named by a newer record's
  // `supersedes` is replaced; what remains is the active call per target key.
  function resolveActiveJudgments(records) {
    const superseded = Object.create(null);
    for (const record of records) {
      if (record && typeof record.supersedes === 'string') superseded[record.supersedes] = true;
    }
    const byTarget = Object.create(null);
    const byRef = Object.create(null);
    for (const record of records) {
      if (!record || record.schemaVersion !== 2) continue;
      if (superseded[record.judgmentId] === true) continue;
      if (record.action === 'missing' && typeof record.reference === 'string') byRef[record.reference] = record;
      else if (typeof record.targetId === 'string' && record.action !== 'prefer') byTarget[record.targetId] = record;
    }
    return { byTarget, byRef };
  }
  function recordLocalJudgment(record) {
    state.sessionJudgmentIds[record.judgmentId] = true;
    if (record.action === 'missing' && typeof record.reference === 'string') {
      state.missingByRef[record.reference] = record;
    } else if (typeof record.targetId === 'string') {
      state.judgedByTarget[record.targetId] = record;
      delete state.reopened[record.targetId];
    }
  }
  function verdictLabel(record) {
    if (record.action === 'essential') return 'Essential (top ' + record.withinTop + ')';
    return VERDICT_LABELS[record.action] ?? record.action;
  }
  function relativeTime(at) {
    const then = Date.parse(at);
    if (Number.isNaN(then)) return 'earlier';
    const minutes = Math.round((Date.now() - then) / 60000);
    if (minutes < 2) return 'a moment ago';
    if (minutes < 60) return minutes + ' minutes ago';
    const hours = Math.round(minutes / 60);
    if (hours < 2) return 'an hour ago';
    if (hours < 24) return hours + ' hours ago';
    const days = Math.round(hours / 24);
    if (days < 2) return 'yesterday';
    return days + ' days ago';
  }
  // Old-console concept evidence: the distinct concepts a result's evidence
  // names (concept_anchor or concept_lexicon), prefix-stripped, with ids
  // resolved through the boot /api/concepts cache (null when unresolved).
  function conceptEvidence(result) {
    const seen = Object.create(null);
    const concepts = [];
    for (const reason of Array.isArray(result.reasons) ? result.reasons : []) {
      if (!reason || typeof reason.label !== 'string') continue;
      if (reason.family !== 'concept_anchor' && reason.family !== 'concept_lexicon') continue;
      const label = reason.label.replace(/^Theme cue: /, '').replace(/^Related theme: /, '').replace(/^Theme: /, '');
      if (seen[label] === true) continue;
      seen[label] = true;
      let id = null;
      for (const concept of state.concepts) {
        if (concept && concept.label === label && typeof concept.id === 'string') { id = concept.id; break; }
      }
      concepts.push({ label, id });
    }
    return concepts;
  }
  function selectedCount() {
    return Object.keys(state.selected).length;
  }
  function anyLayerOpen() {
    return state.interview !== null || state.missingForm !== null || state.rescue !== null || state.lookup !== null;
  }

  // §helpers
  function node(tag, className, text) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (text !== undefined) element.textContent = text;
    return element;
  }
  function clear(element) {
    while (element.firstChild) element.removeChild(element.firstChild);
  }
  function normalizeQuery(query) {
    return query.trim().replace(/\s+/g, ' ').toLowerCase();
  }
  function escapeRegExp(text) {
    return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }
  // The §3.1 highlight rule: quoted fragments from the result's lexical
  // reason labels. "Exact phrase" contributes the query itself; a label
  // matching `Contains "{fragment}"` contributes the fragment.
  function lexicalFragments(result, query) {
    const fragments = [];
    for (const reason of Array.isArray(result.reasons) ? result.reasons : []) {
      if (!reason || typeof reason.label !== 'string') continue;
      if (reason.label === 'Exact phrase') fragments.push(query);
      else {
        const match = /^Contains "(.+)"$/.exec(reason.label);
        if (match !== null) fragments.push(match[1]);
      }
    }
    return fragments;
  }
  // Whole-word, punctuation-tolerant literal emphasis — never tokenization.
  function fragmentRegex(fragment) {
    const words = fragment.trim().split(/\s+/).filter(Boolean).map(escapeRegExp);
    if (words.length === 0) return null;
    const pattern = '(?<![\\p{L}\\p{N}])' + words.join('[^\\p{L}\\p{N}]+') + '(?![\\p{L}\\p{N}])';
    try { return new RegExp(pattern, 'giu'); } catch (error) { return null; }
  }
  // Appends `text` to `target` with <mark> around every fragment match.
  // Zero regex matches means zero highlights, never a guess.
  function appendHighlighted(target, text, fragments) {
    const ranges = [];
    for (const fragment of fragments) {
      const regex = fragmentRegex(fragment);
      if (regex === null) continue;
      let match;
      while ((match = regex.exec(text)) !== null) {
        if (match[0].length === 0) { regex.lastIndex += 1; continue; }
        ranges.push([match.index, match.index + match[0].length]);
      }
    }
    ranges.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    let cursor = 0;
    for (const [start, end] of ranges) {
      if (start < cursor) continue; // overlapping match already marked
      if (start > cursor) target.appendChild(document.createTextNode(text.slice(cursor, start)));
      target.appendChild(node('mark', '', text.slice(start, end)));
      cursor = end;
    }
    if (cursor < text.length) target.appendChild(document.createTextNode(text.slice(cursor)));
  }
  function topReason(result) {
    let best = null;
    for (const reason of Array.isArray(result.reasons) ? result.reasons : []) {
      if (!reason || typeof reason.points !== 'number') continue;
      if (best === null || reason.points > best.points) best = reason; // ties: first wins
    }
    return best;
  }
  function conceptNames(result) {
    const names = [];
    for (const reason of Array.isArray(result.reasons) ? result.reasons : []) {
      if (!reason || reason.family !== 'concept_anchor' || typeof reason.label !== 'string') continue;
      const label = reason.label.replace(/^Theme cue: /, '').replace(/^Related theme: /, '').replace(/^Theme: /, '');
      if (names.indexOf(label) === -1) names.push(label);
    }
    return names;
  }
  function parseReference(reference) {
    const match = /^(.+) (\d+):(\d+)(?:-(\d+))?$/.exec(reference);
    if (match === null) return null;
    return {
      book: match[1],
      chapter: Number(match[2]),
      start: Number(match[3]),
      end: match[4] === undefined ? Number(match[3]) : Number(match[4]),
    };
  }
  function isRangeReference(reference) {
    return reference.indexOf('-') !== -1;
  }

  // §theme
  function systemPrefersDark() {
    try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (error) { return false; }
  }
  function applyTheme() {
    const dark = state.themeMode === 'dark' || (state.themeMode === 'auto' && systemPrefersDark());
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    const button = document.getElementById('theme-cycle');
    button.textContent = state.themeMode === 'auto' ? '◐ Auto' : state.themeMode === 'light' ? '☀ Light' : '☾ Dark';
    button.title = 'Theme: ' + (state.themeMode === 'auto' ? 'Auto (follows your system)' : state.themeMode === 'light' ? 'Light' : 'Dark');
  }
  function cycleTheme() {
    state.themeMode = state.themeMode === 'auto' ? 'light' : state.themeMode === 'light' ? 'dark' : 'auto';
    try { localStorage.setItem('study.theme', state.themeMode); } catch (error) { /* storage unavailable */ }
    applyTheme();
  }

  // §toast
  function showToast(message, options) {
    const slot = document.getElementById('toast-slot');
    clear(slot);
    const toast = node('div', 'toast');
    toast.setAttribute('role', 'status');
    toast.setAttribute('aria-live', 'polite');
    toast.appendChild(node('span', '', message));
    if (options && typeof options.undoTargetId === 'string') {
      // Inline "Undo [U] — your call stands until you choose a new one":
      // the truth is on the affordance — the POST has already happened.
      const undo = node('button', 'chip-undo', 'Undo');
      undo.type = 'button';
      undo.style.textDecoration = 'underline';
      undo.style.border = '0';
      undo.style.background = 'none';
      undo.style.cursor = 'pointer';
      undo.style.color = 'var(--accent)';
      undo.addEventListener('click', () => { reopenCall(options.undoTargetId); });
      toast.appendChild(undo);
      toast.appendChild(node('span', 'kbd', 'U'));
      toast.appendChild(node('span', '', COPY.undoRest));
    }
    slot.appendChild(toast);
    if (state.toastTimer !== null) clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => { clear(slot); state.toastTimer = null; }, 6000);
  }

  // §render — banner
  function renderBanner() {
    const slot = document.getElementById('banner-slot');
    clear(slot);
    const grid = document.getElementById('review-grid');
    if (degradedReadOnly()) {
      const banner = node('div', 'banner');
      banner.setAttribute('role', 'status');
      const strong = node('strong', '', COPY.readOnlyStrong);
      banner.appendChild(strong);
      banner.appendChild(document.createTextNode(COPY.readOnlyRest));
      slot.appendChild(banner);
      grid.classList.add('with-banner');
    } else {
      grid.classList.remove('with-banner');
    }
    if (state.dataBanner !== null) {
      const changed = node('div', 'data-banner');
      changed.setAttribute('role', 'status');
      changed.textContent = state.dataBanner === 'refreshed' ? COPY.banner409 : COPY.bannerSnapshotWins;
      slot.appendChild(changed);
    }
  }

  // §render — queue rail
  function renderQueue() {
    const body = document.getElementById('queue-body');
    clear(body);
    const footer = document.getElementById('rail-footer');
    const hasResults = state.search.status === 'results';

    if (hasResults) {
      const label = node('div', 'rail-label');
      label.appendChild(node('span', 'label-text', 'Results for “' + state.search.query + '”'));
      const counts = topBlockCounts();
      const countText = counts.unjudged === 0
        ? COPY.doneCount
        : counts.reopened > 0
          ? COPY.toGoReopened(counts.unjudged, counts.reopened)
          : COPY.toGo(counts.unjudged);
      label.appendChild(node('span', 'label-count', countText));
      body.appendChild(label);
      state.search.results.slice(0, TOP_WINDOW).forEach((result, index) => {
        const row = node('div', 'queue-row' + (index === state.expandedIndex ? ' current' : ''));
        const judged = state.judgedByTarget[result.targetId];
        const reopened = state.reopened[result.targetId] === true;
        const check = node('input', 'queue-check');
        check.type = 'checkbox';
        check.checked = state.selected[result.targetId] === true;
        if (judged !== undefined) {
          // Disabled so the bulk selection count always equals the commit count.
          check.disabled = true;
          check.setAttribute('aria-label', COPY.alreadyJudgedCheckbox);
        } else {
          check.setAttribute('aria-label', 'Select ' + result.reference + ' for bulk marking');
          check.addEventListener('click', (event) => { event.stopPropagation(); });
          check.addEventListener('change', () => { toggleSelected(result.targetId); });
        }
        row.appendChild(check);
        row.appendChild(node('span', 'row-ref', result.reference));
        const dot = node('span', 'queue-dot' + (reopened ? ' reopened' : judged !== undefined ? (judged.action === 'irrelevant' ? ' notrel' : ' affirm') : ''));
        dot.setAttribute('role', 'img');
        dot.setAttribute('aria-label', reopened
          ? COPY.reopenedDot
          : judged !== undefined
            ? 'Judged ' + verdictLabel(judged)
            : 'Not judged yet');
        row.appendChild(dot);
        row.addEventListener('click', () => { focusStop(index); });
        body.appendChild(row);
      });
      if (state.activeCase === null && (state.search.status === 'results' || state.search.status === 'empty')) {
        const hint = node('div', 'rail-hint');
        hint.appendChild(node('span', '', COPY.newSearchHint));
        const add = node('button', 'btn-quiet', COPY.addQueue);
        add.type = 'button';
        add.id = 'add-to-queue';
        if (degradedReadOnly()) add.disabled = true;
        add.addEventListener('click', () => { void addToQueue(); });
        hint.appendChild(add);
        body.appendChild(hint);
      }
    }

    const activeCaseId = state.activeCase !== null ? state.activeCase.caseId : null;
    const waiting = openCases().filter((record) => record.caseId !== activeCaseId);
    body.appendChild(node('div', 'queue-section-title', 'Waiting in your queue'));
    if (waiting.length === 0) {
      body.appendChild(node('div', 'rail-empty', COPY.queueEmpty));
    } else {
      for (const record of waiting) {
        const row = node('button', 'waiting-row');
        row.type = 'button';
        row.appendChild(node('span', 'q', '“' + record.query + '”'));
        const source = SOURCE_LABELS[record.source];
        if (source !== undefined) row.appendChild(node('span', '', source));
        row.addEventListener('click', () => {
          document.getElementById('search-input').value = record.query;
          void submitSearch(record.query);
        });
        body.appendChild(row);
      }
    }

    if (hasResults) {
      footer.hidden = false;
      footer.textContent = COPY.contract;
    } else {
      footer.hidden = true;
      footer.textContent = '';
    }
  }

  // §render — center pane
  function announce(text) {
    document.getElementById('results-status').textContent = text;
  }

  function renderCenter() {
    const body = document.getElementById('center-body');
    clear(body);
    const search = state.search;

    if (search.status === 'idle') {
      body.appendChild(node('div', 'contract-line', COPY.contract));
      return;
    }
    if (search.status === 'loading') {
      const skeleton = node('div', 'results-list');
      skeleton.id = 'results-skeleton';
      skeleton.setAttribute('aria-busy', 'true');
      for (let i = 0; i < 5; i += 1) skeleton.appendChild(node('div', 'skeleton-row'));
      body.appendChild(skeleton);
      return;
    }
    if (search.status === 'error') {
      const box = node('div', 'error-box');
      box.appendChild(node('span', '', COPY.searchError));
      const retry = node('button', 'btn-quiet', 'Retry');
      retry.type = 'button';
      retry.addEventListener('click', () => { void submitSearch(search.query); });
      box.appendChild(retry);
      body.appendChild(box);
      return;
    }
    if (search.status === 'reference') {
      const message = node('div', 'center-message');
      message.appendChild(node('p', '', COPY.referenceKind));
      if (search.passage && Array.isArray(search.passage.verses)) {
        const head = node('h1', 'verse-ref serif', search.passage.reference);
        message.appendChild(head);
        const versesEl = node('p', 'verse-body');
        for (const verse of search.passage.verses) {
          versesEl.appendChild(node('sup', '', String(verse.verse)));
          versesEl.appendChild(document.createTextNode(verse.text + ' '));
        }
        message.appendChild(versesEl);
        message.appendChild(node('div', 'attribution', COPY.attribution));
      }
      body.appendChild(message);
      return;
    }
    if (search.status === 'invalid') {
      const message = node('div', 'center-message');
      message.appendChild(node('p', '', COPY.invalidReference(search.query)));
      body.appendChild(message);
      return;
    }
    if (search.status === 'empty') {
      const message = node('div', 'center-message');
      message.appendChild(node('p', 'headline', COPY.emptyTitle(search.query)));
      message.appendChild(node('p', '', COPY.emptyInvite));
      const addButton = node('button', 'btn-primary', COPY.emptyButton);
      addButton.type = 'button';
      addButton.id = 'empty-add-missing';
      addButton.addEventListener('click', (event) => { openMissingForm(event.currentTarget); });
      message.appendChild(addButton);
      message.appendChild(node('div', 'contract-line', COPY.contract));
      body.appendChild(message);
      return;
    }
    // status === 'results'
    renderResults(body);
  }

  function renderResults(body) {
    const search = state.search;
    const results = search.results;
    const top = results.slice(0, TOP_WINDOW);
    const tail = results.slice(TOP_WINDOW);
    const list = node('div', 'results-list');
    list.id = 'results-list';

    top.forEach((result, index) => {
      list.appendChild(renderCard(result, index, results.length));
    });
    renderReceiptCards(list);
    body.appendChild(list);

    // Persistent low-key suggestion entry point, pinned after the top block.
    const missingLink = node('button', 'missing-link', COPY.missingLink);
    missingLink.type = 'button';
    missingLink.id = 'missing-link';
    missingLink.addEventListener('click', (event) => { openMissingForm(event.currentTarget); });
    list.appendChild(missingLink);

    if (tail.length > 0) {
      const divider = node('button', 'tail-divider', COPY.tailDivider(tail.length));
      divider.type = 'button';
      divider.id = 'tail-divider';
      divider.setAttribute('aria-expanded', state.tailExpanded ? 'true' : 'false');
      divider.setAttribute('aria-controls', 'tail-list');
      divider.tabIndex = state.focus === top.length ? 0 : -1;
      divider.addEventListener('click', () => {
        state.tailExpanded = !state.tailExpanded;
        state.focus = top.length;
        renderAll({ focus: true });
      });
      divider.addEventListener('focus', () => { state.focus = top.length; state.inTail = false; });
      list.appendChild(divider);

      const tailList = node('div', 'tail-list');
      tailList.id = 'tail-list';
      if (!state.tailExpanded) tailList.hidden = true;
      if (state.tailExpanded) {
        // Permanence, disclosed before commit: visible before any rescue.
        tailList.appendChild(node('div', 'tail-header', COPY.tailHeader));
        tail.forEach((result, tailIndex) => {
          const stopIndex = top.length + 1 + tailIndex;
          const row = node('div', 'tail-row' + (state.focus === stopIndex ? ' focused' : ''));
          row.dataset.stop = String(stopIndex);
          row.tabIndex = state.focus === stopIndex ? 0 : -1;
          row.appendChild(node('span', 'rank-badge', '#' + (TOP_WINDOW + tailIndex + 1)));
          row.appendChild(node('span', 'card-ref', result.reference));
          row.appendChild(node('span', 'card-excerpt', result.excerpt));
          const action = node('button', 'tail-action', COPY.rescueButton);
          action.type = 'button';
          action.tabIndex = state.focus === stopIndex ? 0 : -1;
          if (degradedReadOnly()) action.disabled = true;
          action.addEventListener('click', (event) => {
            event.stopPropagation();
            openRescuePreview(stopIndex);
          });
          row.appendChild(action);
          row.addEventListener('click', () => { focusStop(stopIndex); });
          row.addEventListener('focus', (event) => {
            if (event.target === row) onTailRowFocused(stopIndex);
          });
          tailList.appendChild(row);
          const rescuedRef = state.activeCase !== null
            ? state.rescuedRows[state.activeCase.caseId + '|' + result.reference]
            : undefined;
          if (typeof rescuedRef === 'string') {
            const receipt = node('div', 'receipt-chip');
            receipt.appendChild(node('div', '', COPY.addedMissingChip(10) + ' — ' + rescuedRef));
            receipt.appendChild(node('div', '', COPY.permanence));
            tailList.appendChild(receipt);
          }
        });
      }
      list.appendChild(tailList);
    }
  }

  // "Your suggestion" receipt cards at the end of the top block — visibly not
  // engine results (no rank badge). Session suggestions and prior-session
  // missing records both render here; session tail rescues do not (their
  // receipt rides the rescued row).
  function renderReceiptCards(list) {
    if (state.activeCase === null) return;
    const caseId = state.activeCase.caseId;
    for (const reference of Object.keys(state.missingByRef)) {
      if (state.sessionRescues[caseId + '|' + reference] === true) continue;
      const record = state.missingByRef[reference];
      const card = node('div', 'receipt-card');
      card.appendChild(node('div', 'receipt-tag', COPY.receiptTitle));
      card.appendChild(node('span', 'card-ref', reference));
      if (typeof record.excerpt === 'string' && record.excerpt !== '') {
        card.appendChild(node('div', 'card-excerpt', record.excerpt));
      }
      const lines = node('div', 'receipt-lines');
      lines.appendChild(node('div', '', COPY.receiptSaved));
      lines.appendChild(node('div', '', COPY.permanence));
      card.appendChild(lines);
      list.appendChild(card);
    }
  }

  function renderCard(result, index, totalCount) {
    const expanded = index === state.expandedIndex;
    const card = node('article', 'result-card' + (expanded ? ' expanded' : '') + (index >= 3 ? ' after-three' : ''));
    card.dataset.stop = String(index);
    card.dataset.reference = result.reference;
    card.tabIndex = state.focus === index ? 0 : -1;
    card.addEventListener('focus', () => { onCardFocused(index); });
    card.addEventListener('click', () => { focusStop(index); });

    if (!expanded) {
      const line = node('div', 'card-line');
      line.appendChild(node('span', 'rank-badge' + (index < 3 ? ' top' : ''), '#' + (index + 1)));
      line.appendChild(node('span', 'card-ref', result.reference));
      line.appendChild(node('span', 'card-excerpt', result.excerpt));
      card.appendChild(line);
      const chip = renderJudgedChip(result);
      if (chip !== null) card.appendChild(chip);
      return card;
    }

    const head = node('div', 'verse-head');
    const heading = node('h1', 'verse-ref', result.reference);
    head.appendChild(heading);
    head.appendChild(node('span', 'verse-pos', 'Result ' + (index + 1) + ' of ' + totalCount + ' for “' + state.search.query + '”'));
    card.appendChild(head);
    const badge = node('div', '');
    badge.appendChild(node('span', 'rank-badge' + (index < 3 ? ' top' : ''), '#' + (index + 1)));
    card.appendChild(badge);

    card.appendChild(renderVerseBody(result));
    card.appendChild(node('div', 'attribution', COPY.attribution));

    const best = topReason(result);
    const pillLabel = best !== null && PILL_BY_FAMILY[best.family] !== undefined ? PILL_BY_FAMILY[best.family] : null;
    if (pillLabel !== null) card.appendChild(node('span', 'reason-pill', pillLabel));
    const chip = renderJudgedChip(result);
    if (chip !== null) card.appendChild(node('div', '')).appendChild(chip);
    return card;
  }

  // §render — judged-state chip (§3.1): verdict chips carry an inline Undo
  // whose aria-label/title state that nothing is erased.
  function renderJudgedChip(result) {
    const reopened = state.reopened[result.targetId] === true;
    if (reopened) {
      return node('span', 'judged-chip reopened', COPY.reopenedChip);
    }
    const record = state.judgedByTarget[result.targetId];
    if (record === undefined) return null;
    const label = verdictLabel(record);
    const priorSession = state.sessionJudgmentIds[record.judgmentId] !== true;
    const text = priorSession ? COPY.priorCall(relativeTime(record.at), label) : COPY.yourCall(label);
    const tone = record.action === 'irrelevant' ? 'notrel' : 'affirm';
    const chip = node('span', 'judged-chip ' + tone);
    chip.appendChild(node('span', '', text));
    const undo = node('button', 'chip-undo', 'Undo');
    undo.type = 'button';
    undo.setAttribute('aria-label', COPY.chipUndoTitle);
    undo.title = COPY.chipUndoTitle;
    undo.addEventListener('click', (event) => {
      event.stopPropagation();
      reopenCall(result.targetId);
    });
    chip.appendChild(undo);
    return chip;
  }

  function renderVerseBody(result) {
    const fragments = lexicalFragments(result, state.search.query);
    const versesEl = node('p', 'verse-body');
    const cached = state.passages[result.reference];
    if (cached !== undefined && cached.status === 'done') {
      for (const verse of cached.passage.verses) {
        versesEl.appendChild(node('sup', '', String(verse.verse)));
        appendHighlighted(versesEl, verse.text, fragments);
        versesEl.appendChild(document.createTextNode(' '));
      }
      return versesEl;
    }
    // Placeholder (fetch in flight or failed): the excerpt. A single verse
    // shows the reference's verse number as its one sup — for one verse the
    // excerpt IS the verse text, so this rendering is already complete. A
    // multi-verse run shows the joined excerpt with no sup markers.
    if (!isRangeReference(result.reference)) {
      const parsed = parseReference(result.reference);
      if (parsed !== null) versesEl.appendChild(node('sup', '', String(parsed.start)));
    }
    appendHighlighted(versesEl, result.excerpt, fragments);
    return versesEl;
  }

  // §render — why rail
  function focusedResult() {
    const search = state.search;
    if (search.status !== 'results') return null;
    const top = search.results.slice(0, TOP_WINDOW);
    if (state.focus < top.length) return search.results[state.focus] ?? null;
    if (state.focus > top.length) {
      const tailIndex = state.focus - top.length - 1;
      return search.results[TOP_WINDOW + tailIndex] ?? null;
    }
    // Focus on the divider: the rail keeps following the expanded card.
    return search.results[state.expandedIndex] ?? null;
  }

  function renderRail() {
    const rail = document.getElementById('why-rail');
    clear(rail);
    const result = focusedResult();
    if (result === null) return;

    const tabs = node('div', 'rail-tabs');
    tabs.setAttribute('role', 'tablist');
    tabs.setAttribute('aria-label', 'Explanation');
    const whyTab = node('button', 'rail-tab', 'Why this ranked');
    whyTab.type = 'button';
    whyTab.setAttribute('role', 'tab');
    whyTab.setAttribute('aria-selected', state.railTab === 'why' ? 'true' : 'false');
    whyTab.addEventListener('click', () => { state.railTab = 'why'; renderRail(); });
    const ctxTab = node('button', 'rail-tab', 'Context');
    ctxTab.type = 'button';
    ctxTab.setAttribute('role', 'tab');
    ctxTab.setAttribute('aria-selected', state.railTab === 'context' ? 'true' : 'false');
    ctxTab.addEventListener('click', () => {
      state.railTab = 'context';
      ensureContext(result.reference);
      renderRail();
    });
    tabs.appendChild(whyTab);
    tabs.appendChild(ctxTab);
    rail.appendChild(tabs);

    const pad = node('div', 'rail-pad');
    rail.appendChild(pad);

    if (state.railTab === 'why') {
      const addRow = (key, value) => {
        const row = node('div', 'why-row');
        row.appendChild(node('div', 'why-key', key));
        row.appendChild(node('div', 'why-val', value));
        pad.appendChild(row);
      };
      addRow('Search', '“' + state.search.query + '”');
      const names = conceptNames(result);
      addRow('Named by', names.length > 0 ? names.join(' · ') : COPY.namedByNone);
      const fragments = lexicalFragments(result, state.search.query);
      addRow('Matched', fragments.length > 0 ? fragments.map((f) => '“' + f + '”').join(' · ') : '—');
      const best = topReason(result);
      addRow('Came from', best !== null && best.provenance && typeof best.provenance.label === 'string' ? best.provenance.label : '—');
      const pillLabel = best !== null && PILL_BY_FAMILY[best.family] !== undefined ? PILL_BY_FAMILY[best.family] : null;
      if (pillLabel !== null) {
        const pillWrap = node('div', '');
        pillWrap.style.paddingTop = '12px';
        pillWrap.appendChild(node('span', 'reason-pill', pillLabel));
        pad.appendChild(pillWrap);
      }
      pad.appendChild(node('div', 'rail-note', COPY.whyFooter));
      return;
    }

    // Context tab
    const cached = state.contexts[result.reference];
    if (cached === undefined || cached.status === 'loading') {
      pad.appendChild(node('div', 'rail-note', 'Loading the passage…'));
      return;
    }
    if (cached.status === 'failed') {
      pad.appendChild(node('div', 'rail-note', 'That part of the workbench did not load. Reload the page to try again.'));
      return;
    }
    const context = cached.data.context;
    const focusRange = parseReference(result.reference);
    for (const verse of context.passage.verses) {
      const inFocus = focusRange !== null && verse.verse >= focusRange.start && verse.verse <= focusRange.end;
      const verseEl = node('p', 'context-verse' + (inFocus ? ' focus' : ''));
      verseEl.appendChild(node('sup', '', String(verse.verse)));
      verseEl.appendChild(document.createTextNode(verse.text));
      pad.appendChild(verseEl);
    }
  }

  function ensureContext(reference) {
    if (state.contexts[reference] !== undefined) return;
    state.contexts[reference] = { status: 'loading', data: null };
    apiContext(reference).then((data) => {
      state.contexts[reference] = { status: 'done', data };
      renderRail();
    }).catch(() => {
      state.contexts[reference] = { status: 'failed', data: null };
      renderRail();
    });
  }

  function ensurePassage(reference) {
    const cached = state.passages[reference];
    if (cached !== undefined && (cached.status === 'done' || cached.status === 'loading')) return;
    // The fetch fires on every focus, uniformly — one code path. Stale
    // responses are dropped via the request-sequence counter.
    const seq = ++state.passageSeq;
    state.passages[reference] = { status: 'loading', passage: null };
    apiPassage(reference).then((outcome) => {
      if (seq !== state.passageSeq && state.passages[reference] === undefined) return;
      if (outcome && outcome.kind === 'passage' && outcome.passage && Array.isArray(outcome.passage.verses)) {
        state.passages[reference] = { status: 'done', passage: outcome.passage };
      } else {
        state.passages[reference] = { status: 'failed', passage: null };
      }
      renderAll({ focus: false });
    }).catch(() => {
      state.passages[reference] = { status: 'failed', passage: null };
      // Failure keeps the excerpt rendering; no error state.
      renderAll({ focus: false });
    });
  }

  // §counts — the per-query counter counts only the top block (§3.1); a
  // reopened row's earlier call is still active, so it counts as judged and
  // is reported separately.
  function topBlockCounts() {
    const top = state.search.status === 'results' ? state.search.results.slice(0, TOP_WINDOW) : [];
    let judged = 0;
    let reopenedCount = 0;
    for (const result of top) {
      if (state.reopened[result.targetId] === true) { judged += 1; reopenedCount += 1; }
      else if (state.judgedByTarget[result.targetId] !== undefined) judged += 1;
    }
    return { total: top.length, judged, reopened: reopenedCount, unjudged: top.length - judged };
  }

  // §case — active case, lazy creation, snapshot lifecycle (§4.3/§4.6).
  function renderedTopRefs() {
    return state.search.results.slice(0, TOP_WINDOW).map((result) => result.reference);
  }
  function reviewTopRefs(review) {
    const items = review && review.result && Array.isArray(review.result.results) ? review.result.results : [];
    return items.map((item) => item.reference);
  }
  function sameOrder(a, b) {
    return a.length === b.length && a.every((value, index) => value === b[index]);
  }
  function adoptSnapshot(review, caseRecord) {
    state.activeCase = {
      caseId: review.caseId,
      query: caseRecord && typeof caseRecord.query === 'string' ? caseRecord.query : review.query,
      source: review.source,
      state: caseRecord && typeof caseRecord.state === 'string' ? caseRecord.state : 'new',
      token: review.token,
      snapshotResults: review.result && Array.isArray(review.result.results) ? review.result.results : [],
    };
  }
  function replaceTopBlock(review) {
    const snapResults = review.result && Array.isArray(review.result.results) ? review.result.results : [];
    if (state.search.status !== 'results') return;
    const tail = state.search.results.slice(TOP_WINDOW);
    state.search.results = snapResults.concat(tail);
    const top = Math.min(state.search.results.length, TOP_WINDOW);
    if (state.focus < top && state.expandedIndex >= top) state.expandedIndex = 0;
    if (state.focus >= state.search.results.length) { state.focus = 0; state.expandedIndex = 0; state.inTail = false; }
  }
  function syncLocalCaseState(caseId, next) {
    state.cases = state.cases.map((entry) => entry && entry.caseId === caseId
      ? Object.assign({}, entry, { state: next })
      : entry);
  }
  // First vote on a case-less query: POST /cases, verify the fresh snapshot
  // against the rendered top-10 (§4.6 race guard), then the judgment POST.
  // Dedupes by normalized query against the open-cases list before creating.
  async function ensureActiveCase() {
    if (state.activeCase !== null) return { ok: true, created: false };
    const query = state.search.query;
    const existing = caseForQuery(query);
    let review = null;
    let caseRecord = null;
    let created = false;
    try {
      if (existing !== null) {
        const data = await apiCase(existing.caseId);
        caseRecord = data.case;
        review = data.review;
      } else {
        const data = await apiCaseCreate(query);
        caseRecord = data.case;
        review = data.review;
        created = true;
        state.cases = state.cases.concat([caseRecord]);
      }
    } catch (error) {
      return { ok: false, error };
    }
    if (review === null || typeof review.token !== 'string') return { ok: false };
    if (state.search.status === 'results' && !sameOrder(reviewTopRefs(review), renderedTopRefs())) {
      // Mismatch: re-render from the snapshot and ask for re-confirmation —
      // the pending first vote is dropped, never silently re-aimed.
      adoptSnapshot(review, caseRecord);
      replaceTopBlock(review);
      showToast(COPY.refreshedToast);
      renderAll({});
      return { ok: false, raceMismatch: true };
    }
    adoptSnapshot(review, caseRecord);
    renderQueue();
    return { ok: true, created };
  }

  // §commit — every judgment POST goes through here: routing fields, 409
  // one-shot recovery, failure copy. Append-only: a change of call posts a
  // superseding record; nothing is ever deleted.
  async function postJudgmentBody(fields, opts) {
    const silent = opts !== undefined && opts.silentFailure === true;
    if (degradedReadOnly()) {
      if (!silent) showToast(COPY.readOnlyToast);
      return { ok: false, code: 'read_only' };
    }
    const ensured = await ensureActiveCase();
    if (!ensured.ok) {
      if (ensured.raceMismatch === true) return { ok: false, code: 'race_mismatch' };
      return handleCommitFailure(ensured.error ?? { code: 'case_failed' }, opts);
    }
    const body = Object.assign({ caseId: state.activeCase.caseId, snapshotToken: state.activeCase.token }, fields);
    let outcome;
    try {
      outcome = await apiJudgmentSubmit(body);
    } catch (error) {
      if (error && error.code === 'review_snapshot_required') return recoverSnapshot(fields, opts);
      return handleCommitFailure(error, opts);
    }
    return finalizeCommit(outcome, ensured.created);
  }
  // §4.6: silent one-shot recovery for 409 review_snapshot_required.
  async function recoverSnapshot(fields, opts) {
    let data;
    try {
      data = await apiCase(state.activeCase.caseId);
    } catch (error) {
      return handleCommitFailure(error, opts);
    }
    const review = data.review;
    if (review === null || typeof review.token !== 'string') {
      return handleCommitFailure({ code: 'no_review' }, opts);
    }
    const identical = sameOrder(reviewTopRefs(review), renderedTopRefs());
    adoptSnapshot(review, data.case);
    if (identical) {
      try {
        const outcome = await apiJudgmentSubmit(Object.assign({ caseId: state.activeCase.caseId, snapshotToken: review.token }, fields));
        return finalizeCommit(outcome, false);
      } catch (error) {
        return handleCommitFailure(error, opts);
      }
    }
    replaceTopBlock(review);
    state.dataBanner = 'refreshed';
    showToast(COPY.refreshedToast);
    renderAll({});
    return { ok: false, code: 'snapshot_changed' };
  }
  function handleCommitFailure(error, opts) {
    const code = error && typeof error.code === 'string' ? error.code : 'network_error';
    const message = error && typeof error.message === 'string' ? error.message : '';
    if (code === 'validation_failed' && message.indexOf('already present in the judged result set') !== -1) {
      // Coupled to judgments.ts's rejection string; covered by the study-p2
      // and study-p3 Playwright assertions (plan §3.3 server-side detection).
      return { ok: false, code: 'already_displayed', message };
    }
    refetchHealth();
    const silent = opts !== undefined && opts.silentFailure === true;
    if (!silent) {
      if (code === 'startup_degraded_read_only' || code === 'artifact_unavailable') {
        showToast(COPY.readOnlyToast);
      } else if (code === 'validation_failed') {
        console.error('Judgment rejected: ' + message);
        showToast(COPY.rejectedToast);
      } else {
        showToast(COPY.postFailed);
      }
    }
    return { ok: false, code, message };
  }
  function finalizeCommit(outcome, createdCase) {
    const record = outcome && outcome.judgment ? outcome.judgment : null;
    if (record !== null) recordLocalJudgment(record);
    void updateCaseState(createdCase);
    return { ok: true, record };
  }
  // Bookkeeping transitions (§4.3): failures show nothing, only log.
  async function updateCaseState(createdCase) {
    const active = state.activeCase;
    if (active === null) return;
    try {
      if (createdCase || active.state === 'new') {
        active.state = 'reviewing';
        syncLocalCaseState(active.caseId, 'reviewing');
        await apiCaseState(active.caseId, 'reviewing');
      }
      const counts = topBlockCounts();
      if (counts.total > 0 && counts.unjudged === 0 && active.state !== 'judged') {
        active.state = 'judged';
        syncLocalCaseState(active.caseId, 'judged');
        await apiCaseState(active.caseId, 'judged');
      }
    } catch (error) {
      console.warn('Case state transition failed:', error && error.message ? error.message : error);
    }
  }

  // §verdicts — E/H/X on the focused top-block card.
  async function verdictAction(action) {
    if (degradedReadOnly()) { showToast(COPY.readOnlyToast); return; }
    if (state.search.status !== 'results') return;
    const result = state.search.results[state.expandedIndex];
    if (result === undefined || state.expandedIndex >= topCount()) return;
    if (action === 'irrelevant') { openInterview(result); return; }
    const fields = action === 'essential'
      ? { action: 'essential', targetId: result.targetId, withinTop: state.withinTop }
      : { action: 'helpful', targetId: result.targetId };
    await commitVerdict(result, fields);
  }
  async function commitVerdict(result, fields) {
    const existing = state.judgedByTarget[result.targetId];
    const body = Object.assign({}, fields);
    if (existing !== undefined) body.supersedes = existing.judgmentId;
    const outcome = await postJudgmentBody(body, {});
    if (!outcome.ok) { renderAll({}); return outcome; }
    state.lastCommit = { kind: 'verdict', targetId: result.targetId };
    const label = verdictLabel(outcome.record);
    const toastText = existing !== undefined
      ? COPY.replaced(result.reference, label)
      : outcome.record.action === 'essential'
        ? COPY.markedEssential(result.reference, outcome.record.withinTop)
        : COPY.marked(result.reference, label);
    showToast(toastText, { undoTargetId: result.targetId });
    advanceAfterCommit(result.targetId);
    renderAll({ focus: true });
    return outcome;
  }
  // Commit auto-advance wraps (plain J/K never does — §3.1/§3.12).
  function advanceAfterCommit(targetId) {
    const top = state.search.results.slice(0, TOP_WINDOW);
    const from = top.findIndex((result) => result.targetId === targetId);
    const start = from === -1 ? 0 : from;
    for (let step = 1; step <= top.length; step += 1) {
      const index = (start + step) % top.length;
      const candidate = top[index];
      if (state.judgedByTarget[candidate.targetId] === undefined && state.reopened[candidate.targetId] !== true) {
        state.focus = index;
        state.expandedIndex = index;
        state.inTail = false;
        return;
      }
    }
    if (from !== -1) { state.focus = from; state.expandedIndex = from; state.inTail = false; }
  }
  // §undo — U never posts anything by itself (§4.5): local reopen; the next
  // verdict posts with `supersedes`. Binding: undo retargets focus to the
  // reopened card.
  function reopenCall(targetId) {
    if (state.judgedByTarget[targetId] === undefined) return;
    state.reopened[targetId] = true;
    const top = state.search.results.slice(0, TOP_WINDOW);
