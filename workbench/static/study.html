      data = await apiCase(state.activeCase.caseId);
    } catch (error) {
      return handleCommitFailure(error, opts);
    }
    const review = data.review;
    if (review === null || typeof review.token !== 'string') {
      return handleCommitFailure({ code: 'no_review' }, opts);
    }
    const identical = sameOrder(reviewTopRefs(review), renderedTopRefs());
    adoptSnapshot(review, data.case);
    if (identical) {
      try {
        const outcome = await apiJudgmentSubmit(Object.assign({ caseId: state.activeCase.caseId, snapshotToken: review.token }, fields));
        return finalizeCommit(outcome, false);
      } catch (error) {
        return handleCommitFailure(error, opts);
      }
    }
    replaceTopBlock(review);
    state.dataBanner = 'refreshed';
    showToast(COPY.refreshedToast);
    renderAll({});
    return { ok: false, code: 'snapshot_changed' };
  }
  function handleCommitFailure(error, opts) {
    const code = error && typeof error.code === 'string' ? error.code : 'network_error';
    const message = error && typeof error.message === 'string' ? error.message : '';
    if (code === 'validation_failed' && message.indexOf('already present in the judged result set') !== -1) {
      // Coupled to judgments.ts's rejection string; covered by the study-p2
      // and study-p3 Playwright assertions (plan §3.3 server-side detection).
      return { ok: false, code: 'already_displayed', message };

    const silent = opts !== undefined && opts.silentFailure === true;

  }
  // Bookkeeping transitions (§4.3): failures show nothing, only log.
  async function updateCaseState(createdCase) {
    const active = state.activeCase;
    if (active === null) return;
    try {
      if (createdCase || active.state === 'new') {
        active.state = 'reviewing';
        syncLocalCaseState(active.caseId, 'reviewing');
        await apiCaseState(active.caseId, 'reviewing');
      }
      const counts = topBlockCounts();
      if (counts.total > 0 && counts.unjudged === 0 && active.state !== 'judged') {
        active.state = 'judged';
        syncLocalCaseState(active.caseId, 'judged');
        await apiCaseState(active.caseId, 'judged');
      }
    } catch (error) {
      console.warn('Case state transition failed:', error && error.message ? error.message : error);
    }
  }

  // §verdicts — E/H/X on the focused top-block card.
  async function verdictAction(action) {
    if (degradedReadOnly()) { showToast(COPY.readOnlyToast); return; }
    if (state.search.status !== 'results') return;
    const result = state.search.results[state.expandedIndex];
    if (result === undefined || state.expandedIndex >= topCount()) return;
    if (action === 'irrelevant') { openInterview(result); return; }
    const fields = action === 'essential'
      ? { action: 'essential', targetId: result.targetId, withinTop: state.withinTop }
      : { action: 'helpful', targetId: result.targetId };
    await commitVerdict(result, fields);
  }
  async function commitVerdict(result, fields) {
    const existing = state.judgedByTarget[result.targetId];
    const body = Object.assign({}, fields);
    if (existing !== undefined) body.supersedes = existing.judgmentId;
    const outcome = await postJudgmentBody(body, {});
    if (!outcome.ok) { renderAll({}); return outcome; }
    state.lastCommit = { kind: 'verdict', targetId: result.targetId };
    const label = verdictLabel(outcome.record);
    const toastText = existing !== undefined
      ? COPY.replaced(result.reference, label)
      : outcome.record.action === 'essential'
        ? COPY.markedEssential(result.reference, outcome.record.withinTop)
        : COPY.marked(result.reference, label);
    showToast(toastText, { undoTargetId: result.targetId });
    advanceAfterCommit(result.targetId);
    renderAll({ focus: true });
    return outcome;
  }
  // Commit auto-advance wraps (plain J/K never does — §3.1/§3.12).
  function advanceAfterCommit(targetId) {
    const top = state.search.results.slice(0, TOP_WINDOW);
    const from = top.findIndex((result) => result.targetId === targetId);
    const start = from === -1 ? 0 : from;
    for (let step = 1; step <= top.length; step += 1) {
      const index = (start + step) % top.length;
      const candidate = top[index];
      if (state.judgedByTarget[candidate.targetId] === undefined && state.reopened[candidate.targetId] !== true) {
        state.focus = index;
        state.expandedIndex = index;
        state.inTail = false;
        return;
      }
    }

  }

  // verdict posts with `supersedes`. Binding: undo retargets focus to the
  // reopened card.
  function reopenCall(targetId) {
    if (state.judgedByTarget[targetId] === undefined) return;
    state.reopened[targetId] = true;
    const reopenedRef = referenceForTarget(targetId);
    if (reopenedRef !== null) state.sessionLog.reopened[sessionKey(reopenedRef)] = true;
    const top = state.search.results.slice(0, TOP_WINDOW);
    const index = top.findIndex((result) => result.targetId === targetId);
    if (index !== -1) { state.focus = index; state.expandedIndex = index; state.inTail = false; }
    renderAll({ focus: true });
  }
  function handleUndoKey() {
    const last = state.lastCommit;
    if (last === null) return;
    if (last.kind === 'verdict') { reopenCall(last.targetId); return; }
    if (last.kind === 'bulk') { showToast(COPY.bulkUndoHint); return; }
    // Suggestions and rescues have no reopen path (§4.5); state permanence.
    showToast(COPY.permanence);
  }

  // §bulk — serial batch; stops at the first failure (§3.2 partial receipt).
  function toggleSelected(targetId) {
    if (state.judgedByTarget[targetId] !== undefined) return;
    if (state.selected[targetId] === true) delete state.selected[targetId];
    else state.selected[targetId] = true;
    renderAll({});
  }
  async function runBulk() {
    if (degradedReadOnly()) { showToast(COPY.readOnlyToast); return; }
    const top = state.search.results.slice(0, TOP_WINDOW);
    const chosen = top.filter((result) => state.selected[result.targetId] === true);
    const total = chosen.length;
    if (total === 0) return;
    let committed = 0;
    for (const result of chosen) {
      const outcome = await postJudgmentBody({ action: 'helpful', targetId: result.targetId }, { silentFailure: true });
      if (!outcome.ok) break;
      committed += 1;
      delete state.selected[result.targetId];
    }
    state.lastCommit = { kind: 'bulk' };
    if (committed === total) {
      state.selected = Object.create(null);
      showToast(COPY.bulkDone(total));
    } else {
      showToast(COPY.bulkPartial(committed, total));
    }
    renderAll({});
  }

  // §health — refetches on window focus and after any failed POST (§3.11).
  let healthRefetchInFlight = false;
  function refetchHealth() {
    if (healthRefetchInFlight) return;
    healthRefetchInFlight = true;
    apiHealth().then((health) => { state.health = health; }).catch(() => { /* keep the last known health */ }).then(() => {
      healthRefetchInFlight = false;
      renderAll({});
      if (state.rescue !== null) renderRescue();
      if (state.missingForm !== null) renderMissingForm();
    });
  }

  async function addToQueue() {
    if (degradedReadOnly()) { showToast(COPY.readOnlyToast); return; }
    const query = state.search.query;
    if (caseForQuery(query) !== null || state.activeCase !== null) return;
    try {
      const data = await apiCaseCreate(query);
      state.cases = state.cases.concat([data.case]);
      if (data.review !== null && typeof data.review.token === 'string') adoptSnapshot(data.review, data.case);
      updateActiveCaseCounts();
      renderAll({});
    } catch (error) {
      refetchHealth();
      showToast(COPY.postFailed);
    }
  }

  // §focus — roving tabindex over cards, divider, expanded tail rows.
  function stopCount() {
    const search = state.search;
    if (search.status !== 'results') return 0;
    const top = Math.min(search.results.length, TOP_WINDOW);
    const tail = search.results.length - top;
    if (tail <= 0) return top;
    return state.tailExpanded ? top + 1 + tail : top + 1;
  }

    return Math.min(state.search.results.length, TOP_WINDOW);
  }
  function onCardFocused(index) {
    state.focus = index;
    state.inTail = false;
    if (state.expandedIndex !== index) {
      state.expandedIndex = index;
      renderAll({ focus: true });
      return;
    }
    renderQueue();
    renderRail();
  }
  function onTailRowFocused(stopIndex) {
    state.focus = stopIndex;
    // When focus first enters the tail, the rail fronts the Context tab;
    // J/K within the tail keeps whichever tab the reviewer chose.
    if (!state.inTail) state.railTab = 'context';
    state.inTail = true;
    const result = focusedResult();
    if (result !== null) ensureContext(result.reference);
    renderTailFocusClasses();
    renderRail();
  }
  function renderTailFocusClasses() {
    const rows = document.querySelectorAll('.tail-row');
    rows.forEach((row) => {

      row.tabIndex = row.dataset.stop === String(state.focus) ? 0 : -1;
    });
  }

      ? list.querySelector('[data-stop="' + state.focus + '"]')
      : state.focus === topCount()
        ? document.getElementById('tail-divider')
        : list.querySelector('.tail-row[data-stop="' + state.focus + '"]');

  }

  }

  // §layers — shared focus-contract plumbing (§3.12): every layer is a
  // focus trap; on close, focus returns to the element that opened it.
  function trapTab(event) {
    const dialog = document.querySelector('#dialog-slot .layer-dialog');
    if (dialog === null) return;
    const candidates = dialog.querySelectorAll('input, textarea, button, [tabindex]');
    const focusables = [];
    for (const el of candidates) {
      if (!el.disabled && el.tabIndex !== -1) focusables.push(el);
    }
    if (focusables.length === 0) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }
  function openLayerDialog(titleText, titleId) {
    const slot = document.getElementById('dialog-slot');
    clear(slot);
    const overlay = node('div', 'overlay');
    const dialog = node('div', 'layer-dialog');
    dialog.setAttribute('role', 'dialog');
    dialog.setAttribute('aria-modal', 'true');
    dialog.setAttribute('aria-labelledby', titleId);
    const title = node('h2', 'layer-title', titleText);
    title.id = titleId;
    dialog.appendChild(title);
    overlay.appendChild(dialog);
    slot.appendChild(overlay);
    return dialog;
  }

    // roving-focus position (the focused card / tail row).
    if (opener && typeof opener.focus === 'function' && document.contains(opener)) { opener.focus(); return; }
    if (opener && typeof opener.id === 'string' && opener.id !== '') {
      const byId = document.getElementById(opener.id);
      if (byId !== null) { byId.focus(); return; }
    }
    if (state.search.status === 'results') focusCurrentStop();
  }

  // §interview — the not-relevant interview (§3.2, fixes §3.13.1–2).
  function openInterview(result) {
    if (degradedReadOnly()) { showToast(COPY.readOnlyToast); return; }
    const concepts = conceptEvidence(result);
    const fragments = lexicalFragments(result, state.search.query);
    const resolved = concepts.find((concept) => concept.id !== null);
    state.interview = {
      targetId: result.targetId,
      reference: result.reference,
      // The server requires conceptId for the concept-mode diagnoses; with
      // no resolvable id the interview falls back to auto mode (§4.4) and
      // the unresolved label rides the note into curation review.
      mode: resolved !== undefined ? 'concept' : 'auto',
      concept: resolved !== undefined ? resolved : null,
      unresolvedLabel: resolved === undefined && concepts.length > 0 ? concepts[0].label : null,
      matched: fragments.length > 0 ? fragments[0] : null,
      step: 1,
      diagnosis: null,
      note: '',
      opener: document.activeElement,

    renderAll({});
  }
  function renderInterview() {
    const interview = state.interview;
    if (interview === null) return;
    const dialog = openLayerDialog('Not relevant?', 'interview-title');
    dialog.id = 'interview-dialog';
    let firstFocus = null;

    const cancelButton = () => {
      const cancel = node('button', 'btn-quiet', 'Cancel');
      cancel.type = 'button';
      cancel.addEventListener('click', closeInterview);
      return cancel;
    };

    if (interview.mode === 'auto') {
      const prompt = node('p', 'layer-prompt', interview.matched !== null
        ? COPY.interviewAuto(interview.matched)
        : COPY.interviewAutoNoFragment);
      dialog.appendChild(prompt);
      const actions = node('div', 'layer-actions');
      const yes = node('button', 'btn-primary', COPY.interviewYes);
      yes.type = 'button';
      yes.id = 'interview-confirm';
      yes.addEventListener('click', () => { void commitInterview(); });
      actions.appendChild(yes);
      actions.appendChild(cancelButton());
      dialog.appendChild(actions);
      firstFocus = yes;
    } else if (interview.diagnosis !== null) {
      // Concept mode requires a why, before commit (§3.2).
      const label = node('label', 'layer-prompt', COPY.whyLabel);
      label.htmlFor = 'interview-why';
      dialog.appendChild(label);
      const why = node('textarea', 'note-input');
      why.id = 'interview-why';
      why.value = interview.note;
      why.addEventListener('input', () => {
        interview.note = why.value;
        const confirm = document.getElementById('interview-confirm');
        if (confirm !== null) confirm.disabled = interview.note.trim() === '';
      });
      dialog.appendChild(why);
      const actions = node('div', 'layer-actions');
      const confirm = node('button', 'btn-primary', COPY.confirmNotRelevant);
      confirm.type = 'button';
      confirm.id = 'interview-confirm';
      confirm.disabled = interview.note.trim() === '';
      confirm.addEventListener('click', () => { void commitInterview(); });
      actions.appendChild(confirm);
      actions.appendChild(cancelButton());
      dialog.appendChild(actions);
      firstFocus = why;
    } else if (interview.step === 1) {
      dialog.appendChild(node('p', 'layer-prompt', COPY.conceptStep1(interview.concept.label, interview.reference)));
      const actions = node('div', 'layer-actions');
      const yes = node('button', 'btn-quiet', COPY.conceptStep1Yes);
      yes.type = 'button';
      yes.addEventListener('click', () => { interview.step = 2; renderInterview(); });
      const no = node('button', 'btn-primary', COPY.conceptStep1No);
      no.type = 'button';
      no.addEventListener('click', () => { interview.diagnosis = 'wrong-anchor'; renderInterview(); });
      actions.appendChild(yes);
      actions.appendChild(no);
      const cancel = node('button', 'layer-cancel-link', 'Cancel (Esc)');
      cancel.type = 'button';
      cancel.addEventListener('click', closeInterview);
      actions.appendChild(cancel);
      dialog.appendChild(actions);
      firstFocus = yes;
    } else {
      dialog.appendChild(node('p', 'layer-prompt', COPY.conceptStep2(state.search.query)));
      const actions = node('div', 'layer-actions');
      const commit = node('button', 'btn-primary', COPY.conceptStep2Commit);
      commit.type = 'button';
      commit.addEventListener('click', () => { interview.diagnosis = 'concept-misfire'; renderInterview(); });
      const keep = node('button', 'btn-quiet', COPY.conceptStep2Keep);
      keep.type = 'button';
      keep.addEventListener('click', closeInterview);
      actions.appendChild(commit);
      actions.appendChild(keep);
      const cancel = node('button', 'layer-cancel-link', 'Cancel (Esc)');
      cancel.type = 'button';
      cancel.addEventListener('click', closeInterview);
      actions.appendChild(cancel);
      dialog.appendChild(actions);
      firstFocus = commit;
    }
    dialog.appendChild(node('p', 'layer-note', COPY.demotion));
    if (firstFocus !== null) firstFocus.focus();
  }
  async function commitInterview() {
    const interview = state.interview;
    if (interview === null) return;
    const result = state.search.results.find((entry) => entry.targetId === interview.targetId);
    if (result === undefined) { closeInterview(); return; }
    let fields;
    if (interview.mode === 'concept' && interview.diagnosis !== null) {
      const note = interview.note.trim();
      if (note === '') return;
      // Human-chosen diagnosis: no diagnosisInferred key at all (§4.4).
      fields = {
        action: 'irrelevant',
        targetId: interview.targetId,
        diagnosis: interview.diagnosis,
        conceptId: interview.concept.id,
        note,
      };
    } else {
      fields = {
        action: 'irrelevant',
        targetId: interview.targetId,
        diagnosis: 'lexical-noise',
        diagnosisInferred: true,
      };
      if (interview.unresolvedLabel !== null) {
        fields.note = 'concept label "' + interview.unresolvedLabel + '" (unresolved id)';
      }
    }
    state.interview = null;
    closeLayerDialog(interview.opener);
    await commitVerdict(result, fields);
  }

  // §rescue — the shared rescue/pick preview layer (§3.1; extended by the
  // missing form's pick mode). No rescue ever posts on the first keypress.
  function openRescuePreview(stopIndex) {
    if (degradedReadOnly()) { showToast(COPY.readOnlyToast); return; }
    const top = topCount();
    const tailIndex = stopIndex - top - 1;

  // Resolution timing (§3.1 binding): pressing E fires the resolution if not

    if (cached !== undefined && cached.status === 'done') { rescueResolved(cached.passage); return; }
    rescue.status = 'loading';
    renderRescue();
    apiPassage(rescue.rowReference).then((outcome) => {
      if (state.rescue !== rescue) return;
      if (outcome && outcome.kind === 'passage' && outcome.passage && Array.isArray(outcome.passage.verses) && outcome.passage.verses.length > 0) {
        state.passages[rescue.rowReference] = { status: 'done', passage: outcome.passage };
        rescueResolved(outcome.passage);

      const outcome = await apiPassage(singleRef);
      if (state.rescue !== rescue || rescue.picked !== verseNumber) return;
      if (outcome && outcome.kind === 'passage' && outcome.passage && Array.isArray(outcome.passage.verses) && outcome.passage.verses.length === 1) {

  async function confirmRescue() {

    const existing = state.missingByRef[reference];
    if (existing !== undefined) fields.supersedes = existing.judgmentId;
    const rowReference = rescue.rowReference;
    const outcome = await postJudgmentBody(fields, {});
    if (state.rescue !== rescue) return;

    if (!outcome.ok) {

        const index = await findTopBlockIndexForReference(reference);

    }
    const caseId = state.activeCase !== null ? state.activeCase.caseId : '';
    state.sessionRescues[caseId + '|' + reference] = true;
    state.rescuedRows[caseId + '|' + rowReference] = reference;

    // only in this session log, never guessed for prior-session records.

  // §missing-form — the suggestion flow (§3.3).
  function missingGateActive() {

  }
  function openMissingForm(opener) {

    form.pickedRef = null;
    form.unresolvedShown = false;

    // Live preview: debounced 250ms GET /api/passage as you type.
    form.debounce = setTimeout(() => {
      form.debounce = null;

        if (state.missingForm !== form || seq !== form.seq) return;
        if (outcome && outcome.kind === 'passage' && outcome.passage && Array.isArray(outcome.passage.verses) && outcome.passage.verses.length > 0) {

          form.resolvedFor = value;
          form.unresolvedShown = false;

  async function submitMissingForm() {

  // §already-displayed — reference comparison helpers (§3.3): a displayed
  // range card is compared by its member verses, resolved via GET
  // /api/passage (the focused-card resolution reused when already fetched).
  async function resolveRowPassage(reference) {
    const cached = state.passages[reference];
    if (cached !== undefined && cached.status === 'done') return cached.passage;
    try {
      const outcome = await apiPassage(reference);
      if (outcome && outcome.kind === 'passage' && outcome.passage && Array.isArray(outcome.passage.verses)) {
        state.passages[reference] = { status: 'done', passage: outcome.passage };
        return outcome.passage;
      }
    } catch (error) { /* fall through: no match provable */ }
    return null;
  }
  async function referenceMatchesRow(rowReference, canonicalRef) {
    if (rowReference === canonicalRef) return true;
    if (!isRangeReference(rowReference)) return false;
    const passage = await resolveRowPassage(rowReference);
    if (passage === null) return false;
    const range = parseReference(passage.reference);
    const single = parseReference(canonicalRef);
    if (range === null || single === null) return false;
    if (range.book !== single.book || range.chapter !== single.chapter) return false;
    return passage.verses.some((verse) => verse.verse === single.start);
  }
  async function findTopBlockIndexForReference(canonicalRef) {
    const top = state.search.results.slice(0, TOP_WINDOW);
    for (let index = 0; index < top.length; index += 1) {
      if (await referenceMatchesRow(top[index].reference, canonicalRef)) return index;
    }
    return -1;
  }
  async function findTailStopForReference(canonicalRef) {
    const results = state.search.results;
    const top = Math.min(results.length, TOP_WINDOW);
    for (let index = TOP_WINDOW; index < results.length; index += 1) {
      if (await referenceMatchesRow(results[index].reference, canonicalRef)) {
        return top + 1 + (index - TOP_WINDOW);
      }
    }
    return -1;
  }

  // §action-bar — verdict toolbar + bulk bar (§3.2). The toolbar is active

    const readOnly = degradedReadOnly();

    essential.appendChild(node('span', '', 'Essential'));

    essential.addEventListener('click', () => { void verdictAction('essential'); });
    group.appendChild(essential);
    const picker = node('div', 'topn-picker');

    bar.appendChild(verdictButton('X', 'Not relevant', 'verdict-notrel', readOnly, () => { void verdictAction('irrelevant'); }, 'notrel'));
    bar.appendChild(verdictButton('M', 'Missing passage', 'verdict-missing', readOnly, (event) => { handleMissingKey(event.currentTarget); }));
    slot.appendChild(bar);
  }

  // §screens — nav switching (P4). The review grid stays in the DOM; the
  // other screens render into their own containers.
  function setScreen(name) {
    if (state.screen === name) { renderAll({}); return; }
    state.screen = name;
    if (name === 'compare') void openCompare();
    if (name === 'history') openHistory();
    if (name === 'finish') void openFinishUp();
    renderAll({});
  }
  function renderScreenChrome() {
    document.getElementById('review-grid').hidden = state.screen !== 'review';
    document.getElementById('screen-compare').hidden = state.screen !== 'compare';
    document.getElementById('screen-history').hidden = state.screen !== 'history';
    document.getElementById('screen-finish').hidden = state.screen !== 'finish';
    document.getElementById('screen-advanced').hidden = state.screen !== 'advanced';
    const navName = state.screen;
    document.querySelectorAll('.nav-item, .advanced-link').forEach((item) => {
      if (item.dataset.nav === navName) item.setAttribute('aria-current', 'page');
      else item.removeAttribute('aria-current');
    });
    // The verdict toolbar and bulk bar belong to Review only.
    if (state.screen !== 'review') clear(document.getElementById('actionbar-slot'));
  }

  // §render — everything
  function renderAll(options) {
    renderScreenChrome();
    renderBanner();
    if (state.screen === 'compare') { renderCompare(); return; }
    if (state.screen === 'history') { renderHistory(); return; }
    if (state.screen === 'finish') { renderFinish(); return; }
    if (state.screen === 'advanced') { renderAdvanced(); return; }
    // Re-rendering replaces the results DOM: when the focused element lived
    // there (or focus already fell back to body after an earlier rebuild),
    // restore it, so an async re-render never strands keyboard focus.
    const active = document.activeElement;
    const focusWasInResults = active !== null && typeof active.closest === 'function'
      && active.closest('#center-body') !== null;
    // An id-bearing element (e.g. #missing-link, #empty-add-missing) is
    // re-found after the rebuild so the §3.12 layer focus contract holds:
    // closing a layer opened from such a control returns focus to it, not
    // to the roving card position.
    const activeId = focusWasInResults && typeof active.id === 'string' && active.id !== '' ? active.id : null;
    renderQueue();
    renderCenter();
    renderRail();
    renderActionBar();
    if (anyLayerOpen()) return;
    const explicit = options !== undefined && options.focus === true;
    if (state.search.status === 'results') {
      const focused = state.focus < topCount() ? state.search.results[state.focus] : null;
      if (focused) ensurePassage(focused.reference);
    }
    if (!explicit && activeId !== null) {
      const byId = document.getElementById(activeId);
      if (byId !== null && typeof byId.closest === 'function' && byId.closest('#center-body') !== null) {
        byId.focus();
        return;
      }
    }
    if (state.search.status === 'results' && (explicit || focusWasInResults)) focusCurrentStop();
  }

  // §compare — the blind Compare screen (§3.5/D27). Session and passage
  // field names are ported from the old console's compare code
  // (index.html:2779 area, loadComparisonReviews:3730): the start body is
  // {requestId}; a judgment posts {requestId, revision, stateDigest,
  // queryId, choice}; the passages GET carries exactly queryId + passageId.
  function compareReadOnly() {
    return degradedReadOnly() || state.compare.readOnly === true;
  }
  async function openCompare() {
    const compare = state.compare;
    if (compare.status === 'loading') return;
    compare.status = 'loading';
    renderCompare();
    try {
      const data = await apiCandidates();
      compare.reviews = data && Array.isArray(data.reviews) ? data.reviews : [];
      compare.readOnly = !!(data && data.readOnly === true);
      compare.status = 'ready';
    } catch (error) {
      compare.status = 'failed';
    }
    renderCompare();
  }
  // The per-review requestId persists in study.ui.v1 (§4.9) so a reload
  // resumes the same blind session instead of minting a duplicate.
  function blindRequestIdFor(reviewId) {
    const ui = readUiState();
    const map = typeof ui.blindRequestIds === 'object' && ui.blindRequestIds !== null ? ui.blindRequestIds : {};
    if (typeof map[reviewId] === 'string') return map[reviewId];
    const requestId = crypto.randomUUID();
    map[reviewId] = requestId;
    writeUiState({ blindRequestIds: map });
    return requestId;
  }
  async function startCompareSession(reviewId) {
    const compare = state.compare;
    if (compare.starting) return;
    compare.starting = true;
    renderCompare();
    try {
      const data = await apiBlindSessionStart(reviewId, blindRequestIdFor(reviewId));
      compare.reviewId = reviewId;
      acceptCompareSession(data.session);
    } catch (error) {
      compare.status = 'failed';
    }
    compare.starting = false;
    renderCompare();
  }
  function acceptCompareSession(session) {
    const compare = state.compare;
    compare.session = session;
    const queries = session && Array.isArray(session.queries) ? session.queries : [];
    if (!queries.some((query) => query.queryId === compare.queryId)) {
      const firstOpen = queries.find((query) => !query.judgment);
      compare.queryId = firstOpen !== undefined ? firstOpen.queryId
        : queries.length > 0 ? queries[0].queryId : null;
      compare.passageKey = null;
    }
  }
  function compareSelectedQuery() {
    const compare = state.compare;
    if (compare.session === null || compare.queryId === null) return null;
    const queries = Array.isArray(compare.session.queries) ? compare.session.queries : [];
    return queries.find((query) => query.queryId === compare.queryId) ?? null;
  }
  function selectComparePassage(passageId) {
    const compare = state.compare;
    const key = compare.queryId + '|' + passageId;
    compare.passageKey = key;
    if (compare.passages[key] === undefined) {
      compare.passages[key] = { status: 'loading', data: null };
      apiBlindPassage(compare.reviewId, compare.session.sessionId, compare.queryId, passageId).then((data) => {
        compare.passages[key] = { status: 'done', data };
        if (state.screen === 'compare') renderCompare();
      }).catch(() => {
        compare.passages[key] = { status: 'failed', data: null };
        if (state.screen === 'compare') renderCompare();
      });
    }
    renderCompare();
  }
  // §3.5 binding: A/B/T/W never commits directly — each opens the
  // one-confirm layer; only its Confirm posts.
  function openCompareConfirm(choice, opener) {
    if (compareReadOnly()) { showToast(COPY.readOnlyToast); return; }
    const query = compareSelectedQuery();
    if (query === null || query.judgment) return;
    state.compareConfirm = {
      choice,
      opener: opener !== null && opener !== undefined
        ? opener
        : document.getElementById('compare-' + KEY_BY_CHOICE[choice]),
    };
    renderCompareConfirm();
  }
  function closeCompareConfirm() {
    const confirm = state.compareConfirm;
    state.compareConfirm = null;
    closeLayerDialog(confirm !== null ? confirm.opener : null);
  }
  function renderCompareConfirm() {
    const confirm = state.compareConfirm;
    if (confirm === null) return;
    const label = CHOICE_LABELS[confirm.choice];
    const dialog = openLayerDialog(COPY.compareConfirmTitle(label), 'compare-confirm-title');
    dialog.id = 'compare-confirm-dialog';
    dialog.appendChild(node('p', 'layer-prompt', COPY.compareFinality));
    const actions = node('div', 'layer-actions');
    const commit = node('button', 'btn-primary', COPY.compareConfirmButton(label));
    commit.type = 'button';
    commit.id = 'compare-confirm-commit';
    if (compareReadOnly() || state.compare.posting) commit.disabled = true;
    commit.addEventListener('click', () => { void confirmCompareChoice(); });
    actions.appendChild(commit);
    const cancel = node('button', 'btn-quiet', 'Cancel');
    cancel.type = 'button';
    cancel.id = 'compare-confirm-cancel';
    cancel.addEventListener('click', closeCompareConfirm);
    actions.appendChild(cancel);
    dialog.appendChild(actions);
    // §3.12 exception class: initial focus is Cancel, never Confirm — a
    // reflexive A-then-Enter double-tap must not commit.
    cancel.focus();
  }
  async function confirmCompareChoice() {
    const confirm = state.compareConfirm;
    const compare = state.compare;
    if (confirm === null || compare.session === null || compare.posting) return;
    if (compareReadOnly()) { showToast(COPY.readOnlyToast); return; }
    compare.posting = true;
    const body = {
      requestId: crypto.randomUUID(),
      revision: compare.session.revision,
      stateDigest: compare.session.stateDigest,
      queryId: compare.queryId,
      choice: confirm.choice,
    };
    let data = null;
    try {
      data = await apiBlindJudgment(compare.reviewId, compare.session.sessionId, body);
    } catch (error) {
      compare.posting = false;
      refetchHealth();
      const code = error && typeof error.code === 'string' ? error.code : '';
      showToast(code === 'startup_degraded_read_only' || code === 'artifact_unavailable'
        ? COPY.readOnlyToast
        : COPY.postFailed);
      renderCompareConfirm();
      return;
    }
    compare.posting = false;
    state.compareConfirm = null;
    clear(document.getElementById('dialog-slot'));
    acceptCompareSession(data.session);
    // Keep the just-judged query selected so its reveal is what renders.
    compare.queryId = body.queryId;
    renderCompare();
  }
  function revealText(query) {
    const choice = query.judgment.choice;
    if (choice === 'tie') return COPY.revealTie;
    if (choice === 'both-wrong') return COPY.revealBothWrong;
    const reveal = query.reveal && typeof query.reveal === 'object' ? query.reveal : {};
    const side = choice === 'a-wins' ? 'A' : 'B';
    const sideName = choice === 'a-wins' ? reveal.sideA : reveal.sideB;
    return COPY.revealPreferred(side, sideName === 'Current' ? 'the current engine' : 'the candidate');
  }
  function compareResultRow(entry, index) {
    const compare = state.compare;
    const row = node('button', 'compare-row'
      + (compare.passageKey === compare.queryId + '|' + entry.passageId ? ' sel' : ''));
    row.type = 'button';
    row.dataset.passage = entry.passageId;
    row.appendChild(node('span', 'rank-badge', '#' + (index + 1)));
    row.appendChild(node('span', 'card-ref', entry.reference));
    row.addEventListener('click', () => { selectComparePassage(entry.passageId); });
    return row;
  }
  function renderCompare() {
    if (state.screen !== 'compare') return;
    const container = document.getElementById('screen-compare');
    clear(container);
    const inner = node('div', 'screen-inner');
    container.appendChild(inner);
    const compare = state.compare;
    if (compare.status === 'loading' || compare.starting) {
      for (let i = 0; i < 3; i += 1) inner.appendChild(node('div', 'skeleton-row'));
      return;
    }
    if (compare.status === 'failed') {
      inner.appendChild(node('p', 'screen-sub', COPY.bootFetchFailed));
      return;
    }
    if (compare.session === null) {
      inner.appendChild(node('h1', '', 'Compare'));
      if (compare.reviews.length === 0) {
        inner.appendChild(node('p', 'screen-sub', COPY.compareEmpty));
        return;
      }
      for (const review of compare.reviews) {
        const card = node('div', 'compare-card');
        const left = node('div', '');
        left.appendChild(node('div', '', typeof review.label === 'string' ? review.label : 'Comparison'));
        left.appendChild(node('div', 'screen-sub', review.reviewedCount + ' of ' + review.queryCount + ' searches called'));
        card.appendChild(left);
        const start = node('button', 'btn-primary', review.status === 'not-started' ? 'Start the blind review' : 'Resume the blind review');
        start.type = 'button';
        start.dataset.review = review.reviewId;
        start.addEventListener('click', () => { void startCompareSession(review.reviewId); });
        card.appendChild(start);
        inner.appendChild(card);
      }
      return;
    }
    const query = compareSelectedQuery();
    if (query === null) {
      inner.appendChild(node('p', 'screen-sub', COPY.compareEmpty));
      return;
    }
    const queries = Array.isArray(compare.session.queries) ? compare.session.queries : [];
    if (queries.length > 1) {
      const chips = node('div', 'query-chips');
      for (const entry of queries) {
        const chip = node('button', 'query-chip');
        chip.type = 'button';
        chip.setAttribute('aria-pressed', entry.queryId === compare.queryId ? 'true' : 'false');
        chip.appendChild(node('span', '', '“' + entry.query + '”'));
        if (entry.judgment) chip.appendChild(node('span', 'chip-done', ' ✓'));
        chip.addEventListener('click', () => {
          compare.queryId = entry.queryId;
          compare.passageKey = null;
          renderCompare();
        });
        chips.appendChild(chip);
      }
      inner.appendChild(chips);
    }
    const head = node('div', '');
    head.appendChild(node('h1', '', COPY.compareTitle(query.query)));
    head.appendChild(node('p', 'screen-sub', COPY.compareBlind));
    head.appendChild(node('p', 'screen-sub', COPY.compareHow));
    inner.appendChild(head);
    const lists = node('div', 'compare-lists');
    const sides = query.sides && typeof query.sides === 'object' ? query.sides : { a: [], b: [] };
    for (const side of ['a', 'b']) {
      const column = node('div', 'compare-col');
      column.appendChild(node('div', 'col-head', 'Set ' + side.toUpperCase()));
      (Array.isArray(sides[side]) ? sides[side] : []).forEach((entry, index) => {
        column.appendChild(compareResultRow(entry, index));
      });
      lists.appendChild(column);
    }
    inner.appendChild(lists);
    if (compare.passageKey !== null) {
      inner.appendChild(renderComparePanel(query, sides));
    }
    if (query.judgment) {
      const reveal = node('div', 'reveal-card');
      reveal.id = 'reveal-card';
      reveal.appendChild(node('div', 'reveal-tag', COPY.revealTag));
      reveal.appendChild(node('p', 'reveal-line', revealText(query)));
      reveal.appendChild(node('p', 'screen-sub', COPY.revealBody));
      const back = node('button', 'btn-quiet', COPY.backToReview);
      back.type = 'button';
      back.id = 'reveal-back';
      back.addEventListener('click', () => { setScreen('review'); });
      reveal.appendChild(back);
      inner.appendChild(reveal);
      return;
    }
    const toolbar = node('div', 'compare-toolbar');
    toolbar.setAttribute('role', 'toolbar');
    toolbar.setAttribute('aria-label', 'Comparison call');
    const disabled = compareReadOnly();
    const addButton = (keycap, choice, labelText) => {
      const button = node('button', 'verdict-btn');
      button.type = 'button';
      button.id = 'compare-' + keycap.toLowerCase();
      button.appendChild(node('span', 'kbd', keycap));
      button.appendChild(node('span', '', labelText));
      if (disabled) button.disabled = true;
      button.addEventListener('click', (event) => { openCompareConfirm(choice, event.currentTarget); });
      toolbar.appendChild(button);
    };
    addButton('A', 'a-wins', 'A wins');
    addButton('B', 'b-wins', 'B wins');
    addButton('T', 'tie', 'Tie');
    addButton('W', 'both-wrong', 'Both wrong');
    inner.appendChild(toolbar);
  }
  function renderComparePanel(query, sides) {
    const compare = state.compare;
    const panel = node('div', 'compare-panel');
    panel.id = 'compare-panel';
    const cached = compare.passages[compare.passageKey];
    const passageId = compare.passageKey.split('|')[1];
    if (cached === undefined || cached.status === 'loading') {
      panel.appendChild(node('p', 'screen-sub', COPY.loadingPassage));
      return panel;
    }
    if (cached.status === 'failed') {
      panel.appendChild(node('p', 'screen-sub', COPY.bootFetchFailed));
      return panel;
    }
    const data = cached.data;
    panel.appendChild(node('h2', '', typeof data.reference === 'string' ? data.reference : ''));
    const body = node('p', 'verse-body');
    for (const verse of Array.isArray(data.verses) ? data.verses : []) {
      body.appendChild(node('sup', '', String(verse.verse)));
      body.appendChild(document.createTextNode(verse.text + ' '));
    }
    panel.appendChild(body);
    const says = node('div', 'compare-says');
    for (const side of ['a', 'b']) {
      const cell = node('div', '');
      cell.appendChild(node('div', 'why-key', COPY.setSays(side.toUpperCase())));
      const entry = (Array.isArray(sides[side]) ? sides[side] : [])
        .find((candidate) => candidate.passageId === passageId);
      if (entry === undefined) {
        cell.appendChild(node('div', 'screen-sub', COPY.notInThisSet));
      } else {
        const labels = (Array.isArray(entry.reasons) ? entry.reasons : [])
          .map((reason) => reason && typeof reason.label === 'string' ? reason.label : null)
          .filter((label) => label !== null);
        cell.appendChild(node('div', 'why-val', labels.length > 0 ? labels.join(' · ') : '—'));
      }
      says.appendChild(cell);
    }
    panel.appendChild(says);
    return panel;
  }

  // §history — the humanized History screen (§3.6/D28). No raw IDs, digests,
  // or fingerprints anywhere on this screen.
  function historyCases() {
    return sortByTouchedDesc(state.cases.filter((record) => !!record));
  }
  function openHistory() {
    // Re-fetch lazily per visit so calls made this session appear.
    state.history.byCase = Object.create(null);
    ensureHistoryFetches();
  }
  function ensureHistoryFetches() {
    for (const record of historyCases().slice(0, state.history.expandedCount)) {
      if (state.history.byCase[record.caseId] !== undefined) continue;
      state.history.byCase[record.caseId] = { status: 'loading', records: [] };
      apiJudgments(record.caseId).then((data) => {
        state.history.byCase[record.caseId] = {
          status: 'done',
          records: data !== null && Array.isArray(data.judgments) ? data.judgments : [],
        };
        if (state.screen === 'history') renderHistory();
      }).catch(() => {
        state.history.byCase[record.caseId] = { status: 'failed', records: [] };
        if (state.screen === 'history') renderHistory();
      });
    }
  }
  function historyWhy(record) {
    const phrase = typeof record.diagnosis === 'string' ? COPY.plainWhy[record.diagnosis] : undefined;
    return phrase !== undefined ? phrase : COPY.plainWhy['lexical-noise'];
  }
  function historyRowText(record, query) {
    if (record.action === 'missing') {
      const ref = typeof record.reference === 'string' ? record.reference : '';
      const n = record.withinTop !== undefined ? record.withinTop : 10;
      // A missing judgment this session recorded as a tail rescue renders
      // the rescue phrasing; prior-session records render the generic
      // template — the distinction is session-local, never guessed.
      return state.sessionLog.rescues[normalizeQuery(query) + '|' + ref] === true
        ? COPY.historyRescued(ref, n, query)
        : COPY.historyMissing(ref, n, query);
    }
    if (record.action === 'prefer') {
      const above = referenceOfTargetId(record.preferredTargetId);
      const below = referenceOfTargetId(record.otherTargetId);
      return above !== null && below !== null ? COPY.historyPrefer(above, below, query) : null;
    }
    const ref = referenceOfTargetId(record.targetId);
    if (ref === null) return null; // never render a raw id in place of a reference
    if (record.action === 'essential') return COPY.historyEssential(ref, record.withinTop !== undefined ? record.withinTop : 10, query);
    if (record.action === 'helpful') return COPY.historyHelpful(ref, query);
    if (record.action === 'irrelevant') return COPY.historyIrrelevant(ref, historyWhy(record), query);
    return null;
  }
  function renderHistory() {
    if (state.screen !== 'history') return;
    const container = document.getElementById('screen-history');
    clear(container);
    const inner = node('div', 'screen-inner');
    container.appendChild(inner);
    const cases = historyCases();
    const visible = cases.slice(0, state.history.expandedCount);
    let total = 0;
    let anyLoading = false;
    const groups = [];
    for (const record of visible) {
      const entry = state.history.byCase[record.caseId];
      if (entry === undefined || entry.status === 'loading') { anyLoading = true; continue; }
      if (entry.status !== 'done' || entry.records.length === 0) continue;
      total += entry.records.length;
      groups.push({ record, records: entry.records });
    }
    const head = node('div', '');
    head.appendChild(node('h1', '', COPY.historyTitle));
    head.appendChild(node('p', 'screen-sub', COPY.historySub));
    inner.appendChild(head);
    if (cases.length === 0 || (!anyLoading && total === 0)) {
      inner.appendChild(node('p', 'screen-sub', COPY.historyEmpty));
      const go = node('button', 'btn-primary', COPY.goToReview);
      go.type = 'button';
      go.id = 'history-go-review';
      go.addEventListener('click', () => { setScreen('review'); });
      inner.appendChild(go);
      return;
    }
    inner.appendChild(node('p', 'screen-sub', COPY.historyCount(total)));
    for (const group of groups) {
      const card = node('div', 'history-group');
      const groupHead = node('div', 'group-head');
      groupHead.appendChild(node('h2', '', '“' + group.record.query + '”'));
      card.appendChild(groupHead);
      const superseded = Object.create(null);
      for (const record of group.records) {
        if (record && typeof record.supersedes === 'string') superseded[record.supersedes] = true;
      }
      const ordered = group.records.slice().sort((a, b) => {
        const left = typeof a.at === 'string' ? a.at : '';
        const right = typeof b.at === 'string' ? b.at : '';
        return right < left ? -1 : right > left ? 1 : 0;
      });
      for (const record of ordered) {
        if (!record || record.schemaVersion !== 2) continue;
        const text = historyRowText(record, group.record.query);
        if (text === null) continue;
        const struck = superseded[record.judgmentId] === true;
        const row = node('div', 'history-row' + (struck ? ' struck' : ''));
        const line = node('div', 'row-line');
        line.appendChild(node('span', 'when', relativeTime(record.at)));
        line.appendChild(node('span', 'what', text));
        row.appendChild(line);
        if (struck) row.appendChild(node('div', 'history-sub', COPY.replacedByNewer));
        card.appendChild(row);
      }
      inner.appendChild(card);
    }
    if (anyLoading) inner.appendChild(node('div', 'skeleton-row'));
    if (cases.length > state.history.expandedCount) {
      const more = node('button', 'btn-quiet', COPY.showMore);
      more.type = 'button';
      more.id = 'history-show-more';
      more.addEventListener('click', () => {
        state.history.expandedCount += 20;
        ensureHistoryFetches();
        renderHistory();
      });
      inner.appendChild(more);
    }
  }

  // §finish — the Finish-up screen (§3.7/D29): stat tiles, pending banner,
  // the honestly-derived changed set, and the typed-digest signing flow.
  // Signing reuses the server's existing digest/sign mechanism exactly:
  // POST /api/v2/compile/preview → plan.digest; POST /api/v2/compile/apply
  // posts the FULL digest back. No /api/v2 changes.
  const WEB_SUBSET_PATH = 'pipeline/fixtures/web-subset.json';
  async function openFinishUp() {
    ensureCaseCounts();
    state.finish.outcome = null;
    state.finish.input = '';
    await loadCompilePreview();
  }
  async function loadCompilePreview() {
    const finish = state.finish;
    finish.status = 'loading';
    renderFinish();
    const seq = ++finish.previewSeq;
    let data = null;
    try {
      data = await apiCompilePreview();
    } catch (error) {
      if (seq !== finish.previewSeq) return;

  function renderLookupResults() {
    const lookup = state.lookup;
    if (lookup === null) return;
    const resultsEl = document.getElementById('lookup-results');
    if (resultsEl === null) return;
    clear(resultsEl);
    if (lookup.kind === 'invalid-reference') {
      resultsEl.appendChild(node('div', 'lookup-empty', COPY.invalidReference(lookup.q.trim())));
      return;
    }
    if (lookup.kind === 'error') {
      resultsEl.appendChild(node('div', 'lookup-empty', COPY.searchError));
      return;
    }
    if (lookup.kind !== null && lookup.results.length === 0) {
      resultsEl.appendChild(node('div', 'lookup-empty', COPY.lookupEmpty));
      return;
    }
    lookup.results.forEach((result, index) => {
      const row = node('button', 'lookup-row' + (index === lookup.sel ? ' sel' : ''));
      row.type = 'button';
      const head = node('div', 'row-head');
      head.appendChild(node('span', 'row-ref', result.reference));
      if (index === lookup.sel) head.appendChild(node('span', 'row-action', COPY.lookupAction));
      row.appendChild(head);
      row.appendChild(node('div', 'row-snippet', result.excerpt));
      row.addEventListener('click', () => { lookup.sel = index; lookupSelect(); });
      resultsEl.appendChild(row);
    });
  }

  // §keys — one handler, layers first.
  function isTypingTarget(target) {
    if (!(target instanceof HTMLElement)) return false;
    const tag = target.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || target.isContentEditable;
  }
  document.addEventListener('keydown', (event) => {
    // ⌘K works everywhere, inputs included.
    if ((event.metaKey || event.ctrlKey) && (event.key === 'k' || event.key === 'K')) {
      event.preventDefault();
      openLookup(document.activeElement);
      return;
    }
    if (state.lookup !== null) {
      if (event.key === 'Escape') { event.preventDefault(); closeLookup(); return; }
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        const lookup = state.lookup;
        if (lookup.results.length > 0) {
          lookup.sel = Math.max(0, Math.min(lookup.results.length - 1, lookup.sel + (event.key === 'ArrowDown' ? 1 : -1)));
          renderLookupResults();
        }
        return;
      }
      if (event.key === 'Enter') { event.preventDefault(); lookupSelect(); return; }
      if (event.key === 'Tab') {
        // Focus trap: the input and the rows cycle within the dialog.
        const dialog = document.querySelector('.lookup-dialog');
        if (dialog !== null) {
          const focusables = dialog.querySelectorAll('input, button');
          if (focusables.length > 0) {
            const first = focusables[0];
            const last = focusables[focusables.length - 1];
            if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
            else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
          }
        }
      }
      return;
    }
    // Layered Esc order (§3.12): interview → missing form / rescue preview
    // (one shared slot) → lookup (handled above) → bulk selection.
    if (state.interview !== null) {
      // The interview is modal: Escape closes it without committing, from
      // any focus position; J/K/arrow navigation is inert (§3.13.1–2).
      if (event.key === 'Escape') { event.preventDefault(); closeInterview(); return; }
      if (event.key === 'Tab') { trapTab(event); }
      return;
    }
    if (state.rescue !== null) {
      if (event.key === 'Escape') { event.preventDefault(); closeRescue({}); return; }
      if (event.key === 'Tab') { trapTab(event); }
      return;
    }
    if (state.missingForm !== null) {
      if (event.key === 'Escape') { event.preventDefault(); closeMissingForm(); return; }
      if (event.key === 'Tab') { trapTab(event); return; }
      if (event.key === 'Enter' && event.target instanceof HTMLElement && event.target.id === 'missing-ref-input') {
        // Enter activates Submit only when Submit is enabled; while it is
        // disabled, Enter is a no-op — never a native form submit (§3.3).
        event.preventDefault();
        if (missingSubmitEnabled()) void submitMissingForm();
        return;
      }
      return;
    }
    // The Compare confirm rides the same §3.12 Esc slot as the rescue
    // preview and missing form (at most one of the three is ever open).
    if (state.compareConfirm !== null) {
      if (event.key === 'Escape') { event.preventDefault(); closeCompareConfirm(); return; }
      if (event.key === 'Tab') { trapTab(event); }
      return;
    }
    if (event.key === 'Escape' && selectedCount() > 0) {
      event.preventDefault();
      state.selected = Object.create(null);
      renderAll({});
      return;
    }
    // Typing in an input suppresses single-letter shortcuts.
    if (isTypingTarget(event.target)) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    // A/B/T/W open the §3.5 one-confirm layer on Compare — the key alone
    // never commits; other single letters are inert off the Review screen.
    if (state.screen === 'compare') {
      const choice = CHOICE_BY_KEY[event.key.toLowerCase()];
      if (choice !== undefined) {
        event.preventDefault();
        openCompareConfirm(choice, null);
      }
      return;
    }
    if (state.screen !== 'review') return;
    if (event.key === 'j' || event.key === 'J' || event.key === 'ArrowDown') {
      event.preventDefault();
      moveFocus(1);
      return;
    }
    if (event.key === 'k' || event.key === 'K' || event.key === 'ArrowUp') {
      event.preventDefault();
      moveFocus(-1);
      return;
    }
    const inResults = state.search.status === 'results';
    const onTailRow = inResults && state.focus > topCount();
    const onDivider = inResults && state.search.results.length > TOP_WINDOW && state.focus === topCount();
    if (event.key === 'Enter') {
      // Enter does nothing on a tail row (§3.12): the verse already reads in
      // the rail, and Enter must never double as an uncorrectable commit.
      if (document.activeElement !== null && document.activeElement.classList &&
        document.activeElement.classList.contains('tail-row')) {
        event.preventDefault();
      }
      return;
    }
    if (event.key === ' ') {
      const active = document.activeElement;
      if (active !== null && active.id === 'tail-divider') return; // native expand
      if (active !== null && active.classList && active.classList.contains('result-card')) {
        event.preventDefault();
        const index = Number(active.dataset.stop);
        const result = state.search.results[index];
        if (result !== undefined) toggleSelected(result.targetId);
        return;
      }
      if (active !== null && active.classList && active.classList.contains('tail-row')) {
        event.preventDefault();
      }
      return;
    }
    const key = event.key.toLowerCase();
    if (key === 'e') {
      event.preventDefault();
      if (onTailRow) { openRescuePreview(state.focus); return; }
      if (onDivider) return;
      if (inResults) void verdictAction('essential');
      return;
    }
    if (key === 'h' || key === 'x') {
      event.preventDefault();
      if (onTailRow) { showToast(COPY.tailHint); return; }
      if (onDivider) return;
      if (inResults) void verdictAction(key === 'h' ? 'helpful' : 'irrelevant');
      return;
    }
    if (key === 'm') {
      event.preventDefault();
      if (onTailRow) { showToast(COPY.tailHint); return; }
      if (onDivider) return;
      handleMissingKey(null);
      return;
    }
    if (key === 'u') {
      event.preventDefault();
      handleUndoKey();
      return;
    }
  });

  // §boot
  document.getElementById('theme-cycle').addEventListener('click', cycleTheme);
  document.getElementById('lookup-open').addEventListener('click', (event) => { openLookup(event.currentTarget); });
  document.querySelectorAll('[data-nav]').forEach((item) => {
    item.addEventListener('click', () => { setScreen(item.dataset.nav); });
  });
  document.getElementById('search-form').addEventListener('submit', (event) => {
    event.preventDefault();
    void submitSearch(document.getElementById('search-input').value);
  });

  try {
    const stored = localStorage.getItem('study.theme');
    if (stored === 'light' || stored === 'dark' || stored === 'auto') state.themeMode = stored;
  } catch (error) { /* storage unavailable */ }
  try {
    const storedTop = Number(localStorage.getItem('study.withinTop'));
    if (storedTop === 1 || storedTop === 3 || storedTop === 5 || storedTop === 10) state.withinTop = storedTop;
  } catch (error) { /* storage unavailable */ }
  applyTheme();
  // Health refetches on window focus (§3.11) so read-only recovery re-enables.
  window.addEventListener('focus', () => { refetchHealth(); });
  try {
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if (state.themeMode === 'auto') applyTheme(); };
    if (typeof media.addEventListener === 'function') media.addEventListener('change', onChange);
    else if (typeof media.addListener === 'function') media.addListener(onChange);
  } catch (error) { /* matchMedia unavailable */ }

  // lastQuery pre-fills the search input's VALUE on the no-open-case boot;
  // it never auto-submits and never fetches.
  const uiState = readUiState();
  if (typeof uiState.lastQuery === 'string' && uiState.lastQuery !== '') {
    document.getElementById('search-input').value = uiState.lastQuery;
  }

  renderAll({});

  let bootToastShown = false;
  const bootFailed = () => {
    if (bootToastShown) return;
    bootToastShown = true;
    showToast(COPY.bootFetchFailed);
  };
  apiHealth().then((health) => { state.health = health; renderBanner(); }).catch(bootFailed);
  apiMeta().then((meta) => {
    state.meta = meta;
    writeUiState({ lastSeenMeta: { engineVersion: meta.engineVersion, corpusFingerprint: meta.corpusFingerprint, layerFingerprint: meta.layerFingerprint } });
  }).catch(bootFailed);
  apiConcepts().then((concepts) => { state.concepts = Array.isArray(concepts) ? concepts : []; }).catch(bootFailed);
  apiCases().then((data) => {
    state.cases = data && Array.isArray(data.cases) ? data.cases : [];
    renderQueue();
    // §3.1 open-case boot: the first open case (most recently touched — the
    // client sort, never the server's caseId order) loads exactly as if its
    // queue row were clicked; with none, no request until the first submit.
    const open = openCases();
    if (open.length > 0 && state.search.status === 'idle' && state.lookup === null) {
      // Reserve the boot case's §4.3 counts-row pair for the open-case flow
      // itself — one fetch pair per open case, never a duplicate.
      state.countsPending[open[0].caseId] = true;
      document.getElementById('search-input').value = open[0].query;
      void submitSearch(open[0].query);
    }
    ensureCaseCounts();
  }).catch(bootFailed);
  // "Worth a look next" (§3.4): inbox suggestions load once at boot; a
  // failure shows the §3.11 fallback sentence inline in that rail section.
  apiInbox().then((data) => {
    state.inbox = { status: 'done', items: data !== null && Array.isArray(data.items) ? data.items : [] };
    if (state.screen === 'review') renderQueue();
  }).catch(() => {
    state.inbox = { status: 'failed', items: [] };
    if (state.screen === 'review') renderQueue();
  });
})();
</script>
</body>
</html>
